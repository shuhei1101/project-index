id: skill-global-setup
type: skill
summary: 端末ごとに 1 回、project-index のクローン・依存・端末の設定・Claude Code の env・起動を用意する。再インストール・端末の移行・project-index の更新のあとにも使用する
skill:
  path: plugins/project-index/skills/global-setup/SKILL.md
  arguments:
    - name: clone
      hint: '[クローンのパス]'
      description: project-index のクローンのパス。省くと聞く
  allowed_tools:
    - Bash(*/.venv/bin/python -m project_index migrate --plan)
    - Bash(command -v mdmark)
    - Bash(*/.venv/bin/python -m project_index serve)
steps:
  - name: 端末の設定のパスを決める
    body: 環境変数 `PROJECT_INDEX_CONFIG` があればその値、無ければ `${XDG_CONFIG_HOME:-~/.config}/project-index/settings.yaml`（`XDG_CONFIG_HOME` が空の文字列か相対パスなら `~/.config/project-index/settings.yaml`）にし、ファイルがあるかを確認する。
  - name: 移し替えの手順を確認する
    when: 端末の設定があるとき
    body: |-
      `{clone}` は端末の設定の `clone` の値。端末の設定に `clone` が無いときは `$clone`、空ならクローンの場所を聞いた値にする（聞いた値は、スキーマの検証で足りないキーを追加するときに再度聞かずに記載する）。
      終了コード 6（設定が新しい）のときは、設定のバージョンと project-index のバージョンを示し、管理の MCP の `update` で project-index を更新するよう案内して止まる。端末の設定も env も書き換えない。
      標準出力が空のときは、Claude Code の env を記載する工程へ進む。
      標準出力に手順があるときは手順を示し、`[destructive]` の行があれば適用してよいかを聞き、断られたら止まる。
    calls:
      - type: command
        command: '{clone}/.venv/bin/python -m project_index migrate --plan'
  - name: 移し替えを適用する
    when: 移し替えの手順があり、適用するとき
    body: |-
      `{clone}/.venv/bin/python -m project_index migrate`（破壊的な手順を許可したときは `--allow-destructive` を付ける）を実行し、適用した手順とバックアップのパスを示す。
      スキーマの検証で足りないキーがあれば、そのキーだけを聞いて追加する。`sources` の行とほかのキーは変えない。
  - name: 端末の設定を作る
    when: 端末の設定が無いとき
    body: |-
      端末の設定の場所を聞く（既定は `${XDG_CONFIG_HOME:-~/.config}/project-index/settings.yaml`）。
      `$clone` が空ならクローンの場所（`{clone}`）を聞き、クローンが無ければ `git clone https://github.com/shuhei1101/project-index {clone}` を実行する。
      クローンで `uv sync` を実行して依存を入れ、`{clone}/templates/settings.yaml` を元に、`clone` をクローンの絶対パスにした端末の設定を作る。`sources` は空にする。
  - name: Claude Code の env を記載する
    when: 端末の設定の場所が既定と違うとき
    body: '`${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json` の `env` に `PROJECT_INDEX_CONFIG` を記載する。`env` のほかのキーと、ファイルのほかの内容は変えない。'
  - name: mdmark の CLI を確認する
    body: '`write_docs` が Markdown の値の点検に使用する mdmark の CLI が `PATH` にあるかを確認する。無くても続ける（`write_docs` は点検せずに書き込む）。'
    calls:
      - type: command
        command: command -v mdmark
  - name: 起動してつながることを確認する
    body: |-
      待ち受けていなければ、環境変数 `PROJECT_INDEX_CONFIG` に端末の設定のパスを指定して、project-index を切り離して起動する。
      `http://127.0.0.1:${PROJECT_INDEX_PORT:-8786}/mcp` にツールの一覧（`tools/list`）を要求し、文書の MCP のツールが全て返ることを確認する。
    calls:
      - type: command
        command: '{clone}/.venv/bin/python -m project_index serve'
  - name: 結果を示す
    body: |-
      作ったもの（端末の設定のパス・env に記載したキー）と、つながった結果を出す。
      mdmark の CLI が無かったときは、`npm install -g github:shuhei1101/mdmark#{mdmark_ref}`（`{mdmark_ref}` は端末の設定の `mdmark_ref`。無ければ `develop`。Node 24 以降）で入れると `write_docs` が Markdown の値を点検することを案内する。
      このセッションで文書の MCP を使用するには `/mcp` で再接続することと、配信元を登録する `/project-index:setup` を案内する。
refs:
  - to: SC-2
    type: references
    when: 工程を変えるときに、project-index を入れるシナリオの流れと突き合わせる。
  - to: IF-16
    type: references
    when: 設定の移し替えの終了コードと出力を確認するとき。
  - to: CFG-1
    type: references
    when: 端末の設定のパスと環境変数を確認するとき。
tags:
  - topic:スキル
  - topic:設定
  - action:起動
  - tool:claude-code
  - tool:uv
visibility: internal
title: 端末に project-index を用意するスキル
