id: IF-11
title: "更新"
entry:
  kind: mcp_tool
  value: update
flows:
  - name: 正常系
    summary: 新しい commit を取り込み、依存を入れ直して起動し直す
    setup:
      - name: Mock
        description: '`npm` と `mdmark`（`PATH` の先頭の一時フォルダに、受けた引数を記録して終了コード 0 で終わるスクリプトを置く）。一時フォルダに bare リポジトリと project-index のクローンを作る'
      - name: 上流
        description: クローンより 1 つ新しい commit（バージョンを上げ、移し替えの手順は無い）を bare リポジトリに置く
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update
        participant G as project-index のクローン
        participant N as npm

        C->>T: 引数なし
        T->>G: git pull --ff-only
        T->>G: uv sync
        T-->>G: migrate --plan
        T->>N: install -g github:shuhei1101/mdmark#develop
        T-->>C: updated・migration_needed: false・restarting・mdmark
        T->>T: 起動し直す
      ```

      <!-- /map -->
    expected:
      - '`updated: true`・`migration_needed: false`・`restarting: true`'
      - クローンの HEAD が上流の commit と同じ
      - 起動し直した後の `status` の `version` が新しいバージョン
      - '`mdmark` が `{"ref": "develop", "reinstalled": true}`（`error` を持たない）'
      - '`npm` が `install -g github:shuhei1101/mdmark#develop` の引数で 1 回呼ばれる'
    test: test_normal
  - name: 正常系（新しい commit が無い）
    summary: 上流に新しい commit が無いと、クローンを変えずに mdmark の CLI だけを入れ直して返す
    setup:
      - name: Mock
        description: 正常系と同じ `npm` と `mdmark` のスクリプト
      - name: 上流
        description: クローンと同じ commit
    flow: |-
      <!-- map: {"title": "正常系（新しい commit が無い）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update
        participant G as project-index のクローン
        participant N as npm

        C->>T: 引数なし
        T->>G: git pull --ff-only
        T->>N: install -g github:shuhei1101/mdmark#develop
        T-->>C: updated: false・restarting: false・mdmark
      ```

      <!-- /map -->
    expected:
      - '`updated: false`・`restarting: false`・`version` が `previous_version` と同じ'
      - プロセスが起動し直さない（ログの起動の行が増えない）
      - '`mdmark.reinstalled` が `true` で、`npm` が 1 回呼ばれる'
    test: test_normal_when_up_to_date
  - name: 正常系（移し替えが要る）
    summary: 新しいバージョンに移し替えの手順があると、再起動せずに返す
    setup:
      - name: Mock
        description: 正常系と同じ `npm` と `mdmark` のスクリプト
      - name: 上流
        description: 端末の設定の `version` を上げる移し替えの手順を持つ commit
    flow: |-
      <!-- map: {"title": "正常系（移し替えが要る）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update
        participant G as project-index のクローン
        participant N as npm

        C->>T: 引数なし
        T->>G: git pull --ff-only・uv sync
        T-->>G: migrate --plan
        T->>N: install -g github:shuhei1101/mdmark#develop
        T-->>C: migration_needed: true・restarting: false・mdmark
      ```

      <!-- /map -->
    expected:
      - '`updated: true`・`migration_needed: true`・`restarting: false`'
      - 端末の設定が変わらない
      - 動いているプロセスの `status` の `version` は前のバージョンのまま
      - '`mdmark.reinstalled` が `true` で、`npm` が 1 回呼ばれる'
    test: test_normal_when_migration_needed
  - name: 異常系（取り込みに失敗する・UpdateFailedError）
    summary: fast-forward できないと、クローンに触らず再起動もしない
    setup:
      - name: Mock
        description: 正常系と同じ `npm` と `mdmark` のスクリプト
      - name: クローン
        description: 上流と分岐した commit を 1 つ積んでおく
    flow: |-
      <!-- map: {"title": "異常系（取り込みに失敗する・UpdateFailedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update
        participant G as project-index のクローン

        C->>T: 引数なし
        T->>G: git pull --ff-only（失敗）
        T-->>C: isError（失敗したコマンドと stderr）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で `git pull --ff-only` と stderr を返す'
      - クローンの HEAD が変わらない
      - プロセスが起動し直さない
      - '`npm` が呼ばれない'
    test: test_error_when_pull_fails
  - name: 異常系（再起動の途中で呼ばれる・RestartInProgressError）
    summary: '`restart` の停止を待っている間に `update` を呼ぶと、クローンに触らずに断る'
    setup:
      - name: Mock
        description: なし
      - name: 処理中の要求
        description: '`script_timeout_sec` の間眠る変換スクリプトを持つ配信元で `try_convert` を呼び、続けて `restart` を呼んでおく'
        notes: 停止の待ちを長くするため
    flow: |-
      <!-- map: {"title": "異常系（再起動の途中で呼ばれる・RestartInProgressError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update

        C->>T: 引数なし
        T-->>C: isError（RestartInProgressError）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で再起動の途中であることを返す'
      - クローンの HEAD が変わらない
    test: test_error_when_restart_in_progress
  - name: 正常系（mdmark の CLI が無い）
    summary: '`PATH` に mdmark の CLI が無いと、入れ直さずに更新する'
    setup:
      - name: Mock
        description: '`npm`（`PATH` の先頭に、受けた引数を記録して終了コード 0 で終わるスクリプトを置く）'
        notes: '`PATH` に `mdmark` を置かない'
      - name: 上流
        description: 正常系と同じ
    flow: |-
      <!-- map: {"title": "正常系（mdmark の CLI が無い）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update
        participant G as project-index のクローン

        C->>T: 引数なし
        T->>G: git pull --ff-only・uv sync
        T-->>G: migrate --plan
        T-->>C: updated・restarting（mdmark を持たない）
        T->>T: 起動し直す
      ```

      <!-- /map -->
    expected:
      - '`updated: true`・`restarting: true` で、`mdmark` を持たない'
      - '`npm` が呼ばれない'
    test: test_normal_when_mdmark_absent
  - name: 正常系（mdmark の CLI を入れ直せない）
    summary: '`npm` が失敗しても、理由を応答に入れて更新と再起動を続ける'
    setup:
      - name: Mock
        description: '`npm`（標準エラーに `npm error code ENOTFOUND` を出して終了コード 1 で終わるスクリプト）と `mdmark`（正常系と同じ）を `PATH` の先頭に置く'
      - name: 上流
        description: 正常系と同じ
      - name: 端末の設定
        description: '`mdmark_ref` にタグを書いた端末の設定'
        notes: '`mdmark_ref: v0.13.0`'
    flow: |-
      <!-- map: {"title": "正常系（mdmark の CLI を入れ直せない）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update
        participant G as project-index のクローン
        participant N as npm

        C->>T: 引数なし
        T->>G: git pull --ff-only・uv sync
        T-->>G: migrate --plan
        T->>N: install -g github:shuhei1101/mdmark#v0.13.0（失敗）
        T-->>C: updated・restarting・mdmark（reinstalled: false・error）
        T->>T: 起動し直す
      ```

      <!-- /map -->
    expected:
      - '`isError` ではなく、`updated: true`・`restarting: true`'
      - '`mdmark` が `ref: v0.13.0`・`reinstalled: false` で、`error` に `npm install -g github:shuhei1101/mdmark#v0.13.0` と標準エラーの `npm error code ENOTFOUND` が入る'
      - 起動し直した後の `status` の `version` が新しいバージョン
    test: test_normal_when_mdmark_reinstall_fails
  - name: 異常系（端末の設定が読めない・TerminalConfigInvalidError）
    summary: 端末の設定がスキーマに違反すると、クローンに触らずに違反を返す
    setup:
      - name: Mock
        description: 正常系と同じ `npm` と `mdmark` のスクリプト
      - name: 上流
        description: 正常系と同じ
      - name: 端末の設定
        description: 起動した後に `mdmark_ref` をパターンに当たらない値へ書き換えた端末の設定
        notes: '`mdmark_ref: -x`'
    flow: |-
      <!-- map: {"title": "異常系（端末の設定が読めない・TerminalConfigInvalidError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as update

        C->>T: 引数なし
        T->>T: 端末の設定を再読み込みする（違反）
        T-->>C: isError（mdmark_ref の違反）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で `mdmark_ref` の違反を返す'
      - クローンの HEAD が変わらず、`npm` が呼ばれない
      - プロセスが起動し直さない
    test: test_error_when_terminal_config_invalid
lead: クローンを `git pull --ff-only` と `uv sync` で更新して再起動する管理の MCP の `update` の入出力を定め、`update` を修正するときに参照する。
tags:
  - name: topic:サーバー
    main: true
  - name: action:更新
  - name: tool:mcp
  - name: tool:git
  - name: tool:uv
identifier: update
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: project-index のクローンの作業ツリーと `.venv` を書き換える。`PATH` に mdmark の CLI があるときは、`npm install -g` で端末の全体の mdmark を入れ直す。新しい commit があり移し替えが要らないときは `restart` と同じく起動し直す
callers:
  - SC-3#scenarios[正常シナリオ]
  - SC-3#scenarios[正常シナリオ（端末の設定が古くなる）]
  - SC-3#scenarios[正常シナリオ（project-index に新しい commit が無い）]
  - SC-3#scenarios[正常シナリオ（mdmark の CLI を入れ直せない）]
exclusivity: '`restart` と同じく、再起動を始めた後の呼び出しは `RestartInProgressError` で断る。更新の途中の 2 回目も同じ例外で断る'
request: []
request_example: |-
  ```json
  {}
  ```
response:
  - name: previous_version
    type: str
    description: 更新する前の project-index のバージョン
  - name: version
    type: str
    description: 更新した後のクローンのバージョン
    notes: '`updated: false` のときは `previous_version` と同じ'
  - name: updated
    type: bool
    description: 新しい commit を取り込んだか
  - name: migration_needed
    type: bool
    description: 新しいバージョンで端末の設定の移し替えが要るか（新しいコードの `project-index migrate --plan` で判定する）
    notes: '`true` のときは再起動しない'
  - name: restarting
    type: bool
    description: 応答の後に起動し直すか
  - name: mdmark
    type: dict | None
    description: mdmark の CLI を入れ直した結果
    notes: '`git pull --ff-only` が成功し、`PATH` に `mdmark` があるときだけ持つ。無いときはキーを持たない（管理の MCP の結果は `None` の値のキーを落とす）'
  - name: mdmark.ref
    type: str
    description: 入れた mdmark の参照（端末の設定の `mdmark_ref`。無ければ `develop`）
    example: develop
  - name: mdmark.reinstalled
    type: bool
    description: '`npm install -g` が終了コード 0 で終わったか'
  - name: mdmark.error
    type: str | None
    description: 入れ直せなかったときの、実行したコマンドと標準エラーの末尾（`npm` が見つからない・制限時間を超えたときはその旨）
    notes: '`reinstalled: true` のときはキーを持たない'
response_example: |-
  ```json
  {"previous_version": "0.2.0", "version": "0.3.0", "updated": true, "migration_needed": false, "restarting": true, "mdmark": {"ref": "develop", "reinstalled": true}}
  ```
response_notes: '配信できなかった配信元と、配信元の設定のバージョンの新旧は、起動し直した後の `status` の `version_state` で確かめる。`migration_needed: true` のときは、利用者が `project-index migrate` を実行してから `restart` を呼ぶ。'
exceptions:
  - name: なし（正常終了）
    condition: 新しい commit が無い、または取り込んで依存を入れ直せた
  - name: UpdateFailedError
    condition: '`git pull --ff-only` か `uv sync` が 0 以外で終わった'
    notes: '`isError: true` で失敗したコマンドと stderr を返す。再起動しない'
  - name: RestartInProgressError
    condition: 再起動か更新がまだ終わっていない
    notes: '`isError: true`'
  - name: TerminalConfigInvalidError
    condition: '`update` を呼んだ時点で端末の設定のファイルが無い・YAML として読めない・スキーマに違反する（`mdmark_ref` のパターン違反を含む）'
    notes: '`isError: true` で違反を返す。`git pull` の前に止め、クローンに触らず再起動もしない'
constraints:
  - item: クローンの場所
    constraint: 端末の設定の `clone`
  - item: 移し替えの要否
    constraint: '`uv sync` の後に `{clone}/.venv/bin/python -m project_index migrate --plan` を実行し、当てる手順があれば要るとする'
    notes: 新しいバージョンのコードで判定するため、動いているプロセスでは判定しない
  - item: コマンドのタイムアウト
    constraint: '`git pull`・`uv sync`・`migrate --plan` はそれぞれ 300 秒で打ち切り、`UpdateFailedError` にする'
    notes: 未実測。結合テストで測って見直す
  - item: 作業ツリーの変更
    constraint: クローンに commit していない変更があって `git pull --ff-only` が失敗したときも、変更に触らず `UpdateFailedError` を返す
  - item: mdmark の CLI の入れ直し
    constraint: '`git pull --ff-only` が成功した後（新しい commit が無いとき・移し替えが要るときも含む）、`PATH` に `mdmark` があれば `npm install -g github:shuhei1101/mdmark#{mdmark_ref}` を実行する。失敗しても `UpdateFailedError` にせず、`mdmark.error` に入れて更新と再起動を続ける'
    notes: '`mdmark_ref` は `update` を呼んだ時点で端末の設定のファイルを再読み込みした値（`reload` は要らない）。無ければ `develop`。タイムアウトは `git pull` と同じ 300 秒'
test_file: tests/integration/server/test_update.py
