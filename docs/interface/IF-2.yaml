    expected:
      - '1 回目が、送信してから 3 秒の内に `isError: true` で、`WorktreeLoadingError`、ワークツリー y のパス、読み込み中であることと、時間を空けて同じ呼び出しを送信する次の手を返却する'
      - 読み込み中の応答は、クローン本体の文書 1 を返却しない
      - 読み込み中の応答の後、同じ呼び出しが 30 秒の内にワークツリー y の文書 1 を返却する
      - サーバーのログの `ワークツリーを読み込んだ（sample・{ワークツリー y のパス}・{秒数} 秒）` の行が 1 行だけ（読み込み中の呼び出しごとに読み込みを始め直していない）
    test: test_error_when_worktree_loading
  - name: 異常系（想定外の例外・UnexpectedError）
    summary: '`ProjectIndexError` でない例外を、例外の型と内容を持つ `isError` の応答にする'
    setup:
      - name: Mock
        description: 'project-index を起動する環境の `PATH` の先頭に、`archive` の呼び出しだけ標準エラーに `fatal: archive failed` を出して 128 で終わる `git` のスクリプトを配置する'
      - name: 入力
        description: '`ref` に sample の 1 つ前の commit、`view: summary`'
    flow: |-
      <!-- map: {"title": "異常系（想定外の例外・UnexpectedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs

        C->>T: ref: 1 つ前の commit
        T->>T: リビジョンの書き出しの git archive が 0 以外で終わる（GitError）
        T-->>C: isError（UnexpectedError・例外の型と内容）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、本文が `UnexpectedError: GitError:` で始まり、失敗した git のコマンド（`git archive`）と標準エラーの `fatal: archive failed` を含む'
      - 応答が `Error executing tool` で始まらない
      - サーバーのログに `ツールの処理に失敗した（search_docs）` と例外のトレースバックが残る
      - 続けての `ref` を省いた `search_docs` は文書を返却する
    test: test_error_when_unexpected
  - name: 正常系（disk の配信元をワークツリーの作業場所から引く）
    summary: disk の配信元はワークツリーに読み替えず、登録したフォルダの文書と文書の日時を返す
    setup:
      - name: Mock
        description: なし
      - name: ローカル運用の配信元
        description: 'Git のリポジトリの中の `storage.type: disk` の配信元。文書 1（`created`・`updated` を持つ）と文書 2（持たない）'
        notes: id `company`。`scope.read` は `{company のクローン本体}/**`（ワークツリーを配信元のフォルダとみなさないため）。`.claude/worktrees/x` のワークツリーは project-index のファイルを持たない
      - name: 入力
        description: '`cwd` をワークツリー x にした `source: company`・`view: full`・`fields: [id, created, updated]`'
    flow: |-
      <!-- map: {"title": "正常系（disk の配信元をワークツリーの作業場所から引く）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs
        participant F as company のクローン本体

        C->>T: cwd: ワークツリー x, source: company
        T->>T: worktrees に当たってもワークツリーに読み替えない
        T-->>F: 登録したフォルダの文書を読む
        T-->>C: 文書 1・文書 2
      ```

      <!-- /map -->
    expected:
      - '`items[].path` が company のクローン本体の中の絶対パス'
      - 文書 1 の `created`・`updated` が文書の値で、文書 2 は空
    test: test_normal_when_disk_storage
  - name: 異常系（disk の配信元に ref を指定する・InvalidArgumentError）
    summary: disk の配信元への `ref`・`worktree` の指定を断る
    setup:
      - name: Mock
        description: なし
      - name: ローカル運用の配信元
        description: 正常系（disk の配信元をワークツリーの作業場所から引く）と同じ company
        notes: '`develop` ブランチがある'
      - name: 入力
        description: '`source: company`・`ref: develop`'
    flow: |-
      <!-- map: {"title": "異常系（disk の配信元に ref を指定する・InvalidArgumentError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs

        C->>T: source: company, ref: develop
        T-->>C: isError（company は ref を指定できない）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、company が disk の配信元のため `ref` を指定できない理由を返す'
      - '`worktree` を指定しても同じ理由の `isError: true` を返す'
    test: test_error_when_ref_given_to_disk_source
  - name: 正常系（ワークツリーにだけある行）
    summary: ワークツリーの配信元の設定にだけある documents の行の文書を返す
    setup:
      - name: Mock
        description: なし
      - name: ワークツリー
        description: 'sample の `.claude/worktrees/x`。配信元の設定に、クローン本体に無い行 `notes`（`paths: [notes/*.yaml]`）と、その行の文書 `notes/N-1.yaml` を加えてある'
        notes: サーバーを起動した後に加え、`reload` は呼ばない
      - name: 入力
        description: 1 回目は `worktree` に x のパス、2 回目は `cwd` を x の中にして `worktree` を省く。どちらも `filter` は `kind` が `notes`
    flow: |-
      <!-- map: {"title": "正常系（ワークツリーにだけある行）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs
        participant WT as ワークツリー x

        C->>T: worktree: x, filter（kind が notes）
        T->>T: worktree が worktrees に当たる
        T-->>WT: 配信元の設定を再読み込みし、その documents の行で文書を読む
        T-->>C: N-1
      ```

      <!-- /map -->
    expected:
      - どちらの呼び出しも `N-1` を返す
      - '`worktree` を渡した `group_by: kind` の集計に `notes` がある'
      - '`cwd` がクローン本体で `worktree` を省くと、`N-1` を返さない'
    test: test_normal_when_worktree_adds_row
  - name: 異常系（ワークツリーの設定が検証に通らない・ValidationFailedError）
    summary: ワークツリーの配信元の設定が検証に通らなければ、違反を添えて断る
    setup:
      - name: Mock
        description: なし
      - name: ワークツリー
        description: 'sample の `.claude/worktrees/x`。配信元の設定の documents の行に、知らないキー `typo: x` を加えてある'
        notes: クローン本体の設定は検証に通る
    flow: |-
      <!-- map: {"title": "異常系（ワークツリーの設定が検証に通らない・ValidationFailedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs
        participant WT as ワークツリー x

        C->>T: worktree: x
        T-->>WT: 配信元の設定を再読み込みする
        T->>T: 設定が検証に通らない
        T-->>C: isError（ValidationFailedError・違反）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、`ValidationFailedError` と、`documents[0].typo` の違反を返す'
      - クローン本体の設定で集めた文書を返さない
      - '`cwd` がクローン本体で `worktree` を省くと、これまでどおり文書を返す'
    test: test_error_when_worktree_config_invalid
  - name: 正常系（ワークツリーの設定でメタデータの対応を変えた）
    summary: ワークツリーを読み込んだ後にワークツリーの `project-index.yaml` で行の `metadata` を変えると、次の呼び出しから変えた後の対応で共通のメタデータを返却する
    setup:
      - name: Mock
        description: なし
      - name: ワークツリー
        description: sample の `.claude/worktrees/x`。文書 1 は列 `refs` に文書 2 を持ち、行の `metadata` は `related` を対応付けていない
      - name: 入力
        description: '`worktree` に x のパス、`filter`（id が文書 1）・`fields: [related]`。1 回呼んだ後、ワークツリー x の `project-index.yaml` の行の `metadata` に `related: refs` を追加し（commit しない）、同じ入力でもう 1 回呼ぶ'
    flow: |-
      <!-- map: {"title": "正常系（ワークツリーの設定でメタデータの対応を変えた）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs
        participant WT as ワークツリー x

        C->>T: worktree: x, fields: related
        T-->>WT: 設定と文書を読み込む
        T-->>C: 文書 1（related が空）
        Note over WT: 行の metadata に related: refs を追加する
        C->>T: worktree: x, fields: related
        T-->>WT: 変わった設定の行で、行の定義が変わった文書を再読み込みする
        T-->>C: 文書 1（related が文書 2）
      ```

      <!-- /map -->
    expected:
      - 1 回目は文書 1 の `related` が空、2 回目は `related` に文書 2 を返却する
      - '`reload` も再起動も呼ばない'
      - クローン本体を指す呼び出しは、続けて呼んでも文書 1 の `related` が空
    test: test_normal_when_worktree_metadata_changed
  - name: 正常系（ワークツリーの設定で読み取りの検査を変えた）
    summary: 'ワークツリーで `on: [read]` の検査のスクリプトや validators の行を変えると、文書が変わらなくても次の呼び出しから変えた後の検査の違反を `notes` に返却する'
    setup:
      - name: Mock
        description: なし
      - name: ワークツリー
        description: 'sample の `.claude/worktrees/x`。文書 1 の行の `validators` に `on: [read]` の検査 `check` を持ち、`check` の `run` は `scripts/check.py`（違反を出さない）を動かす'
        notes: クローン本体の設定とスクリプトは、ワークツリーと同じ内容で commit してある
      - name: 入力
        description: '`worktree` に x のパス、`filter`（id が文書 1）。1 回呼んだ後、ワークツリー x の `scripts/check.py` を違反 `rule-a` を出す内容に書き換えて 2 回目を呼び、続けてワークツリー x の `project-index.yaml` の `check` の `run` を、違反 `rule-b` を出す `scripts/check_b.py` に変えて 3 回目を呼ぶ'
        notes: どれも commit しない。文書 1 は変えない
    flow: |-
      <!-- map: {"title": "正常系（ワークツリーの設定で読み取りの検査を変えた）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs
        participant WT as ワークツリー x

        C->>T: worktree: x, filter（id が文書 1）
        T-->>WT: 検査 check を動かす
        T-->>C: 文書 1（notes に違反なし）
        Note over WT: scripts/check.py を rule-a を出す内容に書き換える
        C->>T: worktree: x, filter（id が文書 1）
        T-->>WT: 書き換えた後のスクリプトで検査 check を動かし直す
        T-->>C: 文書 1（notes に rule-a）
        Note over WT: check の run を scripts/check_b.py に変える
        C->>T: worktree: x, filter（id が文書 1）
        T-->>WT: 変えた後の行で検査 check を動かし直す
        T-->>C: 文書 1（notes に rule-b）
      ```

      <!-- /map -->
    expected:
      - 1 回目は `notes` に文書 1 の違反が無い
      - '2 回目は `notes` に `文書 1: check: rule-a（$）` があり、3 回目は `notes` に `文書 1: check: rule-b（$）` があって `rule-a` が無い'
      - '`reload` も再起動も呼ばない'
      - 3 回目の後に `cwd` がクローン本体で `worktree` を省いて呼ぶと、`notes` に文書 1 の違反が無い
    test: test_normal_when_worktree_validator_changed
  - name: 正常系（本文のファイルを持たない要素がある）
    summary: '`body_file` の列が無い・空の要素を要素を本文にした文書として返し、指すファイルが無い要素の知らせを 1 行にまとめる'
    setup:
      - name: Mock
        description: なし
      - name: 本文のファイルを持つ行
        description: "sample の行 `notes`（`paths: [notes/index.yaml]`・`records: items`・`body_file: path`）。`items[0]` の n1 は `path: n1.md` で `notes/n1.md` を指し、`items[1]` は `path` の列を持たず、`items[2]` の n3 は `path: ''`、`items[3]` の n4 と `items[4]` の n5 は無いファイル（`n4.md`・`n5.md`）を指す"
        notes: 行のスキーマは `path` を必須にしない。`items[1]` は `id`・`name` の列を持たない
      - name: 入力
        description: '`filter`: `kind` が `notes`、`view: full`、`format: json`'
    flow: |-
      <!-- map: {"title": "正常系（本文のファイルを持たない要素がある）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as search_docs
        participant ST as 配信元の文書

        C->>T: filter kind notes・view full
        T-->>ST: notes/index.yaml と n1.md を読む
        T->>T: path が無い・空の要素は要素を本文にした文書にする
        T->>T: 無いファイルを指す n4・n5 を除き、知らせを 1 行にまとめる
        T-->>C: 3 件の文書と notes 1 行
      ```

      <!-- /map -->
    expected:
      - '`items` が n1・`items[1]`・n3 の 3 件で、n4・n5 を含まない'
      - n1 の本文は `notes/n1.md` の内容で `path` は `notes/n1.md` の絶対パス。`items[1]`・n3 の本文は要素を YAML に書き出した文字列で、`path` は `notes/index.yaml` の絶対パス、`scope` は `section`
      - '`items[1]` の文書の `id` と `name` が `notes/index.yaml#1`'
      - '`notes` に `notes/index.yaml` の本文のファイルが無い要素の知らせが、件数 2 と先頭の要素（`items[3]`）の詳細を持つ 1 行だけある'
      - '`isError` ではない'
    test: test_normal_when_body_file_absent
lead: '条件に該当する文書の取得・一覧・件数・集計を返却する `search_docs` の入出力を定め、`search_docs` を修正するときに参照する。'
tags:
  - name: topic:クエリ
    main: true
  - name: action:検索
  - name: action:絞り込み
  - name: tool:mcp
aliases:
  - 'search_docs'
identifier: search_docs
permissions: 対象の配信元の `scope.read` か `scope.write` に `cwd` が当たること
idempotent: true
side_effects: '会話キー（`session_id`・`agent_id`）ごとに、本文を返した文書（`sections`・`lines` を渡した呼び出しを除く）の id・ハッシュ・返した時点の内容を `state_dir` に記録する（`list_changes` の前回読んだ時点に使う）。文書のファイルは変えない。'
callers:
  - SC-6#scenarios[正常シナリオ]
  - SC-6#scenarios[正常シナリオ（使われているタグを数える）]
  - SC-6#scenarios[正常シナリオ（作った直後のワークツリーを指す）]
  - SC-6#scenarios[異常シナリオ（ワークツリーの読み込みが上限までに終了しない）]
  - SC-6#scenarios[異常シナリオ（git の実行が失敗する）]
  - SC-6#scenarios[正常シナリオ（本文のファイルを持たない要素を引く）]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true` で並列に呼ばれる）'
request:
  - name: source
    type: str | list[str]
    required: false
    default: なし（作業中の配信元）
    location: argument
    description: 配信元の ID（端末の設定の `sources[].id`）
    notes: 配列か `*`（参照できる全配信元）も受ける
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`。作業中の配信元は作業ツリー）
    location: argument
    description: 読むリビジョン（ブランチ・コミット・タグ）
    constraints: Git 管理外の配信元と、複数の配信元を指したときは渡せない
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: 読むワークツリーのパス
    constraints: 配信元の設定の `worktrees` に当たるパスだけ
  - name: filter
    type: Group | Condition
    required: false
    default: なし（全件）
    location: argument
    description: '条件の木。`Group` は `{and: [...]}`・`{or: [...]}`・`{not: Group | Condition}` のどれか 1 つのキーだけを持つ、`Condition` は `{field, op, values, match, case_sensitive}`'
    constraints: 入れ子の深さは制限しない
  - name: filter.field
    type: str
    required: true
    location: argument
    description: メタデータのキー・種類ごとの項目・`body`・`*`（全項目）・計算項目（`@chars`・`@path`・`@sections`）
  - name: filter.op
    type: Literal['eq', 'ne', 'prefix', 'suffix', 'contains', 'not_contains', 'regex', 'glob', 'gt', 'gte', 'lt', 'lte', 'exists', 'not_exists']
    required: true
    location: argument
    description: 比べ方
    notes: '`regex` は値の各行に適用する（`^`・`$` は各行の先頭・末尾。値全体の先頭・末尾は `\A`・`\Z`）。パターンには正規化をかけず、`case_sensitive: false` は `re.IGNORECASE` と NFKC にした値で比べる。`glob` は値全体に適用し、`**` は `/` をまたぎ、`*`・`?` は `/` をまたがない'
  - name: filter.values
    type: list[str]
    required: false
    default: なし（`exists`・`not_exists` だけ省ける）
    location: argument
    description: 比べる値。数値・日付は項目の型で解釈する
    notes: 日付は `today`・`-7d` も受ける
  - name: filter.match
    type: Literal['any', 'all']
    required: false
    default: '`any`'
    location: argument
    description: '`values` の複数を OR（`any`）か AND（`all`）で比べる'
  - name: filter.case_sensitive
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: 大文字小文字と全角半角（NFKC）を区別するか
  - name: view
    type: Literal['ids', 'summary', 'full', 'count']
    required: false
    default: '`summary`'
    location: argument
    description: '`ids` は ID だけ、`summary` は共通のメタデータ、`full` は本文込み、`count` は件数だけ'
  - name: fields
    type: list[str]
    required: false
    default: なし（`view` に従う）
    location: argument
    description: 返す項目に加える項目
  - name: exclude_fields
    type: list[str]
    required: false
    default: なし
    location: argument
    description: 返す項目から除く項目
  - name: order_by
    type: "list[{field: str, direction: Literal['asc', 'desc']}]"
    required: false
    default: 'なし（`id` の昇順。`filter` が `id` の `eq` の条件 1 つなら、その `values` の順）'
    location: argument
    description: 並べ替え。先のキーが優先
    notes: '`@chars` で文字数順、`@matches` でよく当たる順。日時が空の文書は末尾'
  - name: group_by
    type: str
    required: false
    default: なし
    location: argument
    description: 指定した項目の値ごとの件数を返す
    notes: 配列の項目は要素ごとに数える。どの項目も、条件の比較と同じ正規化（NFKC と `casefold`）をした値でまとめ、表記だけが違う値を 1 つに数える。1 つの文書に付いた同じ値は 1 件と数える
  - name: limit
    type: int
    required: false
    default: '`20`'
    location: argument
    description: 返す件数
    constraints: 1〜100。100 を超えたら 100 に丸めて `notes` で知らせる
  - name: cursor
    type: str
    required: false
    default: なし
    location: argument
    description: 前回の `next_cursor`。ほかの引数は前回と同じにする
  - name: skip
    type: int
    required: false
    default: '`0`'
    location: argument
    description: 先頭から飛ばす件数
  - name: max_chars
    type: int
    required: false
    default: '`20000`'
    location: argument
    description: 結果全体の文字数の上限
    constraints: 上限 40,000
  - name: max_chars_per_field
    type: int
    required: false
    default: '`2000`（`view: full` は `10000`）'
    location: argument
    description: 長い値を末尾で切り、残りの文字数を添える
  - name: snippets
    type: '{context_lines: int, before: int, after: int, max_per_doc: int}'
    required: false
    default: なし
    location: argument
    description: 本文の代わりに、条件に該当した行と前後の行だけを行番号つきで返却する
    notes: 当たった行は、条件の `body`・`*` の `eq`・`prefix`・`suffix`・`contains`・`regex` と同じ判定で行ごとに探す（`eq`・`prefix`・`suffix` は行の部分一致。`case_sensitive` も条件と同じ）
  - name: repeat_seen
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: この会話で返却済みの本文も返す
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返却する形式
  - name: cwd
    type: str
    required: false
    default: なし（作業場所なし。どの `scope` にも当たらない）
    location: argument
    description: セッションの作業場所
    notes: PreToolUse のフックがセッションの作業場所で上書きし、エージェントが指定した値は使わない。ツールの入力のスキーマの `description` にも同じことと、ワークツリーは `worktree` で指すことを載せる
  - name: session_id
    type: str
    required: false
    default: なし（返却済みの記録をしない）
    location: argument
    description: 会話キー
    notes: フックが入れる
  - name: agent_id
    type: str
    required: false
    default: なし（メインの会話）
    location: argument
    description: 会話キー（サブエージェント）
    notes: フックが入れる
  - name: snippets.context_lines
    type: int
    required: false
    default: '`1`'
    location: argument
    description: '`before`・`after` を省いたときの前と後ろの行の数'
  - name: snippets.before
    type: int
    required: false
    default: なし（`context_lines`）
    location: argument
    description: 該当した行の前に返却する行の数
    constraints: 0 以上
  - name: snippets.after
    type: int
    required: false
    default: なし（`context_lines`）
    location: argument
    description: 該当した行の後ろに返却する行の数
    constraints: 0 以上
  - name: snippets.max_per_doc
    type: int
    required: false
    default: '`3`'
    location: argument
    description: 文書ごとに返す抜粋の数
    notes: 重なる範囲は 1 つの抜粋にまとめ、本文の先頭から数える
  - name: filter.not
    type: Group | Condition
    required: false
    default: なし
    location: argument
    description: 中の条件か束に該当しない文書に該当する
    notes: '`and`・`or` の中にも置ける。中の `body`・`*` の条件は `@matches`・抜粋の判定に使わない'
    status: planned
  - name: sections
    type: list[str]
    required: false
    default: なし（本文の全文）
    location: argument
    description: Markdown の本文から返す節の見出しの文字列。見出しの行から、次の同じか上の階層の見出しの前の行までを返す
    constraints: '`view: full` のときだけ。`lines` と同時に指定できない'
    notes: 見出しの `#` と前後の空白を除いた文字列と完全一致で当てる。当たる見出しが複数あれば全て返す。YAML の文書と当たる見出しの無い文書は本文を空で返し、`notes` で知らせる
    status: planned
  - name: lines
    type: '{offset: int, limit: int}'
    required: false
    default: なし（本文の全文）
    location: argument
    description: 本文から返却する行の範囲
    constraints: '`view: full` のときだけ。`sections` と同時に指定できない'
    notes: 文書の種類を問わない
    status: planned
  - name: lines.offset
    type: int
    required: false
    default: '`1`'
    location: argument
    description: 返却する最初の行の行番号（1 始まり）
    constraints: 1 以上
    status: planned
  - name: lines.limit
    type: int
    required: false
    default: なし（本文の末尾まで）
    location: argument
    description: 返却する行の数
    constraints: 1 以上
    status: planned
  - name: outside_scope
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: '`true` のとき、`cwd` が `scope` に該当しない配信元も、端末の設定の `sources[].outside_read` が真なら作業範囲の外（参考）として参照する'
    constraints: '`source` に ID を 1 つ渡したときだけ効く。配列・`*` は `scope` に当たる配信元だけを対象にする'
    status: planned
  - name: term
    type: str
    required: false
    default: なし（用語で絞らない）
    location: argument
    description: 用語。`alias_type` を持つ documents の行の文書のうち、`name` か `aliases` の値がこの単語に一致する文書に該当する
    notes: 条件の比較と同じ正規化（NFKC と `casefold`）をして完全一致で比べる。`filter` と同時に渡すと両方に当たる文書を返す。`alias_type` を持つ行が無い配信元では 0 件で、`notes` で知らせる
    status: planned
request_example: |-
  ```json
  {
    "source": "sample",
    "filter": {"and": [
      {"field": "kind", "op": "eq", "values": ["rule"]},
      {"or": [
        {"field": "tags", "op": "eq", "values": ["mcp"]},
        {"field": "body", "op": "contains", "values": ["ページング"]}
      ]}
    ]},
    "view": "full",
    "limit": 3
  }
  ```
response:
  - name: total_count
    type: int
    description: 条件に当たった総件数
    notes: 常に返す。複数の配信元では配信元ごとにも返す
  - name: returned
    type: int
    description: 返した件数
  - name: next_cursor
    type: str
    description: 続きがあるときだけ
  - name: truncated
    type: bool
    description: '`max_chars` で打ち切ったか'
  - name: notes
    type: list[str]
    description: 丸めた・打ち切った・読めなかったファイルの知らせと次の手
  - name: groups
    type: 'list[{value: str, count: int}]'
    description: '`group_by` のときの値ごとの件数'
    notes: '`value` はまとめた元の表記のうち付いている文書が最も多いもの（同数なら値の昇順で先のもの）。並びは件数の降順・値の昇順'
  - name: items[].id
    type: str
    description: 文書の ID
    notes: ID で絞ったときは指定した順
  - name: items[].source
    type: str
    description: 文書の配信元の ID
    notes: 複数の配信元を指したときだけ
  - name: items[].values.version
    type: str
    description: 内容のハッシュ（短縮）
  - name: items[].values.body
    type: str
    description: 本文。YAML の文書は YAML、Markdown の文書は Markdown
    notes: 返却済みなら `（この会話で返却済み）`
  - name: items[].path
    type: str
    description: 文書の場所。配信元（ワークツリーを指したときはワークツリー）の直下と文書のパスを結んだ絶対パス。`body_file` のある `records` の要素は指したファイル
    notes: '`values` の外に置く（メタデータのキー `path` と別）。`view: ids`・`count`、`ref` を渡した呼び出し、返却済みの文書では持たない'
  - name: items[].scope
    type: Literal['full', 'section', 'summary']
    description: 返した範囲。`full` は本文を切らずに返した、`section` は本文の一部を返した、`summary` は本文を返さなかった
    notes: 決め方は制約の「範囲の決め方」。`items[].path` と同じ条件で持たない
  - name: items[].snippets
    type: 'list[{lines: list[{line: int, text: str, hit: bool}]}]'
    description: 抜粋。重なる範囲をまとめた 1 つが 1 要素
    notes: '`snippets` を渡したときだけ'
  - name: items[].snippets[].lines[].line
    type: int
    description: 本文の行番号（1 始まり）
  - name: items[].snippets[].lines[].text
    type: str
    description: 行の文字列（改行を含まない）
  - name: items[].snippets[].lines[].hit
    type: bool
    description: 条件に当たった行か（`false` は前後の行）
  - name: items[].values.@matches
    type: int
    description: '`filter` の本文の条件に当たった本文の行の数'
    notes: '`fields` に `@matches` を渡したときだけ。数え方は制約の「当たった数の数え方」'
  - name: items[].ranges
    type: 'list[{start_line: int, end_line: int}]'
    description: '`sections`・`lines` で切り出した本文の行の範囲（本文の行番号、1 始まり）'
    notes: '`sections`・`lines` を渡したときだけ。切り出す範囲が無ければ空の配列'
  - name: items[].total_lines
    type: int
    description: 本文の全体の行数
    notes: '`items[].ranges` と同じ条件で持つ'
  - name: outside_scope
    type: bool
    description: 作業範囲の外から読んだか
    notes: '`format: markdown` は先頭の行に「作業範囲の外（参考）」を出し、`view: full` の `<document>` に `outside_scope="true"` を付ける'
response_example: |-
  ```markdown
  sample: 該当 2 件・返却した 2 件

  | id | kind | name | description | chars | version |
  | --- | --- | --- | --- | --- | --- |
  | doc-1 | sample | 文書 1 | 1 件目 | 320 | 9d0e11 |
  | doc-2 | sample | 文書 2 | 2 件目 | 410 | c1aa02 |
  ```
response_notes: '`format: markdown` のときは structuredContent を返さない。`format: json` のときは structuredContent と text に同じ JSON を入れる。


  `format: markdown` の `view: full` は文書ごとに `<document path="{items[].path}" scope="{items[].scope}">` で包む（shuhei1101/rule-inject#46 の書式）。`path` を持たない文書は属性の無い `<document>` で包む。


  `sections`・`lines` を渡した `format: markdown` は、`<document>` の前の行に `{id}: {start_line}-{end_line} 行目 / 全 {total_lines} 行` を出す（範囲が複数なら `・` で並べる）。'
exceptions:
  - name: なし（正常終了）
    condition: 検索できた（読めなかったファイルがあっても `notes` で知らせて正常終了）
  - name: SourceNotReadableError
    condition: '`cwd` が配信元の `scope.read`・`scope.write` に当たらない（`outside_scope: true` のときは、加えて `outside_read` が偽）、または `cwd` が無い'
    notes: '今の作業場所から使える配信元の一覧を添える。`outside_read` が真で `outside_scope` を渡していないときは、`fix` に `outside_scope: true` で作業範囲の外を参考に参照できることを添える'
  - name: SourceNotServedError
    condition: '端末の設定にあるが、起動時の検証で外したか `enabled: false` の配信元を指した'
    notes: 違反したキーのパスと理由を添える
  - name: WorktreeNotMatchedError
    condition: '`worktree` が配信元の `worktrees` に当たらない'
  - name: InvalidArgumentError
    condition: '知らない項目・型の合わない値を条件・並べ替え・`group_by` に渡した、束に `and`・`or`・`not` のキーを 2 つ以上持たせた、`@matches` を条件に使った、`sections` と `lines` を同時に渡した、`view: full` 以外で `sections`・`lines` を渡した、`lines` の `offset`・`limit` が 1 未満、`storage.type: disk` の配信元に `ref`・`worktree` を渡した'
    notes: 項目のパス・期待する型・実際の値と、`describe(source, kind)` でスキーマを見ることを添える
  - name: RefNotFoundError
    condition: '`ref` を commit に解決できない'
  - name: WorktreeLoadingError
    condition: '`worktree` か `cwd` が指すワークツリーの読み込みが、端末の設定の `worktree_load_wait_sec` までに終了しなかった'
    notes: ワークツリーのパスと、時間を空けて同じ呼び出しを送信することを添える。読み込みは止めずに続ける
  - name: UnexpectedError
    condition: '`ProjectIndexError` でない例外（`GitError` など）で処理を終了できなかった'
    notes: 例外の型と内容を返却する。サーバーのログには例外のトレースバックを残す
  - name: ValidationFailedError
    condition: '`worktree` か `cwd` が指すワークツリーの配信元の設定が検証に通らない'
    notes: 違反ごとのパス・決まりを添える。クローン本体の設定で集め直さない（書き込みと同じ扱い）
constraints:
  - item: 件数
    constraint: '`limit` は最大 100'
  - item: 文字数
    constraint: '`max_chars` は最大 40,000。達したら `truncated` と `next_cursor` を返す'
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 引数の検証
    constraint: strict tool use は使わず、サーバーが検証して直し方を返す
  - item: 再読み込み
    constraint: ファイルの更新日時か大きさが変わった文書は、次の呼び出しで再読み込みする
  - item: 範囲の決め方
    constraint: '本文を切らずに返したら `full`。`max_chars_per_field` で切った本文・`snippets`・`sections`・`lines` で切り出した本文・`body_file` の無い `records` の要素と本文のファイルを持たない要素（本文が管理用の YAML の 1 要素）は `section`。本文を返さない呼び出し（`view: summary`、`exclude_fields` で `body` を除いた `view: full`）は `summary`'
    notes: rule-inject は `full` だけを既読にする（D-125）
  - item: 名前の既定
    constraint: メタデータの `name` が空なら、ファイル名から拡張子を除いた名前にする。`records` の要素は `body_file` が指すファイルの名前、`body_file` が無いか要素が本文のファイルを持たなければ文書の `id`
    notes: '行の `metadata` の列名の対応で共通のキーを読んだ後に当てる'
  - item: 抜粋の書式
    constraint: '`format: markdown` は grep の `-n` と同じく、当たった行を `{行番号}:{行}`、前後の行を `{行番号}-{行}` で出し、抜粋の間に `--` の行を置く'
    notes: 行番号を Read の `offset` や `write_docs` の `text_edits` へそのまま渡せる
  - item: 当たった数の数え方
    constraint: '`@matches` は、`filter` の `body`・`*` の条件（`not` の下を除く）のどれかに当たった本文の全文の行を数える。行の判定は抜粋と同じ。本文の条件が無ければ 0'
    notes: '`fields`・`order_by` でだけ使える'
  - item: 本文の切り出しの順序
    constraint: '`sections`・`lines` で切り出し → 切り出した範囲の中で `snippets` の抜粋を探す → `max_chars_per_field` で切る、の順に当てる。抜粋の行番号は本文の行番号のまま'
    notes: 抜粋の行番号を続けて `lines` に渡せる
  - item: 返却済みの記録
    constraint: '`sections`・`lines` を渡した呼び出しは、返した文書を記録せず、返却済みでも切り出した本文を返す。ほかの呼び出しは `scope` によらず本文を返した文書を記録し、返却済みの本文を省く'
    notes: 既存の呼び出し（`max_chars_per_field` で切った本文・`body_file` の無い `records` の要素を含む）の記録は変えない
  - item: 作業範囲の外の記録
    constraint: '`outside_scope: true` で作業範囲の外の配信元を読んだ呼び出しは、作業場所（`cwd`）と配信元の ID を要求のログに残す'
  - item: オブジェクトの配列のタグ
    constraint: '種類の行の `metadata` に `tags: tags[].name` と書くと、各要素の `name` の文字列の配列を `tags` として扱う。共通のキー `main_tags` は、`main_tags: tags[main].name` のように `[{真偽値のキー}]` で絞った要素の `name` を取り出す。どちらも `filter`・`group_by`・`fields` で他の共通のキーと同じように使える'
    notes: '`[]` と `[{キー}]` を使わない `metadata`（`a.b[0].c`）は今のまま読む'
  - item: records の行のスキーマ
    constraint: '`records` を持つ行の `schema` はファイル全体のスキーマとし、要素 1 つずつの検査と項目の一覧には `properties.{records}.items` を当てる'
    notes: 書き込み（`write_docs`）・`check_project` も同じ当て方
  - item: ID の既定
    constraint: メタデータの `id` が空なら、配信元の直下からのファイルのパス（拡張子付き）にする。`records` の要素は `body_file` が指すファイルのパス、`body_file` が無いか要素が本文のファイルを持たなければ `{管理用の YAML のパス}#{位置}`
    notes: 同じ名前で拡張子の違うファイルも別の文書になる
  - item: スキーマの参照の解決
    constraint: '種類のスキーマの `$ref` は、最上位の `$defs` の中の相対パスの `$ref` を含めて、スキーマのファイルのフォルダを基準に解決してから検査に当てる。種類のスキーマの中で循環する参照は `#/$defs/...` のまま、参照先の別のファイルの中で循環する参照はそのファイルの定義を指したまま検査に当てる'
  - item: 解決できないスキーマの参照
    constraint: '読み取りの検査で種類のスキーマの `$ref` を解決できない文書は、結果に含め、`notes` に文書の ID・解決できなかった `$ref`・スキーマのファイルのパスを入れる'
  - item: ワークツリーの読み込みの保持
    constraint: ワークツリーの設定・ファイルの一覧・本文のパス・スキーマの参照の解決をワークツリーごとに保持し、同じワークツリーを指す 2 回目以降の呼び出しで再度読み込まない。ワークツリーのファイルが変わったら、次の呼び出しで変わった分だけを再度読み込む。読み込みを終えたらサーバーのログに INFO で `ワークツリーを読み込んだ（{配信元}・{ワークツリーのパス}・{秒数} 秒）` を出す
    notes: ファイルが変わったかの確認の方法はモジュール構成で決める
  - item: ワークツリーの読み込みの待ち
    constraint: ワークツリーの読み込みを、要求を受けてから端末の設定の `worktree_load_wait_sec`（既定は [非機能要件](id:NFR-1) のワークツリーの読み込みを待つ上限）まで待つ。終了しなければ `WorktreeLoadingError` を返却し、読み込みは止めずに続ける。読み込み中のワークツリーを指す後続の呼び出しは、同じ読み込みの終了を待つ
    notes: クローン本体の文書をワークツリーの文書の代わりに返却しない
  - item: 想定外の例外
    constraint: '`ProjectIndexError` でない例外は、`UnexpectedError: {例外の型}: {内容}` を本文にした `isError: true` の応答にする。`Error executing tool` だけの応答にしない'
    notes: 文書の MCP の全てのツールに共通する
  - item: disk の配信元
    constraint: '端末の設定の行が `storage.type: disk` の配信元は、作業場所が `worktrees[]` に当たっても登録したフォルダの文書を返す。`ref`・`worktree` を指定すると `InvalidArgumentError`。ファイルの日時は文書の `created`・`updated` の値（無ければ空）'
  - item: ワークツリーの配信元の設定
    constraint: '`worktree` を指定したときと `cwd` がワークツリーの中のときは、そのワークツリーの配信元の設定（`documents` の行）で文書を集める'
    notes: 設定はワークツリーの文書の読み込みと同じく、ファイルが変わっていなければ再読み込みしない
  - item: 読めなかったファイルの知らせ
    constraint: 読み込みで除いた文書の知らせは、ファイルと理由ごとに 1 行にまとめ、除いた文書の件数と先頭の 1 件の詳細を添える。件数が 1 のときはその 1 件の詳細だけを出す
    notes: '`records` の行で同じファイルの要素が多く除かれても、`notes` が要素の数だけ並ばない'
  - item: 本文のファイルを持たない要素
    constraint: '`records`・`body_file` の行で `body_file` の列が無いか値が空の文字列の要素は、`body_file` を持たない `records` の行の要素と同じ本文・`path`・範囲・ID と名前の既定で返す。列の値があって指すファイルが無いか配信元の外を指す要素だけを除き、`notes` で知らせる'
    notes: 文字列でない値（数・配列）は、今どおり指すファイルが無い要素として除く
refs:
  - to: SC-6
