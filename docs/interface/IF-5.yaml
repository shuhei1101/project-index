id: IF-5
title: "用語の一覧"
entry:
  kind: mcp_tool
  value: list_match_words
flows:
  - name: 正常系
    summary: '`alias_type` を持つ行の文書の `name` と `aliases` を、指す文書の ID とともに返す'
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリをテストのクライアントで呼ぶ）
      - name: 用語の種類
        description: sample の `alias_type` を持つ行の文書「作業範囲」
        notes: '`aliases` は `[scope, 担当範囲]`'
      - name: エイリアスのキーに違反する文書
        description: 同じ行の文書「壊れた用語」の `aliases` を数値（文字列でも文字列の並びでもない）にする
      - name: 入力
        description: '`source: sample`。`cwd` は sample のクローン本体'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: sample
        T->>T: alias_type を持つ行の文書のうちスキーマに通るものを集める
        T-->>C: 語と文書の ID の一覧
      ```

      <!-- /map -->
    expected:
      - '`words` に `作業範囲`（`name`）・`scope`・`担当範囲`（`alias`）が、文書「作業範囲」の ID とともに並ぶ'
      - 「壊れた用語」の語は `words` に載らない
    test: test_normal
  - name: 正常系（用語の種類が無い）
    summary: '`alias_type` を持つ行が無い配信元は空の一覧を返す'
    setup:
      - name: Mock
        description: なし
      - name: 用語の種類の無い配信元
        description: '`alias_type` を持つ行が無い配信元 `plain`'
    flow: |-
      <!-- map: {"title": "正常系（用語の種類が無い）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: plain
        T-->>C: 空の一覧
      ```

      <!-- /map -->
    expected:
      - '`words` が空で、エラーにしない'
    test: test_normal_when_no_alias_type
  - name: 異常系（作業範囲に当たらない・SourceNotReadableError）
    summary: '`cwd` が `scope` に当たらない配信元を断る'
    setup:
      - name: Mock
        description: なし
      - name: 配信元
        description: other（`scope.read` は other のフォルダだけ）
      - name: 入力
        description: '`source: other`。`cwd` は sample のクローン本体'
    flow: |-
      <!-- map: {"title": "異常系（作業範囲に当たらない・SourceNotReadableError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: other
        T->>T: scope に cwd が当たらない
        T-->>C: SourceNotReadableError
      ```

      <!-- /map -->
    expected:
      - '`SourceNotReadableError` で、今の作業場所から使える配信元の一覧を添える'
    test: test_error_when_source_not_readable
  - name: 異常系（配信していない配信元・SourceNotServedError）
    summary: 起動時の検証で外した配信元を断る
    setup:
      - name: Mock
        description: なし
      - name: 配信元
        description: '`enabled: false` の配信元 off'
    flow: |-
      <!-- map: {"title": "異常系（配信していない配信元・SourceNotServedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: off
        T-->>C: SourceNotServedError
      ```

      <!-- /map -->
    expected:
      - '`SourceNotServedError` を返す'
    test: test_error_when_source_not_served
  - name: 正常系（SQLite の表の行）
    summary: '`alias_type` を持つ SQLite の表の行の文書の名前と別名を返却する'
    setup:
      - name: Mock
        description: なし
      - name: SQLite の行
        description: '文書の検索の正常系（SQLite の表の行）と同じ `data/notes.db` と行 `notes_db`（`alias_type: term`）'
    flow: |-
      <!-- map: {"title": "正常系（SQLite の表の行）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: sample
        T-->>C: n1 の name と別名「実況」、n2 の name
      ```

      <!-- /map -->
    expected:
      - '`words[]` に `n1` の `title` 列の値と `実況` が `id: n1`・`kind: term` である'
      - '`n2` の `title` 列の値が `id: n2` である'
    test: test_normal_when_sqlite_rows
  - name: 正常系（既定の検索から除く文書）
    summary: '行の `search_exclude` に該当する文書の単語を既定の結果から除き、`include_excluded: true` のときだけ `excluded: true` を付けて返却する'
    setup:
      - name: Mock
        description: なし
      - name: 文書
        description: 'sample の `assets/` に `a1.yaml`（id `a1`・`title: アセット1`・`summary: 使用中のアセット`・`state: active`）・`a2.yaml`（id `a2`・`title: アセット2`・`summary: 使用しなくなったアセット`・`state: inactive`）'
      - name: 文書の行
        description: '行 `assets`（`paths: [assets/*.yaml]`・`metadata: {status: state, name: title, description: summary}`・`alias_type: term`・`search_exclude: {field: status, op: eq, values: [inactive]}`）'
      - name: 入力
        description: '1 回目は `source: sample`、2 回目は `include_excluded: true` を加える'
    flow: |-
      <!-- map: {"title": "正常系（既定の検索から除く文書）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: sample
        T-->>C: アセット1・excluded_count 1
        C->>T: source: sample, include_excluded: true
        T-->>C: アセット1・アセット2（excluded）
      ```

      <!-- /map -->
    expected:
      - 1 回目の `words` に `アセット1` が `a1` とともにあり、`アセット2` が無く、`excluded_count` が 1
      - '2 回目の `words` に `アセット1` と `アセット2` があり、`アセット2` の要素だけが `excluded: true` を持ち、`excluded_count` を持たない'
      - '`format: markdown` の 2 回目は表に `除外` の列があり、`アセット2` の行に ✓ を出す'
    test: test_normal_when_search_excluded
    refs:
      - to: SC-6
        item: scenarios[正常シナリオ（既定の検索から除く条件に該当する文書を除く）]
        type: references
        when: このインターフェースのフローを変えるときに、シナリオの対応する流れと期待値を確認する。
lead: '`alias_type` を持つ行の文書から照合する語と指す文書の ID を返却する `list_match_words` の入出力を定め、`list_match_words` を修正するときに参照する。'
tags:
  - name: topic:エイリアス
    main: true
  - name: topic:用語
  - name: tool:mcp
aliases:
  - 'list_match_words'
identifier: list_match_words
permissions: その配信元の `scope.read` か `scope.write` に `cwd` が当たること
idempotent: true
side_effects: なし
callers:
  - SC-6#scenarios[正常シナリオ（エイリアスの語で用語を引く）]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: source
    type: str
    required: true
    location: argument
    description: 配信元の ID
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: 文書を読むワークツリーのパス
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返却する形式
  - name: cwd
    type: str
    required: false
    default: なし（使える配信元が無い）
    location: argument
    description: セッションの作業場所
    notes: PreToolUse のフックがセッションの作業場所で上書きし、エージェントが指定した値は使わない。ツールの入力のスキーマの `description` にも同じことと、ワークツリーは `worktree` で指すことを載せる
  - name: include_excluded
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: '`true` のとき、配信元の設定の `documents[].search_exclude` に該当する文書の単語も返却する'
    status: planned
request_example: |-
  ```json
  {"source": "sample"}
  ```
response:
  - name: words[].word
    type: str
    description: 照合する語（文書の `name` か `aliases` の 1 要素）
  - name: words[].id
    type: str
    description: 語が指す文書の ID
  - name: words[].kind
    type: Literal['name', 'alias']
    description: 語が `name` から来たか `aliases` から来たか
  - name: excluded_count
    type: int
    description: '`alias_type` を持つ行の文書のうち、`documents[].search_exclude` に該当して除いた文書の件数'
    notes: '`include_excluded: false` で 1 件以上除いたときだけ持つ。`format: markdown` は件数と `include_excluded: true` で取得できることを表の後に出す'
  - name: words[].excluded
    type: bool
    description: 単語が指す文書が `documents[].search_exclude` に該当するか
    notes: '`include_excluded: true` で、該当する文書の単語だけ `true` を持つ。`format: markdown` は表に `除外` の列を加え、該当する行に ✓ を出す'
response_example: |-
  ```markdown
  | 単語 | 文書 | 種類 |
  | --- | --- | --- |
  | 作業範囲 | glossary/scope | name |
  | scope | glossary/scope | alias |
  | 担当範囲 | glossary/scope | alias |
  ```
exceptions:
  - name: なし（正常終了）
    condition: 返せた（`alias_type` を持つ行が無い配信元は空の一覧を返して正常終了）
  - name: SourceNotReadableError
    condition: '`cwd` が配信元の `scope.read`・`scope.write` に当たらない'
    notes: 今の作業場所から使える配信元の一覧を添える
  - name: SourceNotServedError
    condition: '起動時の検証で外したか `enabled: false` の配信元を指した'
constraints:
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 載せる文書
    constraint: '`alias_type` を持つ行の文書のうち、エイリアスのキーが取り込んだエイリアスのスキーマに通るものだけ。`search_docs` の `term` と同じ関数で集める'
  - item: 件数
    constraint: 制限なし（配信元の用語を全て返す）
  - item: タイムアウト
    constraint: 制限なし
  - item: 既定の検索から除く文書
    constraint: '`include_excluded: false` のとき、文書の行の `search_exclude` に該当する文書の単語を `words` から除き、除いた文書の件数を `excluded_count` にする。条件の照合は `search_docs` の既定の検索から除く判定と同じ関数で行う。`search_docs` の `term` は、この除外の前の単語で照合し、除外は `search_docs` の既定の検索から除く判定に任せる'
test_file: tests/integration/server/test_list_match_words.py
visibility: internal
