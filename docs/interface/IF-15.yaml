id: IF-15
title: "起動"
entry:
  kind: operation
  value: '`project-index serve`（CLI）'
flows:
  - name: 正常系
    summary: 端末の設定の 2 つの配信元を配信し始める
    setup:
      - name: Mock
        description: なし（`project-index serve` を子プロセスで起動し、空きポートを `PROJECT_INDEX_PORT` に入れる）
      - name: 配信元
        description: git リポジトリの sample と、Git 管理外のフォルダの notes
      - name: 端末の設定
        description: '`PROJECT_INDEX_CONFIG` が指す一時フォルダの `settings.yaml`。`sources` に 2 行'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve
        participant CF as 端末の設定・配信元の設定

        U->>T: project-index serve
        T-->>CF: 端末の設定を読み、スキーマで検証する
        T->>T: 127.0.0.1 で待ち受ける
        T-->>U: 待ち受けたアドレスを標準出力に出す
        loop sources の各行
          T-->>CF: config を上から順に読んでマージする
          T->>T: スキーマとスクリプトを検証し、配信元に加える
        end
        T->>T: sources に id project-index の行が無いので、組み込みの配信元を加える
        T-->>U: 配信元を標準出力に出す
        T->>T: 配信元ごとの検査の警告をログに書く
      ```

      <!-- /map -->
    expected:
      - '`127.0.0.1` で待ち受け、`0.0.0.0` では待ち受けない'
      - '`/sources/sample/docs` と `/sources/notes/docs` が 200 を返す'
      - '`/mcp` のツールが `search_docs`・`write_docs`・`delete_docs`・`describe`・`list_changes`・`trace_related` の 6 つ'
      - '`/_admin/mcp` に MCP のセッションを張れる'
      - 標準出力に待ち受けたアドレスと sample・notes、組み込みの配信元 `project-index（組み込み）` が出る
    test: test_normal
  - name: 正常系（設定の YAML を重ねる）
    summary: '`config` の複数の YAML を上から順にマージする'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: '`project-index.yaml` と `project-index.local.yaml` を持つ sample。後の YAML が `description` を上書きし、`documents[]` に `id` が同じ行（`paths` を変える）と新しい行を持つ'
      - name: 端末の設定
        description: sample の `config` が `[project-index.yaml, project-index.local.yaml]`
    flow: |-
      <!-- map: {"title": "正常系（設定の YAML を重ねる）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve
        participant CF as 配信元の設定

        U->>T: project-index serve
        T-->>CF: project-index.yaml と project-index.local.yaml を読む
        T->>T: 同じキーを上書きし、documents を id で行ごとに上書き・追加する
        T-->>U: sample を配信する
      ```

      <!-- /map -->
    expected:
      - '`describe(source: sample)` の説明が後の YAML の `description` になる'
      - '`id` が同じ `documents[]` の行は後の YAML の `paths` の文書だけを返す'
      - 後の YAML で追加した行の文書を `search_docs` が返す
    test: test_normal_when_configs_merged
  - name: 正常系（設定のバージョンが古い）
    summary: 古いバージョンの設定の配信元も配信し、警告を残す
    setup:
      - name: Mock
        description: なし
      - name: 古い配信元
        description: '`version` がサーバーが参照できるバージョンより古く、今のスキーマは満たす配信元'
        notes: id `old`
    flow: |-
      <!-- map: {"title": "正常系（設定のバージョンが古い）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve

        U->>T: project-index serve
        T->>T: old の設定の version をサーバーが参照できるバージョンと比べる
        T-->>U: old を配信し、警告のログを残す
      ```

      <!-- /map -->
    expected:
      - '`/sources/old/docs` が 200 を返す'
      - 警告のログに old の id・設定のバージョン・サーバーが参照できるバージョンがある
    test: test_normal_when_config_version_old
  - name: 正常系（配信元の検証に失敗する）
    summary: 設定がスキーマに違反する配信元と、スクリプトを実行できない配信元を外して配信する
    setup:
      - name: Mock
        description: なし
      - name: 壊れた配信元
        description: '`documents[]` の必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: スクリプトの無い配信元
        description: '`converters[]` が無いファイルを指す配信元'
        notes: id `noscript`
      - name: 端末の設定
        description: '`sources` に sample・broken・noscript の 3 行'
    flow: |-
      <!-- map: {"title": "正常系（配信元の検証に失敗する）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve

        U->>T: project-index serve
        T->>T: broken のスキーマと noscript のスクリプトの検証に失敗する
        T->>T: 2 つを配信せず、エラーログに残す
        T-->>U: sample だけを配信する
      ```

      <!-- /map -->
    expected:
      - '`/sources/broken/docs` と `/sources/noscript/docs` が 404、`/sources/sample/docs` と `/mcp` は応答する'
      - 'エラーログに `broken: documents[0].paths: 必須のキーが無い` と、noscript の `converters[0]` とスクリプトが見つからない理由がある'
      - '`/_admin/mcp` に MCP のセッションを張れる'
    test: test_normal_when_source_invalid
  - name: 異常系（端末の設定が違反する・TerminalConfigInvalidError）
    summary: 端末の設定がスキーマに違反すると待ち受けずに終わる
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources[0]` に必須のキー `config` が無く、`port` が文字列'
        notes: '`sources[0]` に知らないキー `enable`（`enabled` の打ち間違い）を持つ'
    flow: |-
      <!-- map: {"title": "異常系（端末の設定が違反する・TerminalConfigInvalidError）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve

        U->>T: project-index serve
        T->>T: 端末の設定の検証に失敗する
        T-->>U: 違反を標準エラーに出して終わる
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2 で、ポートを待ち受けない
      - '標準エラーに `{ファイル}: sources[0].config` と `{ファイル}: port` の違反が両方並ぶ'
      - '標準エラーの違反に、`sources[0]` の知らないキー `{ファイル}: sources[0].enable` が含まれる'
      - '`PROJECT_INDEX_CONFIG` が無いファイルを指すときも、そのパスを出して終了コード 2 で終わる'
    test: test_error_when_terminal_config_invalid
    decisions:
      - D-308
  - name: 異常系（ポートが使用中・PortInUseError）
    summary: ポートで待ち受けられないと終わる
    setup:
      - name: Mock
        description: なし
      - name: 使用中のポート
        description: テストが先に待ち受けたポートを `PROJECT_INDEX_PORT` に入れる
    flow: |-
      <!-- map: {"title": "異常系（ポートが使用中・PortInUseError）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve

        U->>T: project-index serve
        T->>T: ポートで待ち受けられない
        T-->>U: ポートと PROJECT_INDEX_PORT を標準エラーに出して終わる
      ```

      <!-- /map -->
    expected:
      - 終了コードが 3
      - 標準エラーに使用中のポートの番号と、`PROJECT_INDEX_PORT` で変えられることが出る
    test: test_error_when_port_in_use
  - name: 正常系（メタデータと管理用の YAML がずれている）
    summary: '`metadata` に書いた列の欠けと管理用の YAML のずれがあっても配信し、件数を警告のログに残す'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 列の欠けた文書
        description: 'sample の行 `sample` が `metadata: {name: title}` を持ち、2 件のうち 1 件に `title` が無い'
        notes: '`metadata` に書いていないキー（同じ名前の列）の欠けは数えない'
      - name: ずれた管理用の YAML
        description: 'sample の `src/files.yaml` が `a.py` と `c.py` の 2 行を持ち、`src/` には `a.py` と `d.py`、`src/sub/e.py` を置く。行 `src` は `records: files`・`body_file: path`。`a.py` の行が `related: [{to: src/z.py, type: tests}]` を持つ'
        notes: '`c.py` はファイルが無い行、`d.py` と `sub/e.py` は索引に無いファイル、`src/z.py` はどの文書にも該当しない関連'
      - name: 同じファイルを文書にする行
        description: 'sample の行 `py`（`paths: [src/a.py]`）を配置する'
        notes: '`src/a.py` は行 `src` と行 `py` の文書になる'
      - name: ID が重なる文書
        description: 'sample の行 `sample`（`paths: [docs/*.yaml]`）に `docs/doc-3.yaml`（`id: doc-1`・`title: 文書 3`）を配置する'
        notes: '`docs/doc-1.yaml` と ID が重なり、配信から除外する'
    flow: |-
      <!-- map: {"title": "正常系（メタデータと管理用の YAML がずれている）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve
        participant ST as 配信元の文書

        U->>T: project-index serve
        T-->>ST: 文書を読む
        T->>T: 配信元を渡して件数を求める
        T-->>U: sample を配信し、件数を警告のログに残す
      ```

      <!-- /map -->
    expected:
      - '`/sources/sample/docs` が 200 を返す'
      - 警告のログに sample の行 `sample` の `metadata` の列の欠け 1 件（`name` の `title`）がある
      - 警告のログに行 `src` の索引に無いファイル 2 件（`src/d.py`・`src/sub/e.py`）とファイルが無い行 1 件（`c.py`）があり、`src/files.yaml` 自身は数えない
      - '警告のログにどの文書にも該当しない関連 1 件（`src: src/a.py: src/z.py`）がある'
      - '警告のログに 2 つ以上の行が文書にするファイル 1 件（`src/a.py: src・py`）がある'
      - ずれが無い配信元では件数の警告を残さない
      - '警告のログに ID が重なる文書 1 件（`doc-1: sample（docs/doc-1.yaml）・sample（docs/doc-3.yaml）`）がある'
    test: test_normal_when_metadata_out_of_sync
  - name: 正常系（前の形式の配信元）
    summary: 前の形式のキーを持つ配信元を外して配信し、違反と移し替えの案内をエラーログに残す
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 前の形式の配信元
        description: '`version: "1"` で、最上位にタグのマスター `tags: tags.yaml`、`documents[0]` が `paths`・`schema`・`type: markdown`、`documents[1]` が `paths`・`schema`・`type: yaml`・`metadata: {name: {type: ref, field: title}}`・`defaults: [{paths: [docs/**], tags: [doc]}]` を持つ配信元'
        notes: id `legacy`。`tags.yaml` を置く
      - name: 端末の設定
        description: '`sources` に sample と legacy の 2 行'
        notes: '-'
    flow: |-
      <!-- map: {"title": "正常系（前の形式の配信元）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve

        U->>T: project-index serve
        T->>T: legacy の設定が tags・type・defaults・オブジェクトの metadata で検証に失敗する
        T->>T: legacy を配信せず、違反と移し替えの案内をエラーログに残す
        T-->>U: sample だけを配信する
      ```

      <!-- /map -->
    expected:
      - '`/sources/legacy/docs` が 404、`/sources/sample/docs` は応答する'
      - 'エラーログに `legacy: tags`・`legacy: documents[0].type`・`legacy: documents[1].type`・`legacy: documents[1].defaults`・`legacy: documents[1].metadata.name` の違反がある'
      - エラーログに、legacy の設定のバージョンが古く `project-index migrate --source` で移し替えられることがある
    test: test_normal_when_source_config_legacy
  - name: 正常系（MCP の入口をスラッシュ無しで呼ぶ）
    summary: プラグインの接続先と同じスラッシュ無しの `/mcp`・`/_admin/mcp` への POST に、リダイレクトを挟まずに MCP が応える
    setup:
      - name: Mock
        description: なし（`project-index serve` を子プロセスで起動し、空きポートを `PROJECT_INDEX_PORT` に入れる）
      - name: 配信元
        description: git リポジトリの sample
      - name: 端末の設定
        description: '`PROJECT_INDEX_CONFIG` が指す一時フォルダの `settings.yaml`。`sources` に 1 行'
      - name: 入力
        description: '`/mcp` と `/_admin/mcp` へ MCP の initialize を POST する'
        notes: HTTP のクライアントはリダイレクトを追従しない
    flow: |-
      <!-- map: {"title": "正常系（MCP の入口をスラッシュ無しで呼ぶ）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve
        participant D as 文書の MCP
        participant A as 管理の MCP

        U->>T: POST /mcp（initialize）
        T->>D: /mcp/ と同じ入口へ届ける
        D-->>U: 200
        U->>T: POST /_admin/mcp（initialize）
        T->>A: /_admin/mcp/ と同じ入口へ届ける
        A-->>U: 200
      ```

      <!-- /map -->
    expected:
      - '`/mcp` への initialize が 307 を挟まずに 200 を返し、`serverInfo` を持つ'
      - '`/_admin/mcp` への initialize が 307 を挟まずに 200 を返し、`serverInfo` を持つ'
      - スラッシュ付きの `/mcp/`・`/_admin/mcp/` への initialize も 200 を返す
    test: test_normal_when_mcp_path_without_slash
  - name: 正常系（設定とスキーマを default_ref から読む）
    summary: クローン本体が別のブランチを checkout していても、`default_ref` の設定とスキーマで配信元を組み立てる
    setup:
      - name: Mock
        description: なし（`project-index serve` を子プロセスで起動する）
      - name: default_ref のブランチ
        description: sample の `develop` に、文書の種類 `kind_a` を加えた `project-index.yaml` とそのスキーマを commit する
        notes: '`default_ref` は `develop`。クローン本体は `master` を checkout し、`master` の `project-index.yaml` は `kind_a` を持たない'
      - name: 端末の設定
        description: '`sources[].config` が sample のクローン本体の `project-index.yaml` を指す'
      - name: ワークツリー
        description: sample の `.claude/worktrees/develop`（`develop` を checkout）
        notes: '`worktrees` は既定（`[./.claude/worktrees/*]`）'
    flow: |-
      <!-- map: {"title": "正常系（設定とスキーマを default_ref から読む）"} -->

      ```mermaid
      sequenceDiagram
        participant C as テスト
        participant S as project-index serve
        participant G as sample のリポジトリ

        C->>S: 起動する
        S->>G: ディスクの project-index.yaml の default_ref を読む
        S->>G: develop の project-index.yaml とスキーマを読む
        S-->>C: 配信を始める
        C->>G: develop に種類 kind_b を commit する
        C->>S: describe(source: sample)
        S->>G: default_ref の commit を確かめ、変わっていれば組み立て直す
        S-->>C: 種類の一覧
      ```

      <!-- /map -->
    expected:
      - '起動直後の `describe(source: sample)` の種類の一覧に `kind_a` が載る'
      - '`kind_b` を commit した後の `describe(source: sample)` で、`reload` をしなくても `kind_a`・`kind_b` が載る'
      - '`describe(source: sample)` の `worktrees[]` に `.claude/worktrees/develop` が載る'
      - Git でない配信元はディスクの設定を読む
    test: test_normal_when_config_read_from_default_ref
  - name: 正常系（.gitignore した設定を先頭に置く）
    summary: 先頭の設定が `default_ref` に無く `.gitignore` で無視されていれば、設定をディスクから、スキーマを `default_ref` から読んで組み立てる
    setup:
      - name: Mock
        description: なし（`project-index serve` を子プロセスで起動する）
      - name: default_ref のブランチ
        description: sample の `develop` に文書の種類 `kind_a` のスキーマを commit する
        notes: クローン本体は `master` を checkout し、`master` は `kind_a` のスキーマを持たない
      - name: Git 管理外の設定
        description: sample のクローン本体の直下に `.gitignore` した `project-index.local.yaml` を置く
        notes: '`default_ref: develop` と `kind_a` の `documents[]` の行を持つ。どのブランチにも commit しない'
      - name: 端末の設定
        description: '`sources[].config` が `project-index.local.yaml` の 1 つだけ'
    flow: |-
      <!-- map: {"title": "正常系（.gitignore した設定を先頭に置く）"} -->

      ```mermaid
      sequenceDiagram
        participant C as テスト
        participant S as project-index serve
        participant G as sample のリポジトリ

        C->>S: 起動する
        S->>G: develop の project-index.local.yaml を読む（無い）
        S->>G: git check-ignore で project-index.local.yaml が無視されていると確かめる
        S->>G: ディスクの project-index.local.yaml と、develop のスキーマを読む
        S-->>C: 配信を始める
      ```

      <!-- /map -->
    expected:
      - '`describe(source: sample)` の種類の一覧に `kind_a` が載る'
      - '`documents[].schema` のスキーマを `develop` から読む'
      - 配信元のフォルダがクローン本体の直下になる
    test: test_normal_when_ignored_config_first
  - name: 正常系（先頭の設定が default_ref に無く無視もしていない）
    summary: '`.gitignore` していない先頭の設定が `default_ref` に無い配信元を外して配信する'
    setup:
      - name: Mock
        description: なし（`project-index serve` を子プロセスで起動する）
      - name: commit していない設定
        description: 配信元 `uncommitted` のクローン本体に、`.gitignore` していない `project-index.yaml` を置き、どのブランチにも commit しない
        notes: '`default_ref` は `develop`。`develop` ブランチはあり、`project-index.yaml` を持たない'
      - name: 端末の設定
        description: '`sources` に sample と uncommitted の 2 行'
    flow: |-
      <!-- map: {"title": "正常系（先頭の設定が default_ref に無く無視もしていない）"} -->

      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as project-index serve

        U->>T: project-index serve
        T->>T: uncommitted の develop に project-index.yaml が無く、git check-ignore でも無視されていない
        T->>T: uncommitted を配信せず、エラーログに残す
        T-->>U: sample だけを配信する
      ```

      <!-- /map -->
    expected:
      - '`/sources/uncommitted/docs` が 404、`/sources/sample/docs` は応答する'
      - 'エラーログに `uncommitted: config[0]: develop に project-index.yaml がありません` がある'
    test: test_normal_when_first_config_not_committed
  - name: 正常系（XDG の環境変数で置き場を決める）
    summary: '`PROJECT_INDEX_CONFIG` が無ければ `XDG_CONFIG_HOME` の下の端末の設定を読み、状態とログを `PROJECT_INDEX_STATE_DIR`・`XDG_STATE_HOME` から決めた置き場に書く'
    setup:
      - name: Mock
        description: なし（`project-index serve` を子プロセスで起動し、空きポートを `PROJECT_INDEX_PORT` に入れる）
      - name: 環境変数
        description: '`PROJECT_INDEX_CONFIG` を外し、`XDG_CONFIG_HOME`・`XDG_STATE_HOME`・`HOME` にテスト用の一時フォルダを入れる'
      - name: 端末の設定
        description: '`$XDG_CONFIG_HOME/project-index/settings.yaml`。`sources` に sample の 1 行'
        notes: 1 回目は `state_dir`・`log_dir` を持たない
      - name: 上書き
