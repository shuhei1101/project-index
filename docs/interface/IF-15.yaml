  - SC-4#scenarios[異常シナリオ（先頭の設定が default_ref に無く無視もしていない）]
  - SC-4#scenarios[正常シナリオ（XDG の環境変数で置き場を決める）]
  - SC-4#scenarios[正常シナリオ（エイリアスのキーと nav の条件を検証する）]
  - SC-6#scenarios[正常シナリオ（MCP を使う場面の案内を受け取る）]
  - SC-6#scenarios[正常シナリオ（instructions の調査の案内を受け取る）]
  - SC-6#scenarios[正常シナリオ（配信元と使う場面の一覧が instructions の上限を超える）]
  - SC-6#scenarios[正常シナリオ（使う場面を書き換えた後に接続する）]
  - SC-4#scenarios[正常シナリオ（paths の基準のフォルダを指定する）]
  - SC-4#scenarios[正常シナリオ（端末の設定の最上位に知らないキーがある）]
  - SC-4#scenarios[正常シナリオ（default_ref のリビジョンを先に書き出す）]
  - SC-4#scenarios[異常シナリオ（裏のリビジョンの書き出しが上限を超える）]
  - SC-10#scenarios[異常シナリオ（直コミットの設定が検証に通らない）]
exclusivity: 同じポートで待ち受けるプロセスは 1 つだけ（後からの起動はポート使用中で終わる）
request:
  - name: PROJECT_INDEX_CONFIG
    type: str
    required: false
    default: '`${XDG_CONFIG_HOME:-~/.config}/project-index/settings.yaml`'
    description: 端末の設定のパス
    notes: 環境変数で渡す
  - name: XDG_CONFIG_HOME
    type: str
    required: false
    default: '`~/.config`'
    description: '`PROJECT_INDEX_CONFIG` が無いときに端末の設定を探すフォルダの親'
    notes: 環境変数で渡す。空の文字列か相対パスは未設定として扱う
  - name: PROJECT_INDEX_STATE_DIR
    type: str
    required: false
    default: 端末の設定の `state_dir`、無ければ `${XDG_STATE_HOME:-~/.local/state}/project-index`
    description: 状態の置き場。端末の設定の `state_dir` より優先
    notes: 環境変数で渡す
  - name: XDG_STATE_HOME
    type: str
    required: false
    default: '`~/.local/state`'
    description: '`PROJECT_INDEX_STATE_DIR` と `state_dir` が無いときの状態の置き場の親'
    notes: 環境変数で渡す。空の文字列か相対パスは未設定として扱う
  - name: PROJECT_INDEX_PORT
    type: int
    required: false
    default: 端末の設定の `port`（既定 8786）
    description: 待ち受けのポート。設定の `port` より優先
    notes: 環境変数で渡す
  - name: PROJECT_INDEX_PROMPTS_DIR
    type: str
    required: false
    default: クローンの直下の `content/prompts/`
    description: プロンプトの YAML を読むフォルダ
    notes: 環境変数で渡す
request_example: |-
  ```bash
  PROJECT_INDEX_CONFIG=/tmp/x/settings.yaml PROJECT_INDEX_PORT=8786 project-index serve
  ```
response:
  - name: 標準出力
    type: str
    description: 待ち受けたアドレスと、配信している配信元の ID
  - name: エラーログ
    type: str
    description: '検証に失敗した配信元ごとに `{id}: {キーのパス}: {理由}`。その配信元の設定の `version` が古いときは、`project-index migrate --source` で移し替えられることも出す。`direct_commit.kinds[]` に `documents[]` に無い種類がある配信元は、配信を続け、直コミットだけを断ることを出す'
  - name: 警告のログ
    type: str
    description: 設定のバージョンが古い配信元の ID・設定のバージョン・サーバーが参照できるバージョン。配信元と documents の行ごとに、`metadata` に書いた列が無い文書の件数・管理用の YAML に無いファイル・ファイルが無い行（`missing_body_file`）・どの文書にも当たらない `related[].to`（`source` を持たない行）・2 つ以上の有効な documents の行が文書にするファイル・ID が先の文書と重なり配信から除外した文書が 0 件でなければ、その件数とパス。`alias_type` を持つ行の文書のエイリアスのキーの違反（文書のパスと内容）と、どの文書にも当たらない `nav` の `auto` の条件（タブと条件）。端末の設定の最上位の知らないキー（端末の設定のファイルとキーのパス）。`direct_commit.branch` を指すワークツリーが `worktrees[]` に無いこと（直コミットを断る）と、端末の設定の `sources[].direct_commit.kinds`・`sources[].direct_commit.write_api_kinds` の種類のうち配信元の `direct_commit.kinds[]` に無いもの。端末の設定の `sources[].direct_commit.write_api_config` が `true` で、配信元の設定の `direct_commit.config` が `true` でない配信元（配信元の設定の直コミットを断る）
  - name: 終了コード
    type: int
    description: 起動できないとき 0 以外
    notes: 待ち受けた後は停止の合図まで終わらない
exceptions:
  - name: なし（正常終了）
    condition: 待ち受けを始めた（検証に失敗した配信元があっても、その配信元を外して待ち受ける）
  - name: TerminalConfigInvalidError
    condition: 端末の設定が無い・スキーマに違反する（最上位の知らないキーは違反にしない）
    notes: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て出し、終了コード 2 で終わる'
  - name: PortInUseError
    condition: ポートで待ち受けられない
    notes: 標準エラーにポートの番号と `PROJECT_INDEX_PORT` で変えられることを出し、終了コード 3 で終わる
  - name: PromptInvalidError
    condition: プロンプトの YAML（文書の MCP の instructions・文書の MCP と管理の MCP のツールの description）が無い・読めない・`schemas/prompt.schema.yaml` に違反する・Jinja2 として解釈できない
    notes: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て出し、待ち受けずに終了コード 4 で終わる。代わりの文は持たない'
  - name: SourceNotServedError
    condition: ある行の読み込みが例外で止まった後に、その行の配信元を指す要求が届いた
    notes: 起動は止めず、要求に返す。残りの行は読み込み続ける
constraints:
  - item: 待ち受けのアドレス
    constraint: '`127.0.0.1`'
    decided_by: NFR-1#requirements[通信]
  - item: 待ち受けのポート
    constraint: 既定 8786
    decided_by: NFR-1#requirements[待ち受けのポート]
  - item: 配信する入口
    constraint: 読み取り API（`/sources`・`/settings/sources` の下）、文書の MCP `/mcp`（ツール 7 つ、instructions を持つ）、管理の MCP `/_admin/mcp`（ツール 7 つ、instructions を持たない）、SessionStart のフックが呼ぶ `POST /_admin/session-start`。`/mcp`・`/_admin/mcp` はスラッシュの有無によらず同じ MCP が応え、リダイレクトを挟まない
    notes: プラグインの `.mcp.json` の接続先はスラッシュ無し。読み取り API のルートより先に MCP へ届け、POST が 405 にならないようにする
  - item: 設定のマージ
    constraint: '`sources[].config` を上から順に読み、同じキーは後が優先、`documents[]` は `id` で行ごとに上書き・追加する'
  - item: タイムアウト
    constraint: 制限なし
  - item: 管理用の YAML の同期で比べる範囲
    constraint: 管理用の YAML のフォルダの配下（下のフォルダを含む）のファイルから、管理用の YAML 自身と `SKIP_DIRS` を除いたもの
    notes: 件数は配信元を受け取って求める関数で求め、配信元の状態には持たない。再読み込みのときも同じ関数で求め直す
  - item: 設定・スキーマ・スクリプトの読み元
    constraint: 'Git の配信元は、ディスクの `project-index.yaml` から `default_ref` だけを読み（ディスクに無いか読めないときは既定の `develop`）、`project-index.yaml`・`documents[].schema` のスキーマ・`validators`・`converters` のスクリプトを `default_ref` から読む（`generators` は書き込み先のワークツリーのスクリプトで動く）。要求ごとに `default_ref` の commit を確かめ、変わっていれば配信元を組み立て直す。Git でない配信元と、端末の設定の行が `storage.type: disk` の配信元は、ディスクの設定・スキーマ・スクリプトを読み、`default_ref`・リポジトリの直下・メインのリポジトリを求めない。先頭の設定が `default_ref` に無く、`git check-ignore` で無視されていれば、先頭の設定はディスクから読み、スキーマとスクリプトは `default_ref` から読む。無視されていなければ `config[0]` の `{default_ref} に {パス} がありません` で配信しない'
    notes: '`worktree` の引数で作業ツリー・ワークツリーを指して読むときは、そのフォルダの設定とスクリプトを使う。そのフォルダに無く、無視されている設定のファイルは、クローン本体のディスクのファイルを使う'
  - item: paths の基準のフォルダ
    constraint: '配信元の設定の `paths_base` を設定ファイル（`config` の先頭）のフォルダから解き、`documents[].paths` をそのフォルダから解く。返却する文書のパスと `exclude[]`・管理用の YAML の同期のパスも基準のフォルダからの相対パスにする。`paths_base` を省くと設定ファイルのフォルダ。`documents[].schema`・`validators`・`converters`・`generators` などのほかの相対パス、`scope.write` の既定、作業中の配信元の判定は設定ファイルのフォルダで解く。Git の配信元は `default_ref` の commit からも基準のフォルダからの相対パスで参照する'
    notes: '`paths_base` の検証は配信元の検査の制約「paths の基準のフォルダの検証」と同じ。`worktree` で参照するときは、ワークツリーの中の同じ相対位置を基準のフォルダにする'
  - item: 端末の設定の知らないキー
    constraint: 端末の設定の最上位の、スキーマの `properties` に無いキーは違反にせず、値を使わずに無視する。キーのパスを読み込みの結果に持ち、警告のログ・引数なしの `describe` の `warnings`・端末の設定の API の応答の `warnings` で返却する。`sources[]` の行と `scope` の知らないキーは今どおり違反にする
  - item: 端末の設定と状態の置き場
    constraint: 端末の設定は `PROJECT_INDEX_CONFIG`、無ければ `${XDG_CONFIG_HOME:-~/.config}/project-index/settings.yaml`。状態の置き場は `PROJECT_INDEX_STATE_DIR` → 端末の設定の `state_dir` → `${XDG_STATE_HOME:-~/.local/state}/project-index` の順。ログの置き場は端末の設定の `log_dir`、無ければ決めた状態の置き場の `logs`。`XDG_CONFIG_HOME`・`XDG_STATE_HOME` が空の文字列か相対パスなら未設定として扱う
    notes: 環境変数が端末の設定より先に有効になる並びは `PROJECT_INDEX_CONFIG`・`PROJECT_INDEX_PORT` と同じ。相対パスの扱いは XDG Base Directory Specification に従う。セッション開始のフックも同じ規則で端末の設定のパスを決める
  - item: ワークツリーの数え方
    constraint: '`worktrees[]` の相対パスは、`git rev-parse --git-common-dir` の親（メインのリポジトリの直下）から数える。`storage.type: disk` の配信元は `worktrees[]` を使用しない'
  - item: MCP の文の出どころ
    constraint: '文書の MCP の instructions（`kind: instructions`）と、文書の MCP・管理の MCP のツールごとの description（`kind: tool`）を、起動のときにプロンプトの YAML から読んで描画する。コードは文を持たない。instructions は 4,096 字以内'
    notes: ツールの名前・引数・返り値は変えない。YAML を書き換えたときは再起動で効かせる。instructions の配信元と使う場面の一覧は、下の「instructions の配信元と使う場面の一覧」のとおり接続ごとに描画する
  - item: instructions の配信元と使う場面の一覧
    constraint: '文書の MCP の `initialize`・`server/discover`（2026-07-28 版）のたびに、配信元の一覧の今のキャッシュ（`registry.served()`）から、`when` を持つ配信元を端末の設定の `sources[]` の順に並べ、ID と `when` の 1 行目をプロンプトの YAML（`mcp/project-index/instructions`）の一覧の部品で描画して、instructions の末尾に加える。描画は lowlevel の `Server` の `create_initialization_options` の上書きと、`add_request_handler` での `server/discover` の置き換えで行い、どちらの中でも Git を呼ばない。応答の後に、並べた配信元ごとの `default_ref` の commit の確認と、変わっていたときの組み立て直しを裏のスレッドで実行する（引数なしの `describe` と同じ。配信元ごとに走っている確認があれば新しく実行しない）。組み立て直した配信元はキャッシュに差し替わり、次の `initialize` がキャッシュを再読み込みして描画する。instructions 全体が 4,096 字を超えるときは、端末の設定の順に収まる配信元まで載せ、載せなかった件数と `describe(outside_scope: true)` の案内を添える。`when` を持つ配信元が無いときは一覧の部品を描画しない'
    notes: 'instructions は接続の時点で作業場所（`cwd`）を受け取らないため、`scope`・`outside_read` で絞らない。`initialize` は配信元の読み込みを待たない（待ち受けまでの順番）ため、読み込み中に届いた `initialize` の一覧は読み込み済みの配信元だけになる。一覧と案内の文はプロンプトの YAML が持ち、コードは値（ID・`when` の 1 行目・載せなかった件数）だけを渡す。mcp 2.3.0 の `initialize` は読み取りのループの中で同期に実行され、`create_initialization_options()` で `Server.instructions` を読む。`initialize` の中で確認・組み立て直しをすると、/mnt/c で確認が 1 件 0.4〜1.0 秒、組み立て直しが 1 件 15〜27 秒、同じプロセスのほかの要求ごと止まる（2026-11-13 の実測）'
  - item: 待ち受けまでの順番
    constraint: 端末の設定・ポート・プロンプトの YAML を確かめたら待ち受けを始め、配信元の読み込み（`registry.reload`）とその後の検査（管理用の YAML の同期・エイリアスのキー・`nav` の警告）を待ち受けの裏で流す。配信元を使う要求は、その配信元の読み込みが終わるまで待ってから答える（配信元の読み込みの単位）。検査は待たない
    decided_by: NFR-1#requirements[起動から接続を受け付けるまでの時間]
    notes: MCP の初期化・ツールの一覧、管理の MCP の `status`、`POST /_admin/session-start` は読み込みを待たずに答える（`status` は読み込み中であることを返す）。ある行の読み込みが例外で止まったときの扱いは、配信元の読み込みの単位の notes
  - item: 配信元の読み込みの単位
    constraint: 配信元は端末の設定の行ごとに、同時に読み込む行の数まで並列に読み込み、読み込み終えた行から配信を始める。読み込みの遅い行は、ほかの行の読み込みを止めない。文書の MCP と読み取り API の要求は、要求が指す配信元の行の読み込みだけを待つ。待っている要求が指す行は、まだ読み始めていない行のうち端末の設定の順より先に読み始める。検査は全ての行を読み込んだ後に行ごとに実行し、行の読み込みも要求も検査を待たない
    notes: 指す配信元は、`source` の ID（`"*"` は全ての行）、`source` を省いたときは作業場所が端末の設定の `scope` に該当する行（どの行の `scope` にも該当しないときは全ての行。ワークツリーの照合は配信元を読み込むまでできない）。ID を持たない行は、読み込むまで ID が決まらないため、ID で指す要求はその行の読み込みも待つ。`describe` の作業範囲の外の一覧と、画面の設定の API、管理の MCP の `status` 以外のツールは全ての行の読み込みを待つ。`status` の `loading` は全ての行を読み込むまで `true` で、`sync` は検査が済んだ行から埋まる。ある行の読み込みが例外で止まったときはエラーログに残し、その行を配信しないままその行の待ちを解いて、残りの行を読み込み続ける。その行は `status` で `not_served`（`errors` に読み込みの失敗の理由）になり、その行を指す要求は `SourceNotServedError` を返す。`id` を持たない行は ID が決まらないため `sources[{n}]` の ID で `not_served` にする
  - item: ほかの配信元のスキーマの参照
    constraint: '`documents[].schema` でほかの配信元を指す行は、配信元の検査の制約「ほかの配信元のスキーマの参照」のとおりに読む'
  - item: 参照先が見つからない配信元
    constraint: 参照先のスキーマを読めない行を持つ配信元は、`documents[{番号}].schema` の違反として配信から外し、エラーログに残す（違反の条件は配信元の検査と同じ）
  - item: リビジョンの先の書き出し
    constraint: 全ての行の読み込みの後に、検査の終了を待たずに Git の配信元ごとに `default_ref` の commit を裏のスレッドで書き出す。`reload`・端末の設定の保存の後と、`default_ref` が進んで配信元を組み立て直した後も同じく書き出す。待ち受け・配信元の読み込み・要求は書き出しを待たない。文書の一覧は書き出しを使用せずに commit の blob から読み込む。そのほかの読み取り（文書の取得・語での検索・配信元の設定の取得）で同じ commit を読む要求は、書き出しの最中ならその終了を待ち、書き出し直さない
    notes: 書き出しが `git archive` の待ち時間の上限を超えたときは警告のログに残して止め、配信元は配信し続ける。その commit を読む次の要求が書き出し直す。書き出しの最中かは管理の MCP の `status` の `exporting` で返す
  - item: 読み書きの方法
    constraint: 端末の設定の行の `storage.type`（`git`・`disk`）で決める。省略すると、配信元のフォルダが Git の作業ツリーの中なら `git`、外なら `disk`。Git の作業ツリーの外部のフォルダに `git` を指定した行は、その配信元だけを配信せず、エラーログに `sources[{添字}].storage.type` とフォルダが Git の作業ツリーの中に無い理由を残す
    notes: 端末の設定のスキーマの違反（プロセスを止める）ではなく、配信元の検証の失敗として扱う
  - item: 裏の処理の譲り方
    constraint: 裏の検査は 1 本のスレッドで配信元を順に行い、裏のリビジョンの書き出しも 1 本のスレッドで行う。裏の処理の 1 件（検査は文書のファイル 1 件、書き出しは commit 1 件）とその後の休みは、検査と書き出しのどちらか 1 つだけが行う。1 件ごとに、文書の MCP と読み取り API の要求に応答している最中かを確認し、応答の最中ならその 1 件にかかった時間の 9 倍だけ休んでから次へ進む。これで、裏の処理の全体が使用する時間を 1 割に抑える。応答の最中でなければ休まない。起動・再読み込みの配信元の行の読み込みも、要求が待っている行を除き、文書の行ごとのスキーマの検証（`documents[].schema`）と種類のスキーマの読み込みを 1 件にして同じ関所で休む。行の読み込みでは、配信元の読み込みを待っている要求も応答の最中として数える
    notes: 裏の検査と要求は 1 つのプロセスの中で GIL を取り合う。休む間は GIL を手放すため、要求の処理に CPU を回せる。1 割は、起動の直後の画面の 1 回目の上限（裏の検査を止めた計測に余裕を足した値）のうち、余裕の割合が最も小さい ai-monitor（23.3 / 21.0 秒で 11%）を超えない値。応答が絶えない間も休みは有限なので、裏の検査と書き出しは止まらずに済むが、応答が絶えない間は最大でおよそ 10 倍の時間がかかる。済むまで管理の MCP の `status` の `checking`・`exporting` は `true`。裏の書き出しは検査の終了を待たずに始めるため（リビジョンの先の書き出し）、検査が延びても書き出しの開始は遅れない
  - item: YAML の読み込み
    constraint: 文書・配信元の設定・スキーマの YAML は、ruamel.yaml.clib の C の解析（`YAML(typ="safe", pure=False)`）で読み、`YAMLError` のときだけ pure で読み直す。値の解決はどちらも ruamel.yaml の YAML 1.2。起動のときに C の解析を使用できなければ、警告のログを 1 行残して pure で動き続ける
    notes: 往復編集の読み書き（rt）は今どおり pure。C で読めない入力と値が変わる入力は外部ライブラリの設計書の制限事項
  - item: スキーマの読み込みの使い回し
    constraint: 配信元の行の読み込みは、ほかの配信元のスキーマの参照を読み込んだ結果を、参照先のリビジョンを commit に解いた後の、参照先の配信元・commit・パスの組ごとに、JSON Schema として正しいかの検査の結果をスキーマの内容のハッシュごとに、行と組み立て直しをまたいで使い回す。参照先のブランチが進むと解いた commit が変わるため、組み立て直しは進んだ後のスキーマを読み込む
    notes: 多くの配信元が knowledge の同じスキーマを参照するため、行の読み込みの CPU の大半（スキーマの読み込みと `check_schema`）を省ける
  - item: 組み込みの配信元
    constraint: '`sources[]` に id `project-index` の行が無いときだけ、`clone` の `project-index.yaml` の `files_guide` の行を id `project-index` の配信元として文書の MCP に加える。読み書きは `disk`、`scope.read`・`scope.write` は空、`outside_read` は `true`、行の `schema` は `clone` の `templates/files.schema.yaml` に差し替える。読み取り API・管理の MCP の配信元の一覧には含めない。`reload` で端末の設定を読み直したときも同じ判定をする'
    notes: knowledge の配信元を登録していない端末でもスキーマを解決できるように、クローンが持つスキーマに差し替える。`scope` が空のため常に作業範囲の外（参考）として参照し、書き込みは読み取りだけの配信元と同じエラーになる
  - item: 管理の MCP の実行スロット
    constraint: 管理の MCP のツールは、文書の MCP・読み取り API と別の専用の実行スロットで動かす。文書の MCP・読み取り API の実行スロットが埋まっていても、管理の MCP の要求は待たない
    decided_by: NFR-1#requirements[管理の MCP の実行スロットの数]
    notes: 専用の実行スロットの本数は非機能要件の決定値。`restart` の停止の待ちは今どおり処理中の要求を待つ
  - item: 稼働中の記録
    constraint: 文書の MCP・読み取り API の要求ごとに、ツール・配信元・実行スロットの待ち・排他の待ち・処理の時間・要求の中でたどったファイルのキャッシュの件数を INFO の 1 行でログに残す。あわせて、実行中・待ち中の処理の数と RSS を、決定値の間隔ごとに INFO の 1 行でログに残す
    decided_by: NFR-1#requirements[稼働中の記録の間隔]
    notes: 'ログだけで劣化の始まりと詰まった処理を指せるようにする（PR #236 の要件 No.4）'
  - item: 文書の MCP・読み取り API の実行スロット
    constraint: 文書の MCP・読み取り API の要求の処理は、asyncio の既定の実行スロットでなく、専用の実行スロットで動かす。停止・再起動は、終わらない専用の実行スロットのスレッドの終了を待たない。再起動は `os.execv`、停止（再起動の要求が無い終了）は、uvicorn の停止の後にログを閉じてから `os._exit` で終え、インタープリタの終了の待ちを通らない
    decided_by: NFR-1#requirements[文書の MCP の実行スロットの数]
    notes: '`asyncio.Runner.close` は既定の実行スロットのスレッドの終了を `THREAD_JOIN_TIMEOUT`（300 秒）まで待つ。専用の `ThreadPoolExecutor` は `Runner.close` では待たないが、インタープリタの終了（`threading._register_atexit` の `_python_exit`）で上限なく待つため、停止も `os._exit` で終える。`atexit` に登録した後片付けは無い（`src/project_index` に `atexit` の登録が無い）。追加するときは `os._exit` の前に呼ぶ'
  - item: SQLite の表の行
    constraint: '`documents[].sqlite` のキーの型とファイルの行のキーとの併記は、配信元の設定の検証で違反にする。ファイル・表・列の欠けは配信元を止めず、その行だけ文書を持たずに警告にする。行は最初の取得で読み込み、起動の待ち受けまでの時間に含めない'
  - item: 衝突したときのスクリプトの検証
    constraint: '端末の設定の `sources[].direct_commit.on_conflict` は `command` を 1 要素以上の文字列の並びで持つ。違反した行は、端末の設定のほかの違反と同じくその配信元を配信から除外し、`{id}: direct_commit.on_conflict.command: {理由}` をエラーログに出す。コマンドが実行できるかは起動時に確認せず、衝突したときの実行の失敗として返却する'
