id: IF-3
title: "関連のたどり"
entry:
  kind: mcp_tool
  value: '`trace_related`'
flows:
  - name: 正常系
    summary: 起点の文書の `related` をたどって関連する文書を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリをテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 文書 1・2・3 を持つ sample。文書 1 の `related` が文書 2、文書 2 の `related` が文書 3 を指す
        notes: id `sample`
      - name: 入力
        description: '`from_ids: [文書 1]`、`direction: out`'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related
        participant ST as 配信元の文書

        C->>T: from_ids: 文書 1, direction: out
        T-->>ST: 文書 1 から related を深さ 2 までたどる
        T-->>C: 文書 2（深さ 1）と文書 3（深さ 2）
      ```

      <!-- /map -->
    expected:
      - 文書 2 を深さ 1、文書 3 を深さ 2 で返す
      - 各行にたどった `related` の元と関係の種類がある
      - '`depth: 1` では文書 2 だけを返す'
      - '`format: json` の各項目に `path`（文書の絶対パス）と `scope: summary` がある'
    test: test_normal
  - name: 正常系（逆向きにたどる）
    summary: '`direction: in` で起点を指す文書を返し、循環をたどらない'
    setup:
      - name: Mock
        description: なし
      - name: 循環する関連
        description: 正常系の sample に、文書 3 の `related` が文書 1 を指す行を加える
      - name: 入力
        description: '`from_ids: [文書 3]`、`direction: in`、`depth: 4`'
    flow: |-
      <!-- map: {"title": "正常系（逆向きにたどる）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: from_ids: 文書 3, direction: in, depth: 4
        T->>T: 文書 3 を指す文書をたどり、一度たどった文書は飛ばす
        T-->>C: 文書 2 と文書 1
      ```

      <!-- /map -->
    expected:
      - 文書 2 を深さ 1、文書 1 を深さ 2 で返し、同じ文書を 2 回返さない
      - '`depth: 5` では 4 に丸め、`notes` で知らせる'
    test: test_normal_when_direction_in
  - name: 正常系（コードのパスから）
    summary: コードのパスを本文に持つ文書を起点にたどる
    setup:
      - name: Mock
        description: なし
      - name: コードの文書
        description: 'sample に `records: files`・`body_file: path` の行を加え、`src/a.py` の文書の `related` が文書 1 を指す'
      - name: 入力
        description: '`code_paths: [src/a.py]`'
    flow: |-
      <!-- map: {"title": "正常系（コードのパスから）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: code_paths: src/a.py
        T->>T: src/a.py を本文に持つ文書を起点にする
        T-->>C: 文書 1 と、その先の文書 2
      ```

      <!-- /map -->
    expected:
      - 文書 1 を深さ 1、文書 2 を深さ 2 で返す
    test: test_normal_when_code_paths
  - name: 正常系（関連の候補）
    summary: '`suggest: true` で同じ commit の変更と会話での閲覧から候補を返す'
    setup:
      - name: Mock
        description: なし（`state_dir` は一時フォルダ）
      - name: 同じ commit の変更
        description: 文書 1 と文書 4（`related` で繋がらない）を同じ commit で変える
      - name: 閲覧の記録
        description: '`session_id: s1` で文書 1 と文書 5 を `view: full` で読む'
      - name: 入力
        description: '`from_ids: [文書 1]`、`suggest: true`、`session_id: s1`'
    flow: |-
      <!-- map: {"title": "正常系（関連の候補）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related
        participant G as Git の履歴
        participant SD as state_dir

        C->>T: from_ids: 文書 1, suggest: true
        T-->>G: 文書 1 と同じ commit で変わった文書を数える
        T-->>SD: 同じ会話で編集・閲覧した文書を読む
        T-->>C: たどった文書と、上位 3 件の候補
      ```

      <!-- /map -->
    expected:
      - '`suggestions` に文書 4（`co_change`）と文書 5（`viewed`）がある'
      - '`related` ですでに繋がる文書 2 は候補に入らない'
      - 文書 1 の `related` は変わらない
    test: test_normal_when_suggest
  - name: 正常系（返却済みの相手）
    summary: 同じ会話で 2 回目は相手の名前・概要文を省く
    setup:
      - name: Mock
        description: なし（`state_dir` は一時フォルダ）
      - name: 入力
        description: '`session_id: s1` で正常系と同じ呼び出しを 2 回、3 回目は `repeat_seen: true`'
    flow: |-
      <!-- map: {"title": "正常系（返却済みの相手）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related
        participant SD as state_dir

        C->>T: from_ids: 文書 1, session_id: s1
        T->>SD: 返した相手を記録する
        T-->>C: 文書 2 と文書 3 の名前と概要文
        C->>T: 同じ引数
        T-->>C: ID と（この会話で返却済み）
      ```

      <!-- /map -->
    expected:
      - 2 回目の文書 2・3 の `name`・`description` が `（この会話で返却済み）` になり、json の項目に `path`・`scope` が無い
      - 3 回目は名前と概要文を返す
    test: test_normal_when_seen
  - name: 異常系（無い起点・DocumentNotFoundError）
    summary: 無い文書・文書の無いコードのパスを起点にすると断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '1 回目は `from_ids: [doc-9]`、2 回目は `code_paths: [src/none.py]`'
    flow: |-
      <!-- map: {"title": "異常系（無い起点・DocumentNotFoundError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: from_ids: doc-9
        T-->>C: isError（見つからない ID と近い候補）
      ```

      <!-- /map -->
    expected:
      - '1 回目が `isError: true` で、`doc-9` と近い ID の候補を返す'
      - '2 回目が `isError: true` で、`src/none.py` を本文に持つ文書が無いことを返す'
    test: test_error_when_document_not_found
  - name: 異常系（起点の指定の誤り・InvalidArgumentError）
    summary: '`from_ids` と `code_paths` の両方かどちらも無い呼び出しを断る'
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: 1 回目は両方、2 回目はどちらも渡さない
    flow: |-
      <!-- map: {"title": "異常系（起点の指定の誤り・InvalidArgumentError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: from_ids と code_paths
        T-->>C: isError（どちらか 1 つを渡すこと）
      ```

      <!-- /map -->
    expected:
      - 'どちらの呼び出しも `isError: true` で、`from_ids` か `code_paths` のどちらか 1 つを渡すことを返す'
    test: test_error_when_invalid_argument
  - name: 異常系（読めない配信元・SourceNotReadableError）
    summary: '`scope` に当たらない配信元を起点にしない'
    setup:
      - name: Mock
        description: なし
      - name: 読めない配信元
        description: '`scope.read` が other のフォルダだけの配信元'
        notes: id `other`
    flow: |-
      <!-- map: {"title": "異常系（読めない配信元・SourceNotReadableError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: source: other, from_ids: other の文書
        T-->>C: isError（読めない配信元と、使える配信元の一覧）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、other を読めないことと使える配信元の一覧を返す'
    test: test_error_when_source_not_readable
  - name: 正常系（作業範囲の外を参考にたどる）
    summary: '`outside_scope: true` で、`scope` に当たらない配信元の関連を作業範囲の外（参考）としてたどる'
    setup:
      - name: Mock
        description: なし
      - name: 配信元
        description: sample と、文書 1 の `related` が文書 2 を指す other（`scope.read` は other のフォルダだけ。端末の設定の `outside_read` は書かない）
      - name: 入力
        description: '`source: other`, `from_ids: [文書 1]`, `outside_scope: true`。`cwd` は sample のクローン本体'
    flow: |-
      <!-- map: {"title": "正常系（作業範囲の外を参考にたどる）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related
        participant L as 要求のログ

        C->>T: source: other, from_ids, outside_scope: true
        T->>T: scope に cwd が当たらず、outside_read が真
        T->>L: cwd と other を残す
        T-->>C: 作業範囲の外（参考）、文書 2
      ```

      <!-- /map -->
    expected:
      - 先頭の行に「作業範囲の外（参考）」があり、文書 2 を返す
      - 要求のログに sample のクローン本体のパスと `other` が残る
      - '`outside_read: false` の other では `SourceNotReadableError` を返す'
    test: test_normal_when_outside_scope
  - name: 正常系（disk の配信元をたどる）
    summary: disk の配信元は related だけをたどり、一緒に変わったファイルを返さない
    setup:
      - name: Mock
        description: なし
      - name: ローカル運用の配信元
        description: '`storage.type: disk` の配信元。文書 2 の `related` が文書 1 を指し、文書 1 と文書 3 を同じ commit で commit する'
        notes: id `company`
    flow: |-
      <!-- map: {"title": "正常系（disk の配信元をたどる）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: source: company, from_ids: [文書 1]
        T-->>C: related で文書 1 を指す文書 2
      ```

      <!-- /map -->
    expected:
      - '`items` に文書 2 があり、同じ commit で変わった文書 3 を一緒に変わったファイルとして返さない'
      - '`ref: develop` を指定すると `isError: true` で、company は `ref` を指定できない理由を返す'
    test: test_normal_when_disk_storage
  - name: 正常系（入れ子の項目の中の関連）
    summary: '`**.refs[]` の対応で最上位と入れ子の `refs` をまとめた `related` を、両方向にたどる'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 入れ子の関連を持つ種類
        description: 'sample に行 `nested`（`paths: [nested/*.yaml]`・`schema: nested.schema.yaml`・`metadata: {related: "**.refs[]"}`）を加える。n1 は最上位の `refs` に n2、`functions[0].refs` に n3 を指す要素を持ち、n2・n3 は `refs` を持たない'
        notes: '`refs` の要素は `to` と `type: references`'
      - name: 入力
        description: '1 回目は `from_ids: [n1]`・`direction: out`。2 回目は `from_ids: [n3]`・`direction: in`'
        notes: '-'
    flow: |-
      <!-- map: {"title": "正常系（入れ子の項目の中の関連）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related
        participant ST as 配信元の文書

        C->>T: from_ids: n1, direction: out
        T-->>ST: n1 の最上位と入れ子の refs をまとめた related をたどる
        T-->>C: n2 と n3（深さ 1）
        C->>T: from_ids: n3, direction: in
        T-->>C: n1（深さ 1）
      ```

      <!-- /map -->
    expected:
      - 1 回目が n2 と n3 を深さ 1 で返却し、どちらの行もたどった関係の種類が `references`
      - 2 回目が n1 を深さ 1 で返却する
    test: test_normal_when_nested_related
  - name: 正常系（ワークツリーの設定でメタデータの対応を変えた）
    summary: ワークツリーを読み込んだ後に行の `metadata` に `related` の対応を追加すると、次の呼び出しからその列の関連をたどる
    setup:
      - name: Mock
        description: なし
      - name: ワークツリー
        description: sample の `.claude/worktrees/x`。文書 1 は列 `refs` に文書 2 を持ち、行の `metadata` は `related` を対応付けていない
      - name: 入力
        description: '`worktree` に x のパス、`from_ids: [文書 2]`、`direction: in`。1 回呼んだ後、ワークツリー x の `project-index.yaml` の行の `metadata` に `related: refs` を追加し（commit しない）、同じ入力でもう 1 回呼ぶ'
    flow: |-
      <!-- map: {"title": "正常系（ワークツリーの設定でメタデータの対応を変えた）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related
        participant WT as ワークツリー x

        C->>T: worktree: x, from_ids: 文書 2, direction: in
        T-->>C: 関連する文書なし
        Note over WT: 行の metadata に related: refs を追加する
        C->>T: worktree: x, from_ids: 文書 2, direction: in
        T-->>WT: 変わった設定の行で、行の定義が変わった文書を再読み込みする
        T-->>C: 文書 1（深さ 1）
      ```

      <!-- /map -->
    expected:
      - 1 回目は関連する文書が無く、2 回目は文書 1 を深さ 1 で返却する
      - '`reload` も再起動も呼ばない'
    test: test_normal_when_worktree_metadata_changed
  - name: 正常系（既定の検索から除く文書）
    summary: '`search_exclude` に該当する文書を既定の関連の相手から除き、`include_excluded: true` のときだけ除外の表示を付けて返却する'
    setup:
      - name: Mock
        description: なし
      - name: 文書
        description: '`c`（`related` に `a1` と `a2`）・`a1`（`state: active`）・`a2`（`state: inactive`、`related` に `d`）・`d`'
      - name: 文書の行
        description: '`a1`・`a2` の行 `assets` に `metadata: {status: state}`・`search_exclude: {field: status, op: eq, values: [inactive]}`'
      - name: 入力
        description: '1 回目は `from_ids: [c]`・`depth: 2`、2 回目は 1 回目に `include_excluded: true` を加える、3 回目は `from_ids: [a2]`'
    flow: |-
      <!-- map: {"title": "正常系（既定の検索から除く文書）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as trace_related

        C->>T: from_ids [c]・depth 2
        T->>T: a2 を除き、a2 の先はたどらない
        T-->>C: a1・excluded_count 1
        C->>T: from_ids [c]・depth 2・include_excluded
        T-->>C: a1・a2（excluded）・d
        C->>T: from_ids [a2]
        T-->>C: d
      ```

      <!-- /map -->
    expected:
      - '1 回目が `a1` だけを返却し、`a2` と `a2` の先の `d` を返却しない。`excluded_count: 1` を返却する'
      - '2 回目が `a1`・`a2`・`d` を返却し、`a2` だけが `excluded: true` を持つ'
      - 3 回目は起点の `a2` からたどり、`d` を返却する
    test: test_normal_when_search_excluded
    refs:
      - to: SC-6
        item: scenarios[正常シナリオ（既定の検索から除く条件に該当する文書を除く）]
        type: references
        when: このインターフェースの入出力やフローを変えるときに、シナリオ『エージェントが調べる』の対応する流れと期待値を確認する。
lead: '`related` をたどって関連する文書と関連の候補を返却する `trace_related` の入出力を定め、`trace_related` を修正するときに参照する。'
tags:
  - name: topic:関連
    main: true
  - name: action:追跡
  - name: tool:mcp
aliases:
  - 'trace_related'
identifier: trace_related
permissions: 対象の配信元の `scope.read` か `scope.write` に `cwd` が当たること。たどった先が読めない配信元の文書なら、その文書は ID だけを返す
idempotent: true
side_effects: 会話キーごとに、名前・概要文を返した関連の相手を `state_dir` に記録する
callers:
  - SC-6#scenarios[正常シナリオ]
  - SC-6#scenarios[正常シナリオ（設計書を実装するコードを引く）]
  - SC-6#scenarios[正常シナリオ（入れ子の項目の中の関連をたどる）]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: source
    type: str
    required: false
    default: なし（作業中の配信元）
    location: argument
    description: 起点の配信元の ID
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`。作業中の配信元は作業ツリー）
    location: argument
    description: 読むリビジョン
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: 読むワークツリーのパス
  - name: from_ids
    type: list[str]
    required: false
    default: なし（`code_paths` からたどる）
    location: argument
    description: 起点の文書の ID
    constraints: '`from_ids` か `code_paths` のどちらか 1 つを渡す'
  - name: code_paths
    type: list[str]
    required: false
    default: なし（`from_ids` からたどる）
    location: argument
    description: 起点のコードのパス（配信元の直下から）
    notes: '`records`・`body_file` の行で、そのパスを本文に持つ文書を起点にする'
  - name: depth
    type: int
    required: false
    default: '`2`'
    location: argument
    description: たどる深さ
    constraints: 1〜4。超えたら 4 に丸めて `notes` で知らせる
  - name: direction
    type: Literal['out', 'in', 'both']
    required: false
    default: '`both`'
    location: argument
    description: '`out` は起点の `related` が指す先、`in` は起点を `related` で指す文書'
    notes: 設計書を起点に `in` で呼ぶと、`via.type` が `implements` の文書がその設計書を実装するコードになる。コードを起点にすると `tests` の文書がそのテストになる
  - name: suggest
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: '`true` で、関連の候補（同じ commit での変更・同じ会話での編集と閲覧）を上位 3 件返す'
  - name: repeat_seen
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: この会話で返却済みの相手の名前・概要文も返す
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返却する形式
  - name: cwd
    type: str
    required: false
    default: なし（どの `scope` にも当たらない）
    location: argument
    description: セッションの作業場所
    notes: PreToolUse のフックがセッションの作業場所で上書きし、エージェントが指定した値は使わない。ツールの入力のスキーマの `description` にも同じことと、ワークツリーは `worktree` で指すことを載せる
  - name: session_id
    type: str
    required: false
    default: なし
    location: argument
    description: 会話キー
    notes: フックが入れる
  - name: agent_id
    type: str
    required: false
    default: なし（メインの会話）
    location: argument
    description: 会話キー（サブエージェント）
    notes: フックが入れる
  - name: outside_scope
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: '`true` のとき、`cwd` が `scope` に当たらない起点の配信元も、端末の設定の `sources[].outside_read` が真なら作業範囲の外（参考）としてたどる'
    notes: '`format: markdown` は先頭の行に「作業範囲の外（参考）」を出し、`format: json` は `outside_scope: true` を返す。外から読んだ呼び出しは作業場所と配信元の ID を要求のログに残す'
    status: planned
  - name: include_excluded
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: '`true` のとき、配信元の設定の `documents[].search_exclude` に該当する文書も関連の相手として返却し、その先もたどる'
    notes: '`from_ids`・`code_paths` の起点は、該当しても `false` のまま起点にする'
    status: planned
request_example: |-
  ```json
  {"from_ids": ["doc-1"], "depth": 2, "direction": "out", "suggest": true}
  ```
response:
  - name: items[].id
    type: str
    description: たどった文書の ID
  - name: items[].source
    type: str
    description: 文書の配信元の ID
    notes: 起点と違う配信元のときだけ
  - name: items[].depth
    type: int
    description: 起点からの深さ
  - name: items[].via
    type: "{from: str, type: str, direction: Literal['out', 'in']}"
    description: たどった `related` の元・関係の種類・向き
  - name: items[].name
    type: str
    description: 文書の名前
    notes: 返却済みなら `（この会話で返却済み）`。読めない配信元の文書は返さない
  - name: items[].description
    type: str
    description: 概要文
    notes: '`name` と同じ'
  - name: suggestions[].id
    type: str
    description: 関連の候補の文書の ID
    notes: '`suggest: true` のときだけ'
  - name: suggestions[].signals
    type: list[Literal['co_change', 'edited', 'viewed']]
    description: 候補にした信号
  - name: suggestions[].score
    type: float
    description: 信号から求めた順位の値
  - name: notes
    type: list[str]
    description: 丸めた・読めなかった文書の知らせ
  - name: items[].path
    type: str
    description: たどった文書の場所。`search_docs` の `items[].path` と同じ決め方の絶対パス
    notes: '`ref` を渡した呼び出し、返却済みの相手、読めない配信元の文書では持たない'
  - name: items[].scope
    type: Literal['summary']
    description: 返した範囲。名前と概要文だけを返すため常に `summary`
    notes: '`items[].path` と同じ条件で持たない'
  - name: excluded_count
    type: int
    description: 関連の相手のうち、`documents[].search_exclude` に該当して除いた文書の件数
    notes: '`include_excluded: false` で 1 件以上除いたときだけ持つ。`notes` にも件数と `include_excluded: true` で取得できることを出す'
  - name: items[].excluded
    type: bool
    description: '`documents[].search_exclude` に該当する文書か'
    notes: '`include_excluded: true` で、該当する文書だけ `true` を持つ。`format: markdown` は表に `除外` の列を加え、該当する行に ✓ を出す'
response_example: |-
  ```markdown
  doc-1 から 2 件

  | id | 深さ | たどった関連 | name | description |
  | --- | --- | --- | --- | --- |
  | doc-2 | 1 | doc-1 → references | 文書 2 | 2 件目 |
  ```
response_notes: 候補は `related` には書き込まない。採用するときは `write_docs` で `related` に追加する。
exceptions:
  - name: なし（正常終了）
    condition: たどれた（関連が 0 件のときも正常終了）
  - name: DocumentNotFoundError
    condition: '`from_ids` の文書が無い、または `code_paths` を本文に持つ文書が無い'
    notes: 見つからなかった ID・パスと近い候補を添える
  - name: InvalidArgumentError
    condition: '`from_ids` と `code_paths` を両方渡した、またはどちらも渡さない、`storage.type: disk` の配信元に `ref`・`worktree` を渡した'
  - name: SourceNotReadableError
    condition: '`cwd` が起点の配信元の `scope.read`・`scope.write` に当たらない（`outside_scope: true` のときは、加えて `outside_read` が偽）'
    notes: '`outside_read` が真で `outside_scope` を渡していないときは、`fix` に `outside_scope: true` で作業範囲の外を参考に参照できることを添える'
  - name: ValidationFailedError
    condition: '`worktree` か `cwd` が指すワークツリーの配信元の設定が検証に通らない'
    notes: 文書の検索と同じ返却。結合テストは文書の検索に置く
constraints:
  - item: 深さ
    constraint: 最大 4
  - item: 候補の数
    constraint: 上位 3 件
  - item: 循環
    constraint: 一度たどった文書はたどらない
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: タイムアウト
    constraint: 制限なし
  - item: 配信元・ワークツリーの解決
    constraint: '`search_docs` と同じ（配信していない配信元・当たらないワークツリーのエラーも同じ）'
    notes: 共通の処理で解決するため、結合テストは [文書の検索](id:IF-2) が持つ
  - item: disk の配信元
    constraint: '端末の設定の行が `storage.type: disk` の配信元は、一緒に変わったファイルを返さない。`ref`・`worktree` を指定すると `InvalidArgumentError`'
  - item: ワークツリーの配信元の設定
    constraint: '`worktree` を指定したときと `cwd` がワークツリーの中のときは、そのワークツリーの配信元の設定（`documents` の行）で文書を集め、関連をたどる'
    notes: 文書の検索の同じ制約と同じ読み込みを使う
  - item: 既定の検索から除く文書
    constraint: '`include_excluded: false` のとき、文書の行の `search_exclude` の条件に該当する文書を関連の相手と関連の候補から除き、その文書の先はたどらない。照合は `search_docs` の制約「既定の検索から除く文書」と同じ'
    notes: 起点に指定した文書は除かない
