id: IF-38
title: 画面のサーバーからの直コミットの書き込み
lead: 画面のサーバーが溜めた文書の書き込みと削除を 1 回で受け、`write_docs`・`delete_docs` と同じ検査に合格させてから 1 つのコミットにまとめてプッシュする書き込みの API の入出力を定め、書き込みの API を修正するときに参照する。
entry:
  kind: endpoint
  value: POST `/sources/{source}/commits`
identifier: commit_documents
permissions: '`Origin` を持たない要求（サーバーの側からの呼び出し）か、project-index と同じオリジンからの要求だけ。書き換わる全ての文書の種類が、端末の設定の `sources[].direct_commit.write_api_kinds` と配信元の設定の `direct_commit.kinds[]` の両方にあること。`sourceConfig` を送ったときは、端末の設定の `sources[].direct_commit.write_api_config` と配信元の設定の `direct_commit.config` が両方とも `true` であること'
idempotent: false
side_effects: 'コミットするブランチのワークツリーへ書き込み、1 つのコミットにしてリモートへプッシュする。`sourceConfig` を送ったときは、プッシュした後にその配信元を再読み込みする（`dryRun: true` のときは何も変えない）'
callers:
- SC-17#scenarios[正常シナリオ]
- SC-17#scenarios[正常シナリオ（試しに書く）]
- SC-17#scenarios[異常シナリオ（作業場所を持たない要求の直コミットを許可していない）]
- SC-17#scenarios[異常シナリオ（直コミットを許可していない種類を含む）]
- SC-17#scenarios[異常シナリオ（1 つの操作が検査に合格しない）]
- SC-17#scenarios[異常シナリオ（文書のバージョンが合わない）]
- SC-17#scenarios[異常シナリオ（別のオリジンからの要求）]
- SC-17#scenarios[異常シナリオ（許可していない種類の文書が書き換わる）]
- SC-1#scenarios[正常シナリオ]
- SC-17#scenarios[正常シナリオ（衝突したら修正をブランチに残してスクリプトを実行する）]
- SC-17#scenarios[正常シナリオ（衝突してスクリプトの指定が無い）]
- SC-17#scenarios[正常シナリオ（ほかの変更で文書が削除されていても修正をブランチに残す）]
- SC-17#scenarios[正常シナリオ（項目ごとのバージョンで照合する）]
- SC-17#scenarios[異常シナリオ（衝突してスクリプトが失敗する）]
- SC-17#scenarios[異常シナリオ（編集を始めたときのコミットでも検査に合格しない）]
- SC-17#scenarios[異常シナリオ（編集を始めたときのコミットが起点に使えない）]
- SC-17#scenarios[正常シナリオ（本文の直コミットを断る種類のメタデータだけを書き換える）]
- SC-17#scenarios[異常シナリオ（本文の直コミットを断る種類の本文の変更を含む）]
- SC-17#scenarios[正常シナリオ（配信元の設定を書き換える）]
- SC-17#scenarios[異常シナリオ（配信元の設定の直コミットを許可していない）]
- SC-17#scenarios[異常シナリオ（書き換えた後の配信元の設定が検証に合格しない）]
- SC-17#scenarios[異常シナリオ（書き換えられないキーを書き換える）]
- SC-17#scenarios[異常シナリオ（配信元の設定を複数のファイルに分けている）]
exclusivity: '[文書の書き込み](id:IF-6) の制約「直コミットの排他」と同じ排他で、直コミットどうしを 1 つずつ進める。配信元ごとの排他は、[文書の書き込み](id:IF-6) の制約「配信元ごとの排他の待ち」と同じく書き込みの API の書き込みの期限まで待つ'
request:
- name: source
  location: path
  type: str
  required: true
  description: 配信元の ID
- name: writes
  location: body
  type: list[Operation]
  required: false
  description: '`write_docs` の `operations` と同じ操作の並び。省くと空'
- name: deletes
  location: body
  type: 'list[{id: str, expectedVersion: str}]'
  required: false
  description: '`delete_docs` の `targets` と同じ、削除する文書と取得したバージョンの並び。省くと空'
- name: onReferenced
  location: body
  type: Literal['fail', 'unlink']
  required: false
  description: 削除する文書を参照する文書があるときの扱い。`delete_docs` の `on_referenced` と同じ。既定は `fail`
- name: message
  location: body
  type: str
  required: true
  description: コミットの説明
- name: branch
  location: body
  type: str | None
  required: false
  description: コミットするブランチ。`write_docs` の `commit.branch` と同じく、配信元の設定の `direct_commit.branches[]` に該当するときだけ上書きする。省くと `direct_commit.branch`
- name: dryRun
  location: body
  type: bool
  required: false
  description: '`true` のとき、取得・書き込み・コミット・プッシュをせず、許可と検査の結果と差分だけを返却する。既定は `false`'
- name: baseCommit
  location: body
  type: str | None
  required: false
  description: 画面が編集を始めたときのコミットするブランチのコミットの SHA（7〜40 桁）。添えた要求は、衝突したときに修正をこのコミットからのブランチに残す。省くと衝突したときも今と同じに断る
- name: sourceConfig
  location: body
  type: SourceConfigWrite | None
  required: false
  default: なし（配信元の設定を書き換えない）
  description: 配信元の設定（`project-index.yaml`）の書き換え。`writes`・`deletes` と同じ 1 つのコミットに入れる
  status: planned
- name: sourceConfig.content
  location: body
  type: str
  required: true
  description: 書き換えた後の `project-index.yaml` の内容の全体。[配信元の設定の原本の取得](id:IF-39) が返した `content` を書き換えたもの
  notes: '`sourceConfig` を送るときに必須'
  status: planned
- name: sourceConfig.expectedVersion
  location: body
  type: str
  required: true
  description: '[配信元の設定の原本の取得](id:IF-39) が返した `version`'
  notes: '`sourceConfig` を送るときに必須'
  status: planned
request_example: |-
  ```json
  {"writes": [{"op": "update", "id": "n1", "expected_version": "a1b2c3", "set": {"description": "新しい説明"}}], "deletes": [{"id": "n2", "expectedVersion": "d4e5f6"}], "message": "用語を更新する"}
  ```
response:
- name: applied
  type: bool
  description: '書き込みとコミット・プッシュをしたか（`dryRun: true` のときは `false`）'
- name: results[].kind
  type: Literal['write', 'delete']
  description: 結果がどちらの並びの操作か
- name: results[].index
  type: int
  description: '`writes` か `deletes` の中の添字'
- name: results[].id
  type: str
  description: 文書の ID
- name: results[].status
  type: Literal['created', 'updated', 'replaced', 'renamed', 'deleted']
  description: 操作の結果
- name: results[].version
  type: str | None
  description: 書き込んだ後の文書のバージョン（削除は `null`）
- name: results[].diff
  type: str
  description: 変更の差分
- name: unlinked[].id
  type: str
  description: '`onReferenced: unlink` で参照を除いた文書の ID'
- name: unlinked[].version
  type: str
  description: 参照を除いた後の文書のバージョン
- name: commit.sha
  type: str
  description: 'プッシュしたコミットの SHA（`dryRun: true` のときは `commit` が `null`）'
- name: commit.branch
  type: str
  description: コミットしたブランチ
- name: commit.retried
  type: bool
  description: プッシュを 1 回やり直したか
- name: conflict
  type: Conflict | None
  description: '衝突してブランチに残したとき（`dryRun: true` は残せるとき）の結果。衝突しなかったときは `null`'
- name: conflict.branch
  type: str | None
  description: '残したブランチの名前（`dryRun: true` は `null`）'
- name: conflict.commit
  type: str | None
  description: 'ブランチの先頭のコミットの SHA（`dryRun: true` は `null`）'
- name: conflict.baseCommit
  type: str
  description: ブランチの起点にした `baseCommit` を解いた 40 桁の SHA
- name: conflict.errors[]
  type: list[ProblemError]
  description: 今のブランチで断った理由（409・422 の `errors[]` と同じ構造）
- name: conflict.script
  type: ScriptResult | None
  description: '衝突したときのスクリプトの結果。`on_conflict` が無いか `dryRun: true` のときは `null`'
- name: conflict.script.exitCode
  type: int | None
  description: 終了コード（制限時間で止めたときは `null`）
- name: conflict.script.timedOut
  type: bool
  description: 制限時間で止めたか
- name: conflict.script.stdout
  type: str
  description: 標準出力の末尾 8000 文字
- name: conflict.script.stderr
  type: str
  description: 標準エラー出力の末尾 8000 文字
- name: sourceConfig
  type: SourceConfigResult | None
  description: 配信元の設定の書き換えの結果。`sourceConfig` を送ったときだけ入れ、それ以外は `null`
- name: sourceConfig.version
  type: str
  description: 書き込んだ後の `project-index.yaml` のバージョン（[配信元の設定の原本の取得](id:IF-39) の `version` と同じ求め方）
- name: sourceConfig.diff
  type: str
  description: '`project-index.yaml` の変更の差分'
- name: sourceConfig.reloaded
  type: bool
  description: 'プッシュした後に配信元を再読み込みしたか（`dryRun: true` と衝突してブランチに残したときは `false`）'
  notes: 再読み込みに失敗したときもコミットとプッシュは戻さず、`false` で 200 を返却する。配信元の状態は [配信元の一覧と状態](id:IF-22) で参照する
response_example: |-
  ```json
  {"applied": true, "results": [{"kind": "write", "index": 0, "id": "n1", "status": "updated", "version": "b2c3d4", "diff": "..."}, {"kind": "delete", "index": 0, "id": "n2", "status": "deleted", "version": null, "diff": "..."}], "unlinked": [], "commit": {"sha": "0a1b2c3", "branch": "develop", "retried": false}}
  ```
status_codes:
- code: '200'
  condition: '書き込み・コミット・プッシュをした、`dryRun: true` で検査に合格した、または衝突して修正をブランチに残した（`conflict` を入れる）'
- code: '400'
  condition: 要求の型の検証に失敗した（`message` が無い・`writes`・`deletes` が両方とも空で `sourceConfig` も無い。`InvalidArgumentError`）
  notes: 起動の『例外の変換の登録』が problem+json にし、`errors[]` にキーのパスと理由を並べる
- code: '403'
  condition: 別のオリジンの要求（`CrossOriginError`）、書き換わる文書の種類が配信元の設定の `direct_commit.kinds[]` にはあるが端末の設定の `write_api_kinds` に無いか、書き込みの API から直コミットできる種類が 1 つも無い（`DirectCommitNotPermittedError`）、`sourceConfig` を送ったが端末の設定の `write_api_config` か配信元の設定の `direct_commit.config` が `true` でない（`SourceConfigNotPermittedError`）、上書きできないブランチを指定した（`BranchNotAllowedError`）、書き換わる文書に SQLite の表の行の種類がある（`ReadOnlyKindError`）
  notes: '`DirectCommitNotPermittedError` は `kinds` に許可していない種類を入れ、`next_steps` で許可を記載する端末の設定のキー `sources[].direct_commit.write_api_kinds` を示す'
- code: '404'
  condition: 無い配信元（`UnknownSourceError`）・配信していない配信元（`SourceNotServedError`）・更新や削除する文書が無い（`DocumentNotFoundError`）
- code: '409'
  condition: 文書か配信元の設定のバージョンが取り込んだ後の今のバージョンと違う（`VersionMismatchError`）、直コミットを使用できない配信元（`DirectCommitNotConfiguredError`）、`sourceConfig` を送った配信元の端末の設定の `config` が `project-index.yaml` 1 つでない（`SourceConfigSplitError`）、コミットするブランチのワークツリーが無い（`CommitWorktreeNotFoundError`）、ワークツリーに未プッシュのコミット（`UnpushedCommitsError`）・書き込むファイルに未コミットの変更（`UncommittedChangesError`）がある、削除する文書が参照されている（`DocumentReferencedError`）、プッシュが 2 回断られた（`PushRejectedError`）、`baseCommit` がクローンに無いかコミットするブランチの祖先でない（`BaseCommitUnusableError`）
- code: '422'
  condition: '検査に合格しない（`ValidationFailedError`。配信元の設定の `direct_commit.kinds[]` に無い種類の文書が書き換わる・`body: false` の種類の本文のファイルが書き換わる・作られる・移る・削除される・秘密の値を含む・配信元の設定の書き換えられないキーが変わる・書き換えた後の配信元の設定がスキーマか起動の検証に合格しないも同じ）'
  notes: '`errors[]` に、`writes`・`deletes` の別と添字・項目のパス・決まり・直し方を全て並べる'
- code: '500'
  condition: '`generators[]` が失敗した（`DirectCommitGeneratorError`）'
  notes: 書き込んだファイルと生成物を戻した後に返却する
- code: '502'
  condition: リモートからの取得に失敗した（`FetchFailedError`）か、プッシュに失敗した・結果が不明（`PushFailedError`）
  notes: 書き込んだファイルと生成物を戻した後に返却する
- code: '504'
  condition: 書き込みの期限を過ぎた（`WriteDeadlineExceededError`）
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`・`current`）
constraints:
- item: オリジンの確認
  constraint: 端末の設定の API と同じ `require_same_origin` で確かめる
- item: 認可
  constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）。作業場所（`cwd`）は受け取らず、`scope.write` と `sources[].direct_commit.scope`・`kinds` では判定しない
  decided_by: NFR-1#requirements[通信]
- item: 書き込みの API の直コミットの権限
  constraint: '制約「直コミットを許可する種類」の後に、変更を適用した後に書き換わる全ての文書（`rename` の参照元・`replace_text` で置換した文書・`onReferenced: unlink` で参照を除く文書を含む）の種類が、端末の設定の `sources[].direct_commit.write_api_kinds` にあることを確認する。配信元の設定の `direct_commit.kinds[]` にあって `write_api_kinds` に無い種類があれば `DirectCommitNotPermittedError` で断る'
- item: 直コミットを許可する種類
  constraint: '[文書の書き込み](id:IF-6) の制約「直コミットを許可する種類」と同じで、制約「書き込みの API の直コミットの権限」より先に判定する。ただし、書き込みの API から直コミットできる種類（`write_api_kinds` のうち配信元の設定の `direct_commit.kinds[]` にある種類）が 1 つも無い配信元は、取得の前に操作の種類に関わらず `DirectCommitNotPermittedError` で断る。書き換わる文書に配信元の設定の `direct_commit.kinds[]` に無い種類があれば、`write_api_kinds` に関わらず `ValidationFailedError` で返却する。`write_api_kinds` にあっても配信元の設定の `direct_commit.kinds[]` に無い種類は、起動の検証で警告にして使用しない'
- item: 書き込みと削除の 1 つのコミット
  constraint: '`writes` を並び順に適用し、続けて `deletes` を適用した後の文書を検査する。全ての操作が合格したときだけ書き込み、書き込んだ・削除したファイルと生成物を 1 つのコミットにする。`atomic: false` は受け付けない'
- item: 直コミットの流れ
  constraint: '[文書の書き込み](id:IF-6) の制約「直コミットの書き込む先」「直コミットの流れ」「秘密の値の検査」「直コミットのプッシュの再試行」「直コミットの取り込み・生成・プッシュの制限時間」「直コミットの生成の失敗」「直コミットのプッシュの結果の照合」と同じ'
- item: バージョンの照合
  constraint: 取得と取り込みの後のワークツリーの文書のバージョンと、`writes[].expected_version`・`deletes[].expectedVersion` を照合する
- item: 書き込みの期限
  constraint: '要求を受けてから書き込みの API の書き込みの期限までに、検査とファイルの置き換えの開始を終える。衝突したときの一時のワークツリーでの検査のやり直しと書き込みの開始もこの期限の中に収める。過ぎたときの扱いは [文書の書き込み](id:IF-6) の制約「書き込みの期限」と同じ'
  decided_by: NFR-1#requirements[書き込みの API の書き込みの期限]
- item: JSON のキー
  constraint: 要求と応答のキーは camelCase。`writes[]` の操作のキーは `write_docs` の `operations[]` のキーのまま
- item: 衝突の判定
  constraint: '`baseCommit` を添えた要求が、今のブランチで `VersionMismatchError`・`DocumentNotFoundError`・`DocumentReferencedError`・`ValidationFailedError` のどれかで断られたときを衝突とし、`baseCommit` の一時のワークツリーで同じ許可と検査をやり直す。許可（配信元の設定の `direct_commit.kinds[]`・端末の設定の `write_api_kinds`・読み取り専用の種類・秘密の値の検査）は今の `origin/{コミットするブランチ}` の配信元の設定で判定し、スキーマ・`validators[]`・`generators[]` と文書の値は `baseCommit` の一時のワークツリーのものを使用する。オリジン・直コミットの権限・ブランチ・読み取り専用の種類・ワークツリーの状態・取得・プッシュ・期限のエラーは衝突にせず、今と同じに断る'
- item: 編集を始めたときのコミット
  constraint: '取得と取り込みの後に、`baseCommit` がクローンにあり、`origin/{コミットするブランチ}` の祖先であることを確認する。クローンに無ければ `reason: not_found`、祖先でなければ `reason: not_ancestor` の `BaseCommitUnusableError`（409）で、検査の前に断る'
- item: 衝突したときのブランチ
  constraint: '`baseCommit` でブランチを付けない一時のワークツリーを状態のフォルダの下に作り、`writes`・`deletes` と `generators[]` の結果を 1 つのコミット（説明は `message`）にしてから、そのコミットに `project-index/conflict/{YYYYMMDD-HHMMSS}-{コミットの 7 桁}`（時刻は UTC）のブランチを作る。ブランチはクローンにだけ作り、プッシュしない。一時のワークツリーは成功しても失敗しても削除する'
- item: 衝突したときの断る理由
  constraint: '`baseCommit` の一時のワークツリーでも合格しない要求は、今のブランチで断ったエラーと `errors[]` で断る（一時のワークツリーの違反は返却しない）'
- item: 衝突したときのスクリプト
  constraint: 端末の設定の `sources[].direct_commit.on_conflict.command` を、ブランチを作って排他を放した後に、シェルを経由せずクローン本体を作業ディレクトリにして実行する。環境変数 `PROJECT_INDEX_SOURCE`（配信元の ID）・`PROJECT_INDEX_CONFLICT_BRANCH`・`PROJECT_INDEX_CONFLICT_COMMIT`・`PROJECT_INDEX_BASE_COMMIT`・`PROJECT_INDEX_TARGET_BRANCH`（コミットするブランチ）・`PROJECT_INDEX_COMMIT_MESSAGE` を加え、ほかはサーバーのプロセスの環境変数を引き継ぐ。制限時間は、要求を受けてから書き込みの API の応答の上限までの残りの時間と、端末の設定の `script_timeout_sec` の短い方にする。終了コードが 0 以外でも、制限時間で止めても、ブランチは削除せずに 200 で結果を返却する
  decided_by: NFR-1#requirements[書き込みの API の応答の上限]
- item: 試しに書くときの衝突
  constraint: '`dryRun: true` で衝突したときも一時のワークツリーで許可と検査をやり直し、合格すれば `conflict` を `branch`・`commit`・`script` が `null` で返却する。ブランチを作らず、スクリプトを実行しない'
- item: 本文の直コミットを断る種類
  constraint: '[文書の書き込み](id:IF-6) の制約「本文の直コミットを断る種類」と同じで、`writes` と `deletes` の両方に適用する（`deletes` は [文書の削除](id:IF-7) の制約「直コミット」と同じ）。1 つでも違反があれば、要求全体を `ValidationFailedError` で断る'
- item: 配信元の設定の直コミットの権限
  constraint: '`sourceConfig` を送った要求は、取得の前に、端末の設定の `sources[].direct_commit.write_api_config` と、書き換える前の配信元の設定の `direct_commit.config` が両方とも `true` であることを確認する。どちらかが `true` でなければ `SourceConfigNotPermittedError`（403）で断り、`nextSteps` で許可を記載するキーを示す。`writes`・`deletes` が空の要求は、制約「直コミットを許可する種類」の「書き込みの API から直コミットできる種類が 1 つも無い配信元を断る」判定をしない'
- item: 配信元の設定のファイル
  constraint: 書き換えるのは、コミットするブランチのワークツリーの、配信元のフォルダからの相対パスが `project-index.yaml` のファイル。端末の設定の `sources[].config` が配列で 2 つ以上のファイルを指すか、配信元のフォルダの `project-index.yaml` 以外を指す配信元は、取得の前に `SourceConfigSplitError`（409）で断る
- item: 配信元の設定のバージョンの照合
  constraint: 取得と取り込みの後のワークツリーの `project-index.yaml` のバージョンを `sourceConfig.expectedVersion` と照合し、違えば `VersionMismatchError`（409。`errors[]` のパスは `sourceConfig`）で断る。バージョンは [配信元の設定の原本の取得](id:IF-39) の制約「バージョン」と同じ求め方
- item: 書き換えられないキー
  constraint: '`sourceConfig.content` を YAML として読み、トップレベルの `validators`・`converters`・`generators`・`direct_commit`・`worktrees` の値を、取り込みの後のワークツリーの `project-index.yaml` の値と比べる（キーが無いことも値として比べ、コメントと書き方の違いは比べない）。違うキーがあれば `ValidationFailedError`（422。決まりは `protected_key`、パスは `sourceConfig.{キー}`）で断る。`documents[]` の `validators`・`converter`・`after_write` はトップレベルで定義したスクリプトの `id` を指すだけなので対象にしない'
- item: 配信元の設定の検査
  constraint: 書き換えた後の配信元の設定を、配信元の設定のスキーマと、[起動](id:IF-15) の配信元の検証（`reload` と同じ判定）にかける。配信元を配信しなくなる違反があれば `ValidationFailedError`（422。パスは `sourceConfig.{キーのパス}`）で断る。配信を続ける警告は断らず、秘密の値の検査は文書と同じくかける
- item: 書き換えた後の設定での文書の検査
  constraint: '`sourceConfig` と `writes`・`deletes` を一緒に送った要求は、`writes`・`deletes` のスキーマを書き換えた後の配信元の設定で判定する。許可（`direct_commit.kinds[]`）は制約「書き換えられないキー」で変わらないため、書き換える前と同じになる'
- item: 配信元の設定の再読み込み
  constraint: '`sourceConfig` を含むコミットをプッシュして排他を放した後に、その配信元を管理の MCP の `reload` と同じ処理で再読み込みしてから応答する。`default_ref` がコミットするブランチと違う配信元は、再読み込みしても `default_ref` の設定で配信する（配信に入るのは `default_ref` に取り込まれたとき）'
- item: 衝突したときの配信元の設定
  constraint: '`baseCommit` を添えた要求が、配信元の設定の `VersionMismatchError` か検査の `ValidationFailedError` で断られたときも制約「衝突の判定」の衝突にする。制約「書き換えられないキー」は、今の `origin/{コミットするブランチ}` の `project-index.yaml` と比べ、違えば衝突にせず断る'
flows:
- name: 正常系
  summary: 書き込みと削除を 1 つのコミットにまとめてプッシュする
  setup:
  - &id001
    name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - &id002
    name: 配信元
    description: '種類 `note`（直コミットを許可する）と種類 `rule`（許可しない）を持つ git の配信元 sample と、`develop` を指すワークツリー。配信元の設定の `direct_commit` は `branch: develop`・`kinds: [note]`'
    notes: '端末の設定の sample の行は `direct_commit.write_api_kinds: [note]`'
  - &id003
    name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1・n2 と、そのバージョン'
  - name: 入力
    description: '`writes` に n1 の `update`、`deletes` に n2、`message`'
  flow: |-
    <!-- map: {"title": "正常系"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: writes（n1 の update）, deletes（n2）, message
      E->>E: オリジンと write_api_kinds を確かめる
      E->>R: 取得し、develop のワークツリーへ早送りで取り込む
      E->>E: 全ての操作を write_docs・delete_docs と同じ検査に通す
      E->>WT: n1 を書き換え n2 を削除し、generators を実行して 1 つのコミットにする
      E->>R: develop をプッシュする
      E-->>C: 200 applied, results, commit
    ```

    <!-- /map -->
  expected:
  - 200 で `applied` が `true`、`results` に n1 の `updated` と n2 の `deleted` がある
  - リモートの `develop` に 1 コミットだけ増え、`commit.sha` と一致し、変更は n1・n2 のファイルと生成物だけ
  - コミットの説明が `message`
  test: test_normal
- name: 正常系（試しに書く）
  summary: '`dryRun: true` は検査と差分だけを返却する'
  setup:
  - *id001
  - *id002
  - *id003
  - name: 入力
    description: '正常系と同じ入力に `dryRun: true`'
  flow: |-
    <!-- map: {"title": "正常系（試しに書く）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: 正常系の入力, dryRun: true
      E->>E: 許可と検査だけを行う
      E-->>C: 200 applied: false, results（差分）
    ```

    <!-- /map -->
  expected:
  - 200 で `applied` が `false`、`results[].diff` がある
  - '`commit` が `null` で、リモートとワークツリーは変わらない'
  test: test_normal_when_dry_run
- name: 異常系（書き込みの API の直コミットを許可していない・403）
  summary: 端末の設定の `write_api_kinds` に無い種類は断る
  setup:
  - *id001
  - name: 配信元
    description: '種類 `note`（直コミットを許可する）と種類 `rule`（許可しない）を持つ git の配信元 sample と、`develop` を指すワークツリー。配信元の設定の `direct_commit` は `branch: develop`・`kinds: [note]`'
    notes: 端末の設定の sample の行に `write_api_kinds` が無い
  - *id003
  flow: |-
    <!-- map: {"title": "異常系（書き込みの API の直コミットを許可していない・403）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: 正常系の入力
      E->>E: n1・n2 の種類 note が write_api_kinds に無い
      E-->>C: 403 DirectCommitNotPermittedError
    ```

    <!-- /map -->
  expected:
  - 403 で、許可していない種類と、許可を記載する端末の設定のキー `sources[].direct_commit.write_api_kinds` を返却する
  - リモートとワークツリーは変わらない
  test: test_error_when_write_api_not_allowed
- name: 異常系（書き換わる文書に許可していない種類がある・422）
  summary: 削除の参照の除外で書き換わる参照元の種類も確かめる
  setup:
  - *id001
  - *id002
  - *id003
  - name: 参照元
    description: 種類 `rule` の文書 r1 の `related` が n2 を指す
  - name: 入力
    description: '`deletes` に n2、`onReferenced: unlink`'
  flow: |-
    <!-- map: {"title": "異常系（書き換わる文書に許可していない種類がある・422）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: deletes（n2）, onReferenced: unlink
      E->>E: n2 の削除で r1（種類 rule）が書き換わる
      E-->>C: 422 ValidationFailedError
    ```

    <!-- /map -->
  expected:
  - 422 で、`errors[]` に n2 の操作の位置と「種類 rule は直コミットを許可していない」がある
  - n2 も r1 も変わらず、リモートとワークツリーは変わらない
  test: test_error_when_disallowed_kind_rewritten
- name: 異常系（1 つの操作が検査に通らない・422）
  summary: 1 つでも違反があればどれも書き込まない
  setup:
  - *id001
  - *id002
  - *id003
  - name: 入力
    description: '`writes` に n1 の `update` と、スキーマに違反する n2 の `update`'
  flow: |-
    <!-- map: {"title": "異常系（1 つの操作が検査に通らない・422）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: writes（n1・n2）
      E->>E: n2 の操作がスキーマに通らない
      E-->>C: 422 ValidationFailedError
    ```

    <!-- /map -->
  expected:
  - 422 で、`errors[]` に n2 の操作の位置と `write_docs` と同じ違反の決まり・直し方がある
  - n1 も書き換わらず、リモートとワークツリーは変わらない
  test: test_error_when_validation_failed
- name: 異常系（文書のバージョンが古い・409）
  summary: 取り込んだ後のバージョンと照合する
  setup:
  - *id001
  - *id002
  - *id003
  - name: 先の書き換え
    description: バージョンを取得した後に、リモートの `develop` で n1 を書き換える
  flow: |-
    <!-- map: {"title": "異常系（文書のバージョンが古い・409）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: 正常系の入力（書き換わる前の n1 のバージョン）
      E->>R: 取得し、取り込む
      E->>E: n1 の今のバージョンと合わない
      E-->>C: 409 VersionMismatchError
    ```

    <!-- /map -->
  expected:
  - 409 で、n1 と今のバージョンを返却する
  - n2 も削除されず、リモートの `develop` に増えたコミットは先の書き換えだけ
  test: test_error_when_version_conflict
- name: 異常系（別のオリジン・403）
  summary: ブラウザの別のオリジンからの要求は断る
  setup:
  - *id001
  - *id002
  - *id003
  - name: 入力
    description: 正常系の入力に、project-index と別のオリジンの `Origin` ヘッダー
  flow: |-
    <!-- map: {"title": "異常系（別のオリジン・403）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: 正常系の入力（Origin: 別のオリジン）
      E-->>C: 403 CrossOriginError
    ```

    <!-- /map -->
  expected:
  - 403 で、別のオリジンからの要求を受けないことを返却する
  - リモートとワークツリーは変わらない
  test: test_error_when_cross_origin
- name: 異常系（配信していない配信元・404）
  summary: 配信していない配信元は断る
  setup:
  - *id001
  - *id002
  flow: |-
    <!-- map: {"title": "異常系（配信していない配信元・404）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: source: missing
      E-->>C: 404 UnknownSourceError
    ```

    <!-- /map -->
  expected:
  - 404 で、配信していない配信元であることを返却する
  test: test_error_when_source_not_found
- name: 異常系（SQLite の表の行の文書を含む・403）
  summary: SQLite の表の行の文書への操作を含む要求を、直コミットを許可していても断る
  setup:
  - name: Mock
    description: なし（テストのコードが書き込みの API を HTTP で呼ぶ）
  - name: サンプルの配信元
    description: 直コミットを許可した sample に、行 `notes_db` と `data/notes.db` を加えたもの
    notes: 配信元の設定の `direct_commit.kinds[]` と端末の設定の `write_api_kinds` の両方に `note` と `notes_db`
  - name: 要求
    description: '`writes` に種類 `note` の文書 1 の部分更新と `n1` の部分更新'
  flow: |-
    <!-- map: {"title": "異常系（SQLite の表の行の文書を含む・403）"} -->

    ```mermaid
    sequenceDiagram
      participant C as dev-docs の画面のサーバー
      participant T as 書き込みの API

      C->>T: writes: 文書 1・n1 の部分更新
      T->>T: n1 の種類 notes_db が SQLite の表の行
      T-->>C: 403（ReadOnlyKindError。errors[] に writes[1]）
    ```

    <!-- /map -->
  expected:
  - 応答が 403 の `application/problem+json` で、`errors[]` に `writes[1]` と種類 `notes_db` が読み取り専用であることがある
  - 文書 1 も書き換わらず、sample のリモートと全てのワークツリーと `data/notes.db` は変わらない
  test: test_error_when_sqlite_kind_included
- name: 正常系（衝突してブランチに残しスクリプトを実行する）
  summary: 今のブランチで断られ、編集を始めたときのコミットで合格する要求を、ブランチの 1 つのコミットに残してスクリプトを実行する
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: 正常系と同じ sample。端末の設定の sample の行に `direct_commit.on_conflict.command` で、受け取った環境変数を一時フォルダのファイルへ書き出して終了コード 0 で終わるテスト用のスクリプトを指定する
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1・n2 と、そのバージョンと、そのときの `develop` のコミット（編集を始めたときのコミット）'
  - name: 先の書き換え
    description: バージョンを取得した後に、リモートの `develop` で n1 の同じ項目を書き換える
  - name: 入力
    description: 正常系の入力に、`baseCommit` で編集を始めたときのコミット
  flow: |-
    <!-- map: {"title": "正常系（衝突してブランチに残しスクリプトを実行する）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant TW as 一時のワークツリー
      participant SC as 衝突したときのスクリプト
      participant R as リモート

      C->>E: writes（n1）, deletes（n2）, message, baseCommit
      E->>R: 取得し、develop のワークツリーへ取り込む
      E->>E: baseCommit がクローンにあり、origin/develop の祖先であることを確認する
      E->>E: 今の develop で n1 が 409 VersionMismatchError
      E->>TW: baseCommit でブランチを付けない一時のワークツリーを作る
      E->>TW: 全ての操作を検査し、書き込み、generators を実行して 1 つのコミットにする
      E->>TW: コミットにブランチを作り、一時のワークツリーを削除する
      E->>E: 排他を放す
      E->>SC: 環境変数に配信元・ブランチ・コミットを入れて実行する
      SC-->>E: 終了コード 0 と出力
      E-->>C: 200 applied: false, conflict（branch・commit・errors・script）
    ```

    <!-- /map -->
  expected:
  - 200 で `applied` が `false`、`commit` が `null`、`conflict.branch` が `project-index/conflict/` で始まり、`conflict.commit` がそのブランチの先頭の SHA
  - '`conflict.errors[]` に、今の develop で断った n1 のバージョンの不一致がある'
  - '`conflict.script.exitCode` が `0` で、`stdout` にスクリプトの出力がある'
  - ブランチの先頭のコミットの親が `baseCommit`、説明が `message`、変更は n1・n2 のファイルと生成物だけ
  - リモートの `develop` は先の書き換えのコミットのままで、リモートにブランチは無い。develop のワークツリーは変わらない
  - '`git worktree list` に一時のワークツリーが無く、フォルダも無い'
  - スクリプトが書き出したファイルに `PROJECT_INDEX_SOURCE=sample` と、ブランチの名前・コミットの SHA がある
  test: test_normal_when_conflict_kept_in_branch
- name: 正常系（衝突してスクリプトの指定が無い）
  summary: '`on_conflict` の無い配信元はブランチを残すだけにする'
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: 正常系と同じ sample
    notes: 端末の設定の sample の行に `direct_commit.on_conflict` が無い
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1・n2 と、そのバージョンと、そのときの `develop` のコミット（編集を始めたときのコミット）'
  - name: 先の書き換え
    description: バージョンを取得した後に、リモートの `develop` で n1 の同じ項目を書き換える
  - name: 入力
    description: 正常系の入力に、`baseCommit` で編集を始めたときのコミット
  flow: |-
    <!-- map: {"title": "正常系（衝突してスクリプトの指定が無い）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant TW as 一時のワークツリー

      C->>E: 衝突してブランチに残す正常系と同じ入力
      E->>TW: baseCommit の一時のワークツリーで合格させ、コミットとブランチを作って一時のワークツリーを削除する
      E-->>C: 200 applied: false, conflict（script: null）
    ```

    <!-- /map -->
  expected:
  - 200 で `conflict.branch`・`conflict.commit` があり、`conflict.script` が `null`
  - クローンにブランチがあり、リモートには無い
  test: test_normal_when_conflict_without_script
- name: 正常系（衝突してスクリプトが失敗する）
  summary: スクリプトが失敗してもブランチを残し、終了コードと出力を返却する
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: 正常系と同じ sample
    notes: '`direct_commit.on_conflict.command` は標準エラー出力に 1 行を出して終了コード 1 で終わるテスト用のスクリプト'
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1・n2 と、そのバージョンと、そのときの `develop` のコミット（編集を始めたときのコミット）'
  - name: 先の書き換え
    description: バージョンを取得した後に、リモートの `develop` で n1 の同じ項目を書き換える
  - name: 入力
    description: 正常系の入力に、`baseCommit` で編集を始めたときのコミット
  flow: |-
    <!-- map: {"title": "正常系（衝突してスクリプトが失敗する）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
