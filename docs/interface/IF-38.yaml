- name: 正常系（項目ごとのバージョンで照合する）
  summary: 別の項目の変更とは衝突しない
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: 正常系と同じ sample
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1 と、文書の取得の `itemVersions` の `title` の値'
  - name: 先の書き換え
    description: 項目のバージョンを取得した後に、リモートの `develop` で n1 の `description` を書き換える
  - name: 入力
    description: '`writes` に n1 の `update`（`set: {title}`、`expected_version: {title: 取得した値}`）'
  flow: |-
    <!-- map: {"title": "正常系（項目ごとのバージョンで照合する）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant R as リモート

      C->>E: writes（n1 の title の update。項目ごとのバージョン）
