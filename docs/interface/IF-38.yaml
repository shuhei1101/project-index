- name: 異常系（編集を始めたときのコミットが起点に使えない・409）
  summary: クローンに無いか、コミットするブランチの祖先でない `baseCommit` は断る
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: 正常系と同じ sample。端末の設定の sample の行に `direct_commit.on_conflict.command` で、受け取った環境変数を一時フォルダのファイルへ書き出して終了コード 0 で終わるテスト用のスクリプトを指定する
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1・n2 と、そのバージョンと、そのときの `develop` のコミット（編集を始めたときのコミット）'
  - name: 入力
    description: 1 回目は `baseCommit` にクローンに無い SHA、2 回目は `master` にだけあるコミットの SHA
  flow: |-
    <!-- map: {"title": "異常系（編集を始めたときのコミットが起点に使えない・409）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant R as リモート

      C->>E: baseCommit: クローンに無い SHA
      E->>R: 取得し、取り込む
      E-->>C: 409 BaseCommitUnusableError（reason: not_found）
      C->>E: baseCommit: master にだけあるコミット
      E->>R: 取得し、取り込む
      E-->>C: 409 BaseCommitUnusableError（reason: not_ancestor）
    ```

    <!-- /map -->
  expected:
  - 1 回目が 409 で `reason` が `not_found`、2 回目が 409 で `reason` が `not_ancestor`
  - どちらもブランチと一時のワークツリーを作らず、スクリプトを実行せず、リモートとワークツリーは変わらない
