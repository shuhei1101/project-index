- name: 異常系（編集を始めたときのコミットでも検査に合格しない・409）
  summary: どちらでも合格しない要求は、今のブランチで断った理由で断る
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: 正常系と同じ sample。端末の設定の sample の行に `direct_commit.on_conflict.command` で、受け取った環境変数を一時フォルダのファイルへ書き出して終了コード 0 で終わるテスト用のスクリプトを指定する
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1・n2 と、そのバージョンと、そのときの `develop` のコミット（編集を始めたときのコミット）'
  - name: 先の書き換え
    description: バージョンを取得した後に、リモートの `develop` で n1 の同じ項目を書き換える
  - name: 入力
    description: '`writes` にスキーマに違反する値への n1 の `update` と、`baseCommit`'
  flow: |-
    <!-- map: {"title": "異常系（編集を始めたときのコミットでも検査に合格しない・409）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant TW as 一時のワークツリー

      C->>E: writes（スキーマに違反する n1）, baseCommit
      E->>E: 今の develop で n1 のバージョンが合わず 409
      E->>TW: baseCommit の一時のワークツリーを作る
      E->>E: 一時のワークツリーでも n1 がスキーマに合格しない
      E->>TW: 一時のワークツリーを削除する
      E-->>C: 409 VersionMismatchError（今の develop で断った理由）
    ```

    <!-- /map -->
  expected:
  - 409 の `VersionMismatchError` で、今の develop で断った n1 のバージョンの不一致（今の develop ではバージョンの照合が検査より先に断る）
  - ブランチと一時のワークツリーが残らず、スクリプトを実行しない
  test: test_error_when_invalid_at_base_commit
- name: 異常系（本文の直コミットを断る種類の本文が変わる・422）
  summary: '`body: false` の種類の本文のファイルが書き換わる・移る・削除される操作を 1 つでも含む要求を、要求全体で断る'
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: '正常系の sample に、管理用の YAML `files.yml` を `records: files`・`body_file: path` で指す種類 `files` を加えたもの。配信元の設定の `direct_commit` は `branch: develop`・`kinds: [note, {id: files, body: false}]`'
    notes: '端末の設定の sample の行は `direct_commit.write_api_kinds: [note, files]`'
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1、`path` が `guide.md` の行と本文のファイル `guide.md`（n1 へのリンクを持つ）、それぞれのバージョン'
  - name: 入力
    description: 1 回目は `writes` に n1 の `update` と `guide.md` の行の `update`（`set` に `@body`）、2 回目は `writes` に n1 の `rename`（`new_id`）、3 回目は `deletes` に `guide.md` の行
  flow: |-
    <!-- map: {"title": "異常系（本文の直コミットを断る種類の本文が変わる・422）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: writes（n1 の update、guide.md の行の set @body）
      E->>E: 種類 files は body: false で、guide.md の行の本文のファイルが書き換わる
      E-->>C: 422 ValidationFailedError
    ```

    <!-- /map -->
  expected:
  - 1〜3 回目のどれも 422 で、`errors[]` に `guide.md` の行を書き換える・削除する操作の位置（2 回目は n1 の操作の位置と、書き換わる `guide.md` の行の ID）と「種類 files は本文の直コミットを断っている」がある
  - n1 も `guide.md` も `files.yml` も変わらず、リモートとワークツリーは変わらない
  test: test_error_when_body_not_allowed
- name: 正常系（配信元の設定を書き換える）
  summary: 配信元の設定と文書を 1 つのコミットにしてプッシュし、配信元を再読み込みする
  setup:
  - name: Mock
    description: なし（一時フォルダに git の配信元とベアリポジトリのリモートと端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: 配信元
    description: '正常系と同じ sample。配信元の設定の `direct_commit` に `config: true`、`nav` にタブ 1 つ'
    notes: '端末の設定の sample の行は `config` が sample の `project-index.yaml` 1 つで、`direct_commit.write_api_kinds: [note]`・`write_api_config: true`'
  - name: 文書
    description: '`develop` にコミット済みの種類 `note` の文書 n1 とそのバージョン、配信元の設定の原本の取得で得た内容とバージョン'
  - name: 入力
    description: '`sourceConfig` に `nav` のタブのタイトルを変えた内容とバージョン、`writes` に n1 の `update`、`message`'
  flow: |-
    <!-- map: {"title": "正常系（配信元の設定を書き換える）"} -->

    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as POST /sources/{source}/commits
      participant WT as develop のワークツリー
      participant R as リモート

      C->>E: sourceConfig, writes（n1 の update）, message
      E->>E: オリジンと write_api_kinds・write_api_config・direct_commit.config を確かめる
      E->>R: 取得し、develop のワークツリーへ早送りで取り込む
      E->>E: 配信元の設定のバージョン・書き換えられないキー・スキーマと起動の検証を確かめ、n1 を書き換えた後の設定で検査する
      E->>WT: project-index.yaml と n1 を書き換え、generators を実行して 1 つのコミットにする
      E->>R: develop をプッシュする
      E->>E: sample を再読み込みする
      E-->>C: 200 applied, results, sourceConfig, commit
    ```

    <!-- /map -->
  expected:
  - 200 で `applied` が `true`、`sourceConfig.reloaded` が `true`、`sourceConfig.version` が書き込んだ後のバージョン
  - リモートの `develop` に 1 コミットだけ増え、変更は `project-index.yaml`・n1 のファイルと生成物だけ
  - 続けて呼ぶ `GET /sources/sample/config` の `nav` が変えた後のタブのタイトルで、`GET /sources/sample/config/file` の `version` が `sourceConfig.version` と同じ
  test: test_normal_when_source_config_written
- name: 異常系（配信元の設定の直コミットを許可していない・403）
