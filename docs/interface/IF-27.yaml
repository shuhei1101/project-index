id: IF-27
title: 検討事項の文書の取得
entry:
  kind: endpoint
  value: GET `/sources/{source}/decisions/{id}`
flows:
- name: 正常系
  summary: ちょうど 1 つのフォルダにある検討事項の文書の本文を返す
  setup:
  - name: Mock
    description: なし（一時フォルダに配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
  - name: サンプルの配信元
    description: '`decisions.folders` の 1 つ目のフォルダにだけ `.mindstella/docs/D-1.md` を置いた sample'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as GET /sources/{source}/decisions/{id}

      C->>E: GET /sources/sample/decisions/D-1
      E-->>C: 200 本文
    ```
  expected:
  - 200 で、`body` が `D-1.md` の本文（変換しない）、`folder` が 1 つ目のフォルダ
  test: test_normal
- name: 異常系（1 つに決まらない・無い・404）
  summary: 当たるフォルダが 0 個か 2 個以上の ID を断る
  setup:
  - name: Mock
    description: なし
  - name: サンプルの配信元
    description: '`D-2.md` を 2 つのフォルダに置き、`D-3.md` はどのフォルダにも置かない sample'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as GET /sources/{source}/decisions/{id}

      C->>E: GET /sources/sample/decisions/D-2
      E-->>C: 404 ambiguous
      C->>E: GET /sources/sample/decisions/D-3
      E-->>C: 404 not_found
    ```
  expected:
  - '`D-2` は 404 で、`missing` が `doc`、`reason` が `ambiguous`、`folders` に 2 つのフォルダ'
  - '`D-3` は 404 で、`missing` が `doc`、`reason` が `not_found`'
  test: test_error_when_not_unique
- name: 異常系（ID の形式に当たらない・404）
  summary: フォルダの外を指す ID を形式で断る
  setup:
  - name: Mock
    description: なし
  - name: 入力
    description: '`/sources/sample/decisions/..%2Fsecret`'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant C as クライアント
      participant E as GET /sources/{source}/decisions/{id}

      C->>E: GET /sources/sample/decisions/..%2Fsecret
      E-->>C: 404 problem+json
    ```
  expected:
  - 404 で、ファイルを読まない
  test: test_error_when_id_invalid
lead: '`decisions.folders` のうちちょうど 1 つのフォルダにある検討事項の文書の本文を返す。'
identifier: get_decision
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
- SC-11#scenarios[正常シナリオ]
- SC-11#scenarios[異常シナリオ（検討事項の文書が 1 つに決まらない）]
exclusivity: 読み取りだけで排他しない
request:
- name: source
  type: str
  required: true
  location: path
  description: 配信元の ID
- name: id
  type: str
  required: true
  location: path
  description: 検討事項の ID
  constraints: '`^[A-Z]+-[0-9]+$`'
request_example: |-
  ```text
  GET /sources/sample/decisions/D-1
  ```
response:
- name: id
  type: str
  description: 検討事項の ID
- name: folder
  type: str
  description: 文書のあったフォルダ（`decisions.folders` の値）
- name: body
  type: str
  description: '`.mindstella/docs/{ID}.md` の本文（変換しない）'
response_example: |-
  ```json
  {"id": "D-1", "folder": "/path/to/talks", "body": "# D-1 保存先を決める\n..."}
  ```
status_codes:
- code: '200'
  condition: 返した
- code: '404'
  condition: 配信元が無い・配信していない、当たるフォルダが 0 個か 2 個以上、ID の形式に当たらない
  notes: '`missing`（`source`・`not_served`・`doc`）。`doc` のときは `reason`（`not_found`・`ambiguous`）、`ambiguous` は `folders` に当たったフォルダ'
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）
constraints:
- item: リビジョン
  constraint: 検討事項の文書は Git の管理外のため、リビジョンによらず今のファイルを読む
- item: 認可
  constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  decided_by: NFR-1#requirements[通信]
- item: JSON のキー
  constraint: レスポンスのキーは camelCase
test_file: tests/integration/server/test_get_decision.py
