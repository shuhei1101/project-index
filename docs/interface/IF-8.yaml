id: IF-8
title: "状態の取得"
entry:
  kind: mcp_tool
  value: status
flows:
  - name: 正常系
    summary: 配信中・配信していない配信元の状態を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリをテストのクライアントで呼ぶ）
      - name: 配信元
        description: 検証に通る sample（管理用の YAML に無いファイル 1 件）と、`documents[0].paths` が無い broken
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: 配信元の検査が済むのを待つ
        C->>T: 引数なし
        T->>T: 配信元ごとの状態と、検査の最後の同期の件数を読む
        T-->>C: アドレス・バージョン・配信元の表
      ```

      <!-- /map -->
    expected:
      - '`version` が配布のメタデータのバージョンと同じ'
      - sample が `serving`、`sync.unindexed_files` が 1
      - broken が `not_served` で、`errors` に `documents[0].paths` と理由がある
      - '`format: json` では同じ中身を structuredContent と text に入れる'
    test: test_normal
  - name: 正常系（配信元を読み込んでいる）
    summary: 配信元の読み込みを待たずに、読み込み中であることを返す
    setup:
      - name: Mock
        description: 配信元の読み込み（`load_source`）を、テストが合図を出すまで止めるものに差し替える
        notes: 合図は `threading.Event`
      - name: 配信元
        description: sample の 1 行
        notes: '-'
    flow: |-
      <!-- map: {"title": "正常系（配信元を読み込んでいる）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: format: json
        T-->>C: loading: true・sample が loading
        C->>T: 配信元の読み込みの合図を出す
        C->>T: format: json
        T-->>C: loading: false・sample が serving
      ```

      <!-- /map -->
    expected:
      - '合図の前の `status` が読み込みを待たずに `loading: true` と、sample を `loading` で並べた `sources` を返す'
      - 合図の前の markdown に、読み込み中であることと、読み込みが終わっていない配信元を指す文書の MCP の呼び出しが待たされることが出る
      - '合図の後の `status` が `loading: false` で、sample が `serving`'
    test: test_normal_when_loading
  - name: 正常系（配信元の検査が済んでいない）
    summary: 配信元のファイルをたどらず、検査が済んでいない配信元は同期の件数を持たずに返す
    setup:
      - name: Mock
        description: 配信元の検査（`check_sync`）を、呼んだ回数を数え、テストが合図を出すまで止めるものに差し替える
        notes: 合図は `threading.Event`
      - name: 配信元
        description: 検証に通る sample（管理用の YAML に無いファイル 1 件）の 1 行
        notes: '-'
    flow: |-
      <!-- map: {"title": "正常系（配信元の検査が済んでいない）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: format: json
        T-->>C: checking: true・sample が serving・sync: null
        C->>T: 配信元の検査の合図を出す
        C->>T: format: json
        T-->>C: checking: false・sample が serving・sync.unindexed_files: 1
      ```

      <!-- /map -->
    expected:
      - '合図の前の `status` が検査を待たずに、sample を `serving`・`sync: null` で返す'
      - 合図の前の markdown の索引の同期の列に、検査中であることが出る
      - '合図の後の `status` の `sync.unindexed_files` が 1'
      - '`status` を 2 回呼んでも、`check_sync` を呼んだ回数は起動の後の検査の 1 回のまま'
      - '合図の前の `status` が `loading: false`・`checking: true` を返し、合図の後の `status` が `checking: false` を返す'
    test: test_normal_when_checking
  - name: 正常系（再読み込みした配信元を検査している）
    summary: '`reload` の後の裏の検査が済むまで、検査の最中であることを返す'
    setup:
      - name: Mock
        description: 配信元の検査（`check_sync`）を、起動の後の 1 回はそのまま通し、その後はテストが合図を出すまで止めるものに差し替える
        notes: 合図は `threading.Event`
      - name: 配信元
        description: Git 管理外の sample の 1 行
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant R as reload
        participant T as status

        C->>R: 引数なし
        R-->>C: 再読み込みした配信元
        C->>T: format: json
        T-->>C: checking: true・sample が serving・sync: null
        C->>T: 検査の合図を出す
        C->>T: format: json
        T-->>C: checking: false・sync.unindexed_files を持つ
      ```
    expected:
      - '合図の前の `status` が `checking: true` で、sample を `serving`・`sync: null` で返す'
      - 合図の前の markdown に、再読み込みの最中であることが出る
      - '合図の後の `status` が `checking: false` で、`sync` に件数がある'
    test: test_normal_when_reload_checking
    refs:
      - to: SC-10
        item: scenarios[正常シナリオ]
        type: references
        when: このインターフェースの入出力やフローを変えるときに、シナリオ『設定・スクリプトを変える』の対応する流れと期待値を確認する。
  - name: 正常系（裏でリビジョンを書き出している）
    summary: 裏のリビジョンの書き出しが済むまで、書き出しの最中であることを返す
    setup:
      - name: Mock
        description: リビジョンの書き出し（`SnapshotStore.checkout`）を、テストが合図を出すまで止めるものに差し替える
        notes: 合図は `threading.Event`
      - name: 配信元
        description: git リポジトリの sample の 1 行
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: format: json
        T-->>C: loading: false・exporting: true
        C->>T: 書き出しの合図を出す
        C->>T: format: json
        T-->>C: exporting: false
      ```
    expected:
      - '合図の前の `status` が書き出しを待たずに `loading: false`・`exporting: true` を返す'
      - 合図の前の markdown に、リビジョンの書き出しの最中であることが出る
      - '合図の後の `status` が `exporting: false` を返す'
    test: test_normal_when_exporting
    refs:
      - to: SC-4
        item: scenarios[正常シナリオ（default_ref のリビジョンを先に書き出す）]
        type: references
        when: このインターフェースの入出力やフローを変えるときに、シナリオ『起動する』の対応する流れと期待値を確認する。
      - to: SC-11
        item: scenarios[正常シナリオ（配信元を読み込んだ直後に開く）]
        type: references
        when: このインターフェースの入出力やフローを変えるときに、シナリオ『画面のサーバーが文書を読む』の対応する流れと期待値を確認する。
lead: 待ち受けのアドレス・バージョン・端末の設定・配信元ごとの状態を返却する管理の MCP の `status` の入出力を定め、`status` を修正するときに参照する。
tags:
  - name: topic:サーバー
    main: true
  - name: topic:状態
  - name: action:取得
  - name: tool:mcp
identifier: status
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - SC-3#scenarios[正常シナリオ]
  - SC-4#scenarios[正常シナリオ（default_ref のリビジョンを先に書き出す）]
  - SC-10#scenarios[正常シナリオ]
  - SC-10#scenarios[正常シナリオ（再読み込みの検査が済む前に再読み込みする）]
  - SC-11#scenarios[正常シナリオ（配信元を読み込んだ直後に開く）]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返却する形式
request_example: |-
  ```json
  {}
  ```
response:
  - name: address
    type: str
    description: 待ち受けている URL（`http://127.0.0.1:8786/`）
  - name: version
    type: str
    description: 動いている project-index のバージョン
  - name: pid
    type: int
    description: サーバーのプロセス ID
  - name: terminal.file
    type: str
    description: 読んだ端末の設定のパス
  - name: terminal.version_state
    type: Literal['current', 'old', 'newer']
    description: 端末の設定の `version` と project-index が参照できるバージョンの比較
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled', 'loading']
    description: '配信中・検証で外した・`enabled: false`・読み込み中'
  - name: sources[].errors[]
    type: str
    description: '配信しない理由（`{キーのパス}: {理由}`）'
    notes: '`not_served` のとき'
  - name: sources[].config_version
    type: str | None
    description: 配信元の設定の `version`
  - name: sources[].version_state
    type: Literal['current', 'old', 'newer'] | None
    description: 配信元の設定のバージョンの比較
  - name: sources[].sync
    type: SyncCounts | None
    description: 索引の同期の件数
    notes: '`serving` で、配信元の検査が済んでいるとき。検査が済んでいなければ `null` で、markdown に検査中であることを出す'
  - name: sources[].sync.missing_refs
    type: int
    description: '`metadata` に書いた列が無い文書の件数'
    notes: '`serving` のとき'
  - name: sources[].sync.unindexed_files
    type: int
    description: 管理用の YAML に無いファイルの件数。除外の条件に当たるファイルと、ほかの documents の行の文書になるファイルは数えない（`check_project` と同じ）
  - name: sources[].sync.missing_body_files
    type: int
    description: ファイルが無い行の件数
  - name: sources[].sync.unresolved_related
    type: int
    description: '`related[].to` が配信元のどの文書の ID にも当たらない関連の件数（`check_project` と同じ）'
  - name: loading
    type: bool
    description: 配信元を読み込んでいる間は `true`。その間は、読み込み済みの行と、読み込みが終わっていない行を `loading` で、端末の設定の順に `sources` に並べ（読み込み中の行の ID は `GET /sources?include_loading=true` と同じ）、markdown に読み込み中であることと、読み込みが終わっていない配信元を指す文書の MCP の呼び出しが待たされることを出す
    notes: '-'
  - name: checking
    type: bool
    description: 配信元の裏の検査が済んでいない間は `true`。markdown に検査の最中であることを出す
    notes: '起動の後・`reload`・端末の設定の保存の後に裏で実行する全ての検査が対象。起動の後は、全ての行の読み込みが済んで `loading` が `false` になった後も、検査が済むまで `true`'
  - name: exporting
    type: bool
    description: 裏のリビジョンの書き出し（配信元ごとの `default_ref` の commit）が済んでいない間は `true`。markdown に書き出しの最中であることを出す
    notes: 上限を超えて止めた書き出しも済んだものとして扱う
  - name: sources[].sync.duplicate_files
    type: int
    description: 2 つ以上の有効な documents の行が文書にするファイルの件数（`check_project` と同じ）
response_example: |-
  ```markdown
  http://127.0.0.1:8786/ project-index 0.2.0（pid 4242）
  端末の設定: /home/u/.config/project-index/settings.yaml（current）
  | source | 状態 | 設定のバージョン | 索引の同期 |
  | --- | --- | --- | --- |
  | sample | serving | 1（current） | 0 |
  | broken | not_served（documents[0].paths: 必須のキーが無い） | - | - |
  ```
exceptions:
  - name: なし（正常終了）
    condition: 返せた（配信元が 0 件のときも空の一覧）
constraints:
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 同期の件数
    constraint: 配信元の読み込み・再読み込み・`default_ref` の組み立て直しの後と、`write_docs`・`delete_docs` の後に裏で実行する検査の最後の結果を読み、`status` は配信元のファイルをたどらない
    notes: 直接編集したファイルのずれは、次の検査まで件数に出ない。今のファイルで求め直すときは `check_project`
  - item: 配信中の配信元の組
    constraint: 配信元ごとの `default_ref` の commit を確かめず、いま配信中の組の設定を読む（組み立て直さない）
    notes: '`default_ref` が進んだ配信元の設定のバージョンは、その配信元を使う次の要求で組み立て直した後に出る'
  - item: 権限
    constraint: 作業場所で絞らず、全ての配信元を返す
  - item: タイムアウト
    constraint: 制限なし
  - item: 配信元の読み込みの間
    constraint: 配信元の読み込みを待たずに答える（起動の待ち受けまでの順番）
test_file: tests/integration/server/test_get_status.py
visibility: internal
