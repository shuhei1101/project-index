title: 端末の設定の配信元の 1 行の削除
entry:
  kind: endpoint
  value: DELETE `/settings/sources/{id}`
lead: 端末の設定の配信元の行を 1 行だけ削除し、その配信元を配信から除外する。取得した後に端末の設定が書き換えられていれば削除しない。
identifier: delete_settings_source
permissions: '`Origin` を持たない要求（サーバーの側や端末のほかのプロセスからの呼び出し）か、project-index と同じオリジンからの要求だけ'
idempotent: false
side_effects: '`settings.yaml` の `sources` から指した 1 行だけを削除し、その配信元を配信から除外する（ほかの配信元は読み直さず、配信を続ける）。配信元のフォルダのファイルは変えない'
callers:
  - SC-12#scenarios[正常シナリオ（1 行を削除する）]
  - SC-12#scenarios[異常シナリオ（利用者が端末の設定を手で書き換えた）]
  - SC-12#scenarios[異常シナリオ（指した行が無い）]
exclusivity: 端末の設定の保存と同じ排他ロックの中で、内容のバージョンの照合・行の検索・書き込み・配信からの除外を行う
request:
  - name: id
    type: str
    required: true
    location: path
    description: 削除する行の配信元の ID
    notes: '`id` を省いた行は、配信元の設定の `name` で照合する'
  - name: expectedVersion
    type: str
    required: true
    location: query
    description: 取得したときの端末の設定の内容のバージョン
request_example: |-
  ```text
  DELETE /settings/sources/extra?expectedVersion=a1b2c3
  ```
response:
  - name: version
    type: str
    description: 削除した後の端末の設定の内容のバージョン
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled']
    description: 削除した後の状態。削除した配信元は並ばない
response_example: |-
  ```json
  {"version": "d4e5f6", "sources": [{"id": "sample", "status": "serving"}]}
  ```
status_codes:
  - code: '200'
    condition: 削除して配信から除外した
  - code: '403'
    condition: project-index と別のオリジンの `Origin` を持つ要求か、`Origin` が無く `Sec-Fetch-Site` が `cross-site`・`same-site` の要求
  - code: '404'
    condition: 指した ID の行が無い
  - code: '409'
    condition: '`expectedVersion` が今の端末の設定の内容のバージョンと違う'
    notes: 拡張メンバー `current` に今の内容のバージョンを入れる
  - code: '422'
    condition: '`expectedVersion` が無い'
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`・`current`）
constraints:
  - item: オリジンの確認
    constraint: 端末の設定の保存と同じ
  - item: 行の指し方
    constraint: 端末の設定の配信元の 1 行の変更と同じ
  - item: 内容のバージョンの照合
    constraint: 排他ロックを取った後に `settings.yaml` の内容のバージョンと照合し、行の検索より前に断る
  - item: 書き込みの範囲
    constraint: '`settings.yaml` の指した 1 行だけを削除し、ほかの行・他のキー・コメントを保つ。一時ファイルに書いてから置き換える'
  - item: 読み直しの範囲
    constraint: 削除した行の配信元を配信から除外するだけで、ほかの配信元は読み直さない
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: NFR-1#requirements[通信]
  - item: JSON のキー
    constraint: クエリとレスポンスのキーは camelCase
  - item: operationId
    constraint: '`{tag}-{関数名}` の `settings-delete_settings_source`'
flows:
  - name: 正常系
    summary: 指した行だけを削除し、その配信元を配信から除外する
    setup:
      - name: Mock
        description: なし（一時フォルダに端末の設定と配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行。別のキーとコメントを持つ'
      - name: 入力
        description: '`GET /settings/sources` で取得した `version`'
        notes: パスの `id` は `extra`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as DELETE /settings/sources/extra
        participant CF as 端末の設定

        C->>E: expectedVersion
        E-->>CF: 内容のバージョンを照合し、extra の行を探す
        E->>CF: extra の行だけを削除する
        E->>E: extra を配信から除外する
        E-->>C: 200（version・配信元ごとの状態）
      ```
    expected:
      - 200 で、`version` が `expectedVersion` と違う値で、`sources` に extra が無い
      - '`settings.yaml` の `sources` が sample の行だけで、sample の行・他のキー・コメントは変わらない'
      - extra のフォルダのファイルは変わらない
      - '`/sources/extra/docs` が 404、`/sources/sample/docs` が 200 を返却し、sample の配信元は読み直さない'
    test: test_normal
  - name: 異常系（内容のバージョンが古い・409）
    summary: 取得した後に書き換えられた端末の設定からの削除を断る
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
      - name: ほかの書き換え
        description: 取得の後に `settings.yaml` の末尾へコメントを 1 行追記する
      - name: 入力
        description: 取得した `version`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as DELETE /settings/sources/extra
        participant CF as 端末の設定

        C->>E: 古い expectedVersion
        E-->>CF: 今の内容のバージョンを求めて照合する
        E-->>C: 409 problem+json（current）
      ```
    expected:
      - 409 で、`current` がコメントを追記した後の内容のバージョン
      - '`settings.yaml` が追記した内容のままで、extra の行が残り、`/sources/extra/docs` が 200 を返却する'
    test: test_error_when_version_outdated
  - name: 異常系（指した行が無い・404）
    summary: 指した ID の行が無い削除を断る
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample の 1 行'
      - name: 入力
        description: 取得した `version`
        notes: パスの `id` は `extra`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as DELETE /settings/sources/extra

        C->>E: expectedVersion
        E-->>C: 404 problem+json
      ```
    expected:
      - 404 で、extra の行が無いことを返却する
      - '`settings.yaml` が変わらない'
    test: test_error_when_row_not_found
  - name: 異常系（内容のバージョンが無い・422）
    summary: '`expectedVersion` が無い削除を断る'
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as DELETE /settings/sources/extra

        C->>E: クエリなし
        E-->>C: 422 problem+json
      ```
    expected:
      - 422 を返却する
      - '`settings.yaml` が変わらない'
    test: test_error_when_version_missing
  - name: 異常系（別のオリジン・403）
    summary: ブラウザからの別のオリジンの削除を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`Origin: http://127.0.0.1:9999` で、取得した `version`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as DELETE /settings/sources/extra

        C->>E: Origin: 別のオリジン
        E-->>C: 403
      ```
    expected:
      - 403 を返却する
      - '`settings.yaml` が変わらない'
    test: test_error_when_cross_origin
test_file: tests/integration/server/test_delete_settings_source.py
