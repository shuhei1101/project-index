lead: 文書の作成・部分更新・置き換え・改名・複数の文書の文字列の一括置換を検査に合格させてから書き込む `write_docs` の入出力を定め、`write_docs` を修正するときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: action:書き込み
  - name: action:検証
  - name: tool:mcp
aliases:
  - 'write_docs'
identifier: write_docs
permissions: 対象の配信元の `scope.write` に `cwd` が当たること。Git の配信元はワークツリーにだけ書く。`commit` を指定した呼び出しは、`scope.write` の代わりに端末の設定の `sources[].direct_commit` に `cwd` が該当すること
idempotent: false
side_effects: 作業ツリー（Git 管理外の配信元はそのフォルダ）の文書の YAML と、`records`・`body_file` の行の文書の本文のファイルを作る・書き換える。`generators[]` のスクリプトを流して生成物を書き出す。Git 管理外の配信元では、`documents[].write_dates` が `false` の種類を除いてメタデータの `created`・`updated` を付ける。`commit` を指定した呼び出しは、コミットするブランチのワークツリーで操作が書き込んだファイルと生成物をコミットし、リモートへプッシュする。
callers:
  - SC-7#scenarios[正常シナリオ]
  - SC-7#scenarios[正常シナリオ（変更していない項目の引用符を保つ）]
  - SC-7#scenarios[異常シナリオ（Markdown の値に mdmark の警告がある）]
  - SC-7#scenarios[正常シナリオ（mdmark の CLI が無い）]
  - SC-7#scenarios[異常シナリオ（書き込みが期限を過ぎる）]
  - SC-7#scenarios[異常シナリオ（検査のスクリプトが制限時間を超える）]
  - SC-7#scenarios[正常シナリオ（本文のファイルを持つ文書を書く）]
  - SC-7#scenarios[異常シナリオ（本文のファイルを書き込めない）]
  - SC-7#scenarios[正常シナリオ（文書を改名して参照元を追随させる）]
  - SC-7#scenarios[異常シナリオ（改名先の ID が既にある）]
  - SC-7#scenarios[正常シナリオ（本文のファイルを持つ文書を改名する）]
  - SC-7#scenarios[正常シナリオ（複数の文書の単語を一括で置換する）]
  - SC-7#scenarios[異常シナリオ（一括置換の後の文書が検査に合格しない）]
  - SC-7#scenarios[正常シナリオ（日時を付けない種類に Git 管理外の配信元で書く）]
  - SC-7#scenarios[正常シナリオ（本文のファイルを持たない要素を書く）]
  - SC-15#scenarios[正常シナリオ]
  - SC-15#scenarios[正常シナリオ（ワークツリーに他の未コミットの変更がある）]
  - SC-15#scenarios[正常シナリオ（コミットするブランチを上書きする）]
  - SC-15#scenarios[正常シナリオ（リモートが先に進んでいる）]
  - SC-15#scenarios[正常シナリオ（プッシュが 1 回断られる）]
  - SC-15#scenarios[正常シナリオ（試しに書く）]
  - SC-15#scenarios[異常シナリオ（直コミットを許可していない種類）]
  - SC-15#scenarios[異常シナリオ（呼べる作業場所に該当しない）]
  - SC-15#scenarios[異常シナリオ（ワークツリーに未プッシュのコミットがある）]
  - SC-15#scenarios[異常シナリオ（書き込むファイルに未コミットの変更がある）]
  - SC-15#scenarios[異常シナリオ（秘密の値を含む）]
  - SC-15#scenarios[異常シナリオ（プッシュが 2 回断られる）]
  - SC-15#scenarios[異常シナリオ（リモートに接続できない）]
  - SC-15#scenarios[異常シナリオ（プッシュで通信に失敗する）]
  - SC-15#scenarios[異常シナリオ（許可していない種類の文書が書き換わる）]
  - SC-15#scenarios[異常シナリオ（atomic を外して指定する）]
  - SC-15#scenarios[異常シナリオ（コミットするブランチのワークツリーが無い）]
  - SC-10#scenarios[異常シナリオ（直コミットの設定が検証に通らない）]
exclusivity: 配信元ごとの排他ロックの中で、読み込み・バージョンの確認・検査・書き込みを行う。後から来た呼び出しはロックを待つ。`commit` を指定した呼び出しは、制約「直コミットの排他」のリポジトリの単位の排他も取る
request:
  - name: source
    type: str
    required: false
    default: なし（作業中の配信元）
    location: argument
    description: 配信元の ID
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: 書き込むワークツリーのパス
    constraints: 配信元の設定の `worktrees` に当たるパスだけ
    notes: 種類・配置先は、そのワークツリーの `project-index.yaml` で再読み込みした配信元の設定で参照する
  - name: operations
    type: list[Operation]
    required: true
    location: argument
    description: 並べた順に適用する操作
    constraints: 1〜50 件
  - name: operations[].op
    type: Literal['create', 'update', 'replace', 'rename', 'replace_text']
    required: true
    location: argument
    description: '`create` は新しい文書、`update` は部分更新、`replace` は全項目の置き換え、`rename` は文書の ID・パスの変更と参照元の追随、`replace_text` は `filter` に該当する文書の文字列の値の一括置換'
    notes: upsert は置かない
  - name: operations[].kind
    type: str
    required: false
    default: なし（`create` では必須）
    location: argument
    description: 種類（`documents[].id`）。スキーマと配置先を決める
  - name: operations[].id
    type: str
    required: false
    default: なし（`update`・`replace`・`rename` では必須。`create` で省くと `ids.format` から作る）
    location: argument
    description: 対象の文書の ID
    constraints: '`ids.format` に合い、配信元の中で重複しない'
  - name: operations[].expected_version
    type: str | dict[str, str]
    required: false
    default: なし（`update`・`replace`・`rename` では必須）
    location: argument
    description: 読んだときのバージョン
    notes: '`update` では項目のパスごとのハッシュも受ける'
  - name: operations[].data
    type: dict
    required: false
    default: なし（`create`・`replace` では必須）
    location: argument
    description: 文書の全項目
  - name: operations[].set
    type: dict
    required: false
    default: なし
    location: argument
    description: 項目に値を入れる。オブジェクトは再帰的にマージし、配列と値は置き換える
    notes: '`update` だけ'
  - name: operations[].unset
    type: list[str]
    required: false
    default: なし
    location: argument
    description: 消す項目のパス
    notes: '`update` だけ。`#` で始まる参照の型の項目のパスも受ける（制約「unset の項目のパス」）'
  - name: operations[].add_to
    type: dict[str, list]
    required: false
    default: なし
    location: argument
    description: 配列の項目の末尾へ要素を追加する
    notes: '`update` だけ。`x-key` を持つ配列に既にある `x-key` の値の要素も、違反にせず追加する（制約「add_to の x-key を持つ配列」）'
  - name: operations[].remove_from
    type: dict[str, list]
    required: false
    default: なし
    location: argument
    description: 配列の項目から一致する要素を削除する。`x-key` を持つ配列は `x-key` の値でも要素を指す
    notes: '`update` だけ。`x-key` を持つ配列で削除する要素が無い値は違反にする（制約「remove_from の x-key を持つ配列」）'
  - name: operations[].text_edits
    type: 'list[{field: str, old: str, new: str, replace_all: bool}]'
    required: false
    default: なし
    location: argument
    description: 文字列の項目の一部を置き換える
    constraints: '`replace_all` が `false` のとき `old` が 1 か所だけ一致すること'
    notes: '`update` だけ'
  - name: atomic
    type: bool
    required: false
    default: '`true`'
    location: argument
    description: '`true` は 1 件でも失敗したら何も書かない。`false` は成功分を書き、失敗分を添字つきで返す'
  - name: dry_run
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: 本番と同じ検証・バージョンの確認・差分を返し、書き込まない
  - name: cwd
    type: str
    required: false
    default: なし（どの `scope.write` にも当たらない）
    location: argument
    description: セッションの作業場所
    notes: PreToolUse のフックがセッションの作業場所で上書きし、エージェントが指定した値は使わない。ツールの入力のスキーマの `description` にも同じことと、ワークツリーは `worktree` で指すことを載せる
  - name: session_id
    type: str
    required: false
    default: なし
    location: argument
    description: 会話キー
    notes: フックが入れる
  - name: agent_id
    type: str
    required: false
    default: なし（メインの会話）
    location: argument
    description: 会話キー（サブエージェント）
    notes: フックが入れる
  - name: operations[].data.@body
    type: str
    required: false
    default: なし（`records`・`body_file` の行の `create` では、`data` に `body_file` の列があれば必須。無ければ本文のファイルを持たない要素を作る）
    location: argument
    description: 本文のファイルの内容
    notes: '`records`・`body_file` の行の文書だけ。本文のファイルのパスは `data` の `body_file` の列に、管理用の YAML のフォルダからの相対で渡す'
  - name: operations[].set.@body
    type: str
    required: false
    default: なし（本文のファイルを変えない）
    location: argument
    description: 本文のファイルの内容の全体。本文のファイルを置き換える
    notes: '`records`・`body_file` の行の文書の `update` だけ'
  - name: operations[].text_edits[].field
    type: str
    required: true
    location: argument
    description: 置き換える文字列の項目のパス。`@body` は本文のファイルの一部を置き換える。`#` で始まるパスは参照の型の項目のパス（`#functions[apply_migration].process`）で、配列の要素を種類のスキーマの `x-key` の値で指す
    notes: '`@body` は `records`・`body_file` の行の文書だけ。参照の型の項目のパスの読み方は制約の「参照の型の項目のパス」'
  - name: operations[].new_id
    type: str
    required: false
    default: なし（ID を変えない）
    location: argument
    description: 改名後の ID
    constraints: '`ids.format` に合い、配信元の中で重複しない。ID の列（種類の行の `metadata.id`。省くと `id`）の値を持たない文書（ID がパスの文書）では受けない'
    notes: '`rename` だけ。`new_id`・`new_path` の少なくとも 1 つを指定する'
  - name: operations[].new_path
    type: str
    required: false
    default: なし（制約の「改名後のパス」で決める）
    location: argument
    description: 改名後のファイルの配信元の直下からのパス。1 ファイル 1 文書は YAML のファイル、`records`・`body_file` の行の文書は本文のファイル
    constraints: 種類の行の `paths` に該当し `exclude[]` に該当しない（`body_file` の行は配信元の中）。既にあるファイルを指さない。`body_file` を持たない `records` の行の文書と、本文のファイルを持たない要素では受けない
    notes: '`rename` だけ'
  - name: operations[].filter
    type: Condition | Group
    required: false
    default: なし（`replace_text` では必須）
    location: argument
    description: 置換する文書の条件。[文書の検索](id:IF-2) の `filter` と同じ記載方法と意味
    notes: '`replace_text` だけ'
  - name: operations[].old
    type: str
    required: false
    default: なし（`replace_text` では必須）
    location: argument
    description: 置換する前の文字列。大文字小文字を区別して文字列のまま一致させる
    constraints: 空でない
    notes: '`replace_text` だけ'
  - name: operations[].new
    type: str
    required: false
    default: なし（`replace_text` では必須）
    location: argument
    description: 置換した後の文字列
    notes: '`replace_text` だけ。空の文字列で `old` を削除する'
  - name: operations[].fields
    type: list[str]
    required: false
    default: なし（制約の「一括置換の対象」の全ての項目）
    location: argument
    description: 置換する項目のパス。項目の配下の文字列も置換する。`@body` は本文のファイルを指す
    notes: '`replace_text` だけ。`@body` は `records`・`body_file` の行の文書のうち本文のファイルの拡張子が `.md` の文書だけに適用し、ほかの文書では無視する。共通のキーは列名へ読み替える'
  - name: commit
    type: '{message: str, branch: str | None} | None'
    required: false
    default: なし（コミットとプッシュをしない）
    location: argument
    description: 書き込みの後に、コミットするブランチのワークツリーでコミットしてプッシュする指定（直コミット）
    constraints: '`atomic: true` のときだけ'
    notes: 書き込む先はコミットするブランチのワークツリーに決定するため、`worktree` と同時には受けない。権限の判定は `scope.write` の代わりに端末の設定の `sources[].direct_commit` で行う（制約「直コミットの権限」）
  - name: commit.message
    type: str
    required: true
    location: argument
    description: コミットの説明
    constraints: 空白だけでない
  - name: commit.branch
    type: str | None
    required: false
    default: なし（配信元の設定の `direct_commit.branch`）
    location: argument
    description: コミットしてプッシュするブランチ。この呼び出しだけ `direct_commit.branch` を上書きする
    constraints: '`direct_commit.branch` か、`direct_commit.branches[]` の名前・glob に該当するブランチ'
request_example: |-
  ```json
  {
    "worktree": "/path/to/sample/.claude/worktrees/x",
    "operations": [
      {"op": "update", "id": "doc-1", "expected_version": "9d0e11", "set": {"name": "新しい名前"}},
      {"op": "create", "kind": "sample", "data": {"name": "文書 3", "description": "3 件目"}}
    ]
  }
  ```
response:
  - name: applied
    type: bool
    description: 1 件以上をファイルへ書いたか
    notes: '`dry_run: true` のときは常に `false`'
  - name: results[].index
    type: int
    description: '`operations` の添字'
  - name: results[].id
    type: str
    description: 文書の ID
  - name: results[].status
    type: Literal['created', 'updated', 'replaced', 'renamed', 'failed']
    description: 操作の結果
  - name: results[].version
    type: str
    description: 書いた後のバージョン
    notes: '`failed` では返さない'
  - name: results[].diff
    type: str
    description: git と同じ `+`・`-` の差分の行
    notes: '`updated`・`replaced` と `dry_run` のとき。本文のファイルを書き換える文書は、要素の差分の行に続けて `@@ {本文のファイルの配信元の直下からのパス}` の行と本文のファイルの差分の行を並べる'
  - name: results[].errors
    type: 'list[{path: str, rule: str, fix: str, schema?: {title?: str, description?: str, x-rules?: list, examples?: list, x-bad-examples?: list}}]'
    description: 違反ごとの項目のパス・決まり・直し方と、違反した項目のスキーマの説明
    notes: '`failed` のときだけ。`schema` の中身は制約の「違反へ添えるスキーマの説明」'
  - name: results[].unchecked
    type: 'list[{path: str, reason: str}]'
    description: mdmark の点検に通す Markdown のキーのうち、点検できなかったキーのパスと理由
    notes: '点検できなかったキーがあるときだけ。`failed` では返さない'
  - name: results[].path
    type: str
    description: 改名後のファイルの配信元の直下からのパス
    notes: '`renamed` のときだけ'
  - name: results[].renamed_from
    type: str
    description: 改名の前の ID
    notes: '`renamed` のときだけ'
  - name: results[].references
    type: 'list[{path: str, before: str, after: str}]'
    description: 改名で書き換えた参照元の箇所（項目のパスと、書き換える前後の値）。本文のファイルの箇所は `path` が `@body`
    notes: '`rename` の参照元の文書の行だけ。`rename` の参照元は、改名した文書の行と同じ `index` で `status` が `updated` の行になる'
  - name: results[].count
    type: int
    description: 文書ごとの置換の件数（本文のファイルの件数を含む）
    notes: '`replace_text` だけ。置換した文書ごとに同じ `index` で 1 行ずつ返却し、置換が 0 件の文書の行は返却しない'
  - name: commit.sha
    type: str
    description: プッシュしたコミットの SHA（40 桁）
    notes: '`commit` を指定し、`dry_run: false` で書き込んだときだけ'
  - name: commit.branch
    type: str
    description: プッシュしたブランチ
    notes: '`commit.sha` と同じ'
  - name: commit.retried
    type: bool
    description: プッシュが 1 回断られ、取り込みからやり直したか
    notes: '`commit.sha` と同じ'
response_example: |-
  ```json
  {"applied": true, "results": [
    {"index": 0, "id": "doc-1", "status": "updated", "version": "c1aa02", "diff": "- name: 文書 1\n+ name: 新しい名前"},
    {"index": 1, "id": "sample-doc-3", "status": "created", "version": "7b2f90"}
  ]}
  ```
response_notes: '`format` によらず JSON を返し、structuredContent と text に同じ JSON を入れる。'
exceptions:
  - name: なし（正常終了）
    condition: '全ての操作を書いた（`atomic: false` で一部が失敗したときも、失敗分を `failed` として返して正常終了）'
  - name: ValidationFailedError
    condition: '変更を当てた後の文書（`rename` の参照元と `replace_text` で置換した文書を含む）がスキーマか `validators[]` に通らないか、`rename` の `new_id` が `ids.format` に合わないか既にある文書と重なるか、種類のスキーマの `$ref` を解決できないか、変えた Markdown のキーの値に mdmark の描画時の書き方の警告があるか、本文のファイルのパスが配信元の外・`create` で既にあるファイルを指す（`atomic: true`）か、書き込むワークツリーの配信元の設定が検証に通らない'
    notes: '違反ごとの添字・パス・決まり・直し方を添える。スキーマの違反には、違反した項目のスキーマの説明（`schema`）も添える'
  - name: SourceNotWritableError
    condition: '`cwd` が配信元の `scope.write` に当たらない'
    notes: 今の作業場所から使える配信元の一覧を添える
  - name: TargetIsCloneError
    condition: Git の配信元で、書く先がクローン本体になる
    notes: クローン本体のパス（配信元の設定をワークツリーから読んでいても、ワークツリーの親のクローン本体）と、`worktree` でワークツリーを指すことを添える
  - name: VersionMismatchError
    condition: '`expected_version` が今のバージョンと違う'
    notes: 今のバージョンと差分、`search_docs` で再取得して呼び直すことを添える
  - name: UnknownKindError
    condition: '`create` の `kind` が配信元の種類に無い'
    notes: その配信元の種類の一覧を添える。書く先がワークツリーのときは、ワークツリーの設定の種類で判定し、その一覧を添える
  - name: DocumentNotFoundError
    condition: '`update`・`replace` の `id` の文書が無い'
    notes: 見つからなかった ID と近い ID の候補を添える
  - name: InvalidArgumentError
    condition: '操作が 50 件を超える・`op` ごとの必須のキーが無い・`text_edits` の `old` が 1 か所に一致しない・`create` の配置先を行の `paths` の先頭から決められない（`records` を持つ行で先頭が空か glob を含む・持たない行で先頭が glob を含まないか、最後の段の `*` を ID に置き換えた後に glob が残るか、決めた配置先が行の `paths` に当たらない）・`create` の配置先が行の `exclude[]` に当たる（`/` を含む値はパス、含まない値はファイル名で当てる）・共通のキーとその列名を同じ操作に両方渡した・`{配列}[].{項目}`・`{配列}[{真偽値のキー}].{項目}` の対応を持つ共通のキーに名前（文字列）の配列でない値を渡した、または配列に無い名前を選んだ・`**.{列名}` の対応を持つ共通のキーへの操作を渡した・`body_file` を持たない行の文書に `@body` を渡した・`unset`・`add_to`・`remove_from` に `@body` を渡した・`body_file` の行の `create` に `@body` が無い・`body_file` の列の値を変える `update`・`replace` を渡した・`storage.type: disk` の配信元に `worktree` を渡した・`rename` に `new_id`・`new_path` がどちらも無い・ID がパスの文書に `new_id` を渡した・`body_file` を持たない `records` の行の文書に `new_path` を渡した・`new_path` が種類の行の `paths` に当たらないか `exclude[]` に当たるか既にあるファイルを指す・`replace_text` に `filter`・`old`・`new` のどれかが無いか `old` が空・`text_edits[].field` の参照の型の項目のパスが `x-key` の無い配列・該当する要素の無い値・無い順番・無いキーを指す・`unset` の要素の参照の型の項目のパスを解決できないか、`#` で始まらない要素に要素の選び方（`[...]`・`**.`）を含む・`x-key` を持つ配列への `remove_from` の値に削除する要素が無い・`commit` と `atomic: false` を同時に渡した・`commit` と `worktree` を同時に渡した'
  - name: SourceNotServedError
    condition: '起動時の検証で外したか `enabled: false` の配信元を指した'
  - name: WorktreeNotMatchedError
    condition: '`worktree` が配信元の `worktrees` に当たらない'
  - name: WriteDeadlineExceededError
    condition: 作業ツリーのファイルを置き換える前に、要求を受けてから端末の設定の `write_deadline_sec` を過ぎていた
    notes: 書き込みの期限・経過した秒数・ファイルを書き換えていないことと、検査のスクリプトの所要時間を確認してから再実行することを添える
  - name: UnexpectedError
    condition: '`ProjectIndexError` でない例外（`GitError` など）で処理を終了できなかった'
    notes: 例外の型と内容を返却する。サーバーのログには例外のトレースバックを残す。文書の MCP の全てのツールで共通の変換のため、結合テストは [文書の検索](id:IF-2) が持つ
  - name: WorktreeLoadingError
    condition: 書き込むワークツリーの初めての読み込みが、端末の設定の `worktree_load_wait_sec` までに終了しなかった
    notes: 何も書き込まない。ワークツリーのパスと、時間を空けて同じ呼び出しを送信することを添える
  - name: DirectCommitNotConfiguredError
    condition: '`commit` を指定した呼び出しで、配信元の設定に `direct_commit` が無いか、端末の設定の `storage.type` が `disk` の配信元か、`direct_commit.kinds[]` に `documents[]` に無い種類がある'
    notes: 配信元の ID と理由を添える。何も書き込まない
  - name: DirectCommitNotPermittedError
    condition: '`commit` を指定した呼び出しで、`cwd` が書き換わる文書の種類の呼べる作業場所（`sources[].direct_commit.kinds` に種類があればその glob、無ければ `sources[].direct_commit.scope`）に該当しない'
    notes: 今の作業場所から直コミットできないことと、該当しなかった種類を添える。`scope.write` に該当しても直コミットはできない
  - name: BranchNotAllowedError
    condition: '`commit.branch` が `direct_commit.branch` でなく、`direct_commit.branches[]` にも該当しない'
    notes: 上書きできるブランチの一覧を添える
  - name: CommitWorktreeNotFoundError
    condition: コミットするブランチを指すワークツリーが、配信元の `worktrees[]` に該当するワークツリーの中に無い
    notes: ブランチ名を添える。クローン本体のブランチは切り替えない
  - name: UnpushedCommitsError
    condition: 取り込んだ後のコミットするブランチのワークツリーの HEAD が、リモートの追跡ブランチと違う（プッシュしていないコミットがあるか、早送りで取り込めない）
    notes: ワークツリーのパスと、先行・遅延のコミット数を添える。何も書き込まない
  - name: UncommittedChangesError
    condition: 書き込む文書のファイル・本文のファイル・`generators[]` の生成物のどれかに、コミットしていない変更がある
    notes: 変更のあるファイルのパスを添える。何も書き込まない
  - name: FetchFailedError
    condition: コミットするブランチのリモートからの取得が失敗したか、制約「直コミットの取り込みとプッシュの制限時間」を超えた
    notes: git の標準エラーの末尾を添える。何も書き込まない
  - name: PushRejectedError
    condition: やり直した後のプッシュもリモートに断られたか、やり直しの置き換えの前に書き込みの期限を過ぎていた
    notes: リモートが返した理由を添える。この呼び出しが書き込んだファイルと生成物とコミットを戻した後に返却する
  - name: PushFailedError
    condition: プッシュが通信の失敗か、制約「直コミットの取り込みとプッシュの制限時間」を超えて終わった
    notes: git の標準エラーの末尾を添える。この呼び出しが書き込んだファイルと生成物とコミットを戻した後に返却する
constraints:
  - item: 件数
    constraint: 1 回の `operations` は最大 50 件
  - item: 書き込みの方式
    constraint: 一時ファイルに書いてから置き換える
  - item: 変更していない項目の書き出し
    constraint: 変更していない項目は、コメント・順序・字下げ・引用符の種類（単一引用符・二重引用符・引用符なし）を元のまま書き出す
    notes: 改行を含む引用符なしの文字列だけをブロックのリテラル（`|-`）で書く
  - item: 検査
    constraint: 全ての操作を当ててから 1 回だけスキーマと `validators[]` に通し、通った文書の点検するキーの値を mdmark の点検に通す
  - item: Markdown のキー
    constraint: '種類のスキーマで `contentMediaType: text/markdown` を持つ文字列のキー。`$ref` の先・`properties`・`items` をたどり、配列の要素の中のキーも含める'
    notes: '`contentMediaType` を持つキーが無い種類は、mdmark の CLI を呼ばない'
  - item: 点検するキーの値
    constraint: Markdown のキーのうち、操作を当てる前の文書と値が違うキーの値（`create` は値を持つ全ての Markdown のキー）。値が文字列でないキーは点検しない
    notes: 変えていないキーの既存の警告では書き込みを止めない
  - item: mdmark の点検の呼び出し
    constraint: '`PATH` の `mdmark` を、点検する値ごとに `check --text -` で起動し、値を標準入力に渡す。制限時間は端末の設定の `script_timeout_sec`'
    notes: 起動するフォルダは書き込む配信元の作業ツリーの直下（`mdmark.config.yaml` があればその設定で点検する）
  - item: mdmark の点検の結果
    constraint: '終了コード 0 はずれ無し。終了コード 1 で最後の行が `ずれ {件数} 件` のときは、`-:{行}: {種類}: {内容}` の行のうち種類が `diagram_invalid`・`syntax_warning`（描画時の書き方の警告）の行ごとに、パスをキーのパス、決まりを `mdmark の {種類}（{行} 行目）`、直し方を内容にした違反にする。ほかの種類の行（`unknown_mark`・`diagram_` で始まる配置のずれ・`missing_file`）では書き込みを止めない。それ以外（CLI が見つからない・制限時間を超えた・最後の行が `ずれ {件数} 件` でない）は点検できなかったとして `results[].unchecked` に理由を入れ、書き込みは止めない'
    notes: 1 回の呼び出しの中で CLI が見つからなかった・制限時間を超えた後は、残りの値の点検も同じ理由で飛ばす
  - item: commit
    constraint: '`commit` を省いた呼び出しでは、project-index は commit しない。`commit` を指定した呼び出しは制約「直コミットの流れ」'
  - item: 注釈
    constraint: '`readOnlyHint: false`・`destructiveHint: false`'
  - item: ツールの説明
    constraint: 「範囲のファイルを作成・削除・改名したら、管理用の YAML の行を修正する」を含める
    notes: D-163。索引へ反映するフックを置かないため
  - item: 共通のキー名
    constraint: '`data`・`set`・`add_to`・`remove_from` のキーと、`unset`・`text_edits[].field` の項目のパスの先頭のキーが、種類の行の `metadata` に書いた共通のキーなら、対応する列名（入れ子は `.` でつないだパス）へ読み替えてから当てる。列名をそのまま渡したキーと、`metadata` に書いていないキーは読み替えない'
    notes: 共通のキーと列名を同じ操作に両方渡すと `InvalidArgumentError`
  - item: オブジェクトの配列のタグの書き戻し
    constraint: '行の `metadata` が `tags: tags[].name` のとき、`add_to: {tags: [x]}` は `{name: x}` の要素を末尾に追加し、`remove_from: {tags: [x]}` は `name` が `x` の要素を削除する。`set: {tags: [...]}` は渡した名前の並びで配列を置き換え、元からあった名前の要素は `main` を含む他のキーを保つ。`main_tags`（`tags[main].name`）は要素の `main` を書き換える。`set: {main_tags: [...]}` は渡した名前の要素の `main` を `true`、それ以外の要素の `main` を削除する。`add_to: {main_tags: [...]}` は渡した名前の要素に `main: true` を付け、`remove_from: {main_tags: [...]}` は渡した名前の要素の `main` を削除する。`unset: [main_tags]` は全ての要素の `main` を削除する'
    notes: '`main_tags` の `set`・`add_to` に `tags` に無い名前を渡したときは `InvalidArgumentError` を返す。`remove_from` に無い名前を渡したときは何もしない。`tags`・`main_tags` の `data`・`set`・`add_to`・`remove_from` に名前（文字列）の配列でない値（オブジェクトの配列。`data`・`set` は文字列 1 つも）を渡したときは、配列へ書き戻さず `InvalidArgumentError` を返す'
  - item: 違反へ添えるスキーマの説明
    constraint: 'スキーマの違反（`validators[]` の違反・引数の誤りは除く）ごとに、違反した項目に当たるスキーマの定義から `title`・`description`・`x-rules`・`examples`・`x-bad-examples` のうちスキーマが持つキーだけを `schema` に入れる。`required` の違反は無かったキーの `properties` の定義、それ以外は違反した値に当てた定義（`$ref` を解いた後）から取る。どのキーも持たない項目は `schema` のキーを出さない'
    notes: 'スキーマの全文は返さない。同じ応答で同じ定義を指す違反が続くときも、違反ごとに添える'
  - item: 当てるスキーマ
    constraint: '`documents[].schema` でほかの配信元を指す種類は、参照したリビジョンのスキーマで検査する（読み方は配信元の検査の制約「ほかの配信元のスキーマの参照」）'
  - item: スキーマの参照の解決
    constraint: '種類のスキーマの `$ref` は、最上位の `$defs` の中の相対パスの `$ref` を含めて、スキーマのファイルのフォルダを基準に解決してから検査に当てる。種類のスキーマの中で循環する参照は `#/$defs/...` のまま、参照先の別のファイルの中で循環する参照はそのファイルの定義を指したまま検査に当てる'
  - item: 解決できないスキーマの参照
    constraint: '種類のスキーマの `$ref` を解決できない文書への操作は、解決できなかった `$ref` とスキーマのファイルのパスを決まりにした違反として、`atomic: true` は `ValidationFailedError`、`atomic: false` は `results[].status` の `failed` で返す'
  - item: 書き込みの期限
    constraint: 書き込みの期限は、要求を受けた時刻に端末の設定の `write_deadline_sec`（既定は [非機能要件](id:NFR-1) の書き込みの期限）を足した時刻。`validators[]` のスクリプトと mdmark の点検の制限時間は、`script_timeout_sec` と期限までの残りの時間の短い方にする。残りの時間が無いとき、残りの時間でスクリプトを止めたとき、作業ツリーのファイルを置き換える前に期限を過ぎていたときは、何も書き込まずに `WriteDeadlineExceededError` を返却する。置き換えを始めた後は、期限を過ぎても全てのファイルを書き込み終える
    notes: '`script_timeout_sec` で止めたスクリプトは、違反（`ValidationFailedError`）にする'
  - item: 書き込み後の生成の制限時間
    constraint: '`generators[]` のスクリプトの制限時間は、`script_timeout_sec` と、[非機能要件](id:NFR-1) の文書の MCP の応答の上限までの残りの時間の短い方にする。残りの時間が無ければ生成を実行せず、実行しなかった生成をサーバーのログに残す'
    notes: 生成の失敗と同じく、書き込みの結果は変えない
  - item: 想定外の例外
    constraint: '`ProjectIndexError` でない例外は、`UnexpectedError` として例外の型と内容を `isError: true` の応答にする。`Error executing tool` だけの応答にしない'
  - item: ワークツリーの読み込みの待ち
    constraint: '[文書の検索](id:IF-2) の制約「ワークツリーの読み込みの待ち」と同じ。終了しなければ何も書き込まずに `WorktreeLoadingError` を返却する'
    notes: 共通の処理のため、結合テストは文書の検索が持つ
  - item: 本文のファイル
    constraint: '`records`・`body_file` の行の文書の本文は `@body` で受ける。`create` は `body_file` の列の値（管理用の YAML のフォルダからの相対）に本文のファイルを作成し、`set` の `@body` は全体を、`text_edits` の `field: @body` は一部を置き換える。`replace` は `data` に `@body` があれば置き換え、無ければ本文のファイルを変えない。本文のファイルを持つ要素の `body_file` の列の値を変える `update`・`replace`（`unset` で列を外す `update` と、列を含まない `data` の `replace` を含む）は受けない。本文のファイルを外す操作は持たない。本文のファイルを持たない要素は制約「本文のファイルを持たない要素」'
    notes: '`@body` は種類の列名と重ならない。`body_file` の列の名前が `body` の配信元でも、`body` は列を指す'
  - item: 本文のファイルの検査
    constraint: 本文のファイルの内容は、スキーマ・`validators[]`・mdmark の点検に通さない。パスを読み込みと同じく管理用の YAML のフォルダから解き、配信元の外を指すときと、`create` で既にあるファイルを指すときは `body_file` の列の違反にする
  - item: 本文のファイルの書き込み
    constraint: 要素の YAML と本文のファイルは、全ての検査に通ってからそれぞれ一時ファイルに書いて置き換える。書き込みの期限は置き換える前に確認し、始めた後は両方を書き終える
  - item: 本文のファイルを持つ文書のバージョン
    constraint: 要素の値と本文のファイルの内容の両方から求める（読み取りの `version` も同じ値）。本文のファイルだけを書き換えてもバージョンが変わる
    notes: 今は要素の値だけから求めているため、`records`・`body_file` の行の文書の `version` はこの変更で 1 度だけ変わる
  - item: disk の配信元
    constraint: '端末の設定の行が `storage.type: disk` の配信元は、作業場所が `scope.write` に当たれば登録したフォルダへ書き、`TargetIsCloneError` にしない。Git 管理外の配信元と同じく、制約「日時の付与」で `created`・`updated` を付ける。`worktree` を指定すると `InvalidArgumentError`'
  - item: 参照の型の項目のパス
    constraint: '`text_edits[].field` が `#` で始まるとき、`#` の後を種類のスキーマ（`$ref` を解決した後）と文書でたどり、位置で指す項目のパスに解決してから既存の取得・書き込みで置き換える。配列の項目の `[{値}]` はスキーマの `x-key` のキーがその値の最初の要素、`[{値}#{順番}]` は同じ値の要素のその順番の要素（同じ値の要素が無く、末尾が `#{整数}` のときだけ）、辞書の項目の `[{キー}]` はそのキー（`.` や空白を含んでも 1 階層）を指す。`[...]` の中の `[` と `]` は対応を数え、対応の取れた `[` `]` は値の一部として読む（`#request[operations[].fields].description` は `x-key` の値が `operations[].fields` の要素）。対応の取れない `[` `]` を含むパスは記載方法の誤り。`[]` の外の `.` で区切った名前は辞書のキー。共通のキーの列名への読み替えはしない。`text_edits[].field`・`add_to`・`remove_from` のキーと `unset` の要素だけが受け付け、`set` と `metadata` の列名・`search_docs`・`list_changes` の項目のパスの読み方は変えない'
    notes: 書き方は設計書の参照の型（`{ID}#{項目のパス}`）の `#` から後と同じ。`#` で始まらない既存の `[{キー}]`（キーが真の要素）とは `#` の有無で分ける
  - item: add_to・remove_from の項目のパス
    constraint: '`add_to`・`remove_from` のキーが `#` で始まるとき、「参照の型の項目のパス」と同じ読み方で文書の中の 1 つの配列へ解決し、その配列へ追加・削除する。解決できないパス（無い要素・`x-key` の無い配列・無いキー）と、解決した値が配列でないパスは `add_to.{パス}`・`remove_from.{パス}` の違反にする。`#` で始まらないキーに要素の選び方（`[...]`・`**.`）を含めると、書き込まずに同じ違反にする'
    notes: '`#` で始まらない要素の選び方を含まないキーは今までどおりで、項目が無ければ `add_to` は空の配列を作り、`remove_from` は何もしない。`#` で始まるキーは配列を作らない。共通のキーの列名への読み替えは `#` で始まるキーにはしない'
  - item: 改名後のパス
    constraint: '`new_path` を省いた `rename` は、ファイル名の最初の `.` より前が旧 ID と一致する 1 ファイル 1 文書だけ、同じフォルダでその部分を `new_id` にしたパスへ移す（`IF-6.yaml` → `IF-9.yaml`、`MOD-1.py.yaml` → `MOD-2.py.yaml`）。一致しない文書と `records` の要素の文書はパスを変えない'
    notes: '`new_id` を省いた `rename` は ID を変えない。ID がパスの文書は、`new_path` で ID も変わる'
  - item: 改名の書き込み
    constraint: 1 ファイル 1 文書は、改名後のパスに YAML を作成して改名前のファイルを削除する。`records`・`body_file` の行の文書は、管理用の YAML の要素の `body_file` の列を管理用の YAML のフォルダからの相対で書き換え、本文のファイルを移す。移すファイルの内容は変えない
    notes: どちらも、全ての検査に合格してから一時ファイルを経由して置き換える。project-index は `git mv` しない
  - item: 改名の参照元
    constraint: "同じ配信元の全ての文書から、次の箇所を書き換える。(1) 種類の行の `metadata.related` の列の、`source` を持たず `to` が旧 ID の行の `to`。(2) 文字列の値の全体が `{旧 ID}#{項目のパス}` の値の ID の部分。(3) 文字列の値の中の `id:{旧 ID}` のうち、直後が `#`・`)`・`\"`・`'`・空白・文字列の末尾のものの ID の部分（Markdown のリンク・mermaid の `click` の `href`）。(4) パスが変わるとき、文字列の値の全体と Markdown のリンクの先のうち、その文書のファイルのフォルダから解くと改名前のパスになる値を、同じフォルダから改名後のパスを指す相対の値（`index.yaml` の `page: IF-6.yaml` など）。(5) `records`・`body_file` の行の文書の、拡張子が `.md` の本文のファイルの、(3) の `id:{旧 ID}` と、本文のファイルのフォルダから解くと改名前のパスになる Markdown のリンクの先。本文のファイルの箇所は `references[].path` を `@body` にする"
    notes: 拡張子が `.md` でない本文のファイル（コード・スキーマ・画像など）は読まず、書き換えない。本文のファイルの中のリンクでない文と、改名した文書自身の本文のファイルと、ほかの配信元からの参照は書き換えない。同じ本文のファイルを複数の要素が指すときは、管理用の YAML で先に並ぶ要素の文書の行で 1 回だけ書き換える。本文のファイルは検査と mdmark の点検に通さない（制約の「本文のファイルの検査」）。書き換えた参照元の文書も検査と mdmark の点検に合格させる
  - item: 一括置換の対象
    constraint: '`filter` に該当する文書の、文字列の値（配列の要素・辞書の値の配下を含む）の `old` を全て `new` にする。`records`・`body_file` の行の文書のうち本文のファイルの拡張子が `.md` の文書は、本文のファイルの `old` も全て `new` にし、件数をその文書の `count` に含める。`fields` を指定したときは、`@body` を含むときだけ本文のファイルを置換する。辞書のキー・文字列でない値・種類の行の ID の列と `body_file` の列・拡張子が `.md` でない本文のファイルは置換しない'
    notes: '`old` を含まない文書は書き換えず、検査しない。同じ本文のファイルを複数の要素が指すときは、管理用の YAML で先に並ぶ要素の文書で 1 回だけ置換して数える。置換した文書が 1 件も無いときは `results` に行を返却せず正常終了する'
  - item: 一括置換の失敗
    constraint: 置換した文書が 1 件でも検査に合格しなければ、その `replace_text` の操作全体を失敗にする。違反には合格しなかった文書の `id` を添える
    notes: '`atomic: false` でも、同じ操作の合格した文書だけを書き込むことはしない'
  - item: unset の項目のパス
    constraint: '`unset` の要素が `#` で始まるとき、「参照の型の項目のパス」と同じ読み方で文書の中の 1 つの項目へ解決し、その項目を削除する。解決できないパス（無い要素・`x-key` の無い配列・無い順番・無いキー）は `unset.{パス}` の違反にする。`#` で始まらない要素に要素の選び方（`[...]`・`**.`）を含めると、書き込まずに同じ違反にする'
    notes: '`#` で始まらず要素の選び方を含まない要素は今までどおりで、項目が無ければ何もしない。解決した項目は配列でなくても削除する。共通のキーの列名への読み替えは `#` で始まる要素にはしない'
  - item: remove_from の x-key を持つ配列
    constraint: '`remove_from` のキーを解決した配列のスキーマ（`$ref` を解決した後）が `x-key` を持つとき、オブジェクトでない値は `x-key` のキーの値がその値と等しい要素を、オブジェクトの値はその値と等しい要素を削除する。等しい要素が複数あれば全て削除する。削除する要素が 1 つも無い値は `remove_from.{キー}` の違反にし、書き込まない。削除する要素が有るかは、`remove_from` を当てる前の配列で値ごとに判定する（同じ要素を指す値を 2 つ渡しても違反にしない）'
    notes: '`x-key` を持たない配列は今までどおり渡した値と等しい要素を削除し、該当しない値は何もしない。制約「オブジェクトの配列のタグの書き戻し」の共通のキー（`tags`・`main_tags`）の読み方と、`#` で始まらないキーの項目が無いときに何もしない扱いは変えない'
  - item: 1 つの操作の中の適用順
    constraint: '`update` の 1 つの操作は、`set` → `unset` → `remove_from` → `add_to` → `text_edits` の順に当てる。同じ配列の要素を `remove_from` と `add_to` に渡すと、削除してから追加する'
    notes: '`x-key` を持たない配列で同じ値を `remove_from` と `add_to` の両方に渡したときは、今までの「削除される」から「追加した要素が残る」に変わる'
  - item: add_to の x-key を持つ配列
    constraint: '`add_to` のキーを解決した配列のスキーマ（`$ref` を解決した後）が `x-key` を持つときも、指定した要素を既にある要素の `x-key` の値と照合せずに末尾へ追加する。既にある要素と同じ `x-key` の値の要素も違反にせず追加し、同じ値の要素が複数になる（2 つ目以降は参照の型の項目のパスの `[{値}#{順番}]` で指す）'
    notes: 要素を置き換えるときは、1 つの `update` の `remove_from` に置き換える要素の `x-key` の値を、`add_to` に置き換えた後の要素を指定する（制約「1 つの操作の中の適用順」で削除してから追加するので、置き換えた要素は配列の末尾に移る）。`x-key` の値で指すと同じ値の要素を全て削除するので、同じ値の要素のうち 1 つだけを置き換えるときは、`remove_from` に置き換える要素のオブジェクトを指定する。配列全体を置き換えるときは `set` を使用する
  - item: text_edits の field の違反の修正方法
    constraint: '`text_edits[{n}].field` の違反（項目のパスを解決できない・指した項目が文字列でない）の `fix` は、通る配列が全て `x-key` を持つときは `#` で始めて `x-key` の値で指す（`#functions[save].process`）こと、`x-key` を持たない配列を 1 つでも通るときは `#` を付けずに全ての配列を位置で指す（`flows[35].expected[2]`）こと、配列・オブジェクトそのものは `text_edits` ではなく `set`・`add_to`・`remove_from` で書き換えることを案内する。違反になる条件と `rule`・`path` は変えない'
    notes: '`set`・`unset`・`add_to`・`remove_from` と `search_docs` の項目のパスの違反には付けない'
  - item: 日時の付与
    constraint: 'Git 管理外の配信元と `storage.type: disk` の配信元では、書き換える文書（`create`・`update`・`replace`・`rename` の対象と、改名の参照元・`replace_text` で書き換える文書）に `created`・`updated` を付けてから検査する。付けるかは、操作の対象でなく書き換える文書の種類の `documents[].write_dates`（省くと `true`）で決める。`false` の種類の文書には付けず、既にある `created`・`updated` の値も書き換えない'
    notes: Git の配信元では `write_dates` に関わらず付けない
  - item: 本文のファイルを持たない要素
    constraint: '`records`・`body_file` の行で `body_file` の列が無いか値が `null`・空の文字列の要素は、`body_file` を持たない `records` の行の文書と同じく要素だけを書き換える。`create` は `data` に `body_file` の列と `@body` のどちらも無ければ要素だけを追加し、`@body` だけがあれば `body_file` の列の違反、`body_file` の列だけがあれば `@body` の違反にする。`update`・`replace` は `body_file` の列の値と `@body` を同時に指定したときだけ本文のファイルを作成し（「本文のファイルの検査」の `create` と同じ検査）、`@body` だけは `body_file` の列の違反、`body_file` の列の値だけは `@body` の違反にする。`text_edits` の `field: @body` は、本文のファイルが無いことを決まりにした `text_edits[{n}].field` の違反にする。`rename` は `new_id` だけを受け、`new_path` は引数の誤りにする。どの操作も本文のファイルを削除・移動しない'
  - item: 直コミットの権限
    constraint: '`commit` を指定した呼び出しは、`scope.write` で判定しない。変更を適用した後に書き換わる文書（`rename` の参照元・`replace_text` で置換した文書を含む）の種類ごとに、端末の設定の `sources[].direct_commit.kinds` にその種類があればその glob、無ければ `sources[].direct_commit.scope` に `cwd` が該当することを確認する'
    notes: 既定は空で、どの作業場所からも呼べない。該当しなければ `DirectCommitNotPermittedError`
  - item: 直コミットを許可する種類
    constraint: 書き換わる文書の種類が全て配信元の設定の `direct_commit.kinds[]` にあるときだけ進める。無い種類の文書は、`operations` の添字と文書の ID を付け、決まりを「種類 {kind} は直コミットを許可していない」にした違反として `ValidationFailedError` で返却する
    notes: 改名・一括の置換で参照元の他の種類の文書が書き換わる場合も同じ
  - item: 直コミットの書き込む先
    constraint: コミットするブランチ（`commit.branch`、省くと `direct_commit.branch`）を HEAD が指すワークツリーのうち、配信元の `worktrees[]` に該当するものに書き込む。種類・配置先・検査は、そのワークツリーの `project-index.yaml` で再読み込みした配信元の設定で行う
    notes: 該当するワークツリーが無ければ `CommitWorktreeNotFoundError`
  - item: 直コミットの流れ
    constraint: 制約「直コミットの排他」の中で、(1) リモートの追跡ブランチを取得して早送りで取り込む、(2) HEAD が追跡ブランチと同じこと・書き込むファイルと生成物にコミットしていない変更が無いことを確認する、(3) 操作を適用して検査（今の書き込みと同じ検査・直コミットを許可する種類・秘密の値）を実行する、(4) ファイルを書き込み `generators[]` を実行する、(5) 操作が書き込んだファイルと生成物だけを `git add` してコミットする、(6) プッシュする、の順に進める
    notes: ワークツリーにある他の変更（コミットしていない変更・追跡していないファイル）はコミットに含めず、そのまま残す。コミットの作成者と認証は、索引のサーバーを動かしている利用者の Git の設定
  - item: 直コミットの排他
    constraint: 取得からプッシュまでを、リポジトリ（`git rev-parse --git-common-dir` が同じ配信元）ごとの 1 つの排他で囲む。同じリポジトリの配信元への `commit` を省いた書き込み・削除も、同じ排他を待つ
    notes: 排他の待ちは書き込みの期限に含め、置き換えの前に期限を過ぎたら `WriteDeadlineExceededError`
  - item: 秘密の値の検査
    constraint: 書き込む文書の差分の追加の行（本文のファイルを含む）を、project-index が持つ正規表現の規則で照合する。規則の種類は `github-token`・`aws-access-key`・`slack-token`・`openai-api-key`・`anthropic-api-key`・`private-key`・`email-address`。該当すれば、添字・項目のパス・決まり「秘密の値（{種類}）を含む」の違反として `ValidationFailedError` で返却し、値そのものは返却しない
    notes: 検査を抜けるマーカー（行の注釈）は持たない。規則は gitleaks の既定の規則集（MIT）から移し、著作権表示を移したファイルに残す。規則ごとに、該当しない 1 MB の入力を書き込みの期限の内に照合し終えることを単体テストで確認する
  - item: 直コミットのプッシュの再試行
    constraint: プッシュがリモートに断られたら、作ったコミットを取り消し、この呼び出しが書き込んだファイルと生成物を書き込み前の内容に戻してから、取得から 1 回だけやり直す。2 回目も断られたら同じく戻して `PushRejectedError` を返却する
    notes: やり直しでも `expected_version` を確認する。やり直しの置き換えの前に書き込みの期限を過ぎていたら、やり直さずに `PushRejectedError`
  - item: 直コミットの取り込みとプッシュの制限時間
    constraint: 取得は書き込みの期限までの残りの時間、プッシュは [非機能要件](id:NFR-1) の文書の MCP の応答の上限までの残りの時間から、直コミットの取り込みとプッシュの所要時間の余裕（8 秒）を除いた時間で止める
    notes: 止めたプッシュは、リモートの追跡ブランチを取得し直してコミットの SHA と一致すれば成功、違えば `PushFailedError` として戻す
  - item: 直コミットの試しの書き込み
    constraint: '`commit` と `dry_run: true` を同時に指定したときは、取得・コミット・プッシュをせず、権限・ブランチ・ワークツリー・検査（秘密の値を含む）の結果と差分だけを返却する'
    notes: リモートと通信しない
