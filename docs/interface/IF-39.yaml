id: IF-39
title: 配信元の設定の原本の取得
lead: 書き込みの API で書き換える前の配信元の設定（`project-index.yaml`）の内容とバージョンを返却する読み取り API の入出力を定め、配信元の設定の原本の取得を修正するときに参照する。
visibility: internal
entry:
  kind: endpoint
  value: GET `/sources/{source}/config/file`
identifier: get_source_config_file
permissions: 端末の設定の `sources[].direct_commit.write_api_config` と配信元の設定の `direct_commit.config` が両方とも `true` の配信元だけ（`127.0.0.1` でだけ待ち受ける）
idempotent: true
read_only: true
side_effects: なし
callers:
  - SC-17#scenarios[正常シナリオ（配信元の設定を書き換える）]
  - SC-17#scenarios[異常シナリオ（書き換えた後の配信元の設定が検証に合格しない）]
  - SC-17#scenarios[異常シナリオ（書き換えられないキーを書き換える）]
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
    status: planned
request_example: |-
  ```text
  GET /sources/sample/config/file
  ```
response:
  - name: content
    type: str
    description: コミットするブランチのワークツリーの `project-index.yaml` の内容の全体（端末の設定を重ねる前のファイルのまま。コメントと書き方もそのまま）
  - name: version
    type: str
    description: '`content` のバージョン。[画面のサーバーからの直コミットの書き込み](id:IF-38) の `sourceConfig.expectedVersion` に指定する'
  - name: branch
    type: str
    description: 内容を参照したコミットするブランチ（配信元の設定の `direct_commit.branch`）
  - name: protectedKeys
    type: list[str]
    description: 書き込みの API が書き換えを断るトップレベルのキー（`validators`・`converters`・`generators`・`direct_commit`・`worktrees`）
    notes: 画面がこれらのキーを編集できない表示にするために使用する
response_example: |-
  ```json
  {"content": "version: \"3\"\nname: sample\n...", "version": "a1b2c3", "branch": "develop", "protectedKeys": ["validators", "converters", "generators", "direct_commit", "worktrees"]}
  ```
status_codes:
  - code: '200'
    condition: 返却した
  - code: '403'
    condition: 端末の設定の `write_api_config` か配信元の設定の `direct_commit.config` が `true` でない（`SourceConfigNotPermittedError`）
    notes: '`nextSteps` で許可を記載するキーを示す'
  - code: '404'
    condition: 配信元が無い・配信していない（`UnknownSourceError`・`SourceNotServedError`）
  - code: '409'
    condition: 端末の設定の `config` が配信元のフォルダの `project-index.yaml` 1 つでない（`SourceConfigSplitError`）、直コミットを使用できない配信元（`DirectCommitNotConfiguredError`）、コミットするブランチのワークツリーが無い（`CommitWorktreeNotFoundError`）
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）
constraints:
  - item: 参照するファイル
    constraint: 配信元の設定の `direct_commit.branch` を指すワークツリーの、配信元のフォルダからの相対パスが `project-index.yaml` のファイルをそのまま返却する。リモートからの取得はしない（取得の後に変わっていれば、書き込みの API が `VersionMismatchError` で断る）
  - item: 許可
    constraint: '[画面のサーバーからの直コミットの書き込み](id:IF-38) の制約「配信元の設定の直コミットの権限」「配信元の設定のファイル」と同じ判定で断る。`content` はコマンドを持つキーを含むため、配信元の設定の直コミットを許可した配信元だけに返却する'
  - item: バージョン
    constraint: '`content` のバイト列から、文書のバージョンと同じ求め方（内容のハッシュの短縮）で求める'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: NFR-1#requirements[通信]
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase
flows:
  - name: 正常系
    summary: 重ねる前の `project-index.yaml` の内容とバージョンを返却する
    setup:
      - name: Mock
        description: なし（一時フォルダに git の配信元と端末の設定を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: 配信元
        description: '`develop` を指すワークツリーを持つ git の配信元 sample。配信元の設定はコメントを含み、`direct_commit` に `branch: develop`・`config: true`'
        notes: '端末の設定の sample の行は `config` が sample の `project-index.yaml` 1 つで、`direct_commit.write_api_config: true`'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config/file
        participant WT as develop のワークツリー

        C->>E: GET /sources/sample/config/file
        E->>E: write_api_config と direct_commit.config を確認する
        E->>WT: project-index.yaml を参照する
        E-->>C: 200 content, version, branch, protectedKeys
      ```

      <!-- /map -->
    expected:
      - 200 で、`content` が develop のワークツリーの `project-index.yaml` とバイト列で一致し（コメントを含む）、`branch` が `develop`
      - 同じ内容で 2 回呼ぶと同じ `version` を返却し、ファイルを書き換えると `version` が変わる
      - '`protectedKeys` が `validators`・`converters`・`generators`・`direct_commit`・`worktrees`'
    test: test_normal
  - name: 異常系（配信元の設定の直コミットを許可していない・403）
    summary: 配信元の設定の直コミットを許可していない配信元には内容を返却しない
    setup:
      - name: Mock
        description: なし（正常系と同じ）
      - name: 配信元
        description: 正常系と同じ sample
        notes: 端末の設定の sample の行に `write_api_config` が無い
    flow: |-
      <!-- map: {"title": "異常系（配信元の設定の直コミットを許可していない・403）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config/file

        C->>E: GET /sources/sample/config/file
        E->>E: 端末の設定の write_api_config が true でない
        E-->>C: 403 SourceConfigNotPermittedError
      ```

      <!-- /map -->
    expected:
      - 403 で、`nextSteps` に許可を記載するキー `sources[].direct_commit.write_api_config` があり、`content` を返却しない
    test: test_error_when_not_allowed
  - name: 異常系（配信元の設定を複数のファイルに分けている・409）
    summary: 端末の設定の `config` が `project-index.yaml` 1 つでない配信元は断る
    setup:
      - name: Mock
        description: なし（正常系と同じ）
      - name: 配信元
        description: 正常系と同じ sample
        notes: 端末の設定の sample の行の `config` は、sample の `project-index.yaml` と一時フォルダの重ねる YAML の 2 つ
    flow: |-
      <!-- map: {"title": "異常系（配信元の設定を複数のファイルに分けている・409）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config/file

        C->>E: GET /sources/sample/config/file
        E->>E: 端末の設定の config が 2 つのファイルを指す
        E-->>C: 409 SourceConfigSplitError
      ```

      <!-- /map -->
    expected:
      - 409 で、`files` に端末の設定の `config` のパスの並びがある
    test: test_error_when_split
  - name: 異常系（無い配信元・404）
    summary: 無い配信元・配信していない配信元を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/sources/unknown/config/file`'
    flow: |-
      <!-- map: {"title": "異常系（無い配信元・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config/file

        C->>E: GET /sources/unknown/config/file
        E-->>C: 404 problem+json
      ```

      <!-- /map -->
    expected:
      - 404 で、`missing` が `source`
    test: test_error_when_source_not_found
test_file: tests/integration/server/test_get_source_config_file.py
tags:
  - name: topic:設定
    main: true
  - name: topic:配信元
  - name: topic:api
  - name: action:読み取り
