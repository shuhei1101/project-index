id: IF-28
title: "語での検索"
entry:
  kind: endpoint
  value: GET `/sources/{source}/search`
flows:
  - name: 正常系
    summary: 語を含む文書だけを一致した箇所つきで返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 文書 2 の本文だけが含む語を持つ sample
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/search
        participant ST as 配信元の文書

        C->>E: q: 文書 2 だけが含む語
        E-->>ST: 文書を読む
        E-->>C: 200 文書 2 と一致した箇所
      ```

      <!-- /map -->
    expected:
      - '`totalCount` が 1 で、`items` が文書 2 だけ'
      - '`snippets` に語を含む行があり、`matchCount` が文書 2 の本文で語を含む行の数（1）'
      - '`items[0].path` を `path` に渡した文書の取得が文書 2 を返す'
      - '`items[0].id` が文書 2 の文書の ID、`items[0].filePath` が文書 2 のファイルのパス'
      - '`items[0].filePath` を `path` に、`items[0].id` を `id` に渡した文書の取得が文書 2 を返す'
    test: test_normal
  - name: 異常系（語の誤り・400）
    summary: 空の語と長すぎる語を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`q` が空と、201 文字'
    flow: |-
      <!-- map: {"title": "異常系（語の誤り・400）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/search

        C->>E: q: 空
        E-->>C: 400 problem+json（q の違反）
      ```

      <!-- /map -->
    expected:
      - どちらも 400 で、`errors[0].path` が `q`、`reason` に空か長すぎることがある
    test: test_error_when_query_invalid
  - name: 異常系（無い配信元・リビジョン・404）
    summary: 無い配信元・解決できないリビジョンを断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/sources/unknown/search?q=a` と `/sources/sample/search?q=a&ref=no-such-branch`'
    flow: |-
      <!-- map: {"title": "異常系（無い配信元・リビジョン・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/search

        C->>E: source: unknown
        E-->>C: 404 problem+json（無い配信元）
      ```

      <!-- /map -->
    expected:
      - '`unknown` が 404 で、`detail` に無いのが配信元であることがある'
      - '`no-such-branch` が 404 で、`detail` に解決できなかったリビジョンがある'
    test: test_error_when_not_found
  - name: 異常系（リビジョンの書き出しが上限を超える・504）
    summary: 指したリビジョンの書き出しが上限を超えたとき、止めた処理と理由を返す
    setup:
      - name: Mock
        description: git の実行を、`archive` の引数が親の commit のときだけ待ち時間の上限を超えたときと同じ失敗（`GitError` の `timed_out`）を返すものに差し替える
      - name: サンプルの配信元
        description: 親の commit を持つ git リポジトリの sample
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/search

        C->>E: GET /sources/sample/search?q=語&ref={親の commit}
        E->>E: 親の commit の書き出しが上限を超えて止まる
        E-->>C: 504 problem+json
      ```
    expected:
      - 504 で、`title` が `RevisionExportTimeoutError`、`operation` が `revision_export`、`commit` が親の commit、`limitSec` が `git archive` の待ち時間の上限
      - '`detail` に、止めた処理がリビジョンの書き出しであることと上限の秒数がある'
    test: test_error_when_revision_export_times_out
  - name: 正常系（既定の検索から除く文書）
    summary: '行の `search_exclude` に該当する文書を既定の結果から除き、`include_excluded=true` のときだけ `excluded: true` を付けて返却する'
    setup:
      - name: Mock
        description: なし
      - name: 文書
        description: 'sample の `assets/` に `a1.yaml`（id `a1`・`state: active`）・`a2.yaml`（id `a2`・`state: inactive`）。どちらの本文も単語 `夕焼け` を含む'
      - name: 文書の行
        description: '行 `assets`（`paths: [assets/*.yaml]`・`metadata: {status: state}`・`search_exclude: {field: status, op: eq, values: [inactive]}`）'
      - name: 入力
        description: 1 回目は `q=夕焼け`、2 回目は `q=夕焼け&include_excluded=true`
    flow: |-
      <!-- map: {"title": "正常系（既定の検索から除く文書）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/search

        C->>E: q: 夕焼け
        E-->>C: 200 a1・excludedCount 1
        C->>E: q: 夕焼け, include_excluded: true
        E-->>C: 200 a1・a2（excluded）
      ```

      <!-- /map -->
    expected:
      - '1 回目が `totalCount: 1` で `items` が `a1` だけ、`excludedCount` が 1'
      - '2 回目が `totalCount: 2` で `items` が `a1` と `a2`、`a1` と `a2` が `matchCount` を持ち、`a2` だけが `excluded: true` を持ち、`excludedCount` を持たない'
    test: test_normal_when_search_excluded
    refs:
      - to: SC-11
        item: scenarios[正常シナリオ（既定の検索から除く条件に該当する文書を参照する）]
        type: references
        when: このインターフェースのフローを変えるときに、シナリオの対応する流れと期待値を確認する。
lead: 単語を含む文書と一致した箇所を返却する読み取り API の入出力を定め、画面の検索を修正するときに参照する。
tags:
  - name: topic:クエリ
    main: true
  - name: action:検索
  - name: topic:api
identifier: search_page
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: q
    type: str
    required: true
    location: query
    description: 検索する語。空白で区切った語を全て含む文書に当たる
    constraints: 1〜200 文字
    notes: 大文字小文字と全角半角（NFKC）を区別しない
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`）
    location: query
    description: 検索するリビジョン
  - name: limit
    type: int
    required: false
    default: '`20`'
    location: query
    description: 返す件数
    constraints: 1〜100
  - name: include_excluded
    type: bool
    required: false
    default: '`false`'
    location: query
    description: '`true` のとき、配信元の設定の `documents[].search_exclude` に該当する文書も返却する'
    status: planned
request_example: |-
  ```text
  GET /sources/sample/search?q=%E3%83%9A%E3%83%BC%E3%82%B8%E3%83%B3%E3%82%B0
  ```
response:
  - name: totalCount
    type: int
    description: 一致した文書の総件数
  - name: items[].path
    type: str
    description: 文書のパス（文書の取得の `path` に渡す形）
  - name: items[].id
    type: str
    description: 文書の ID（文書の取得の `id` に渡す形）
  - name: items[].filePath
    type: str
    description: 文書のファイルのパス（文書の一覧の `documents[].path` と同じ形。`id` と組で文書の取得の `path` に渡す）
  - name: items[].name
    type: str
    description: 文書の名前
  - name: items[].snippets
    type: list[str]
    description: 一致した行と前後の文字
    constraints: 文書ごとに 3 件まで
  - name: excludedCount
    type: int
    description: 単語を含む文書のうち、`documents[].search_exclude` に該当して除いた文書の件数
    notes: '`include_excluded` が `false` で 1 件以上除いたときだけ持つ'
  - name: items[].excluded
    type: bool
    description: '`documents[].search_exclude` に該当する文書か'
    notes: '`include_excluded` が `true` で、該当する文書だけ `true` を持つ'
  - name: items[].matchCount
    type: int
    description: 文書の本文のうち、`snippets` と同じ判定（空白で区切った語のどれかを含む行）に該当した行の数
    notes: '`snippets` の上限に関わらず本文の全ての行を数える。同じ行が複数の語を含んでも 1。語の照合が本文以外の項目だけで該当した文書は `0`。`include_excluded` の値に関わらず全ての `items` が持つ'
response_example: |-
  ```json
  {"totalCount": 1, "items": [
    {"path": "docs/doc-2", "id": "doc-2", "filePath": "docs/doc-2.yaml", "name": "文書 2", "snippets": ["…一覧のページングは…"], "matchCount": 1}
  ]}
  ```
status_codes:
  - code: '200'
    condition: 検索した（一致が 0 件のときも 200）
  - code: '400'
    condition: '`q` が空か 200 文字を超える'
  - code: '404'
    condition: 配信元が無い・配信していない、または `ref` を解決できない
  - code: '504'
    condition: リビジョンの書き出し（`git archive`）が待ち時間の上限を超えて止まった
    notes: '`title` が `RevisionExportTimeoutError`。`operation`（`revision_export`）・`commit`・`limitSec`'
error_format: RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）。拡張メンバーは camelCase（`nextSteps`・`errors[]`）。検証の違反は `errors[]` に `{path, reason}` で並べる
constraints:
  - item: 件数
    constraint: '`limit` は最大 100'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  - item: タイムアウト
    constraint: 制限なし
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名は変えない
  - item: operationId
    constraint: '`{tag}-{関数名}` の `view-search_page`'
  - item: SQLite の表の行
    constraint: '`documents[].sqlite` を持つ行の文書も、`columns[]` の列の値を本文として検索の対象にする。`ref` によらず今の `sqlite.file` の行を引く'
  - item: 既定の検索から除く文書
    constraint: '`include_excluded` が `false` のとき、単語を含む文書のうち文書の行の `search_exclude` に該当する文書を `items`・`totalCount` から除き、除いた件数を `excludedCount` にする。条件の照合は `search_docs` の既定の検索から除く判定と同じ関数で行う'
test_file: tests/integration/server/test_search_page.py
visibility: internal
