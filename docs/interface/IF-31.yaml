id: IF-31
title: "端末の設定の保存"
entry:
  kind: endpoint
  value: PUT `/settings/sources`
flows:
  - name: 正常系
    summary: 配信元を追加して保存し、再起動せずに配信する
    setup:
      - name: Mock
        description: なし（一時フォルダに端末の設定と配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: 端末の設定
        description: '`sources` に sample の 1 行。別のキーとコメントを持つ'
      - name: 追加する配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ git リポジトリ
        notes: id `extra`
      - name: 入力
        description: '`Origin` を持たない要求で、sample と extra の 2 行'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample, extra
        E->>E: オリジンを確かめ、保存後の端末の設定をスキーマで検証する
        E->>CF: settings.yaml の sources を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200 配信元ごとの状態
      ```

      <!-- /map -->
    expected:
      - 200 で、sample と extra が `serving`
      - '`settings.yaml` の `sources` に extra の行があり、sample の行・他のキー・コメントは変わらない'
      - 文字列で送った extra の `config` が、`settings.yaml` では要素 1 つの配列で書かれる
      - 再起動せずに `/sources/extra/docs` が 200 を返し、`describe()` に extra が出る
      - '`version` が書き換えた後の `settings.yaml` の内容のバージョンで、`GET /settings/sources` の `version` と同じ'
    test: test_normal
  - name: 正常系（配信を止める）
    summary: '`enabled: false` で保存し、配信を止める'
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
      - name: 入力
        description: 'extra の行を `enabled: false` にした 2 行'
    flow: |-
      <!-- map: {"title": "正常系（配信を止める）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample, extra（enabled: false）
        E->>CF: settings.yaml を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200（extra は disabled）
      ```

      <!-- /map -->
    expected:
      - extra が `disabled`
      - '`settings.yaml` の extra の行の `enabled` が `false`'
      - '`/sources/extra/docs` が 404、`/sources/sample/docs` が 200 を返す'
    test: test_normal_when_source_disabled
  - name: 正常系（配信元を削除する）
    summary: 行を除いて保存し、配信元のフォルダは残す
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
      - name: 入力
        description: sample の 1 行だけ
    flow: |-
      <!-- map: {"title": "正常系（配信元を削除する）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample
        E->>CF: settings.yaml から extra の行を除く
        E->>E: 配信元を再読み込みする
        E-->>C: 200（sample だけ）
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` の `sources` に extra の行が無く、sample の行は変わらない'
      - extra のフォルダのファイルは変わらない
      - '`/sources/extra/docs` が 404 を返す'
    test: test_normal_when_source_deleted
  - name: 正常系（追加した配信元が検証に通らない）
    summary: 端末の設定は保存し、再読み込みの検証で配信元を外す
    setup:
      - name: Mock
        description: なし
      - name: 検証に失敗する配信元
        description: '`documents[0]` に必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: 入力
        description: sample と broken の 2 行
    flow: |-
      <!-- map: {"title": "正常系（追加した配信元が検証に通らない）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample, broken
        E->>CF: settings.yaml を書き換える
        E->>E: 再読み込みし、起動時と同じ検証で broken を外す
        E-->>C: 200（broken は not_served）
      ```

      <!-- /map -->
    expected:
      - 200 で、broken が `not_served`、`errors` に `documents[0].paths` がある
      - '`settings.yaml` の `sources` に broken の行がある'
      - '`/sources/broken/docs` が 404、`/sources/sample/docs` が 200 を返す'
    test: test_normal_when_added_source_invalid
  - name: 正常系（端末の設定の最上位に知らないキーがある）
    summary: 最上位の知らないキーを違反にせずに保存し、ファイルの値とコメントを残して警告で返却する
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample の 1 行。最上位に知らないキー `mindstella`（入れ子の値とコメントを持つ）を持つ'
      - name: 入力
        description: '`Origin` を持たない要求で、sample の 1 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample
        E->>E: 保存後の端末の設定をスキーマで検証する（mindstella は違反にしない）
        E->>CF: settings.yaml の sources を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200 配信元ごとの状態と警告
      ```
    expected:
      - 200 で、sample が `serving`
      - '`warnings` に `path` が `mindstella` の 1 件がある'
      - '`settings.yaml` の `mindstella` の値とコメントが保存の前と変わらない'
    test: test_normal_when_unknown_top_level_key_kept
    decisions:
      - D-308
  - name: 異常系（別のオリジン・403）
    summary: ブラウザからの別のオリジンの保存を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`Origin: http://127.0.0.1:9999` で、スキーマに通る `sources`'
    flow: |-
      <!-- map: {"title": "異常系（別のオリジン・403）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources

        C->>E: Origin: 別のオリジン
        E-->>C: 403
      ```

      <!-- /map -->
    expected:
      - 403 を返す
      - '`settings.yaml` が変わらず、`/sources/sample/docs` は 200 を返す'
      - '`Origin` が無く `Sec-Fetch-Site: cross-site` の要求も 403'
      - '`expectedVersion` を持たない要求も、400 ではなく 403 を返す'
    test: test_error_when_cross_origin
  - name: 異常系（スキーマに通らない・422）
    summary: スキーマに通らない保存を断り、違反を全て返す
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: 2 行目の `id` が `Sample Docs`、`scope.read` が空の文字列を含む
    flow: |-
      <!-- map: {"title": "異常系（スキーマに通らない・422）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources

        C->>E: expectedVersion, sources: sample, 違反を含む行
        E->>E: 内容のバージョンを照合し、スキーマで検証して失敗する
        E-->>C: 422 problem+json（違反したキーと理由）
      ```

      <!-- /map -->
    expected:
      - 422 で、`errors` に `sources[1].id` と `sources[1].scope.read` がそれぞれの理由つきである
      - '`settings.yaml` が変わらず、`/sources/sample/docs` は 200 を返す'
    test: test_error_when_schema_invalid
  - name: 正常系（送信しなかったキーを残す）
    summary: 行に含めなかったキーを、ファイルの同じ配信元の行の今の値で残す
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
        notes: 'extra の行に `outside_read: false` と `scope.write`'
      - name: 入力
        description: 'sample の行を `enabled: false` にした 2 行。どちらの行にも `outside_read` と `scope.write` を含めない'
    flow: |-
      <!-- map: {"title": "正常系（送信しなかったキーを残す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample（enabled: false）, extra
        E->>CF: 同じ配信元の行の今の値で送信しなかったキーを埋めて settings.yaml を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200（sample は disabled）
      ```

      <!-- /map -->
    expected:
      - 200 で、sample が `disabled`、extra が `serving`
      - '`settings.yaml` の sample の行の `enabled` が `false`'
      - '`settings.yaml` の extra の行に `outside_read: false` と元の `scope.write` が残る'
    test: test_normal_when_unsent_keys_kept
  - name: 正常系（送信したキーを優先する）
    summary: 行に含めたキーは、ファイルの同じ配信元の行の値より送信した値で記載する
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
        notes: 'extra の行に `outside_read: false`'
      - name: 入力
        description: 'extra の行に `outside_read: true` を含めた 2 行'
    flow: |-
      <!-- map: {"title": "正常系（送信したキーを優先する）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample, extra（outside_read: true）
        E->>CF: 送信した値で settings.yaml を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` の extra の行に `outside_read` が無い'
      - '`GET /settings/sources` が返す extra の行の `outsideRead` が `true`'
    test: test_normal_when_sent_keys_override
  - name: 正常系（内容のバージョンが一致する）
    summary: 取得した内容のバージョンを添えた保存を受ける
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra の 2 行'
      - name: 入力
        description: '`GET /settings/sources` で取得した `version` を `expectedVersion` にし、sample の 1 行だけ'
    flow: |-
      <!-- map: {"title": "正常系（内容のバージョンが一致する）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample
        E-->>CF: 今の内容のバージョンを求めて照合する
        E->>CF: settings.yaml の sources を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200（新しい version）
      ```

      <!-- /map -->
    expected:
      - 200 で、`version` が `expectedVersion` と違う値
      - '`settings.yaml` の `sources` が sample の行だけ'
    test: test_normal_when_version_matched
  - name: 異常系（内容のバージョンが古い・409）
    summary: 取得した後に書き換えられた端末の設定への保存を断る
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample の 1 行'
      - name: ほかの書き換え
        description: 取得の後に `POST /settings/sources` で extra の行を追加する
      - name: 入力
        description: 最初に取得した `version` を `expectedVersion` にし、sample の 1 行だけ
    flow: |-
      <!-- map: {"title": "異常系（内容のバージョンが古い・409）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: 古い expectedVersion, sources: sample
        E-->>CF: 今の内容のバージョンを求めて照合する
        E-->>C: 409 problem+json（current）
      ```

      <!-- /map -->
    expected:
      - 409 で、`current` が extra を追加した後の内容のバージョン
      - '`settings.yaml` に extra の行が残り、`/sources/extra/docs` が 200 を返却する'
    test: test_error_when_version_outdated
  - name: 異常系（内容のバージョンが無い・400）
    summary: 内容のバージョンを添えない保存を断る
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample の 1 行'
      - name: 入力
        description: '`expectedVersion` を持たない、sample と extra の 2 行'
    flow: |-
      <!-- map: {"title": "異常系（内容のバージョンが無い・400）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources

        C->>E: sources: sample, extra（expectedVersion なし）
        E-->>C: 400 problem+json（errors に expectedVersion）
      ```

      <!-- /map -->
    expected:
      - 400 で、`errors[]` に `expectedVersion` のパスと理由がある
      - '`settings.yaml` が変わらず、`/sources/extra/docs` が 404 を返す'
    test: test_error_when_version_missing
  - name: 正常系（送信しなかった読み書きの方法を残す）
    summary: 行に含めなかった `storage` を、ファイルの同じ配信元の行の今の値で残す
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と company（`storage.type: disk`）の 2 行'
      - name: 入力
        description: '`GET /settings/sources` で取得した `version` を `expectedVersion` にし、sample の行を `enabled: false` にした 2 行。どちらの行にも `storage` を含めない'
    flow: |-
      <!-- map: {"title": "正常系（送信しなかった読み書きの方法を残す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample（enabled: false）, company
        E->>CF: 同じ配信元の行の今の値で storage を埋めて settings.yaml を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200（company は serving）
      ```

      <!-- /map -->
    expected:
      - 200 で、company が `serving`
      - '`settings.yaml` の company の行に `storage.type: disk` が残る'
      - '再読み込みした後も `/sources/company/refs` が `git: false` を返す'
    test: test_normal_when_unsent_storage_kept
  - name: 正常系（送信しなかった直コミットの作業場所を残す）
    summary: 行に含めなかった `direct_commit` を、ファイルの同じ配信元の行の今の値で残す
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources` に sample と extra（`direct_commit.scope` と `direct_commit.kinds.note`）の 2 行'
      - name: 入力
        description: '`GET /settings/sources` で取得した `version` を `expectedVersion` にし、sample の行を `enabled: false` にした 2 行。sample の行には `direct_commit` を含めず、extra の行には `direct_commit.scope` だけを別の glob で含める'
    flow: |-
      <!-- map: {"title": "正常系（送信しなかった直コミットの作業場所を残す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /settings/sources
        participant CF as 端末の設定

        C->>E: expectedVersion, sources: sample（enabled: false）, extra（direct_commit.scope だけ）
        E->>CF: 同じ配信元の行の今の値で送信しなかった direct_commit.kinds を埋めて settings.yaml を書き換える
        E->>E: 配信元を再読み込みする
        E-->>C: 200（sample は disabled）
      ```

      <!-- /map -->
    expected:
      - 200 で、sample が `disabled`、extra が `serving`
      - '`settings.yaml` の extra の行の `direct_commit.scope` が送信した glob になり、`direct_commit.kinds.note` は元の値が残る'
      - '`settings.yaml` の sample の行に `direct_commit` が記載されない'
    test: test_normal_when_unsent_direct_commit_kept
lead: '`sources[]` を丸ごと受けて端末の設定を書き換え、配信元を再読み込みする端末の設定の API の入出力を定め、端末の設定の保存を修正するときに参照する。'
tags:
  - name: topic:設定
    main: true
  - name: topic:端末
  - name: topic:api
  - name: action:保存
identifier: put_settings_sources
permissions: '`Origin` を持たない要求（サーバーの側からの呼び出し）か、project-index と同じオリジンからの要求だけ'
idempotent: true
side_effects: '`PROJECT_INDEX_CONFIG` が指す `settings.yaml` の `sources` を書き換え、配信元を再読み込みする。配信元のフォルダのファイルは変えない'
exclusivity: 端末の設定の排他ロックの中で、内容のバージョンの照合・検証・書き込み・再読み込みを行う。再読み込みの間の要求は、再読み込みする前の配信元で応える。再読み込みした配信元の裏の検査はロックの外で実行する
request:
  - name: sources
    type: list[Source]
    required: true
    location: body
    description: 保存する `sources[]` の全行。削除した行は含めない
  - name: sources[].id
    type: str
    required: false
    default: 配信元の設定の `name`
    location: body
    description: 配信元の ID
    constraints: 英小文字・数字・`-` だけ。行の間で重複しない
  - name: sources[].config
    type: str | list[str]
    required: true
    location: body
    description: 配信元の設定の YAML の絶対パス。文字列でも、`settings.yaml` には要素の数によらず配列で書く
  - name: sources[].enabled
    type: bool
    required: false
    default: 'ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ `true`）'
    location: body
    description: 配信するか
  - name: sources[].scope.read
    type: list[str]
    required: false
    default: 'ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ `[]`）'
    location: body
    description: この配信元を参照できる作業場所の glob
    constraints: 空の文字列を含めない
  - name: sources[].scope.write
    type: list[str]
    required: false
    default: ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ配信元のフォルダだけ）
    location: body
    description: この配信元を参照と書き込みができる作業場所の glob
  - name: Origin
    type: str
    required: false
    default: なし（サーバーの側からの呼び出し）
    location: header
    description: 要求元のオリジン
  - name: sources[].outside_read
    type: bool
    required: false
    default: 'ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ `true`）'
    location: body
    description: '`scope` に当たらない作業場所からも `outside_scope: true` で作業範囲の外（参考）として参照できるか'
    notes: '`false` の配信元は `scope` の外から一切読めない'
  - name: sources[].storage.type
    type: Literal['git', 'disk']
    required: false
    default: ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ書かない）
    location: body
    description: 配信元の読み書きの方法
  - name: expectedVersion
    type: str
    required: true
    location: body
    description: 取得したときの端末の設定の内容のバージョン。今の内容のバージョンと違えば書き換えない
  - name: sources[].direct_commit.scope
    type: list[str]
    required: false
    default: ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ `[]`）
    location: body
    description: 直コミットを許可した全ての種類の直コミットを呼べる作業場所の glob
  - name: sources[].direct_commit.kinds
    type: dict[str, list[str]]
    required: false
    default: ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ `{}`）
    location: body
    description: 種類の ID → その種類の直コミットを呼べる作業場所の glob
  - name: sources[].direct_commit.write_api_kinds
    type: list[str]
    required: false
    default: ファイルの同じ配信元の行の今の値（同じ配信元の行が無ければ `[]`）
    location: body
    description: 書き込みの API から直コミットできる種類の ID の並び
request_example: |-
  ```json
  {"expectedVersion": "a1b2c3", "sources": [
    {"id": "sample", "config": "/path/to/sample/project-index.yaml", "scope": {"read": ["/path/to/sample/**"]}},
    {"id": "extra", "config": "/path/to/extra/project-index.yaml", "scope": {"read": ["/path/to/extra/**"]}}
  ]}
  ```
response:
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled']
    description: 再読み込みした後の状態
  - name: sources[].errors
    type: 'list[{path: str, reason: str}]'
    description: 検証で除外した理由
    notes: '`not_served` のときだけ'
  - name: version
    type: str
    description: 書き換えた後の端末の設定の内容のバージョン
  - name: warnings[].path
    type: str
    description: 端末の設定の最上位の知らないキーのパス
    notes: 知らないキーが無いときは `warnings` が空の配列
  - name: warnings[].reason
    type: str
    description: project-index が知らないキーで、値を使わずにファイルに残すこと
response_example: |-
  ```json
  {"sources": [
    {"id": "sample", "status": "serving"},
    {"id": "extra", "status": "serving"}
  ],
  "warnings": []}
  ```
response_notes: 配信元の設定が検証に通らない配信元も、端末の設定がスキーマに通れば保存し、`not_served` として返す。
status_codes:
  - code: '200'
    condition: 保存して配信元を再読み込みした（再読み込みで外した配信元があっても 200）
  - code: '403'
    condition: project-index と別のオリジンの `Origin` を持つ要求か、`Origin` が無く `Sec-Fetch-Site` が `cross-site`・`same-site` の要求
  - code: '422'
    condition: 保存後の端末の設定がスキーマに通らない（`storage.type` が `git`・`disk` 以外を含む。最上位の知らないキーは違反にしない）
    notes: '`errors[]` に違反したキーのパスと理由を全て並べる'
  - code: '409'
    condition: '`expectedVersion` が今の端末の設定の内容のバージョンと違う'
    notes: problem+json の拡張メンバー `current` に今の内容のバージョンを入れる
  - code: '400'
    condition: '`expectedVersion` が無い'
    notes: 要求の型の検証の失敗。起動の『例外の変換の登録』が `InvalidArgumentError` の problem+json にし、`errors[]` にキーのパスと理由を並べる
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`・`current`）。検証の違反は `errors[]` に `{path, reason}` で並べる（`path` は `sources[1].id` の形）
constraints:
  - item: オリジンの確認
    constraint: '`Origin` と `Sec-Fetch-Site` をどちらも持たない要求（dev-docs の画面のサーバーなど、サーバーの側からの呼び出し）と、`Origin` が project-index のオリジンと同じ要求だけを受ける'
    notes: 'ブラウザが別のオリジンから送る書き込みを断るため。dev-docs の画面のサーバーはブラウザの要求を受けてからサーバーの側で呼ぶため、`Origin` を持たない'
  - item: 書き込みの範囲
    constraint: '`settings.yaml` の `sources` だけを書き換え、他のキーとコメントを保つ。一時ファイルに書いてから置き換える'
  - item: 端末の設定の知らないキー
    constraint: 起動の制約「端末の設定の知らないキー」と同じ。最上位の知らないキーを `warnings[]` で返却し、違反にしない
  - item: 再読み込みの検証
    constraint: 起動時と同じ検証（スキーマ・スクリプトを実行できるか）
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  - item: タイムアウト
    constraint: 制限なし
  - item: JSON のキー
    constraint: リクエストの本文とレスポンスのキーは camelCase
  - item: operationId
    constraint: '`{tag}-{関数名}` の `settings-put_settings_sources`'
  - item: 送信しなかったキー
    constraint: 送信した行ごとに、ファイルの同じ配信元の行（`id`、無ければ配信元の設定の `name` で照合する）を探し、行に含めなかった `enabled`・`scope.read`・`scope.write`・`outside_read`・`storage`・`direct_commit.scope`・`direct_commit.kinds`・`direct_commit.write_api_kinds` をその行の今の値で埋めてから記載する。`direct_commit` は、既定値（`scope` の `[]`・`kinds` の `{}`・`write_api_kinds` の `[]`）でないキーだけを記載し、全て既定値の行には `direct_commit` を記載しない。同じ配信元の行が無い行は既定値で記載する
    notes: 取得した行の一部のキーだけを送信する呼び出し側でも、送信しなかったキーが既定値に戻らない
  - item: 内容のバージョンの照合
    constraint: '排他ロックを取った後に `settings.yaml` の内容のバージョンと照合し、スキーマの検証より前に断る。フローの `expectedVersion` は、直前に `GET /settings/sources` で取得した `version`'
  - item: 検査とリビジョンの書き出し
    constraint: 応答は配信元の一覧を差し替えた時点で返し、再読み込みした配信元の検査と `default_ref` の commit の書き出しは裏で実行して待たない。応答の配信元ごとの状態は検査の前の値（`sync` は `null`）
    notes: 管理の MCP の `reload` と同じ。検査が済んだかは管理の MCP の `status` の `checking` で確かめる
  - item: 衝突したときのスクリプト
    constraint: 送信した行に `direct_commit.on_conflict` があれば、`sources[{番号}].direct_commit.on_conflict` を送信できないキーとして 422 で断り、ファイルを書き換えない。書き換えるときは、ファイルの同じ配信元の行の `direct_commit.on_conflict` をそのまま残す
