id: IF-7
title: "文書の削除"
entry:
  kind: mcp_tool
  value: '`delete_docs`'
flows:
  - name: 正常系
    summary: 参照されていない文書をワークツリーから消す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリをテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件。どちらも `related` を持たない）と `project-index.yaml` を持つ git リポジトリと、そのワークツリー（`.claude/worktrees/x`）
        notes: id `sample`
      - name: 入力
        description: '`worktree` にワークツリー x、`targets` に文書 2 と読んだときの `version`'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー x

        C->>T: targets: 文書 2
        T->>T: 排他ロックを取り、バージョンと参照を確かめる
        T->>WT: 文書 2 のファイルを削除する
        T-->>C: deleted
      ```

      <!-- /map -->
    expected:
      - '`applied: true` で、文書 2 の `status` が `deleted`'
      - ワークツリー x の文書 2 のファイルが無く、クローン本体の文書 2 は残る
      - 次の `search_docs` がワークツリー x の文書 2 を返さない
    test: test_normal
  - name: 正常系（参照も外して消す）
    summary: '`on_referenced: unlink` で参照元の `related` から外して消す'
    setup:
      - name: Mock
        description: なし
      - name: 参照されている文書
        description: ワークツリー x の文書 2。文書 1 の `related` が文書 2 を指す
      - name: 入力
        description: '`targets` に文書 2、`on_referenced: unlink`'
    flow: |-
      <!-- map: {"title": "正常系（参照も外して消す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー x

        C->>T: targets: 文書 2, on_referenced: unlink
        T->>T: 文書 1 の related から文書 2 を外した文書を検査に通す
        T->>WT: 文書 1 を書き換え、文書 2 のファイルを削除する
        T-->>C: deleted と参照を外した文書
      ```

      <!-- /map -->
    expected:
      - ワークツリー x の文書 2 のファイルが無い
      - 文書 1 の `related` に文書 2 が無い
      - '`unlinked` が文書 1 の `id` と新しい `version` を返す'
    test: test_normal_when_unlink
  - name: 正常系（試しに消す）
    summary: '`dry_run: true` で消した場合の結果だけを返す'
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '正常系（参照も外して消す）と同じ引数と `dry_run: true`'
    flow: |-
      <!-- map: {"title": "正常系（試しに消す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: targets: 文書 2, on_referenced: unlink, dry_run: true
        T->>T: 本番と同じ確認
        T-->>C: applied: false、消す文書と参照を外す文書
      ```

      <!-- /map -->
    expected:
      - '`applied` が `false` で、`results` と `unlinked` を返す'
      - ワークツリー x のファイルは変わらない
    test: test_normal_when_dry_run
  - name: 異常系（参照されている・DocumentReferencedError）
    summary: '参照されている文書を `on_referenced: fail` で消すと断る'
    setup:
      - name: Mock
        description: なし
      - name: 参照されている文書
        description: 正常系（参照も外して消す）と同じ
      - name: 入力
        description: '`targets` に文書 2。`on_referenced` は既定'
    flow: |-
      <!-- map: {"title": "異常系（参照されている・DocumentReferencedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: targets: 文書 2
        T->>T: 文書 1 の related が文書 2 を指している
        T-->>C: isError（参照元の id と on_referenced: unlink）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、参照元の文書 1 の `id` と `on_referenced: unlink` で消せることを返す'
      - 文書 2 のファイルも文書 1 も変わらない
    test: test_error_when_referenced
  - name: 異常系（読んだ後に変わった・VersionMismatchError）
    summary: 読んだ後に直接編集された文書を消さない
    setup:
      - name: Mock
        description: なし
      - name: 直接編集
        description: 文書 2 を読んで `version` を持った後、ワークツリー x の文書 2 の YAML をテストが書き換える
    flow: |-
      <!-- map: {"title": "異常系（読んだ後に変わった・VersionMismatchError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: targets: 文書 2・読んだときの expected_version
        T->>T: 今のバージョンと違う
        T-->>C: isError（今のバージョン）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、今のバージョンを返す'
      - 文書 2 のファイルが残る
    test: test_error_when_version_mismatch
  - name: 異常系（書き込めない配信元・SourceNotWritableError）
    summary: '`scope.write` に当たらない作業場所からの削除を断る'
    setup:
      - name: Mock
        description: なし
      - name: 読み取りだけの配信元
        description: '`scope.write` を持たない Git 管理外の配信元'
        notes: id `notes`
    flow: |-
      <!-- map: {"title": "異常系（書き込めない配信元・SourceNotWritableError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: source: notes, targets: notes の文書
        T-->>C: isError（notes は読み取りだけ、使える配信元の一覧）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、notes に書き込めないことと使える配信元の一覧を返す'
      - notes のファイルが残る
      - 組み込みの配信元 `project-index` を `source` に渡した削除も同じエラーを返却し、クローンのファイルが残る
    test: test_error_when_source_not_writable
  - name: 異常系（消す先がクローン本体・TargetIsCloneError）
    summary: Git の配信元のクローン本体からは消さない
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`cwd` は sample のクローン本体で、`worktree` を渡さない'
    flow: |-
      <!-- map: {"title": "異常系（消す先がクローン本体・TargetIsCloneError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: targets: 文書 2
        T-->>C: isError（クローン本体からは消さない、worktree を指すこと）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、クローン本体からは消さないことと `worktree` を指すことを返す'
      - クローン本体の文書 2 が残る
    test: test_error_when_target_is_clone
  - name: 異常系（削除を許していない種類・DeleteNotAllowedError）
    summary: Git 管理外の配信元で `writable` が削除を許さない種類の文書を消さない
    setup:
      - name: Mock
        description: なし
      - name: 書ける配信元
        description: Git 管理外の配信元で、種類の `documents[].writable` が `false`
        notes: id `memo`。`scope.write` は sample のフォルダ
    flow: |-
      <!-- map: {"title": "異常系（削除を許していない種類・DeleteNotAllowedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: source: memo, targets: memo の文書
        T->>T: 種類の writable が削除を許していない
        T-->>C: isError（削除を許していない種類と documents[].writable のパス）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、種類の id と `documents[].writable` が削除を許していないことを返す'
      - memo のファイルが残る
    test: test_error_when_delete_not_allowed
  - name: 異常系（無い文書・DocumentNotFoundError）
    summary: 無い `id` の削除を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`targets` に `doc-9`'
    flow: |-
      <!-- map: {"title": "異常系（無い文書・DocumentNotFoundError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: targets: doc-9
        T-->>C: isError（見つからない ID と近い ID の候補）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、`doc-9` と近い ID の候補を返す'
    test: test_error_when_document_not_found
  - name: 正常系（参照を外した文書の引用符を保つ）
    summary: '`on_referenced: unlink` で書き換えた参照元の文書の、変更していない項目の引用符の種類を元のまま書き出す'
    setup:
      - name: Mock
        description: なし
      - name: 引用符を持つ参照元
        description: 'ワークツリー x の文書 1 が、単一引用符の値（`description: ''2020-12''`）と、`: ` を含む二重引用符の値（`name: "A: b"`）を持ち、`related` が文書 2 を指す'
      - name: 入力
        description: '`targets` に文書 2、`on_referenced: unlink`'
    flow: |-
      <!-- map: {"title": "正常系（参照を外した文書の引用符を保つ）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー x

        C->>T: targets: 文書 2, on_referenced: unlink
        T->>T: 引用符の種類を保って文書 1 を読み、related から文書 2 を外す
        T->>WT: 文書 1 を書き換え、文書 2 のファイルを削除する
        T-->>C: deleted と参照を外した文書
      ```

      <!-- /map -->
    expected:
      - '文書 1 の YAML の、`related` の文書 2 の行以外の行が書き込み前の文字列と一致し、`description: ''2020-12''` と `name: "A: b"` が残る'
    test: test_normal_when_unlink_quotes_preserved
  - name: 正常系（本文のファイルを持つ文書を消す）
    summary: '`records`・`body_file` の行の文書を、要素と本文のファイルごと削除する'
    setup:
      - name: Mock
        description: なし
      - name: 本文のファイルを持つ行
        description: '行 `notes`（`paths: [notes/index.yaml]`・`records: items`・`body_file: path`）。要素 n1・n2・n3 の `path` が `n1.md`・`n2.md`・`n1.md`'
        notes: n3 は n1 と同じ本文のファイルを指す
      - name: 入力
        description: 1 回目は n2、2 回目は n3 を削除する
    flow: |-
      <!-- map: {"title": "正常系（本文のファイルを持つ文書を消す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー

        C->>T: targets: n2
        T->>WT: notes/index.yaml から n2 を除き、notes/n2.md を削除する
        T-->>C: deleted
        C->>T: targets: n3
        T->>WT: notes/index.yaml から n3 を除き、n1 が指す notes/n1.md は残す
        T-->>C: deleted
      ```

      <!-- /map -->
    expected:
      - 1 回目の後、`notes/index.yaml` に n2 が無く、`notes/n2.md` が無い
      - 2 回目の後、`notes/index.yaml` が n1 だけになり、`notes/n1.md` は変わらない
      - 削除した後の `check_project` の `unindexed_files` に `notes/n2.md` が出ない
    test: test_normal_when_body_file
  - name: 異常系（disk の配信元で削除を許していない種類・DeleteNotAllowedError）
    summary: disk の配信元で `writable` が削除を許さない種類の文書を消さない
    setup:
      - name: Mock
        description: なし
      - name: ローカル運用の配信元
        description: 'Git のリポジトリの中の `storage.type: disk` の配信元で、種類の `documents[].writable` が `false`'
        notes: id `company`。`cwd` は company のクローン本体で、`scope.write` に当たる
    flow: |-
      <!-- map: {"title": "異常系（disk の配信元で削除を許していない種類・DeleteNotAllowedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: source: company, targets: company の文書
        T->>T: 種類の writable が削除を許していない
        T-->>C: isError（削除を許していない種類と documents[].writable のパス）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、種類の id と `documents[].writable` が削除を許していないことを返す（`TargetIsCloneError` ではない）'
      - company のクローン本体のファイルが残る
    test: test_error_when_disk_storage_delete_not_allowed
  - name: 正常系（入れ子の参照も外して消す）
    summary: '`related: "**.refs[]"` の行で、`on_referenced: unlink` が最上位と入れ子の `refs` の両方から参照を外す'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 入れ子の参照を持つ文書
        description: ワークツリー x の n1 の最上位の `refs` が n2 と n3、`functions[0].refs` が n2 を指す
        notes: '行 `nested` は `metadata: {related: "**.refs[]"}`。`refs` の要素は `to` と `type: references`'
      - name: 入力
        description: '`targets` に n2、`on_referenced: unlink`'
        notes: '-'
    flow: |-
      <!-- map: {"title": "正常系（入れ子の参照も外して消す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー x

        C->>T: targets: n2, on_referenced: unlink
        T->>T: n1 の最上位と入れ子の refs から n2 を外した文書を検査に通す
        T->>WT: n1 を書き換え、n2 のファイルを削除する
        T-->>C: deleted と参照を外した文書
      ```

      <!-- /map -->
    expected:
      - ワークツリー x の n2 のファイルが無い
      - n1 の最上位の `refs` が n3 だけを指し、`functions[0].refs` が n2 を指さない
      - '`unlinked` が n1 の `id` と新しい `version` を返却する'
    test: test_normal_when_unlink_nested_related
  - name: 正常系（本文のファイルを持たない要素を削除する）
    summary: '`records`・`body_file` の行で、`body_file` の列を持たない要素を、管理用の YAML の要素だけを除いて削除する'
    setup:
      - name: Mock
        description: なし
      - name: 本文のファイルを持つ行
        description: 正常系（本文のファイルを持つ文書を消す）と同じ行 `notes`。要素 n1 の `path` が `n1.md` で、要素 n4 は `path` の列を持たない
        notes: 行のスキーマは `path` を必須にしない
      - name: 入力
        description: '`targets: [n4]`'
    flow: |-
      <!-- map: {"title": "正常系（本文のファイルを持たない要素を削除する）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー

        C->>T: targets n4
        T->>WT: notes/index.yaml から n4 の要素を除く（本文のファイルは削除しない）
        T-->>C: deleted
      ```

      <!-- /map -->
    expected:
      - '`notes/index.yaml` から n4 の要素だけが除かれ、n1 の要素は変わらない'
      - '`notes/` のファイル（`notes/n1.md`）は削除されない'
      - 結果の `status` が `deleted`
    test: test_normal_when_body_file_absent
  - name: 正常系（直コミットで文書を消す）
    summary: '`commit` を指定した削除で、develop のワークツリーから文書を消し、削除と生成物の変更だけをコミットしてプッシュする'
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元とテスト用のベアリポジトリを作り、project-index のアプリをテストのクライアントで呼ぶ）
      - name: 直コミットの配信元
        description: '[文書の書き込み](id:IF-6) の正常系（直コミットする）の配信元の `develop` に、種類 `note` の文書 1 をコミット済みのもの'
      - name: 入力
        description: '`cwd` に手元の作業場所、`targets` に文書 1 と読んだときの `version`、`commit: {message: "docs: note を消す"}`'
    flow: |-
      <!-- map: {"title": "正常系（直コミットで文書を消す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs
        participant WT as ワークツリー develop
        participant R as リモート

        C->>T: cwd: 手元の作業場所, commit: message, targets: 文書 1
        T->>T: 直コミットの設定・呼べる作業場所・許可する種類を確認する
        R-->>T: develop を取得する
        T->>WT: 早送りで取り込み、文書 1 のファイルを削除し、generators を実行する
        T->>WT: 削除と生成物の変更だけをコミットする
        T->>R: develop へプッシュする
        T-->>C: deleted、commit（sha・branch・retried）
      ```

      <!-- /map -->
    expected:
      - '`applied: true` で、文書 1 の `status` が `deleted`、`commit.branch` が `develop`'
      - リモートの `develop` に、文書 1 のファイルの削除と生成物の変更だけを含む 1 コミットが増え、SHA が `commit.sha` と一致する
      - develop のワークツリーに文書 1 のファイルが無く、`git status` に変更が出ない
    test: test_normal_when_direct_commit
  - name: 異常系（直コミットを許可していない種類の文書を消す・ValidationFailedError）
    summary: 直コミットを許可していない種類の文書を消す `commit` を断る
    setup:
      - name: Mock
        description: なし
      - name: 直コミットの配信元
        description: 正常系（直コミットで文書を消す）の配信元の `develop` に、種類 `rule` の文書 r1 をコミット済みのもの
      - name: 入力
        description: '`targets` に r1 と `commit`'
    flow: |-
      <!-- map: {"title": "異常系（直コミットを許可していない種類の文書を消す・ValidationFailedError）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as delete_docs

        C->>T: commit: message, targets: r1
        T->>T: 種類 rule が direct_commit.kinds に無い
        T-->>C: isError（添字 0・種類 rule は直コミットを許可していない）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、添字 0 の違反として種類 `rule` は直コミットを許可していないことを返却する'
      - リモートと develop のワークツリーは変わらず、r1 のファイルが残る
    test: test_error_when_direct_commit_kind_not_allowed
lead: 文書を物理削除し、`related` からの参照を拒否するか除外する `delete_docs` の入出力を定め、`delete_docs` を修正するときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: action:削除
  - name: tool:mcp
aliases:
  - 'delete_docs'
identifier: delete_docs
permissions: 対象の配信元の `scope.write` に `cwd` が当たること。Git の配信元はワークツリーだけ。`commit` を指定した呼び出しは、`write_docs` と同じく `scope.write` の代わりに端末の設定の `sources[].direct_commit` に `cwd` が該当すること。Git 管理外の配信元は種類の `documents[].writable` が削除を許すこと
idempotent: false
side_effects: '作業ツリー（Git 管理外の配信元はそのフォルダ）の文書のファイルと、`records`・`body_file` の行の文書の本文のファイルを削除する（本文のファイルを持たない要素は要素だけを除く）。`on_referenced: unlink` のときは参照元の文書の `related` も書き換える。`generators[]` を流す。`commit` を指定した呼び出しは、`write_docs` と同じく、削除したファイル・書き換えた参照元・生成物だけをコミットしてプッシュする。'
callers:
  - SC-7#scenarios[正常シナリオ（参照も外して消す）]
  - SC-7#scenarios[正常シナリオ（変更していない項目の引用符を保つ）]
  - SC-7#scenarios[正常シナリオ（本文のファイルを持つ文書を消す）]
  - SC-7#scenarios[正常シナリオ（本文のファイルを持たない要素を書く）]
  - SC-15#scenarios[正常シナリオ（文書を消す）]
exclusivity: '`write_docs` と同じ配信元ごとの排他ロックの中で行う。`commit` を指定した呼び出しは、`write_docs` と同じリポジトリの単位の排他も取る'
request:
  - name: source
    type: str
    required: false
    default: なし（作業中の配信元）
    location: argument
    description: 配信元の ID
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: 消すワークツリーのパス
    constraints: 配信元の設定の `worktrees` に当たるパスだけ
    notes: 種類・配置先は、そのワークツリーの `project-index.yaml` で再読み込みした配信元の設定で参照する
  - name: targets
    type: 'list[{id: str, expected_version: str}]'
    required: true
    location: argument
    description: 消す文書と、読んだときのバージョン
    constraints: 1〜50 件
  - name: on_referenced
    type: Literal['fail', 'unlink']
    required: false
    default: '`fail`'
    location: argument
    description: 他の文書の `related` から参照されているとき。`unlink` は参照も外す
  - name: atomic
    type: bool
    required: false
    default: '`true`'
    location: argument
    description: '`write_docs` と同じ'
  - name: dry_run
    type: bool
    required: false
    default: '`false`'
    location: argument
    description: '`write_docs` と同じ'
  - name: cwd
    type: str
    required: false
    default: なし（どの `scope.write` にも当たらない）
    location: argument
    description: セッションの作業場所
    notes: PreToolUse のフックがセッションの作業場所で上書きし、エージェントが指定した値は使わない。ツールの入力のスキーマの `description` にも同じことと、ワークツリーは `worktree` で指すことを載せる
  - name: commit
    type: '{message: str, branch: str | None} | None'
    required: false
    default: なし（コミットとプッシュをしない）
    location: argument
    description: '`write_docs` と同じ。削除の後に、コミットするブランチのワークツリーでコミットしてプッシュする'
    constraints: '`atomic: true` のときだけ'
    notes: '`worktree` と同時には受けない'
  - name: commit.message
    type: str
    required: true
    location: argument
    description: '`write_docs` と同じ'
  - name: commit.branch
    type: str | None
    required: false
    default: なし（配信元の設定の `direct_commit.branch`）
    location: argument
    description: '`write_docs` と同じ'
request_example: |-
  ```json
  {
    "worktree": "/path/to/sample/.claude/worktrees/x",
    "targets": [{"id": "doc-2", "expected_version": "c1aa02"}],
    "on_referenced": "unlink"
  }
  ```
response:
  - name: applied
    type: bool
    description: 1 件以上を消したか
    notes: '`dry_run: true` のときは常に `false`'
  - name: results[].index
    type: int
    description: '`targets` の添字'
  - name: results[].id
    type: str
    description: 文書の ID
  - name: results[].status
    type: Literal['deleted', 'failed']
    description: 結果
  - name: results[].errors
    type: 'list[{path: str, rule: str, fix: str}]'
    description: 失敗の理由と直し方
    notes: '`failed` のときだけ'
  - name: unlinked[].id
    type: str
    description: 参照を外した文書の ID
    notes: '`on_referenced: unlink` のときだけ'
  - name: unlinked[].version
    type: str
    description: 参照を外した後のバージョン
  - name: commit.sha
    type: str
    description: '`write_docs` と同じ'
  - name: commit.branch
    type: str
    description: '`write_docs` と同じ'
  - name: commit.retried
    type: bool
    description: '`write_docs` と同じ'
response_example: |-
  ```json
  {"applied": true,
   "results": [{"index": 0, "id": "doc-2", "status": "deleted"}],
   "unlinked": [{"id": "doc-1", "version": "5e8a31"}]}
  ```
response_notes: '`format` によらず JSON を返し、structuredContent と text に同じ JSON を入れる。Git の配信元で消した文書は Git で戻せる。'
exceptions:
  - name: なし（正常終了）
    condition: '全ての文書を消した（`atomic: false` で一部が失敗したときも、失敗分を `failed` として返して正常終了）'
  - name: DocumentReferencedError
    condition: '`on_referenced: fail` で、消す文書が他の文書の `related` から参照されている'
    notes: '参照元の ID と `on_referenced: unlink` を添える'
  - name: VersionMismatchError
    condition: '`expected_version` が今のバージョンと違う'
  - name: SourceNotWritableError
    condition: '`cwd` が配信元の `scope.write` に当たらない'
  - name: TargetIsCloneError
    condition: Git の配信元で、消す先がクローン本体になる
    notes: クローン本体のパス（配信元の設定をワークツリーから読んでいても、ワークツリーの親のクローン本体）と、`worktree` でワークツリーを指すことを添える
  - name: DeleteNotAllowedError
    condition: 'Git 管理外の配信元か `storage.type: disk` の配信元で、種類の `documents[].writable` が削除を許していない'
  - name: DocumentNotFoundError
    condition: '`targets[].id` の文書が無い'
    notes: 見つからなかった ID と近い ID の候補を添える
  - name: WriteDeadlineExceededError
    condition: 作業ツリーのファイルを削除・置き換える前に、要求を受けてから端末の設定の `write_deadline_sec` を過ぎていた
    notes: '`write_docs` と同じ'
  - name: UnexpectedError
    condition: '`ProjectIndexError` でない例外で処理を終了できなかった'
    notes: '`write_docs` と同じ'
  - name: WorktreeLoadingError
    condition: 消す先のワークツリーの初めての読み込みが、端末の設定の `worktree_load_wait_sec` までに終了しなかった
    notes: '`write_docs` と同じ'
  - name: InvalidArgumentError
    condition: '`storage.type: disk` の配信元に `worktree` を渡した・`commit` と `atomic: false` か `worktree` を同時に渡した'
  - name: ValidationFailedError
    condition: '`commit` を指定した呼び出しで、消す文書か参照を外す文書の種類が `direct_commit.kinds[]` に無いか、参照を外した文書が秘密の値の規則に該当する'
    notes: 違反ごとの添字・パス・決まりを添える
  - name: DirectCommitNotConfiguredError
    condition: '`write_docs` と同じ'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: DirectCommitNotPermittedError
    condition: '`write_docs` と同じ'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: BranchNotAllowedError
    condition: '`write_docs` と同じ'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: CommitWorktreeNotFoundError
    condition: '`write_docs` と同じ'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: UnpushedCommitsError
    condition: '`write_docs` と同じ'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: UncommittedChangesError
    condition: '`write_docs` と同じ（消すファイルを含む）'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: FetchFailedError
    condition: '`write_docs` と同じ'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: PushRejectedError
    condition: '`write_docs` と同じ。戻すときは削除したファイルを元に戻す'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - name: PushFailedError
    condition: '`write_docs` と同じ。戻すときは削除したファイルを元に戻す'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
constraints:
  - item: 件数
    constraint: 1 回の `targets` は最大 50 件
  - item: 削除の方式
    constraint: 物理削除。参照を外した文書は `write_docs` と同じ検査に通してから、`write_docs` と同じく変更していない項目の引用符の種類を保って書く
  - item: 注釈
    constraint: '`destructiveHint: true`'
  - item: 配信元・ワークツリーの解決
    constraint: '`write_docs` と同じ（配信していない配信元・当たらないワークツリーのエラーも同じ）'
    notes: 共通の処理で解決するため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - item: 書き込みの期限・生成の制限時間
    constraint: '`write_docs` と同じ。作業ツリーのファイルを削除・置き換える前に期限を確認し、始めた後は全てのファイルを処理し終える'
    notes: 共通の処理のため、結合テストは [文書の書き込み](id:IF-6) が持つ
  - item: 本文のファイル
    constraint: '`records`・`body_file` の行の文書は、管理用の YAML から要素を除き、本文のファイルも削除する。同じ管理用の YAML のほかの要素が同じ本文のファイルを指すときは、本文のファイルを削除しない'
  - item: disk の配信元
    constraint: '端末の設定の行が `storage.type: disk` の配信元は、登録したフォルダから消し、`TargetIsCloneError` にしない。Git 管理外の配信元と同じく、`documents[].writable` が削除を許さない種類は `DeleteNotAllowedError`。`worktree` を指定すると `InvalidArgumentError`'
  - item: 直コミット
    constraint: '`commit` を指定した呼び出しは、[文書の書き込み](id:IF-6) の制約「直コミットの権限」から「直コミットの試しの書き込み」までと同じ。消す文書と参照を外す文書の種類が全て `direct_commit.kinds[]` にあるときだけ進め、削除したファイル・書き換えた参照元・生成物だけをコミットする'
    notes: 共通の処理のため、直コミットの異常系の結合テストは文書の書き込みが持つ
refs:
  - to: SC-7
    item: scenarios[正常シナリオ（参照も外して消す）]
    type: references
    when: このインターフェースの入出力やフローを変えるときに、シナリオ『エージェントが書き込む』の対応する流れと期待値を確認する。
  - to: SC-7
    item: scenarios[異常シナリオ（参照されている文書を消す）]
    type: references
    when: このインターフェースの入出力やフローを変えるときに、シナリオ『エージェントが書き込む』の対応する流れと期待値を確認する。
test_file: tests/integration/server/test_delete_docs.py
visibility: internal
