id: IF-23
title: 配信元の設定の取得
entry:
  kind: endpoint
  value: GET `/sources/{source}/config`
flows:
  - name: 正常系
    summary: 配信元の設定のうち、画面が使うキーを返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: '`nav`・`documents[]`・`decisions.folders`・`github`・`diff` を持つ `project-index.yaml` の sample'
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config

        C->>E: GET /sources/sample/config
        E-->>C: 200 nav・documents・decisions・github・diff
      ```

      <!-- /map -->
    expected:
      - 200 で、`nav`・`documents`・`decisions.folders`・`github` が `project-index.yaml` の値と同じ
      - '`diff.ignore_keys` が `project-index.yaml` の値と同じ。`diff` を書いていない配信元は既定の値（`["updated"]`）'
      - '`schemas` が `null`'
      - 端末の設定の `config` を重ねた配信元は、重ねた後の値を返す
    test: test_normal
  - name: 正常系（解いたスキーマを求める）
    summary: '`schemas` を指したときだけ、`documents[]` の行ごとの `$ref` を解いた種類のスキーマを返す'
    setup:
      - name: Mock
        description: なし
      - name: スキーマの参照を持つ配信元
        description: 同じファイルの `$defs` の定義を `$ref` で指す種類 `design` のスキーマと、`records` の行の種類 `files_guide` を持つ sample
        notes: 種類 `design` のスキーマと種類 `files_guide` のスキーマ（`records` の要素の中）のそれぞれが、`$defs` の中に自分を指す循環する定義 `node` を 1 つ持つ
    flow: |-
      <!-- map: {"title": "正常系（解いたスキーマを求める）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config

        C->>E: GET /sources/sample/config?schemas=true
        E-->>C: 200 nav・documents・decisions・github・diff・schemas
      ```

      <!-- /map -->
    expected:
      - 200 で、`schemas` のキーが `documents[].id`（`design`・`files_guide`）
      - '`schemas.design` は循環しない `$ref` が参照先の定義に置き換わり、循環する定義 `node` の中の `$ref` が残り、最上位の `$defs` を持つ'
      - '`schemas.files_guide` は `records` の要素 1 つのスキーマに、ファイル全体のスキーマの最上位の `$defs` を加えたもので、循環する定義 `node` の中の `$ref` の参照先が `$defs` にあり、文書の取得の `schema` と同じ'
    test: test_normal_when_schemas_requested
  - name: 異常系（無い配信元・404）
    summary: 無い配信元・配信していない配信元を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/sources/unknown/config`'
    flow: |-
      <!-- map: {"title": "異常系（無い配信元・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/config

        C->>E: GET /sources/unknown/config
        E-->>C: 404 problem+json
      ```

      <!-- /map -->
    expected:
      - 404 で、`missing` が `source`、`detail` に配信元 `unknown` がある
      - 配信していない配信元は `missing` が `not_served` で、`errors[]` に外した理由がある
    test: test_error_when_source_not_found
lead: 配信元の設定のうち画面が使用するキーを返却する読み取り API の入出力を定め、配信元の設定の取得を修正するときに参照する。
tags:
  - name: topic:設定
    main: true
  - name: topic:配信元
  - name: topic:api
  - name: action:読み取り
identifier: get_source_config
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - SC-11#scenarios[正常シナリオ]
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: schemas
    type: bool
    required: false
    default: '`false`'
    location: query
    description: '`true` のとき、`schemas` に `documents[]` の行ごとの種類のスキーマを入れる'
request_example: |-
  ```text
  GET /sources/sample/config?schemas=true
  ```
response:
  - name: nav
    type: list[NavTab] | None
    description: 配信元の設定の `nav`（書いていなければ `null`）
  - name: documents
    type: list[DocumentRow]
    description: 配信元の設定の `documents[]`
  - name: decisions.folders
    type: list[str]
    description: 検討事項の文書のフォルダ（書いていなければ空）
  - name: github
    type: GitHubTarget | None
    description: GitHub のリポジトリと起票のラベル
  - name: diff.ignore_keys
    type: list[str]
    description: 配信元の設定の `diff.ignore_keys`（差分で無視するキー。書いていなければ既定の値 `["updated"]`）
  - name: schemas
    type: dict[str, dict] | None
    description: '`documents[].id` ごとの種類のスキーマ（`$ref` を解いた形で、文書の取得の `schema` と同じ。`records` の行は要素 1 つのスキーマに、ファイル全体のスキーマの最上位の `$defs` を加えたもの）'
    notes: '`schemas` が `true` のときだけ入れ、それ以外は `null`。解けない `$ref` と、種類のスキーマの中で循環する `$ref` はそのまま残し、最上位の `$defs` を残す。参照先の別のファイルの中で循環する定義は最上位の `$defs` に加え、`$ref` をその定義へ向ける'
response_example: |-
  ```json
  {"nav": [{"title": "設計書", "items": [{"auto": {"document": "design"}}]}],
   "documents": [{"id": "design", "title": "設計書", "paths": ["design/*.yaml"], "schema": "schemas/design.schema.yaml"}],
   "decisions": {"folders": ["/path/to/talks"]},
   "github": {"repository": "owner/sample", "issueLabels": ["docs"]},
   "diff": {"ignore_keys": ["updated"]},
   "schemas": {"design": {"type": "object", "required": ["id", "title"], "$defs": {}}}}
  ```
status_codes:
  - code: '200'
    condition: 返した
  - code: '404'
    condition: 配信元が無い・配信していない
    notes: '`missing`（`source`・`not_served`）と値、配信していない配信元は `errors[]` に外した理由'
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）
constraints:
  - item: 返すキー
    constraint: '`nav`・`documents`・`decisions`・`github`・`diff`・`schemas` だけを返し、`validators`・`converters`・`generators` のコマンドは返さない'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: NFR-1#requirements[通信]
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名と、配信元の設定から写したキーの中身と、`schemas` の中身は変えない
test_file: tests/integration/server/test_get_source_config.py
