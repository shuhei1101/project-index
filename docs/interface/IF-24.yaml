id: IF-24
title: 文書の一覧
entry:
  kind: endpoint
  value: GET `/sources/{source}/docs`
flows:
  - name: 正常系
    summary: 指定のリビジョンの文書の ID・パス・種類・メタデータを返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 種類 `design` の YAML 2 件（1 件目だけが `visibility` を持つ）と、管理用の YAML `files.yaml` の行の文書 1 件を `main` に持つ sample
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs
        E-->>C: 200 文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、`ref` が `main`、`documents` に 3 件が並ぶ
      - 各要素が `id`・`path`・`kind`・`name`・`description`・`tags`・`visibility` を持ち、行の文書は `bodyPath` を持つ
      - '`visibility` は文書の `visibility` の値で、文書が持たなければ `null`'
      - 各要素が `version` を持つ
    test: test_normal
  - name: 正常系（値を求める）
    summary: '`values` を指したときだけ、各文書の値を返す'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: 正常系と同じ sample
    flow: |-
      <!-- map: {"title": "正常系（値を求める）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?values=true
        E-->>C: 200 値つきの文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、各要素の `value` が文書の取得の `value` と同じ（YAML の文書は YAML を読み込んだ値、行の文書は行の値）
      - '`values` を省いた正常系の各要素の `value` は `null`'
    test: test_normal_when_values_requested
  - name: 正常系（共通のキーを求める）
    summary: '`common_keys` を指したときだけ、各文書の共通のキーを返す'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: 正常系と同じ sample。種類 `design` の `documents[]` の行は、`metadata` に `name` を列名 `title` から、`related` を列名 `links` から取る対応と、`alias_type` を持つ
    flow: |-
      <!-- map: {"title": "正常系（共通のキーを求める）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?common_keys=true
        E-->>C: 200 共通のキーつきの文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、種類 `design` の各要素の `commonKeys` が、文書の `title` の値を `name` に、`links` の値を `related` に入れ、行の `alias_type` を `alias_type` に入れた共通のキーを持つ
      - 各要素の `commonKeys` の中のキーは `METADATA_KEYS` の名前のまま（camelCase にしない）で、文書に値の無いキーを持たない
      - '`common_keys` を省いた正常系の各要素の `commonKeys` は `null`'
    test: test_normal_when_common_keys_requested
  - name: 正常系（リビジョンを指す）
    summary: '`ref` の文書の一覧を返す'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: 正常系と同じ sample。最新の commit で文書を 1 件追加した
    flow: |-
      <!-- map: {"title": "正常系（リビジョンを指す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?ref={親の commit}
        E-->>C: 200 親の commit の文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、`documents` に追加した文書が無い
      - 親の commit と `main` の両方にある文書の `version` は、内容が同じなら同じ値になる
    test: test_normal_when_ref_given
  - name: 異常系（無い配信元・リビジョン・404）
    summary: 無い配信元・配信していない配信元・解決できないリビジョンを断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/sources/unknown/docs` と `/sources/sample/docs?ref=no-such-branch`'
    flow: |-
      <!-- map: {"title": "異常系（無い配信元・リビジョン・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?ref=no-such-branch
        E-->>C: 404 problem+json
      ```

      <!-- /map -->
    expected:
      - 無い配信元は 404 で `missing` が `source`
      - 無いリビジョンは 404 で `missing` が `ref`、`detail` にリビジョンの名前 `no-such-branch` がある
    test: test_error_when_not_found
  - name: 正常系（リビジョンの書き出しが上限を超える commit を指す）
    summary: 文書の一覧はリビジョンを書き出さずに commit の blob を読み込むため、書き出しが上限を超える commit でも一覧を返す
    setup:
      - name: Mock
        description: git の実行を、`archive` の引数が親の commit のときだけ待ち時間の上限を超えたときと同じ失敗（`GitError` の `timed_out`）を返すものに差し替える
      - name: サンプルの配信元
        description: 正常系（リビジョンを指す）と同じ sample
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?ref={親の commit}
        E->>E: 書き出さずに、親の commit のファイルを blob から読み込む
        E-->>C: 200 親の commit の文書の一覧
      ```
    expected:
      - 200 で、`documents` が正常系（リビジョンを指す）と同じ親の commit の文書の一覧
      - 包みの git の `archive` を文書の一覧の要求の中で呼ばない
      - 状態のフォルダに親の commit の書き出しができない
    test: test_normal_when_revision_export_times_out
    refs:
      - to: SC-11
        item: scenarios[異常シナリオ（リビジョンの書き出しが上限を超える）]
        type: references
        when: このインターフェースの入出力やフローを変えるときに、シナリオ『画面のサーバーが文書を読む』の対応する流れと期待値を確認する。
  - name: 正常系（disk の配信元でリビジョンを指す）
    summary: disk の配信元は `ref` を無視して登録したフォルダの文書を返す
    setup:
      - name: Mock
        description: なし
      - name: ローカル運用の配信元
        description: 'Git のリポジトリの中の `storage.type: disk` の配信元。`files.local.yaml` の行の文書を持つ'
        notes: id `company`。`master` ブランチがある
    flow: |-
      <!-- map: {"title": "正常系（disk の配信元でリビジョンを指す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/company/docs?ref=master
        E-->>C: 200 登録したフォルダの文書の一覧（ref は空）
      ```

      <!-- /map -->
    expected:
      - 200 で、`documents` に `files.local.yaml` の行の文書がある
      - '`ref` が空の文字列'
    test: test_normal_when_disk_storage
  - name: 正常系（裏の検査の最中に応答する）
    summary: 応答の最中は、裏の検査が休みを挟んで進む
    setup:
      - name: Mock
        description: sample の文書の一覧の処理を、テストが合図を出すまで止まるものに差し替える（応答の最中の状態を保つ）。裏の検査が文書のファイルを読み込んだ時刻を記録する包みを配置する
        notes: 合図は、裏の検査が始まってから 1 秒の後に出す
      - name: 大きな配信元
        description: 種類 `design` の YAML を持ち、合図の後も裏の検査が 1 秒以上続く件数を持つ large。件数は、テストが始めに同じ形の文書で休まない検査の 1 件あたりの時間を測り、1 秒をその時間で割った件数の 2 倍にする（合図までの 1 秒に 1 割の速さで読む分を引いても、合図の後に 1 秒以上残る）
      - name: サンプルの配信元
        description: 正常系と同じ sample
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs
        participant B as 裏の検査

        B->>B: large を検査し始める
        C->>E: GET /sources/sample/docs（合図まで応答の最中になる）
        B->>B: ファイル 1 件ごとに休みを挟んで進む
        C->>E: 合図を出す
        E-->>C: 200 文書の一覧
        B->>B: 休みを挟まずに検査を済ませる
      ```
    expected:
      - 応答の最中に裏の検査が 1 秒あたりに読み込んだファイルの数が、合図の後の 2 割以下
      - 応答の最中も、裏の検査が読み込んだファイルの数が 1 件以上増える（止まらない）
      - 合図の後に 200 で sample の文書の一覧を返却し、裏の検査が済むと large の `sync` が休まずに済ませたときと同じ件数になる
    test: test_normal_when_background_check_running
    refs:
      - to: SC-11
        item: scenarios[正常シナリオ（裏の検査の最中に開く）]
        type: references
        when: このインターフェースのフローを変えるときに、シナリオ『画面のサーバーが文書を読む』の対応する流れと期待値を確認する。
      - to: IF-15
        item: constraints[裏の処理の譲り方]
        type: requires
        when: 休みの長さや確認の単位を変えるときに、起動の制約と合うかを確認する。
  - name: 正常系（ほかの配信元の読み込みの最中に応答する）
    summary: 応答の最中は、要求が指さない配信元の行の読み込みが休みを挟んで進む
    setup:
      - name: Mock
        description: sample の文書の一覧の処理を、テストが合図を出すまで止まるものに差し替える。large の行の読み込みで文書の行ごとのスキーマの検証を実行した時刻を記録する包みを配置する
        notes: 合図は、large の検証が始まってから 1 秒の後に出す
      - name: 大きな配信元
        description: 文書の種類の行を多く持ち、合図の後も行の読み込みが 1 秒以上続く large。行の数は、テストが始めに休まない検証の 1 件あたりの時間を測り、1 秒をその時間で割った数の 2 倍にする
      - name: サンプルの配信元
        description: 正常系と同じ sample。端末の設定で large の後に並べる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs
        participant L as 配信元の行の読み込み

        L->>L: large と sample を読み込み始める
        C->>E: GET /sources/sample/docs（合図まで応答の最中になる）
        L->>L: large の文書の行ごとに休みを挟んで進む
        C->>E: 合図を出す
        E-->>C: 200 文書の一覧
        L->>L: 休みを挟まずに large を読み込み終える
      ```
    expected:
      - 応答の最中に large の文書の行の検証が 1 秒あたりに進んだ数が、合図の後の 2 割以下
      - 応答の最中も、large の文書の行の検証が 1 件以上進む（止まらない）
      - 合図の後に 200 で sample の文書の一覧を返却し、large の配信元の設定と種類のスキーマが休まずに読み込んだときと同じ
    test: test_normal_when_other_sources_loading
    refs:
      - to: SC-11
        item: scenarios[正常シナリオ（ほかの配信元の読み込みの最中に開く）]
        type: references
        when: このインターフェースのフローを変えるときに、シナリオ『画面のサーバーが文書を読む』の対応する流れと期待値を確認する。
      - to: IF-15
        item: constraints[裏の処理の譲り方]
        type: requires
        when: 休みの長さや休む単位を変えるときに、起動の制約と合うかを確認する。
  - name: 正常系（同じ commit を 2 回取得する）
    summary: 同じ commit の 2 回目は、ファイルと文書の行のパターンの照合をやり直さない
    setup:
      - name: Mock
        description: 文書の行のパターンとファイルの照合の呼び出しの回数を数える包みを配置する
      - name: サンプルの配信元
        description: 正常系と同じ sample
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?values=true
        E-->>C: 200 文書の一覧
        C->>E: GET /sources/sample/docs?values=true（同じ commit）
        E-->>C: 200 文書の一覧
      ```
    expected:
      - 2 回とも 200 で、同じ `documents` を返す
      - 2 回目の要求の中の、文書の行のパターンとファイルの照合の呼び出しが 0 回
      - '`main` に commit を追加した後の文書の一覧は、照合をやり直して追加した文書を返す'
    test: test_normal_when_same_commit_listed_twice
  - name: 正常系（C の読み込みで読めない YAML を含む）
    summary: C の読み込みで読めない YAML も、pure で読み直して同じ値で返す
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: '正常系と同じ sample。`files.yaml` の行に flow の中の `:` を含む plain scalar（`tags: [scope:a, topic:b]`）を持たせる'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?values=true
        E->>E: C で読めない files.yaml を pure で読み直す
        E-->>C: 200 文書の一覧
      ```
    expected:
      - 200 で、`files.yaml` の行の文書の `tags` が `scope:a`・`topic:b`
      - '`documents` の各要素の `value` が、pure の読み込みだけで読んだときと同じ'
    test: test_normal_when_yaml_unreadable_by_c
lead: 指定のリビジョンの文書の一覧を返却する読み取り API の入出力を定め、文書の一覧を修正するときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: topic:api
  - name: action:読み取り
identifier: list_documents
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - SC-11#scenarios[正常シナリオ]
  - SC-11#scenarios[異常シナリオ（無いリビジョンを指す）]
  - SC-11#scenarios[正常シナリオ（配信元を読み込んだ直後に開く）]
  - SC-11#scenarios[正常シナリオ（裏の書き出しの最中に開く）]
  - SC-4#scenarios[異常シナリオ（裏のリビジョンの書き出しが上限を超える）]
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: ref
    type: str
    required: false
    default: 配信元の `default_ref`
    location: query
    description: リビジョン（ブランチ・コミット・タグ）
  - name: values
    type: bool
    required: false
    default: '`false`'
    location: query
    description: '`true` のとき、各要素の `value` に文書の値を入れる'
  - name: common_keys
    type: bool
    required: false
    default: '`false`'
    location: query
    description: '`true` のとき、各要素の `commonKeys` に文書の共通のキーを入れる'
request_example: |-
  ```text
  GET /sources/sample/docs?ref=main&values=true&common_keys=true
  ```
response:
  - name: ref
    type: str
    description: 解決したリビジョンの名前
  - name: documents[].id
    type: str
    description: 文書の ID
  - name: documents[].path
    type: str
    description: 文書のファイルのパス（配信元の直下から、拡張子つき）
  - name: documents[].kind
    type: str
    description: 種類（`documents[].id`）
  - name: documents[].name
    type: str
    description: 名前（共通のキー `name`）
  - name: documents[].description
    type: str | None
    description: 概要（共通のキー `description`）
  - name: documents[].tags
    type: list[str]
    description: タグ
  - name: documents[].visibility
    type: str | None
    description: 公開範囲（共通のキー `visibility`）
  - name: documents[].bodyPath
    type: str | None
    description: 本文のファイルのパス（管理用の YAML の行の文書だけ）
  - name: documents[].version
    type: str
    description: 文書のバージョン。YAML の文書はファイルの内容のハッシュ、行の文書は行の値のハッシュで、内容が変わると変わる
    notes: 文書の書き込み（`write_docs`）の `expected_version` と同じ値
  - name: documents[].value
    type: dict | None
    description: 文書の値（YAML を読み込んだもの、行の文書は行の値）
    notes: '`values` が `true` のときだけ入れ、それ以外は `null`'
  - name: documents[].commonKeys
    type: dict | None
    description: 共通のキーの値。配信元の設定の行の `metadata` の列名の対応で文書から取った値と、行の `alias_type`。`name` は無いときの既定を入れた値
    notes: '`common_keys` が `true` のときだけ入れ、それ以外は `null`。値の無いキーは持たない'
response_example: |-
  ```json
  {"ref": "main", "documents": [
    {"id": "D-1", "path": "design/D-1.yaml", "kind": "design", "name": "タスクの保存", "description": "タスクの保存と取得", "tags": ["topic:task"], "visibility": "internal", "bodyPath": null, "version": "3f2a9c", "value": {"id": "D-1", "title": "タスクの保存", "links": [{"to": "D-2"}], "visibility": "internal"}, "commonKeys": {"id": "D-1", "name": "タスクの保存", "related": [{"to": "D-2"}], "alias_type": "term", "visibility": "internal"}},
    {"id": "guide.md", "path": "files.yaml", "kind": "files_guide", "name": "使い方", "description": null, "tags": [], "visibility": "public", "bodyPath": "guide.md", "version": "8b41d0", "value": {"path": "guide.md", "name": "使い方", "visibility": "public"}, "commonKeys": {"name": "使い方", "path": "guide.md", "visibility": "public"}}
  ]}
  ```
status_codes:
  - code: '200'
    condition: 返した（文書が 0 件でも 200）
  - code: '404'
    condition: 配信元が無い・配信していない、リビジョンを解決できない
    notes: '`missing`（`source`・`not_served`・`ref`）と値'
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）
constraints:
  - item: 並び
    constraint: '`documents[]` の行の順、行の中はパスの順'
  - item: 値の読み込み
    constraint: '`value`・`version`・`commonKeys` は文書のストアが読み込み済みの文書から返し、文書ごとにファイルを再読み込みしない'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: NFR-1#requirements[通信]
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名と、`value`・`commonKeys` の中身は変えない
  - item: disk の配信元
    constraint: '端末の設定の行が `storage.type: disk` の配信元は、`ref` を無視して登録したフォルダの文書を返し、応答の `ref` を空にする'
  - item: リビジョンの読み込み
    constraint: commit を状態のフォルダへ書き出さずに、commit のファイルの一覧（`ls-tree`）と、変わったファイルの blob の内容（`cat-file --batch`）から読み込む。同じ commit の 2 回目は、ファイルと文書の行のパターンの照合の結果を使い回す
    notes: 文書の取得・語での検索・配信元の設定の取得は今どおり書き出しを読む。書き出しの最中でも、文書の一覧はその終了を待たない
test_file: tests/integration/server/test_list_documents.py
visibility: internal
