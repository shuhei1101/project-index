id: IF-24
title: 文書の一覧
entry:
  kind: endpoint
  value: GET `/sources/{source}/docs`
flows:
  - name: 正常系
    summary: 指定のリビジョンの文書の ID・パス・種類・メタデータを返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 種類 `design` の YAML 2 件（1 件目だけが `visibility` を持つ）と、管理用の YAML `files.yaml` の行の文書 1 件を `main` に持つ sample
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs
        E-->>C: 200 文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、`ref` が `main`、`documents` に 3 件が並ぶ
      - 各要素が `id`・`path`・`kind`・`name`・`description`・`tags`・`visibility` を持ち、行の文書は `bodyPath` を持つ
      - '`visibility` は文書の `visibility` の値で、文書が持たなければ `null`'
      - 各要素が `version` を持つ
    test: test_normal
  - name: 正常系（値を求める）
    summary: '`values` を指したときだけ、各文書の値を返す'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: 正常系と同じ sample
    flow: |-
      <!-- map: {"title": "正常系（値を求める）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?values=true
        E-->>C: 200 値つきの文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、各要素の `value` が文書の取得の `value` と同じ（YAML の文書は YAML を読み込んだ値、行の文書は行の値）
      - '`values` を省いた正常系の各要素の `value` は `null`'
    test: test_normal_when_values_requested
  - name: 正常系（共通のキーを求める）
    summary: '`common_keys` を指したときだけ、各文書の共通のキーを返す'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: 正常系と同じ sample。種類 `design` の `documents[]` の行は、`metadata` に `name` を列名 `title` から、`related` を列名 `links` から取る対応と、`alias_type` を持つ
    flow: |-
      <!-- map: {"title": "正常系（共通のキーを求める）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?common_keys=true
        E-->>C: 200 共通のキーつきの文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、種類 `design` の各要素の `commonKeys` が、文書の `title` の値を `name` に、`links` の値を `related` に入れ、行の `alias_type` を `alias_type` に入れた共通のキーを持つ
      - 各要素の `commonKeys` の中のキーは `METADATA_KEYS` の名前のまま（camelCase にしない）で、文書に値の無いキーを持たない
      - '`common_keys` を省いた正常系の各要素の `commonKeys` は `null`'
    test: test_normal_when_common_keys_requested
  - name: 正常系（リビジョンを指す）
    summary: '`ref` の文書の一覧を返す'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: 正常系と同じ sample。最新の commit で文書を 1 件追加した
    flow: |-
      <!-- map: {"title": "正常系（リビジョンを指す）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?ref={親の commit}
        E-->>C: 200 親の commit の文書の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、`documents` に追加した文書が無い
      - 親の commit と `main` の両方にある文書の `version` は、内容が同じなら同じ値になる
    test: test_normal_when_ref_given
  - name: 異常系（無い配信元・リビジョン・404）
    summary: 無い配信元・配信していない配信元・解決できないリビジョンを断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/sources/unknown/docs` と `/sources/sample/docs?ref=no-such-branch`'
    flow: |-
      <!-- map: {"title": "異常系（無い配信元・リビジョン・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources/{source}/docs

        C->>E: GET /sources/sample/docs?ref=no-such-branch
        E-->>C: 404 problem+json
      ```

      <!-- /map -->
    expected:
      - 無い配信元は 404 で `missing` が `source`
      - 無いリビジョンは 404 で `missing` が `ref`、`detail` にリビジョンの名前 `no-such-branch` がある
    test: test_error_when_not_found
lead: 指定のリビジョンの文書の一覧を返却する読み取り API の入出力を定め、文書の一覧を修正するときに参照する。
identifier: list_documents
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - SC-11#scenarios[正常シナリオ]
  - SC-11#scenarios[異常シナリオ（無いリビジョンを指す）]
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: ref
    type: str
    required: false
    default: 配信元の `default_ref`
    location: query
    description: リビジョン（ブランチ・コミット・タグ）
  - name: values
    type: bool
    required: false
    default: '`false`'
    location: query
    description: '`true` のとき、各要素の `value` に文書の値を入れる'
  - name: common_keys
    type: bool
    required: false
    default: '`false`'
    location: query
    description: '`true` のとき、各要素の `commonKeys` に文書の共通のキーを入れる'
request_example: |-
  ```text
  GET /sources/sample/docs?ref=main&values=true&common_keys=true
  ```
response:
  - name: ref
    type: str
    description: 解決したリビジョンの名前
  - name: documents[].id
    type: str
    description: 文書の ID
  - name: documents[].path
    type: str
    description: 文書のファイルのパス（配信元の直下から、拡張子つき）
  - name: documents[].kind
    type: str
    description: 種類（`documents[].id`）
  - name: documents[].name
    type: str
    description: 名前（共通のキー `name`）
  - name: documents[].description
    type: str | None
    description: 概要（共通のキー `description`）
  - name: documents[].tags
    type: list[str]
    description: タグ
  - name: documents[].visibility
    type: str | None
    description: 公開範囲（共通のキー `visibility`）
  - name: documents[].bodyPath
    type: str | None
    description: 本文のファイルのパス（管理用の YAML の行の文書だけ）
  - name: documents[].version
    type: str
    description: 文書のバージョン。YAML の文書はファイルの内容のハッシュ、行の文書は行の値のハッシュで、内容が変わると変わる
    notes: 文書の書き込み（`write_docs`）の `expected_version` と同じ値
  - name: documents[].value
    type: dict | None
    description: 文書の値（YAML を読み込んだもの、行の文書は行の値）
    notes: '`values` が `true` のときだけ入れ、それ以外は `null`'
  - name: documents[].commonKeys
    type: dict | None
    description: 共通のキーの値。配信元の設定の行の `metadata` の列名の対応で文書から取った値と、行の `alias_type`。`name` は無いときの既定を入れた値
    notes: '`common_keys` が `true` のときだけ入れ、それ以外は `null`。値の無いキーは持たない'
response_example: |-
  ```json
  {"ref": "main", "documents": [
    {"id": "D-1", "path": "design/D-1.yaml", "kind": "design", "name": "タスクの保存", "description": "タスクの保存と取得", "tags": ["topic:task"], "visibility": "internal", "bodyPath": null, "version": "3f2a9c", "value": {"id": "D-1", "title": "タスクの保存", "links": [{"to": "D-2"}], "visibility": "internal"}, "commonKeys": {"id": "D-1", "name": "タスクの保存", "related": [{"to": "D-2"}], "alias_type": "term", "visibility": "internal"}},
    {"id": "guide.md", "path": "files.yaml", "kind": "files_guide", "name": "使い方", "description": null, "tags": [], "visibility": "public", "bodyPath": "guide.md", "version": "8b41d0", "value": {"path": "guide.md", "name": "使い方", "visibility": "public"}, "commonKeys": {"name": "使い方", "path": "guide.md", "visibility": "public"}}
  ]}
  ```
status_codes:
  - code: '200'
    condition: 返した（文書が 0 件でも 200）
  - code: '404'
    condition: 配信元が無い・配信していない、リビジョンを解決できない
    notes: '`missing`（`source`・`not_served`・`ref`）と値'
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）
constraints:
  - item: 並び
    constraint: '`documents[]` の行の順、行の中はパスの順'
  - item: 値の読み込み
    constraint: '`value`・`version`・`commonKeys` は文書のストアが読み込み済みの文書から返し、文書ごとにファイルを読み直さない'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: NFR-1#requirements[通信]
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名と、`value`・`commonKeys` の中身は変えない
test_file: tests/integration/server/test_list_documents.py
