id: IF-22
title: 配信元の一覧と状態
entry:
  kind: endpoint
  value: GET `/sources`
flows:
  - name: 正常系
    summary: 配信元ごとの ID・状態・配信していない理由を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、project-index のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: 端末の設定
        description: 検証に通る sample、`project-index.yaml` の `documents[0]` に必須のキー `paths` が無い broken、`enabled` が `false` の archive の 3 行
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources

        C->>E: GET /sources
        E-->>C: 200 配信元ごとの状態
      ```

      <!-- /map -->
    expected:
      - 200 で、`sources` に sample（`serving`）・broken（`not_served`）・archive（`disabled`）が端末の設定の順に並ぶ
      - broken の `errors` に `documents[0].paths` のパスと理由がある
    test: test_normal
  - name: 正常系（配信元が無い）
    summary: 端末の設定に配信元が無いときは空の一覧を返す
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources: []`'
    flow: |-
      <!-- map: {"title": "正常系（配信元が無い）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /sources

        C->>E: GET /sources
        E-->>C: 200 空の一覧
      ```

      <!-- /map -->
    expected:
      - 200 で、`sources` が空
    test: test_normal_when_no_source
lead: 配信元ごとの ID・状態・配信していない理由を返却する読み取り API の入出力を定め、配信元の一覧と状態を修正するときに参照する。
identifier: list_sources
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - SC-11#scenarios[正常シナリオ]
  - SC-11#scenarios[異常シナリオ（配信していない配信元を指す）]
exclusivity: 読み取りだけで排他しない
request: []
request_example: |-
  ```text
  GET /sources
  ```
response:
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled']
    description: 配信中・配信していない・無効
  - name: sources[].errors
    type: 'list[{path: str, reason: str}]'
    description: 配信していない理由
    notes: '`not_served` のときだけ'
response_example: |-
  ```json
  {"sources": [
    {"id": "sample", "status": "serving"},
    {"id": "broken", "status": "not_served", "errors": [{"path": "documents[0].paths", "reason": "'paths' is a required property"}]},
    {"id": "archive", "status": "disabled"}
  ]}
  ```
status_codes:
  - code: '200'
    condition: 返した（配信元が 0 件でも 200）
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）
constraints:
  - item: 読み込み中
    constraint: 読み込みが終わっていない配信元は、その配信元の読み込みが終わるまで待ってから返す
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: NFR-1#requirements[通信]
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名は変えない
test_file: tests/integration/server/test_list_sources.py
