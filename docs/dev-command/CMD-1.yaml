title: 開発コマンド
lead: project-index の開発で使用するコマンドを分類ごとの前提・順序・確認の記録とともに定め、開発のコマンドを実行・追加するときに参照する。
categories:
  - name: 環境構築（クローン直後）
    commands: |-
      1. `.python-version` の Python と、`uv.lock` どおりの開発の依存を入れる

      ```bash
      uv sync --frozen
      ```
    verification:
      state: 済
      date: '2026-11-06'
      detail: 作業 PR の worktree で実行し、依存が入って `uv run project-index --version` が `project-index 0.0.0` を出すことを確認した
  - name: 取り込み後の追従（pull 後）
    commands: |-
      1. 取り込んだ `pyproject.toml`・`uv.lock` に手元の依存を合わせる

      ```bash
      uv sync
      ```
    verification:
      state: 済
      date: '2026-11-06'
      detail: 作業 PR の worktree で実行し、依存が lock どおりであることを確認した
  - name: 依存の追加・更新・削除
    commands: |-
      1. 実行時の依存を追加する（開発の依存は `--dev` を付ける）

      ```bash
      uv add {パッケージ}
      ```

      2. 依存を削除する

      ```bash
      uv remove {パッケージ}
      ```
    effects: '`pyproject.toml` と `uv.lock` を書き換える'
    verification:
      state: 済
      detail: 作業 PR の worktree で `uv add --dev httpx`（入っている依存）を実行し、解決が通って `pyproject.toml`・`uv.lock` に差分が出ないことを確認した
      date: '2026-11-12'
  - name: 起動・停止
    commands: |-
      1. 端末の設定を指して索引のサーバーを起動する（待ち受けた後は停止の合図まで終わらないため、tmux のセッションで切り離す）

      ```bash
      tmux new-session -d -s project-index "PROJECT_INDEX_CONFIG={端末の設定} PROJECT_INDEX_PORT={ポート} uv run project-index serve"
      ```

      2. 停止する

      ```bash
      tmux kill-session -t project-index
      ```
    effects: 端末の設定の `state_dir` に会話の記録・リビジョンの書き出し・ログを記録する
    verification:
      state: 済
      date: '2026-11-12'
      detail: 作業 PR の worktree で配信元 `ai-monitor` を持つ端末の設定とポート 8796 で起動し、`/sources` が `serving` を返却して `/mcp` の `search_docs` が応えること、停止でポートが閉じることを確認した
  - name: テスト
    refs:
      - TP-1#
  - name: 静的検査
    refs:
      - TP-1#layers[lint]
  - name: ビルド・生成
    prerequisites:
      - AI Monitor のクローンがある（`uv` で AI Monitor の依存を入れてある）
    commands: |-
      1. `docs/` のフォルダの目次の原本（`index.yaml`）か `docs/guide/files.yml` を変えたら、目次の `README.md` と Pages のナビゲーション（`docs/_theme/_data/nav.project.yml`）を AI Monitor の公開ドキュメントの書き出しで再作成し、原本と一緒に commit する

      ```bash
      cd {AI Monitor のクローン} && PYTHONPATH=src uv run python -m ai_monitor.design_docs publish --root {project-index の作業ツリー}
      ```

      2. 配信元の設定のスキーマの原本（`src/project_index/schemas/project-index.schema.yaml`）を変えたら、配布する `schemas/project-index.schema.json` を再作成し、原本と一緒に commit する（コマンドは `refs` の『配布のスキーマの生成』）
    refs:
      - MOD-70#functions[source_schema_json]
    verification:
      state: 未確認
      detail: 1 は、AI Monitor が配信元の設定を `dev-docs.yaml` の名前でだけ読み込み、`project-index.yaml` のこのリポジトリでは `No such file or directory` で止まるため確認していない（shuhei1101/ai-monitor#3441 で修正する）。2 の『配布のスキーマの生成』のコマンドは作業 PR の worktree で実行し、終了コード 0 で、出力が commit 済みの `schemas/project-index.schema.json` と一致した（2026-11-14）
  - name: 取り込み前の検査
    refs:
      - TP-1#layers[単体テスト（バック）]
      - TP-1#layers[lint]
  - name: 管理作業
    commands: |-
      1. 配信元の設定のバージョンを移し替える手順を確認する（`--plan` を除くと書き換える）

      ```bash
      uv run project-index migrate --plan --source {配信元の設定}
      ```

      2. 管理用の YAML に記載するファイルの一覧を出す

      ```bash
      uv run project-index files --root {配信元のフォルダ} --paths {範囲の glob}
      ```
    verification:
      state: 済
      date: '2026-11-12'
      detail: 作業 PR の worktree で `migrate --plan --source dev-docs.yaml` が終了コード 0 で終わり、`files --root docs/guide --paths "*.md"` がファイル名を出すことを確認した
id: CMD-1
visibility: internal
prerequisites:
  - Python 3.14 と uv
