confirmations:
  - topic: 画面のサーバーの書き込みの API で配信元の設定を直コミットで書き換えられるようにするか
    decision: 扱う。スキーマと起動の検証に合格し、コマンドを持つキーを変えない変更だけを書き込む（推奨案 A）
    decided_by: thumbs_up
    approver: shuhei1101
    commit: f6a7921
    thread: https://github.com/shuhei1101/project-index/pull/275#discussion_r4662755673
  - topic: 書き込みの API で配信元の設定を指定する方法
    decision: 書き込みの API に配信元の設定の項目を追加し、端末の設定と配信元の設定に文書の種類とは別の許可のキーを追加する（推奨案 B）
    decided_by: thumbs_up
    approver: shuhei1101
    commit:
    thread: https://github.com/shuhei1101/project-index/pull/275#discussion_r4662756120
  - topic: 配信元の設定の直コミットを許可する設定のキーの名前と既定値
    decision: 配信元の設定の `direct_commit.config` と端末の設定の `sources[].direct_commit.write_api_config`（どちらも bool・既定 `false`）（推奨案 A）
    decided_by: thumbs_up
    approver: shuhei1101
    commit: 36e89cb
    thread: https://github.com/shuhei1101/project-index/pull/275#discussion_r4663247974
