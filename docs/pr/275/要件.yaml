use_cases:
  - kind: single
    scenario: docs/scenario/SC-17.yaml
    impact: changed
    detail: 画面で修正した配信元の設定を、検査に合格させてから既定のブランチへ直コミットし、配信へ反映する流れを追加する（扱う場合）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-12.yaml
    impact: run_only
    detail: 端末の設定の配信元の変更の流れは変えないが、端末の設定に直コミットの許可を足すため回帰を確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-10.yaml
    impact: run_only
    detail: 利用者が配信元の設定を変えて reload する流れは変えないが、同じ検証を書き込みで使うため回帰を確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: none
    detail: 画面のサーバーが文書を書き込む流れは変わらない
    depends_on: []
