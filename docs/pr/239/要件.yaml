    plan: none
  - item: 精度評価の設計書
    reason: Issue の指示で対象外（精度が大事な客が見るものを持たない）
    plan: none
  - item: エージェントの定義・起動の構成の設計書
    reason: このリポジトリはエージェントと起動の構成を持たない（Issue の対象は MCP サーバー・スキル・LLM の呼び出し）
    plan: none
  - item: 'type: skill のエージェントフローから SKILL.md を生成する仕組み'
    reason: 要望は設計書の作成と実装の追随で、生成の仕組みの追加を含まない。この PR では SKILL.md を手でエージェントフローに合わせる
