use_cases:
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: Git 管理外の配信元で、日時を付けない指定をした種類の文書を、日時を追加せずに書き込む流れと、本文のファイルを持たない要素を作成・更新する流れを追加する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: changed
    detail: 本文のファイルを持たない要素を文書として検索・参照し、同じファイルの警告が要素の数だけ並ばない流れを追加する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: following
    detail: 起動時の索引の同期で、ファイルが無い行に本文のファイルを持たない要素を数えなくなることに追随する
    depends_on:
      - docs/scenario/SC-6.yaml
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: run_only
    detail: 画面のサーバーが読む文書の一覧・文書に、本文のファイルを持たない要素が加わる
    depends_on: []
