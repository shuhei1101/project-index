use_cases:
  - kind: single
    scenario: docs/scenario/SC-17.yaml
    impact: changed
    detail: 画面で溜めた修正がほかの変更と衝突したとき、断らずに修正をブランチに残し、端末のスクリプトで後の処理を任せる流れを追加する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: changed
    detail: 画面が文書を取得したときに、項目ごとのバージョンも受け取れるようにする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-12.yaml
    impact: following
    detail: 画面から端末の設定を変えても、衝突したときに実行するスクリプトの指定は変えられない
    depends_on:
