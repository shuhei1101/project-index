scope_out:
  - item: setup が推奨する検索の範囲を全てのファイルにする
    reason: 別の要望で、同じ SKILL.md の別の箇所を扱う
    plan: '#102'
  - item: 既存の配信元の検索の対象とメタデータの見直し
    reason: この作業 PR が入った後に行う
    plan: '#104'
  - item: 取り出す手段を MCP のツールにする
    reason: setup のときしか使用しないため、既に setup が呼ぶ CLI のサブコマンドにする判断を推奨にする（インターフェース定義設計のレビューで確定する）
    plan: none
  - item: 見出しの並びが同じファイル群は 1〜2 件だけ参照して型を決める
    reason: アウトラインで決まらないファイルだけが深い段階へ進むため、型でまとめても参照する量はほとんど減らない
    plan: none
  - item: '`git log` のコミットの題名をメタデータの材料にする'
    reason: 題名はその変更の理由で、ファイルが受け持つことを表さないことが多く、`name`・`description` の材料にならない
    plan: none
  - item: 付けた後に、ほぼ同じ `description` の組・1 件にしか付いていないタグ・半数以上に付いているタグを洗い出す
    reason: 今回入れる取り出す手段と段階的な付与を前提にした後続で、要望の中心（中身に合った付与と変わったファイルの見直し）とは別に扱う
    plan: to_file
  - item: 変更の前後のアウトラインを比べ、変わったファイルだけを見直しの候補にする
    reason: アウトラインが変わらない本文だけの変更でも `description` が古くなるため、中身が変わったファイルは全て見直しの候補にする
    plan: none
