    impact: changed
    detail: 管理用の YAML に無いファイルへ仮のメタデータを付けるとき、目次のページで語彙を決めてから、安い読み方から順に段階的に中身を参照する。2 回目以降は、前回の確認の後に中身が変わったファイルだけを見直し、今の値と新しい案を並べて了承を得る
    depends_on: []
