    detail: エージェントが関連をたどるときに、文書の最上位の関連と入れ子の項目の中の関連の両方の相手が出るようになる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: run_only
    detail: どの深さの列もまとめる対応の共通のキーへの書き込みは断られる。書き込みの流れの記述は変わらないが、共通のキーの列名への読み替えが変わるため回帰を確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: run_only
    detail: 起動時の metadata の列の欠けと該当しない関連の数え方は変わらないが、列名の解釈が変わるため回帰を確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: run_only
    detail: 画面のサーバーが受け取る共通のキーの流れは変わらないが、列名の解釈が変わるため回帰を確かめる
    depends_on: []
