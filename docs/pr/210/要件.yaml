scope_out:
  - item: knowledge のネットミームの種類とスキーマ・直コミットの許可の設定・登録のスキル
    reason: knowledge リポジトリの作業で、この作業 PR の直コミットの指定を前提にする後続（Issue の `## 依存・後続`）
    plan: to_file
  - item: rule-inject の `write_index_entry` と ai-monitor の連絡ボード（shuhei1101/ai-monitor#3404）への直コミットの適用
    reason: この Issue の後に別に検討すると Issue に決まっている。他のリポジトリのツールで、この作業 PR の方式が決まってから中身が決まる
    plan: to_file
  - item: 規約・判定フローチャートなどエージェントの動きを変える文書の直コミット
    reason: 最初は対象にしないと利用者が決めた（D-776 の案 A）。配信元の設定で種類を許可するだけで対象にできるため、project-index の変更は要らない
    plan: none
  - item: プッシュの後の CI の失敗の取得と打ち消しのコミットの提案
    reason: 呼んだ側の登録のスキルが担う想定（Issue の手元で考えた一案）で、project-index のツールはプッシュの結果までを返す
    plan: none
  - item: AI Monitor のエージェントの作業での直コミットの使用
    reason: 作業 PR の中でコミットの単位を決めるため使用しないと Issue に決まっている
    plan: none
