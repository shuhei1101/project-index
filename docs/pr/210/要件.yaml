use_cases:
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: changed
    detail: 手元のセッションが、データを書き込んだ後にコミットとプッシュまでを 1 回の呼び出しで終え、直後からリモートに残る流れを加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: 書き込み・削除にコミットの指定を付けると、既定のブランチへ取り込み・検査・書き込み・コミット・プッシュまでを行い、許可していない種類・ずれのある作業ツリー・断られたプッシュでは元に戻して断る分岐を加える
    depends_on:
      - docs/scenario/SC-1.yaml
  - kind: single
    scenario: docs/scenario/SC-10.yaml
    impact: changed
    detail: 配信元の設定に直コミットを許可する種類を書き、確認してから配信に入れる流れと、誤った設定を確認で知らせる分岐を加える
    depends_on:
      - docs/scenario/SC-1.yaml
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: following
    detail: 配信元の説明に、直コミットを許可した種類を示す記述へ追随する
    depends_on:
      - docs/scenario/SC-7.yaml
