confirmations:
  - topic: 直コミットの設定の構造と置き場所
    decision: 許可する種類とブランチは配信元の設定（`direct_commit.branch`・`direct_commit.kinds[]`）、呼べる作業場所は端末の設定（`sources[].direct_commit.scope`・`sources[].direct_commit.kinds`。既定は空）（推奨案 A）。あわせて、呼ぶときにブランチなどを上書きできるようにする
    decided_by: thumbs_up
    approver: shuhei1101
    commit: e5b27f3
    thread: https://github.com/shuhei1101/project-index/pull/210#discussion_r4633467567
  - topic: 呼び出しで上書きできる項目
    decision: 上書きできるのはブランチだけにし、上書きできるブランチは配信元の設定の `direct_commit.branches[]` に記載したものに限る（推奨案 A）。プッシュするリモートは上書きの対象にしない
    decided_by: thumbs_up
    approver: shuhei1101
    commit: ae1495e
    thread: https://github.com/shuhei1101/project-index/pull/210#discussion_r4633563667
