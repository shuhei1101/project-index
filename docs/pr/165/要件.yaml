use_cases:
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: 文書を改名したとき、本文のファイルを持つ文書の本文の中の旧 ID・旧パスのリンクも追随し、一括置換で本文の中の単語も置き換わる期待値を追加
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: none
    detail: 書き込みの単一ユースケースの中で操作の対象が広がるだけで、連鎖は変わらない
    depends_on: []
docs:
  - page: docs/guide/文書のMCP.md
    new: false
    change: '`write_docs` の改名・一括置換の節の「本文のファイルの中は書き換えない・置換しない」を、本文のファイルの中の参照の追随と単語の置換、`fields` の `@body` の説明に置き換える'
    status: todo
scope_out:
  - item: ほかの配信元から改名した文書を指す本文のファイルの中の参照の追随
    reason: 要望は同じ配信元の本文のファイルが対象。ほかの配信元は書き込みの `scope.write` とワークツリーが別になる（#157 と同じ扱い）
    plan: none
  - item: 配信の範囲の外のファイル（コード・規約の本文）の中の旧 ID・旧パスの追随と単語の置換
    reason: 要望は `records`・`body_file` の行の本文のファイルが対象で、配信の範囲の外のファイルは文書として読み書きしない
    plan: none
