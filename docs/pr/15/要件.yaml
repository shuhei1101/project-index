scope_out:
  - item: dev-docs から移した機能の除外と、dev-docs の画面のサーバーの付け替え
    reason: dev-docs のリポジトリの変更で、shuhei1101/dev-docs#163 が担う
    plan: none
  - item: dev-docs の画面のサーバーを本物の project-index の読み取り API へつなぐ作業
    reason: 規約『複数リポジトリのAPI契約』で、利用する側が本物へつなぐ作業は別の Issue にする。shuhei1101/dev-docs#164 が担う
    plan: none
  - item: 画面の API のうち、画面の配信・表の列の設定・API のスキーマ（dev-docs の IF-155-3・18・21）
    reason: dev-docs の画面のサーバーに残る機能。残す境界は shuhei1101/dev-docs#163 のインターフェース定義設計で決まり、移すと決まったものはこの作業 PR のインターフェース定義設計で取り込む。更新（IF-155-13）と再起動（IF-155-7）は 2 つのサーバーがそれぞれのクローンに対して持ち、project-index の分はこの作業 PR で移す（SC-3・SC-4）
    plan: none
  - item: 端末の設定の配信元を 1 行ずつ版を照合して追加・変更・削除する API
    reason: 'この作業 PR は今の dev-docs と同じ丸ごとの取得・保存と、Issue #14 の表の 1 行の追加を提供する。版を照合する 1 行ずつの追加・変更・削除は #10 が担う'
    plan: '#10'
  - item: フォルダ構成の設計書（layout）の作成
    reason: '#7 が担う。この作業 PR で増えるフォルダはモジュール構成の束ねる設計書（MOD-1・MOD-2）の directory に書く'
    plan: '#7'
  - item: このリポジトリの直下の配信元の設定 `dev-docs.yaml` の `project-index.yaml` への改名
    reason: '今の各リポジトリの `dev-docs.yaml` の移行方法は、この作業 PR のインターフェース定義設計で決める（Issue #14 の書き換え）。移行の間は両方を探す案ならそれぞれの作業で改名でき、改名だけにする案なら反映作業としてこの作業 PR に取り込む。決まるまではその時点の判断としてスコープ外に置き、レビューで確定する'
    plan: to_file
  - item: 'dev-docs から移した文書への、置き場所・`id`・書き方の決まり（dev-docs の #7・#74・#95）の適用'
    reason: shuhei1101/dev-docs#114 の扱いの判断で、移す文書の範囲が決まってから別に起票すると決まった。この作業 PR はこのリポジトリの今の決まりで書く
    plan: to_file
  - item: 配信元の設定の paths[] の基準のフォルダを、設定ファイルのフォルダ以外に指定する
    reason: 移した後のコードに対して行う変更。この作業 PR は今の dev-docs の振る舞いのまま移す
    plan: '#6'
  - item: '設定の画面で配信元を保存すると、ほかの行の outside_read: false が消える不具合'
    reason: 移した後のコードに対して行う修正。この作業 PR は今の dev-docs の振る舞いのまま移す
    plan: '#9'
  - item: 端末の設定の最上位の知らないキーを警告として返して読み込みを続ける
    reason: 移した後のコードに対して行う変更。この作業 PR は今の dev-docs の振る舞いのまま移す
    plan: '#11'
  - item: 呼ぶ側のリポジトリ（AI Monitor・knowledge・rule-inject・alias-inject）の、文書の MCP・管理の MCP のツールの完全名の書き換え
    reason: 別のリポジトリの変更。確認ログのとおりリポジトリごとに起票し、shuhei1101/dev-docs#163 のマージと同じ時期に入れる。完全名はこの作業 PR のプラグインが決めるため、この作業 PR がマージされなければ成り立たない
    plan: to_file
  - item: dev-docs から移した処理の lint の既存の違反（ruff の `# noqa`・pyright のファイルごとの Unknown 系の warning 指定・complexipy のスナップショット `complexipy-snapshot.json`）を解消してベースラインを外す
    reason: dev-docs はこのリポジトリより緩い lint の設定で書かれており、移した処理の構造の書き換え（cognitive complexity が上限を超える 41 関数の分割など）は移した後のコードに対して行う変更。この作業 PR は今の dev-docs の振る舞いのまま移し、既存の違反を規約『設計原則』の「既存の Python のリポジトリは warn から始める」に沿ってベースラインに載せ、新しい違反だけを失敗にする
    plan: to_file
