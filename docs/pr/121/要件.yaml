use_cases:
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: run_only
    detail: 書き込んだ YAML の文書が、変えた行だけの差分で残るようになる。書き込みの流れは変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: none
    detail: 配信元の説明と検索の結合テストの期待と準備だけを直し、調べる流れは変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-10.yaml
    impact: none
    detail: 試しの変換の結合テストの期待だけを直し、設定を変える流れは変わらない
    depends_on: []
scope_out:
  - item: 配列の `- ` の位置以外の字下げ（辞書の字下げの幅）を元のファイルに合わせること
    reason: 配信元の YAML の辞書の字下げは 2 で、`YAML_INDENT` の `mapping` と同じ。幅の違うファイルは見つかっていない
    plan: none
  - item: '`migrate`・`settings`・`admin`（`write_nav`）・`checkpoint` の往復編集の書き出しで、元のファイルの配列の字下げを保つこと'
    reason: '#118 は `write_docs` の事象。今回は `dump_roundtrip` に `original` を受ける口だけを入れ、`write_docs`・`delete_docs` で渡す。他の呼び出し元は今回の引数を前提にする'
    plan: '#128'
  - item: TP-1 の `run_runner` が `gh workflow run` の直後に `gh run watch` を呼び、run を API で引けない間は 404 で終わってランナーの結果を受け取れないこと
    reason: '#116 で入ったテストの実行方法の不具合で、今回の要望に含まれない（reviewer の対象外の不具合の報告）'
    plan: '#129'
