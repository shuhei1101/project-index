use_cases:
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: changed
    detail: 画面のサーバーが配信元の文書の修正をまとめて直コミットで登録する流れを加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-17.yaml
    impact: new
    detail: 画面のサーバーが溜めた文書の書き込みと削除を 1 回の要求で検査に合格させ、1 つのコミットにまとめてプッシュする。許可していない端末・配信元では断る
    depends_on:
      - docs/scenario/SC-1.yaml
  - kind: single
    scenario: docs/scenario/SC-15.yaml
    impact: following
    detail: 作業場所を持つ手元のセッションの直コミットはそのままで、作業場所を持たない要求の直コミットと分けて記載する
    depends_on:
      - docs/scenario/SC-17.yaml
  - kind: single
    scenario: docs/scenario/SC-12.yaml
    impact: following
    detail: 作業場所を持たない要求の直コミットの許可を端末の設定に持つなら、その許可を端末の設定の API で取得・保存できる
    depends_on:
      - docs/scenario/SC-17.yaml
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: run_only
    detail: 画面のサーバーの読み取りは変わらないが、同じ待ち受けとオリジンの確認に書き込みが加わるため回帰を確認する
    depends_on: []
