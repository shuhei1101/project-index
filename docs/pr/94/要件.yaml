scope_out:
  - item: 起動から `GET /sources` に 2 秒以内に応答するまでの時間（#85 の計測で 506.7 秒）
    reason: '#85 の終わりの条件は配信元ごとの最初の問い合わせで、起動の後の全ての配信元の読み込みにかかる時間は含まないと判断した。ただし、先に書き出しを済ませると起動の後の読み込みが延びうるため、スコープに含めるかはレビューで確定する'
    plan: to_file
  - item: dev-docs の側の 2 回目以降の取得の短縮と、文書の取得全体の制限時間
    reason: dev-docs のリポジトリの対処で、shuhei1101/dev-docs#230 が進めている
    plan: none
