use_cases:
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: run_only
    detail: 画面のサーバーの参照と設定の変更の流れは変わらないが、最初の参照と読み直しの応答の時点が変わるため回帰を確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: changed
    detail: 配信元ごとの最初の参照も 2 回目以降と同じ程度の時間で返り、上限を超えて止めたときは止めた処理と理由が伝わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: changed
    detail: 起動の後の配信元の読み込みで、最初の参照に要る準備を先に済ませる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-10.yaml
    impact: changed
    detail: 読み直しが配信元の一覧を差し替えた時点で応答し、読み直しの完了を状態の取得で確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-12.yaml
    impact: following
    detail: 端末の設定の配信元を丸ごと変えたときの読み直しも、同じく差し替えた時点で応答する
    depends_on:
      - docs/scenario/SC-10.yaml
