scope_out:
  - item: Bash の mv・rm・git mv での作成・削除・改名への通知
    reason: コマンドの文字列からの推測になり誤通知が出る。通知で捕捉できない分はスキル setup の突き合わせと describe() の注意の件数が検出する
    plan: none
  - item: 用語・エイリアス・索引のエントリを追加する基準を判定フローチャートの形に整理すること
    reason: '#203 が同じ内容を持つ。この PR の通知とスキルは、基準のページを文書の ID で指すだけで、基準の中身に依存しない'
    plan: '#203'
  - item: 圧縮で消えた会話・会話の記録のファイルからの指摘の検出
    reason: '#202 の本文が今の文脈に残っている分だけを対象にすると定めている'
    plan: none
  - item: alias-inject・rule-inject のコードの呼び出しと、両プラグイン側の変更
    reason: 緩い依存にするため、配信元の中身と端末の設定のファイルの有無だけで判定する
    plan: none
