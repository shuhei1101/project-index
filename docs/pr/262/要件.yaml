scope_out:
  - item: aituber のゲーム実況の行と AI Monitor の連絡ボードの、配信元の設定への行の追加
    reason: それぞれのリポジトリの作業で、この作業 PR の機能を前提にする後続。起点 Issue は完了の後に起票すると定めている
    plan: to_file
  - item: write_docs・delete_docs での SQLite の行の書き込み
    reason: アプリの検査を通らない書き込みができるため見送ると起点 Issue で決定した。書き込みは各アプリの MCP のツールで行う
    plan: none
