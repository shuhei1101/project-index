use_cases:
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: changed
    detail: エージェントが、アプリの SQLite のデータの行もタグ・種類・本文・別名で 1 回の検索で探して参照できる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: SQLite の行から配信した文書への書き込み・削除は、読み取り専用である理由とともに断られる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-10.yaml
    impact: changed
    detail: 利用者が配信元の設定に SQLite の表を指す行を追加し、管理の MCP で確認してから配信に入れられる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: changed
    detail: 起動時に SQLite の表を指す行も読み込んで配信し、開けないファイルは警告にして他の行の配信を続ける
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-8.yaml
    impact: changed
    detail: 変更のレビューでは、履歴を持たない SQLite の行の文書を変わった文書に含めない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-9.yaml
    impact: following
    detail: アプリが SQLite の行を書き換えた後の次の取得の振る舞いを、YAML を直接編集した後の再読み込みに合わせる
    depends_on:
      - docs/scenario/SC-6.yaml
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: run_only
    detail: 画面のサーバーの文書の一覧・取得・検索に SQLite の行の文書が混ざっても読み取りが壊れない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-17.yaml
    impact: following
    detail: 画面のサーバーからの書き込みも、SQLite の行の文書の書き込み・削除を断る
    depends_on:
      - docs/scenario/SC-7.yaml
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: run_only
    detail: 配信元の文書の読み書きの全体の流れが、SQLite の行の追加で壊れない
    depends_on: []
