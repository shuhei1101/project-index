    status: todo
  - page: docs/guide/documentsの行の判定.md
    new: false
    change: ファイル・records に加えて SQLite の表を指す行を選ぶ場合を追加する
    status: todo
  - page: docs/guide/文書のMCP.md
    new: false
    change: search_docs・describe・list_match_words・write_docs・delete_docs・list_changes の SQLite の行の文書の扱いを追加する
    status: todo
  - page: docs/guide/管理のMCP.md
    new: false
