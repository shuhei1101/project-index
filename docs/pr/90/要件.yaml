use_cases:
  - kind: single
    scenario: docs/scenario/SC-5.yaml
    impact: changed
    detail: 初回に運用（コミットする・ローカル運用）を聞き、ローカル運用なら *.local.* の名前で設定・管理用の YAML・スキーマを作り、Git が無視する設定に追加し、端末の設定の行を disk にする流れを加える。2 回目以降は端末の設定の行で運用を判定する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: changed
    detail: 端末の設定の配信元の行に読み書きの方法（git・disk）を指定でき、disk の配信元を Git のリポジトリの中でも登録したフォルダのファイルで検証・配信する。Git の作業ツリーの外のフォルダに git を指定した行を違反にする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: changed
    detail: disk の配信元は、どの作業場所（ワークツリー・リポジトリの外を含む）からも登録したフォルダの文書を返却し、リビジョンの指定と区間の変更の一覧を受け付けない
    depends_on:
      - docs/scenario/SC-4.yaml
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: disk の配信元は、書き込みの範囲に該当すれば登録したフォルダ（クローン本体）へ書き込み、作成・更新の日時を文書に追加する
    depends_on:
      - docs/scenario/SC-4.yaml
  - kind: single
    scenario: docs/scenario/SC-10.yaml
    impact: changed
    detail: disk の配信元の設定・スキーマ・スクリプトの変更は、commit ではなく reload の後に配信に入る
    depends_on:
      - docs/scenario/SC-4.yaml
  - kind: single
    scenario: docs/scenario/SC-11.yaml
    impact: changed
    detail: 画面のサーバーが disk の配信元を読むとき、リビジョンの指定を無視して登録したフォルダの文書を返却し、Git 管理外の配信元と同じくリビジョンの一覧を持たない
    depends_on:
      - docs/scenario/SC-4.yaml
  - kind: single
    scenario: docs/scenario/SC-9.yaml
    impact: run_only
    detail: YAML を直接編集した後の読み直しは変わらないが、disk の配信元の読む場所を変えるため回帰を確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: run_only
    detail: 入れる・参照・書き込み・設定の変更・更新の流れは変わらないが、配信元の読む場所と書き込みの先の解決を変えるため回帰を確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-12.yaml
    impact: changed
    detail: 端末の設定の配信元の行の読み書きの方法を取得・保存・1 行ずつ変更でき、送信しなかったときは今の値を残す
    depends_on:
      - docs/scenario/SC-4.yaml
