use_cases:
  - kind: single
    scenario: docs/scenario/SC-5.yaml
    impact: changed
    detail: 利用者が setup で配信元を登録・見直すとき、エージェントが手順のページを文書の MCP で取得して上から進める
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: changed
    detail: エージェントが作業の途中に、配信元が登録されていない端末でも、メタデータ・エイリアスを付ける基準の箇所を取得する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: changed
    detail: 配信元が無い端末で起動したときに、クローンのガイドを組み込みの配信元として配信し始める
    depends_on:
      - docs/scenario/SC-6.yaml
  - kind: single
    scenario: docs/scenario/SC-2.yaml
    impact: run_only
    detail: 入れた直後（配信元が無い状態）の端末で setup を始められることを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: following
    detail: 配信元の追加の段の流れの変更に追随する
    depends_on:
      - docs/scenario/SC-5.yaml
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: エージェントが組み込みの配信元へ書き込もうとすると、読み取りだけの配信元と同じように断られる
    depends_on:
      - docs/scenario/SC-6.yaml
