scope_out:
  - item: 書き込みの後のフックの通知から、手順と基準の該当する箇所を指す
    reason: 別の Issue の要望で、この作業 PR の手順のページを前提にする
    plan: '#199'
  - item: 手順と基準の中身（質問の既定・メタデータの段階・候補の表）の変更
    reason: 要望は置き場の移動と取得の経路で、手順の中身は変えない
    plan: none
  - item: スキル global-setup の手順の移動
    reason: 要望の対象は配信元の登録・見直しの手順（setup）だけ
    plan: none
