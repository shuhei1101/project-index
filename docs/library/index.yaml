summary: 採用ライブラリと選定理由の一覧
items:
- page: LIB-1.yaml
  summary: Starlette の上に作られた ASGI の Web フレームワーク。引数の型ヒントからリクエストを検証して受け取る。
- page: LIB-2.yaml
  summary: Model Context Protocol の公式の Python SDK。MCP のサーバーとクライアント、Streamable HTTP のトランスポートを持つ。
- page: LIB-3.yaml
  summary: Python の ASGI サーバー。ASGI アプリを HTTP で待ち受ける。
- page: LIB-4.yaml
  summary: YAML 1.2 の読み書きのライブラリ。rt モードではコメント・キーの順序・クォートを保ったまま読み書きできる。
- page: LIB-5.yaml
  summary: Python の JSON Schema の検証のライブラリ。Draft 2020-12 に対応し、`referencing` でスキーマ間の `$ref` を解決する。
- page: LIB-6.yaml
  summary: 型ヒントから値の検証と変換を行う Python のデータ検証ライブラリ。
- page: LIB-7.yaml
  summary: Markdown を検査・描画するライブラリと CLI。project-index は、文書の書き込みで Markdown の値を `mdmark check --text` で点検するためだけに使う。
- page: LIB-8.yaml
  summary: Python のテンプレートエンジン。`{{ 変数 }}`・`{% if %}`・`{% for %}` の構文で文字列を組み立てる。
- page: LIB-9.yaml
  summary: Claude Code のプロンプトに、YAML の文書から集めた用語・文書の別名・コマンドなどのエイリアスを差し込むプラグイン。エイリアスの元の行のスキーマ（`schemas/aliases.schema.yaml`）を正本として持つ。
