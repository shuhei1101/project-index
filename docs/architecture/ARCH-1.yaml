title: アーキテクチャ図
lead: project-index のサブシステムと、利用するシステム・配信元との境界。
overview:
  direction: LR
  nodes:
    - id: CC
      label: Claude Code のセッション
      kind: external
    - id: DD
      label: dev-docs の画面のサーバー
      kind: external
    - id: PLG
      label: プラグイン
      kind: system
    - id: SRV
      label: 索引のサーバー
      kind: system
    - id: SET
      label: 端末の設定
      kind: store
    - id: STATE
      label: 状態のフォルダ
      kind: store
    - id: REPO
      label: 配信元のリポジトリ
      kind: external
    - id: GIT
      label: git
      kind: external
  edges:
    - from: CC
      to: PLG
      label: フック
    - from: CC
      to: SRV
      label: MCP
    - from: DD
      to: SRV
      label: REST
    - from: PLG
      to: SRV
      label: HTTP
    - from: SRV
      to: SET
      label: 読み取り
    - from: SRV
      to: STATE
      label: 会話記録
    - from: SRV
      to: REPO
      label: ファイル
    - from: SRV
      to: GIT
      label: リビジョン
  frame:
    label: project-index
    nodes:
      - PLG
      - SRV
      - SET
      - STATE
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/project-index
  layout: '`src/project_index/`（索引のサーバー）/ `plugins/project-index/`（プラグイン）/ `.claude-plugin/marketplace.json`'
subsystems:
  - name: 索引のサーバー
    scope: server
    role: 配信元を読み込んで索引にし、文書の MCP・管理の MCP・読み取りAPI で問い合わせと書き込みを受け付け、端末の設定の API で端末の設定の配信元を保存する
    runtime: Python 3.14
    runs_on: 手元の端末で常駐する（待ち受けのポートは環境変数 `PROJECT_INDEX_PORT`、既定 8786）
  - name: プラグイン
    scope: plugin
    role: Claude Code のセッションへ MCP の接続を配り、SessionStart・PreToolUse のフックと global-setup・setup のスキルを持つ
    runtime: Python 3.14
    runs_on: Claude Code のセッションの中
external_systems:
  - name: Claude Code
    purpose: セッションと AI Monitor・aituber のエージェントが、文書の MCP・管理の MCP を呼ぶ
    direction: 受信のみ
    protocol: MCP（Streamable HTTP）
    notes:
      事前確認: 不要。受ける側で、こちらから費用や時間のかかる処理を始めない
  - name: dev-docs の画面のサーバー
    purpose: 配信元の一覧と状態・配信元の設定・文書の一覧と文書・検討事項の ID の一覧と文書・語での検索・リビジョンの一覧を読み取りAPI で返却し、端末の設定の配信元を端末の設定の API で取得・保存・1 行追加する
    direction: 受信のみ
    protocol: HTTP（REST）
    notes:
      事前確認: 不要。受ける側で、こちらから費用や時間のかかる処理を始めない
      契約: 入出力は IF-22〜IF-32 が持つ
  - name: git
    purpose: 配信元のリビジョンの解決と、過去のリビジョンのファイルの書き出し
    direction: 双方向
    protocol: 子プロセスの CLI
    notes:
      事前確認: 要。起動時に git の実行ファイルがあることを確認し、無ければ起動を止める
  - name: 配信元のスクリプト（validators・converters・generators）
    purpose: 配信元の設定のコマンドで文書を検査・変換・生成する
    direction: 双方向
    protocol: 子プロセスのコマンド
    notes:
      事前確認: 要。実行する前に、残りの制限時間が足りるかを確認し、足りなければ始めない
id: ARCH-1
visibility: internal
