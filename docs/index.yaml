  - page: nonfunctional/
    summary: 外部の制約から逆算したアプリ側の決定値
  - page: external-api/
    summary: 連携している外部 API の一覧
  - page: layout/
    summary: リポジトリのフォルダとファイルの構成
  - page: library/
    summary: 採用ライブラリと選定理由の一覧
  - page: dev-command/
    summary: 開発で使用するコマンドの分類ごとの前提・順序・確認の記録
  - page: test-procedure/
    summary: テスト種別ごとの実行方法
  - page: guide/
    summary: project-index の使い方（はじめに・使い方・リファレンス）
  - page: scenario/
    summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
  - page: interface/
