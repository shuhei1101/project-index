title: 非機能要件
lead: 外部の制約から逆算した project-index の決定値（待ち受け・上限・所要時間）を定め、これらの値を決める・変えるときに参照する。
tags:
  - name: topic:要件
    main: true
  - name: topic:制約
  - name: topic:性能
requirements:
  - id: NFR-1
    name: 対応 OS
    category: 動作環境
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: 手元の端末で常駐させる OS（WSL を含む）は、起動と常駐の仕組みを決めるモジュール構成設計で決める
  - id: NFR-2
    name: 通信
    english_name: bind_address
    category: セキュリティ
    external_constraint: 利用者の手元だけで使う（認証を持たない）
    source_kind: ユーザー要望
    source: shuhei1101/dev-docs の非機能要件『待ち受けのアドレス』
    value: 127.0.0.1
    rationale: 文書の MCP・管理の MCP・読み取り API に認証が無く、書き込みも受けるため、他の端末から届かないアドレスで待ち受ける。dev-docs の画面のサーバーも同じ端末で動き、同じアドレスへつなぐ
    status: planned
  - id: NFR-3
    name: 待ち受けのポート
    english_name: listen_port
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: '設定の設計書『設定: 索引のサーバー』の `PROJECT_INDEX_PORT`'
    value: '8786'
    overflow: 使用中のときは起動を止め、ポートと `PROJECT_INDEX_PORT` で変えられることを出す。確かめる時点は起動時
    rationale: 文書の MCP・管理の MCP・読み取り API を 1 つのポートで待ち受ける。`.mcp.json` も同じ値を読むため `PROJECT_INDEX_PORT` で上書きする。dev-docs の画面のサーバーの 8781 と重ならない番号
    status: planned
  - id: NFR-4
    name: スクリプトの制限時間
    english_name: script_timeout
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    source: shuhei1101/dev-docs の非機能要件『スクリプトの制限時間』
    value: '30'
    unit: 秒
    overflow: 制限時間を超えたスクリプトを止め、検査・変換の失敗として返す
    rationale: 検査・変換・生成のスクリプトは配信元の利用者が書くため、外部の上限は無い。dev-docs で使ってきた既定値をそのまま移す。端末の設定の `script_timeout_sec` で変えられる
    status: planned
  - id: NFR-5
    name: 検索の件数の上限
    english_name: search_limit
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '100'
    unit: 件
    overflow: 100 を超えた値は 100 に丸め、`notes` で知らせる。黙って切り捨てない
    rationale: エージェントの文脈に載せる量を抑えるため。`search_docs`・`list_changes` の `limit` の上限で、既定は 20。dev-docs の値をそのまま移す
    status: planned
  - id: NFR-6
    name: 結果全体の文字数の上限
    english_name: result_max_chars
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '40000'
    unit: 文字
    overflow: 上限を超える手前で打ち切り、`truncated` と、続きを取る `next_cursor` を返す
    rationale: エージェントの文脈に載せる量を抑えるため。`search_docs`・`list_changes` の `max_chars` の上限で、既定は 20,000。dev-docs の値をそのまま移す
    status: planned
  - id: NFR-7
    name: 1 回の操作の件数の上限
    english_name: operations_max
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '50'
    unit: 件
    overflow: 50 件を超える要求は `InvalidArgumentError` で断り、何も書かない
    rationale: 1 回の書き込み・削除で配信元の排他を握る時間と、検査の実行の時間を抑えるため。`write_docs` の `operations`・`delete_docs` の `targets` の件数の上限。dev-docs の値をそのまま移す
    status: planned
  - id: NFR-8
    name: 起動から接続を受け付けるまでの時間
    english_name: listen_start_time
    category: 可用性
    external_constraint: 再起動のスクリプトが待ち受けを待つ上限 60 秒
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/dev-docs/issues/65
    value: '20'
    unit: 秒
    overflow: 超えても起動は止めない。再起動のスクリプトが 60 秒で打ち切る
    measurement: '`project-index serve` を子プロセスで起動してから、待ち受けのポートへの TCP の接続が通るまでの時間'
    rationale: 待ち受けの前に残るのは import と端末の設定・プロンプトの YAML の読み込みだけで、dev-docs の負荷のある端末の計測で約 8 秒。配信元の読み込みと検査は待ち受けの後に回すため含めない。60 秒に対して計測値の 2 倍強を決定値にする
    status: planned
    verification:
      device: WSL2 の Ubuntu（Windows 11）
      version: Linux 6.6.87.2-microsoft-standard-WSL2
      date: '2026-11-12'
      result: 合格
  - id: NFR-9
    name: 作業範囲の外の配信元の検索の所要時間
    english_name: outside_scope_search_time
    category: 性能
    external_constraint: Claude Code の MCP のツールの呼び出しの時間切れ。shuhei1101/dev-docs#119 では 1 分を超えた呼び出しが時間切れになった
    source_kind: 実行基盤の制限
    source: https://github.com/shuhei1101/dev-docs/issues/119
    value: '10'
    unit: 秒
    measurement: '配信元 `ai-monitor`（1,212 文書）を作業範囲の外（`outside_scope: true`）に配置し、`/mcp` へ `search_docs` の 3 つの要求（name に `planner` を含む・`limit: 3`、`view: count`、body の正規表現 `(?i)changelog`・`limit: 5`）を HTTP で送信し、応答までの時間を測る'
    breakdown:
      - part: dev-docs#119 の計測（修正前）
        value: 56.1 / 85.3 / 53.8 秒
        notes: 1,467 文書。文書ごとに default_ref を git で繰り返し解決していた
      - part: 移した後の初回
        value: 30.72 秒
        notes: 1 つ目の要求。default_ref の commit の文書を初めて読み込む分を含む
      - part: 移した後の 2 回目以降
        value: 2.47 / 2.23 / 2.75 秒
        notes: 同じ commit の文書を読み込んだ後の 3 つの要求
      - part: アプリの決定値
        value: '10'
        notes: 2 回目以降の最大 2.75 秒の 3 倍強
    rationale: 1 回の要求の中で ref の解決とスキーマの読み込みを繰り返さないため、読み込んだ後の要求は文書の数によらず数秒で返る。初回の読み込みは default_ref の commit が変わったときだけで、時間切れの 1 分より短い
    overflow: 超えても止めない。時間切れになった呼び出しは Claude Code の側で失敗になる
    verification:
      device: WSL2 の Ubuntu（Windows 11）
      version: Linux 6.6.87.2-microsoft-standard-WSL2
      date: '2026-11-12'
      result: 合格
    status: planned
  - id: NFR-10
    name: 文書の MCP の応答の上限
    english_name: tool_response_limit
    category: 可用性
    external_constraint: Claude Code の HTTP の MCP サーバーへの要求 1 回の待ち時間 60 秒。サーバーの行の `timeout` と `MCP_TOOL_TIMEOUT` は 60 秒より短い値を 60 秒に切り上げる。待ち時間を過ぎると接続を切り、取り消しの通知を送信しない
    source_kind: 実行基盤の制限
    source: https://github.com/shuhei1101/project-index/blob/fix/docs-mcp/timeout-write-and-worktree-read/docs/pr/82/%E7%B4%A2%E5%BC%95%E3%81%AE%E3%82%B5%E3%83%BC%E3%83%90%E3%83%BC.md
    value: '48'
    unit: 秒
    measurement: 要求を記録するだけの HTTP の MCP サーバーに 80 秒かかるツールを配置し、Claude Code（`claude -p`）から 1 回呼び、時間切れまでの時間とサーバーが受けた要求を記録する
    breakdown:
      - part: 外部の上限
        value: '60'
        notes: Claude Code 2.1.325 の HTTP の要求の待ち時間の既定値。実測でも約 1 分で `The operation timed out.` になった
      - part: 安全率
        value: 20%
        notes: 要求の送受信と端末の負荷で、クライアントが測る時間はサーバーが測る時間より長い
      - part: アプリの決定値
        value: '48'
        notes: 60 × 0.8
    rationale: 時間切れの後もサーバーは処理を続けるため、クライアントが時間切れにする前に応答を返却する。書き込みの期限・書き込み後の生成の制限時間・ワークツリーの読み込みを待つ上限は、この値から差し引いて決める
    overflow: 上限を過ぎた応答は、Claude Code の側で時間切れになる。書き込みは期限を過ぎたらファイルを置き換えずに時間切れを返却し、読み取りはワークツリーの読み込み中である旨を返却する
    verification:
      device: WSL2 の Ubuntu（Windows 11）
      version: Linux 6.6.87.2-microsoft-standard-WSL2、Claude Code 2.1.325
      date: '2026-11-15'
      result: 合格
    status: planned
  - id: NFR-11
    name: 書き込みの期限
    english_name: write_deadline
    category: 可用性
    external_constraint: 文書の MCP の応答の上限 48 秒
    source_kind: 実行基盤の制限
    source: NFR-1#requirements[文書の MCP の応答の上限]
    value: '32'
    unit: 秒
    measurement: '`write_deadline_sec` より長く待つ検査のスクリプトを持つ種類へ `write_docs` を送信し、応答までの時間と、ファイルが書き換わっていないことを測る'
    breakdown:
      - part: 外側の待ち
        value: '48'
        notes: 文書の MCP の応答の上限
      - part: 余裕（置き換え・書き込み後の生成・応答の組み立て）
        value: '16'
        notes: 実測が無いため、内側の待ち（書き込みの期限）の 50%。置き換えから応答までの所要時間を測り、p99.9 で差し替える。生成は応答の上限までの残りの時間を制限時間にするため、余裕が足りなくても応答は上限を超えない
      - part: アプリの決定値
        value: '32'
        notes: 32 × 1.5 = 48
    rationale: 置き換えを始めた後は最後まで書き込むため、検査と置き換えの開始を期限までに収め、応答の上限を外側の待ちとする入れ子の待ち（規約『資源の値の決め方』）で導く。端末の設定の `write_deadline_sec` で変えられる
    overflow: 期限を過ぎたら、ファイルを 1 つも書き換えずに `WriteDeadlineExceededError` を返却する
    status: planned
  - id: NFR-12
    name: ワークツリーの読み込みを待つ上限
    english_name: worktree_load_wait
    category: 可用性
    external_constraint: 文書の MCP の応答の上限 48 秒
    source_kind: 実行基盤の制限
    source: NFR-1#requirements[文書の MCP の応答の上限]
    value: '22'
    unit: 秒
    measurement: 読み込みを遅らせたワークツリーを指す `search_docs` を送信し、応答までの時間を測る
    breakdown:
      - part: 外側の待ち
        value: '48'
        notes: 文書の MCP の応答の上限
      - part: 読み込んだ後の検索
        value: '10'
        notes: 作業範囲の外の配信元の検索の所要時間の決定値。読み込んだ後の検索は文書の数によらず数秒
      - part: 余裕（応答の組み立てと端末の負荷）
        value: '16'
        notes: 実測が無いため、内側の待ち（読み込みの待ち + 検索）の 50%。応答の組み立ての所要時間を測り、p99.9 で差し替える
      - part: アプリの決定値
        value: '22'
        notes: (22 + 10) × 1.5 = 48
    rationale: 読み込みを待った後に検索して応答を組み立てるため、読み込みの待ちと検索を内側の待ち、応答の上限を外側の待ちとする入れ子の待ち（規約『資源の値の決め方』）で導く。端末の設定の `worktree_load_wait_sec` で変えられる
    overflow: 上限までに読み込みが終了しなければ `WorktreeLoadingError` を返却し、読み込みは続ける。次の呼び出しは同じ読み込みの終了を待つ
    status: planned
  - id: NFR-13
    name: 同時に読み込む行の数
    english_name: load_workers
    category: 性能
    external_constraint: WSL の `/mnt/c`（9P）の行ごとの読み込みの待ちと、Python の GIL（行の読み込みの CPU の部分は同時に 1 つしか進まない）
    source_kind: 実行基盤の制限
    value: '10'
    unit: 行
    overflow: 行の数が上回る分は、読み終えたスレッドが続けて読む
    measurement: '#85 と同じ `/mnt/c` の配信元 14 件を、配信元の読み込み（`load_source`）を `ThreadPoolExecutor` で実行し、全ての行の読み込みの時間を測る'
    rationale: スループット × レイテンシ（規約『資源の値の決め方』）で導く。スループットの上限は GIL で進む CPU の部分で決まり、それより多く並べても CPU の待ちが増えるだけになる。同じ 14 件の計測で、スレッド 1 は 58.9 秒・4 は 20.8 秒・8 は 16.9 秒・10 は 14.5 秒・14 は 13.8 秒で、10 で頭打ちに近づく。ext4 の配信元 15 件は CPU の時間が実時間の大半（17.7 秒のうち 14.4 秒）で、スレッドを増やしても短くも長くもならない（1 は 14.6〜16.5 秒、8 は 15.8 秒）
    status: planned
    breakdown:
      - part: 行ごとの読み込みの時間（レイテンシ）
        value: '4.05'
        notes: スレッド 1 で 14 件を読み込んだ実時間 56.7 秒 ÷ 14。CPU の時間と同じ回の計測で、rationale のスレッド 1 の 58.9 秒はスレッドの数を変えた別の回
      - part: 行ごとの CPU の時間
        value: '0.44'
        notes: スレッド 1 の CPU の時間（`time.process_time`）6.1 秒 ÷ 14。GIL のため、この部分は並列にしても足し合わせになる
      - part: スループットの上限
        value: '2.3'
        notes: 1 ÷ 0.44（行 / 秒）
      - part: アプリの決定値
        value: '10'
        notes: 2.3 × 4.05 = 9.3 を切り上げる
    verification:
      device: WSL2 の Ubuntu（Windows 11）
      version: Linux 6.6.87.2-microsoft-standard-WSL2
      date: '2026-11-17'
      result: 合格
  - id: NFR-14
    name: 文書の一覧の応答時間
    english_name: document_list_response_time
    category: 性能
    external_constraint: dev-docs の画面のサーバーが文書の一覧の問い合わせを打ち切る 45 秒
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/project-index/pull/171#discussion_r4603214753
    value: '0.5'
    unit: 倍（変更の前の計測に対する比）
    measurement: 端末の設定の複製・空の状態フォルダで起動し、裏の検査と書き出しを止めて、約 5 秒後から 14 件の配信元の `GET /sources/{source}/docs?values=true&common_keys=true` を 2 回ずつ取得する。変更の前と後を同じ時間帯に 3 回ずつ測り、中央値で比べる
    breakdown:
      - part: dev-docs の 1 回目
        value: 0.5 倍以下
        notes: 変更の前 17.83 秒（PoC の計測）
      - part: ほかの配信元の 1 回目
        value: 1.2 倍以下
        notes: 待ちをほかの配信元へ移さない
      - part: ai-monitor の 1 回目
        value: 0.5 倍以下
        notes: 変更の前 13.80 秒
      - part: ai-monitor の 2 回目
        value: 0.5 倍以下
        notes: 変更の前 1.14 秒
    rationale: 端末の負荷で秒数が揺れるため、同じ時間帯に測った変更の前の値に対する比で決める。PoC で、取り合いの除去・C の YAML の読み込み・照合とスキーマの使い回しを入れた構成がどの基準も大きな余裕で満たした（dev-docs 0.05 倍・ほかは 0.27〜0.48 倍・ai-monitor 0.31 倍と 0.11 倍）。秒数の上限は決めない
    overflow: 超えても止めない。45 秒を超えた問い合わせは dev-docs の画面の側で打ち切られる
    status: planned
  - id: NFR-15
    name: 直コミットの取り込みとプッシュの所要時間の余裕
    english_name: direct_commit_network_margin
    category: 可用性
    external_constraint: 文書の MCP の応答の上限 48 秒
    source_kind: 実行基盤の制限
    source: NFR-1#requirements[文書の MCP の応答の上限]
    value: '8'
    unit: 秒
    measurement: プッシュを止めた後に、リモートの追跡ブランチの取得・コミットの取り消し・ファイルの戻し・応答の組み立てを終えるまでの時間を、GitHub のリモートで 10 回測る
    breakdown:
      - part: 外側の待ち
        value: '48'
        notes: 文書の MCP の応答の上限
      - part: 止めたプッシュの確認（リモートの追跡ブランチの取得）
        value: '5'
        notes: 実測が無いため、小さなリポジトリの取得の見込み。測って p99.9 で差し替える
      - part: 戻しと応答の組み立て
        value: '3'
        notes: コミットの取り消しと書き込んだファイルの戻しは手元の git だけで終わる
      - part: アプリの決定値
        value: '8'
        notes: 5 + 3
    rationale: 取得は書き込みの期限の中で止める。プッシュはファイルの置き換えの後に始まるため、応答の上限までの残りの時間から、止めたプッシュの確認と戻しと応答の組み立ての分を除いた時間をプッシュの制限時間にする（規約『資源の値の決め方』の入れ子の待ち）
    overflow: プッシュを制限時間で止め、リモートにコミットが入っていなければ戻して `PushFailedError` を返却する
    status: planned
  - id: NFR-16
    name: 直コミットのプッシュの所要時間
    english_name: direct_commit_push_time
    category: 可用性
    external_constraint: 文書の MCP の応答の上限 48 秒のうち、書き込みの期限 32 秒の後に残る 16 秒
    source_kind: 実行基盤の制限
    source: NFR-1#requirements[書き込みの期限]
    value: '5'
    unit: 秒
    measurement: GitHub のリモートへ、1 ファイルを変えたコミットのプッシュを 10 回行い、それぞれの所要時間を測る
    breakdown:
      - part: 書き込みの期限の後に残る時間
        value: '16'
        notes: 48 − 32
      - part: 直コミットの取り込みとプッシュの所要時間の余裕
        value: '8'
        notes: NFR-15
      - part: 生成とコミットに残す時間
        value: '3'
        notes: 文書の一覧を書き出す程度の生成と、手元の git のコミット
      - part: アプリの決定値
        value: '5'
        notes: 16 − 8 − 3。実測が無いため、小さなコミットのプッシュの見込みと合うかを測って確認する
    rationale: プッシュと生成はファイルの置き換えの後に進むため、書き込みの期限の後に残る時間を、生成・プッシュ・余裕で分ける（規約『資源の値の決め方』の入れ子の待ち）。生成の制限時間は、応答の上限までの残りからこの値と余裕を除いた時間
    overflow: 生成の時間が残らなければ生成を実行せずに戻して `DirectCommitGeneratorError`、プッシュは応答の上限までの残りから余裕を除いた時間で止める
    status: planned
  - id: NFR-17
    name: 負荷の高い間の文書 1 件の取得の所要時間
    english_name: document_get_time_under_load
    category: 性能
    external_constraint: dev-docs の画面は文書を差分つきで開くたびに文書 1 件の取得を待つ。ロードアベレージが 8 コアで 15 の間に約 7.8 秒かかった（shuhei1101/project-index#215）
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/project-index/issues/215
    value: '0.1'
    unit: 倍（変更の前の計測に対する比）
    measurement: 配信元 ai-monitor と knowledge だけの端末の設定と空の状態フォルダで、同じプロセスに CPU を使用し続けるスレッドを 8 本立て、`ref` に `c9cd618aa`（shuhei1101/ai-monitor#3693 のブランチ）を指した `docs/data/DATA-3694-1.yaml` と、`ref` を省いた `docs/data/DATA-3430-1.yaml` の文書の取得のサービスと応答の直列化を交互に 4 回ずつ呼び、2 回目以降の中央値を測る。変更の前と後を同じ時間帯に測って比べる
    breakdown:
      - part: 変更の前（スレッド 0 本）
        value: 0.080 秒
        notes: 読み込みの照合 0.061 秒・リビジョンの解決 0.012 秒・文書の引き当て 0.013 秒
      - part: 変更の前（スレッド 8 本）
        value: 17.45 秒
        notes: 読み込みの照合 13.1 秒・リビジョンの解決 1.12 秒。CPU の時間が 0.1 秒に満たない処理が GIL の取り合いで延びる
      - part: 試作（スレッド 8 本）
        value: 0.33 秒
        notes: 読み込みの結果とパスの索引を使い回した。残りは git の 1 回の呼び出し
      - part: アプリの決定値
        value: 0.1 倍以下
        notes: 試作の 0.02 倍に対して余裕を持たせる
      - part: 変更の前（スレッド 0 本・交互）
        value: 1.23〜1.34 秒
        notes: 読み込みの照合。交互にしないときの 0.061 秒の約 20 倍で、commit が切り替わるたびに照合と読み込み直しが走る。応答は 21,997 バイト（HTTP では 33,837 バイト）で、直列化は 1 ミリ秒に満たない。報告の約 744KB は project-index の応答では再現しない
      - part: 稼働中のサーバー（交互）
        value: 8.8 秒 / 0.5 秒
        notes: '`ref=c9cd618aa` の取得は、ほかの commit の要求を挟んだ後の 1 回目が 8.8 秒、続けた取得が 0.5 秒前後'
      - part: 変更の前（スレッド 8 本・交互）
        value: ref あり 504 秒 / ref なし 685 秒
        notes: origin/develop（c79ecf5）の 2 周目。`timeout 3300` 秒の中で 2 周目まで終えた（1 周目は 44.6 秒 / 367 秒。初回の読み込みの直後で ref ありだけ照合が済んでいた）
      - part: 変更の後（スレッド 8 本・交互）
        value: ref あり 0.80 秒 / ref なし 0.48 秒
        notes: a8bdf97 の 4 周の 2 周目以降の中央値。変更の前に対して 0.0016 倍 / 0.0007 倍で、決定値の 0.1 倍以下を満たす。残りはリビジョンの解決の git の 1 回の呼び出しと応答の組み立て
    rationale: 同じプロセスの文書の MCP・ワークツリーの読み込み・裏の検査が CPU を使用する間、要求のスレッドは GIL を待つ。待ちは要求の中で Python が進む量に比例するため、要求ごとに配信元の全てのファイルを照合せず、同じ commit の読み込みの結果を使い回して進む量を減らす。端末の負荷で秒数が揺れるため、同じ時間帯に測った変更の前の値に対する比で決める
    overflow: 超えても止めない。dev-docs の画面の表示が遅れる
    status: planned
  - id: NFR-18
    name: 管理の MCP の実行スロットの数
    english_name: admin_executor_workers
    category: 可用性
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '2'
    unit: 本
    overflow: 2 本とも使用中のときは、次の管理の MCP の要求は空くまで待つ。文書の MCP・読み取り API の実行スロットは使用しない
    rationale: '管理の MCP の要求は利用者の手で 1 件ずつ呼ぶため、同時に動くのは長い処理（`check_project`・`update` 等）1 件と、その間の `status`・`restart` 1 件まで。文書の MCP と同じ既定の実行スロットを使用すると、文書の MCP が詰まっている間 `status`・`restart` も待つ（PR #236 の PoC 結果の No.4）'
    status: planned
