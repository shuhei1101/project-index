lead: 利用者が `/project-index:setup [path]` で、フォルダを配信元として端末の設定に並べ、文書の MCP で読めるようにする。2 回目以降は範囲のファイルの増減・改名を管理用の YAML に合わせる。
issue: 14
primary_actor: 利用者
stakeholders:
- name: 利用者
  interest: どの作業場所から読み書きできるかを質問に答えるだけで決められ、書き込む前に内容を表で確かめられる
- name: エージェント（Claude Code）
  interest: 追加した配信元を、セッションを張り直さずに `describe` と `search_docs` で使える
trigger: 利用者が `/project-index:setup [path]` を実行する（path を省くと今の作業場所）
preconditions:
- '`/project-index:global-setup` を済ませ、project-index が待ち受けている'
- path のフォルダが YAML の文書とそのスキーマを持つ（git リポジトリか Git 管理外のフォルダ）
success_guarantee: 端末の設定の `sources` に配信元の行があり、`check_project` が違反を返さない。`reload` の後、`scope.read` に当たる作業場所の `describe` がその配信元を返す。
minimal_guarantee: '`check_project` が違反を返したときと、利用者が確認の表を断ったときは、端末の設定を書き換えない。既にある配信元の配信は止まらない。'
frequency: 配信元ごとに 1 回。範囲のファイルを大きく増減・改名したとき
priority: 高
refs:
- SC-1#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_配信元を追加する.py
