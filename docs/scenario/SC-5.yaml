- name: 正常シナリオ（2 回目以降で行の exclude に当たるファイルがある）
  setup:
  - name: Mock
    description: なし（実環境で実行）
    notes: '-'
  - name: 管理用の YAML を 2 行持つ配信元
    description: '`project-index.yaml` が、管理用の YAML を読む行 `src`（`paths: [src/files.yaml]`・`records: files`・`body_file: path`・`exclude: [README.md]`）と行 `tools`（`paths: [tools/files.yaml]`・`records: files`・`body_file: path`。`exclude` なし）を持ち、端末の設定に登録済みの git リポジトリ'
    notes: 2 つの管理用の YAML は、どちらも今あるファイルを全て行に持つ
  - name: 追加したファイル
    description: '`src/README.md`・`src/new.py`・`tools/README.md` を追加して commit し、その commit でワークツリーを作る'
    notes: '`src/README.md` は行 `src` の `exclude` に当たり、`tools/README.md` はどの行の `exclude` にも当たらない'
  flow: |-
    ```mermaid
    sequenceDiagram
      actor U as 利用者
      participant SK as setup のスキル
      participant CL as project-index の CLI
      participant DM as 文書の MCP
      participant AD as 管理の MCP

      U->>SK: 配信元のワークツリーで /project-index:setup
      SK->>SK: 既にある sources の行と管理用の YAML を読む
      SK->>CL: project-index files --root {配信元のパス} --paths src/** --exclude README.md
      CL-->>SK: 行 src の載せるファイル
      SK->>CL: project-index files --root {配信元のパス} --paths tools/**
      CL-->>SK: 行 tools の載せるファイル
      SK->>SK: 行ごとに、載せるファイルと管理用の YAML の行を突き合わせる
      SK-->>U: 追加の行を表で示して確かめる
      U-->>SK: 了承
      SK->>DM: write_docs（管理用の YAML の行を追加する）
      SK->>AD: check_project
      AD-->>SK: 索引の同期の件数 0
      SK->>AD: reload
      SK-->>U: 追加した行と結果を出す
    ```
  expected:
