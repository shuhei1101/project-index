        description: '`正常シナリオ（仮のメタデータを段階的に付ける）` を終えた後の配信元'
        notes: その後に `docs/guide.md` の見出しと本文を書き換えて commit し、`src/tasks.py` に関数を追加して commit せずに置く。`docs/en.md` は変えない
    flow: |-
      <!-- map: {"title": "正常シナリオ（2 回目以降で中身が変わったファイルを見直す）"} -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant CL as project-index の CLI
        participant DM as 文書の MCP
        participant AD as 管理の MCP

        U->>SK: 配信元のワークツリーで /project-index:setup
        SK->>SK: 既にある sources の行と管理用の YAML を参照する
        SK->>CL: 確認の時点の後に中身が変わったファイルを引く
        CL-->>SK: docs/guide.md・src/tasks.py
        SK->>CL: 変わったファイルのアウトラインを取り出す
        SK-->>U: 変わったファイルの今のメタデータと新しい案を並べた表で示して確かめる
        U-->>SK: docs/guide.md の案だけを了承
        SK->>DM: write_docs（了承された行を書き換える）
        SK->>SK: 確認の時点を記録し直す
        SK->>AD: check_project
        SK->>AD: reload
        SK-->>U: 書き換えた行と結果を出す
      ```

      <!-- /map -->
    expected:
      - 見直しの表に `docs/guide.md` と `src/tasks.py` が出て、`docs/en.md` は出ない（commit していない作業ツリーの変更も対象に入る）
      - 変わっていないファイルは中身を参照しない
      - 見直しの表の各行に、今の値と新しい案が並ぶ
      - 了承した `docs/guide.md` の行だけが書き換わり、`src/tasks.py` の行は元の値のまま
      - 確認の時点が今の時点に進む
    test: test_normal_when_rerun_with_changed_files
  - name: 正常シナリオ（確認の時点の記録が無い配信元の 2 回目以降）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 記録の無い配信元
        description: 管理用の YAML を持ち、確認の時点の記録を持たない登録済みの配信元。管理用の YAML を最後に変更した commit の後に 1 件の Markdown の中身を変えて commit する
        notes: Git 管理外のフォルダでも同じく、管理用の YAML の変更日時より後に 1 件を変更する
    flow: |-
      <!-- map: {"title": "正常シナリオ（確認の時点の記録が無い配信元の 2 回目以降）"} -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant CL as project-index の CLI

        U->>SK: /project-index:setup {配信元のパス}
        SK->>CL: 確認の時点の後に中身が変わったファイルを引く
        CL-->>SK: 記録が無いため、管理用の YAML を最後に変更した commit（Git 管理外は変更日時）からの変更
        SK-->>U: 変わったファイルの今のメタデータと新しい案を並べた表で示して確かめる
      ```

      <!-- /map -->
    expected:
      - 見直しの表に、変更した 1 件だけが出る
      - Git 管理外のフォルダでは、管理用の YAML の変更日時より後に変更した 1 件だけが出る
    test: test_normal_when_rerun_without_checkpoint
lead: 利用者が `/project-index:setup` でフォルダを配信元として登録し、管理用の YAML を範囲のファイルに合わせるシナリオを定め、配信元の追加の流れを変えるときに参照する。
