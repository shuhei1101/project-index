id: SC-15
title: 手元のセッションが直コミットで登録する
lead: 利用者と話している手元のセッションが、配信元のフォルダの外部の作業場所から、直コミットを許可した種類の文書を `write_docs`・`delete_docs` で書き込み、既定のブランチへコミットしてプッシュするシナリオを定め、直コミットの流れを変えるときに参照する。
primary_actor: 手元のセッション（利用者と話している Claude Code）
stakeholders:
  - name: 利用者
    interest: Issue と作業 PR を経ずに、レビューの要らないデータを登録した直後からリモートに残せる
  - name: 手元のセッション
    interest: 配信元のフォルダの外部の作業場所から、書き込みからコミット・プッシュまでを 1 回の呼び出しで終えられる
  - name: 配信元のリポジトリ
    interest: 直コミットを許可した種類の文書だけが、検査に合格した内容で、既定のブランチに 1 コミットずつ入る。ワークツリーにある他の変更と、許可していない種類の文書は入らない
trigger: 手元のセッションが、`commit` を指定した `write_docs`・`delete_docs` を呼ぶ
preconditions:
  - 配信元の読み書きの方法が `git` で、直コミットの設定を持つ
  - 直コミットの設定のコミットするブランチを指すワークツリーが、配信元の `worktrees` に該当する
  - 索引のサーバーを動かしている利用者の Git の認証で、リモートへプッシュできる
success_guarantee: 直コミットを許可した種類の文書が、検査と秘密の値の検査に合格した内容で、コミットするブランチのリモートに 1 コミットで入る。結果にコミットの SHA・ブランチ・文書のバージョンが返る。コミットに入るのは、その呼び出しが書き込んだファイルと生成物だけ。
minimal_guarantee: '断られた呼び出しは、リモートを変えず、ワークツリーにこの呼び出しが書き込んだ変更を残さない。ワークツリーにあった未プッシュのコミットと未コミットの変更は消さない。断ったときは `isError: true` で理由を返却する。'
frequency: 利用者と話しながらデータを登録するたび
priority: 高
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。フックが入れる `cwd`・`session_id`・`agent_id` はテストが引数に入れる）
      - name: サンプルの配信元
        description: 種類 `note`（直コミットを許可する）と種類 `rule`（許可しない）のスキーマと YAML と、文書の一覧を書き出す `generators[]` と、`project-index.yaml` を持つ git リポジトリ（クローン本体は `master`）と、2 つのワークツリー（`.claude/worktrees/x` と、`develop` を指す `.claude/worktrees/develop`。どちらも sample の `worktrees` に該当する）
        notes: id `sample`。`scope.read`・`scope.write` は sample のフォルダ
      - name: sample のリモート
        description: テスト用の一時フォルダのベアリポジトリ。sample の `origin` で、`master` と `develop` を持つ
        notes: '`develop` のワークツリーの HEAD は `origin/develop` と同じで、未コミットの変更が無い'
      - name: 直コミットの設定
        description: sample の種類 `note` の直コミットを許可し、コミットするブランチを `develop`、呼べる作業場所を手元の作業場所にする
      - name: 手元の作業場所
        description: テスト用の一時フォルダの中の空のフォルダ
        notes: sample の `scope.read`・`scope.write` に該当しない。直コミットの呼べる作業場所に該当するため、sample の `describe` と、develop のワークツリーを読む `search_docs` は使用できる。`cwd` にこのパスを入れる
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      sequenceDiagram
        actor A as 手元のセッション
        participant M as 文書の MCP（/mcp）
        participant WT as develop のワークツリー
        participant R as sample のリモート

        A->>M: describe(source: sample)
        M->>M: cwd が直コミットの呼べる作業場所に該当する
        M-->>A: 種類の一覧と、直コミットを許可した種類 note
        A->>M: write_docs(source: sample, operations: create・kind note, commit: message)
        M->>M: 直コミットの設定で、種類 note と cwd が許可に該当することを確認する
        M->>M: リポジトリの排他を取る
        M->>R: 最新を取得する
        M->>WT: origin/develop を早送りで取り込む
        M->>M: HEAD が origin/develop と同じで、書き込むファイルと生成物に未コミットの変更が無いことを確認する
        M->>M: スキーマと validators に通し、秘密の値が無いことを確認する
        M->>WT: 文書を書き込み、generators を実行する
        M->>WT: 書き込んだファイルと生成物だけをコミットする
        M->>R: develop をプッシュする
        M->>M: 排他を放す
        M-->>A: 作った文書の id と version、コミットの SHA とブランチ
      ```

      <!-- /map -->
    expected:
      - '結果が `applied: true` で、文書の `status` が `created`、コミットの SHA とブランチ `develop` を返却する'
      - sample のリモートの `develop` に 1 コミットが増え、その SHA が結果の SHA と一致する。コミットの説明は `commit.message` で、変更は作った文書のファイルと `generators[]` の生成物だけ
      - develop のワークツリーの HEAD が `origin/develop` と同じで、`git status` に作った文書のファイルと生成物が出ない
      - sample のワークツリー x とクローン本体は変わらない
      - '引数なしの `describe` の sample の行と `describe(source: sample)` が、直コミットを許可した種類として `note` を返却する'
      - '手元の作業場所から呼んだ `search_docs(source: sample)` が、develop のワークツリーの作った文書と結果の `version` を返却する'
    test: test_normal
  - name: 正常シナリオ（ワークツリーに他の未コミットの変更がある）
    setup:
      - name: Mock
        description: なし（実環境で実行。フックが入れる `cwd`・`session_id`・`agent_id` はテストが引数に入れる）
      - name: サンプルの配信元
        description: 種類 `note`（直コミットを許可する）と種類 `rule`（許可しない）のスキーマと YAML と、文書の一覧を書き出す `generators[]` と、`project-index.yaml` を持つ git リポジトリ（クローン本体は `master`）と、2 つのワークツリー（`.claude/worktrees/x` と、`develop` を指す `.claude/worktrees/develop`。どちらも sample の `worktrees` に該当する）
        notes: id `sample`。`scope.read`・`scope.write` は sample のフォルダ
      - name: sample のリモート
        description: テスト用の一時フォルダのベアリポジトリ。sample の `origin` で、`master` と `develop` を持つ
        notes: '`develop` のワークツリーの HEAD は `origin/develop` と同じで、未コミットの変更が無い'
      - name: 直コミットの設定
        description: sample の種類 `note` の直コミットを許可し、コミットするブランチを `develop`、呼べる作業場所を手元の作業場所にする
      - name: 手元の作業場所
