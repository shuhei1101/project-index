        notes: '`.claude/worktrees/data` は sample の `worktrees` に該当する。直コミットの設定のコミットするブランチは `develop` のままで、上書きできるブランチ（`direct_commit.branches[]`）に `data` を記載する'
    flow: |-
      <!-- map: {"title": "正常シナリオ（コミットするブランチを上書きする）"} -->

      ```mermaid
      sequenceDiagram
        actor A as 手元のセッション
        participant M as 文書の MCP（/mcp）
        participant WT as develop のワークツリー
        participant R as sample のリモート

        A->>M: write_docs(source: sample, operations: create・kind note, commit: message・branch data)
        M->>M: data が上書きできるブランチに該当し、data を指すワークツリーが worktrees に該当することを確認する
        M->>R: 最新を取得し、data のワークツリーへ origin/data を早送りで取り込む
        M->>M: 書き込み・コミット
        M->>R: data をプッシュする
        M-->>A: コミットの SHA とブランチ data
      ```

      <!-- /map -->
    expected:
      - sample のリモートの `data` に作った文書のコミットが 1 つ増え、結果のブランチが `data` になる
      - sample のリモートの `develop` と、develop のワークツリーは変わらない
      - '`commit` のブランチに、上書きできるブランチに該当しない `master` を指定した呼び出しは、`isError: true` で上書きできないブランチであることを返却し、sample のリモートと全てのワークツリーは変わらない'
      - '`commit` のブランチに、上書きできるブランチに該当するがワークツリーの無いブランチを指定した呼び出しは、異常シナリオ（コミットするブランチのワークツリーが無い）と同じく断られる'
    test: test_normal_when_branch_overridden
  - name: 正常シナリオ（文書を消す）
    setup:
      - name: Mock
        description: なし（実環境で実行。フックが入れる `cwd`・`session_id`・`agent_id` はテストが引数に入れる）
      - name: サンプルの配信元
