        notes: sample の `scope.read`・`scope.write` に該当しない。直コミットの呼べる作業場所に該当するため、sample の `describe` と、develop のワークツリーを読む `search_docs` は使用できる。`cwd` にこのパスを入れる
      - name: 消す文書
        description: sample の `develop` にコミット済みの種類 `note` の文書 1
    flow: |-
      <!-- map: {"title": "正常シナリオ（文書を消す）"} -->

      ```mermaid
      sequenceDiagram
        actor A as 手元のセッション
        participant M as 文書の MCP（/mcp）
        participant WT as develop のワークツリー
        participant R as sample のリモート

        A->>M: search_docs(source: sample, filter: id が文書 1)
        M-->>A: develop のワークツリーの文書 1 と version
        A->>M: delete_docs(source: sample, targets: 文書 1・expected_version, commit: message)
        M->>M: 正常シナリオと同じ確認・排他・取り込み
        M->>WT: 文書 1 のファイルを消し、generators を実行する
        M->>WT: 消したファイルと生成物だけをコミットする
        M->>R: develop をプッシュする
        M-->>A: 消した文書と、コミットの SHA
      ```

      <!-- /map -->
    expected:
      - sample のリモートの `develop` に、文書 1 のファイルの削除と生成物の変更だけを含む 1 コミットが増え、結果の SHA と一致する
      - develop のワークツリーに文書 1 のファイルが無く、`git status` に変更が出ない
    test: test_normal_when_delete
  - name: 正常シナリオ（リモートが先に進んでいる）
    setup:
      - name: Mock
        description: なし（実環境で実行。フックが入れる `cwd`・`session_id`・`agent_id` はテストが引数に入れる）
