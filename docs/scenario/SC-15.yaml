      <!-- /map -->
    expected:
      - sample のリモートの `develop` が、先にプッシュしたコミットの上に、作った文書のコミットを 1 つ持つ
      - 結果が、プッシュをやり直していないことを返却する
    test: test_normal_when_remote_ahead
