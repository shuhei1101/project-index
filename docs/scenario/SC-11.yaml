id: SC-11
title: 画面のサーバーが文書を読む
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。dev-docs の画面のサーバーの代わりにテストのコードが読み取り API を HTTP で呼ぶ）
      - name: サンプルの配信元
        description: 文書の種類を 3 つ（同じファイルの `$defs` の循環しない定義を `$ref` で指すスキーマを持つ種類の YAML 2 件、`files.yaml` を `records`・`body_file` で指す種類、`terms.yaml` を `body_file` の無い `records` で指す種類）と、`nav`・`decisions.folders`・`github`・`diff` を持つ `project-index.yaml` を持つ git リポジトリ。`default_ref` は `main`
        notes: id `sample`。文書 1 を変えた commit が `main` の最新で、その親の commit では文書 1 の `title` が違う。`decisions.folders` の 1 つのフォルダに検討事項の文書 `D-1` を置く。管理用の YAML `files.yaml` の行の文書として Markdown `guide.md` を置く。本文のファイルを持たない行の文書 `term-1`・`term-2` を 1 つの管理用の YAML `terms.yaml` に配置する
      - name: project-index
        description: sample を端末の設定に並べて起動した project-index
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      sequenceDiagram
        participant DD as dev-docs の画面のサーバー
        participant PI as project-index（読み取り API）
        participant SRC as sample

        DD->>PI: 配信元の一覧と状態を取得する
        PI-->>DD: sample が配信中
        DD->>PI: sample の配信元の設定を、解いたスキーマを求めて取得する
        PI-->>DD: nav・documents[]・decisions.folders・github・diff と、種類ごとの $ref を解いたスキーマ
        DD->>PI: sample の文書の一覧を、値とバージョンを求めて取得する（リビジョンを省く）
        PI-->>DD: 文書ごとの ID・パス・種類・メタデータ・値・バージョン
        DD->>PI: sample の文書 1 を取得する（リビジョンを省く）
        PI->>SRC: default_ref の文書 1 を読み込む
        PI-->>DD: 文書の値・種類のスキーマ・メタデータ
        DD->>PI: 文書 1 を親の commit を指して取得する
        PI-->>DD: 親の commit の文書の値
        DD->>PI: sample の文書の一覧を、値とバージョンを求めて親の commit を指して取得する
        PI-->>DD: 親の commit の文書ごとの値・バージョン
        DD->>PI: sample のリビジョンの一覧を取得する
        PI-->>DD: ブランチ・タグ・最近の commit
        DD->>PI: sample の文書を単語で検索する
        PI-->>DD: 当たった文書と一致した箇所
        DD->>PI: 本文のファイル guide.md のパスを指して文書を取得する
        PI-->>DD: 行の値・メタデータ・本文の文字列・本文のファイルのパス
        DD->>PI: sample の文書を term-2 だけが含む単語で検索する
        PI-->>DD: term-2 の文書の ID と文書のファイルのパス terms.yaml
        DD->>PI: 検索の結果のファイルのパス terms.yaml と文書の ID term-2 を指して文書を取得する
        PI-->>DD: term-2 の行の値・メタデータ
        DD->>PI: sample の検討事項の ID の一覧を取得する
        PI-->>DD: D-1 と、当たるフォルダの数 1
        DD->>PI: 検討事項 D-1 の文書を取得する
        PI-->>DD: D-1 の文書の本文
      ```

      <!-- /map -->
    expected:
      - 配信元の一覧が sample を配信中として返却する
      - 配信元の設定が、`project-index.yaml` の `nav`・`documents[]`・`decisions.folders`・`github` を返却する
      - 配信元の設定が、`project-index.yaml` の `diff` と、参照先の定義が展開され `$ref` が残らない種類のスキーマを返却する
      - 文書の一覧が、`main` の文書 5 件（YAML 2 件と行の文書 3 件）の ID・パス・種類・メタデータを返却する
      - 値とバージョンを求めた文書の一覧が、各文書の値と、文書 1 の取得の値と同じ値を返却し、文書 1 のバージョンは親の commit を指した文書の一覧のバージョンと違う
      - 文書 1 の取得が、`main` の文書 1 の値・種類のスキーマ・メタデータ（ID・種類・名前・概要）を返却する
      - 親の commit を指した文書 1 の取得が、親の commit の `title` の値を返却する
      - リビジョンの一覧が `main` と、文書 1 を変えた commit を含む最近の commit を返却する
      - 単語での検索が、その単語を含む sample の文書と一致した箇所を返却する
      - '`guide.md` のパスを指した文書の取得が、`files.yaml` の行の値・メタデータと、`guide.md` の本文の文字列・本文のファイルのパスを返却する'
      - '`term-2` だけが含む単語での検索が、`term-2` の文書の ID と文書のファイルのパス `terms.yaml` を返却する'
      - '`terms.yaml` のパスと文書の ID `term-2` を指した文書の取得が、`term-1` ではなく `term-2` の行の値・メタデータを返却する'
      - 検討事項の ID の一覧が、`D-1` を当たるフォルダの数 1 で返却する
      - 検討事項の文書の取得が、D-1 の文書の本文を返却する
      - 読み取り API の呼び出しは、sample のフォルダのファイルを変えない
    test: test_normal
  - name: 正常シナリオ（変換のスクリプトを指す種類の文書）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 変換を持つ配信元
        description: '`converters[]` を指す種類を持つ配信元。種類の文書 3 は変換のスクリプトが Markdown を出し、文書 4 は変換のスクリプトが失敗する'
        notes: id `sample`
      - name: project-index
        description: sample を端末の設定に並べて起動した project-index
    flow: |-
      <!-- map: {"title": "正常シナリオ（変換のスクリプトを指す種類の文書）"} -->

      ```mermaid
      sequenceDiagram
        participant DD as dev-docs の画面のサーバー
        participant PI as project-index（読み取り API）

        DD->>PI: sample の文書 3 を取得する
        PI->>PI: converters[] のスクリプトで変換する
        PI-->>DD: スクリプトが出した Markdown
        DD->>PI: sample の文書 4 を取得する
        PI-->>DD: 変換の失敗（スクリプトと理由）
      ```

      <!-- /map -->
    expected:
      - 文書 3 の取得が、変換のスクリプトが出した Markdown とメタデータを返却する
      - 文書 4 の取得が、変換の失敗に変換のスクリプトと失敗の理由を入れて返却する
      - 文書 4 の失敗の後も、配信元の一覧は sample を配信中として返却する
    test: test_normal_when_converter_kind
  - name: 異常シナリオ（配信していない配信元を指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 正常シナリオと同じ配信元
        notes: id `sample`
      - name: 壊れた配信元
        description: '`project-index.yaml` がスキーマに違反する配信元'
        notes: id `broken`。`documents[]` の必須のキーが無い
      - name: project-index
        description: sample と broken を端末の設定に並べて起動した project-index
    flow: |-
      <!-- map: {"title": "異常シナリオ（配信していない配信元を指す）"} -->

      ```mermaid
      sequenceDiagram
        participant DD as dev-docs の画面のサーバー
        participant PI as project-index（読み取り API）

        DD->>PI: 配信元の一覧と状態を取得する
        PI-->>DD: broken は配信していない（理由つき）
        DD->>PI: broken の文書を取得する
        PI-->>DD: 404（配信していない配信元）
        DD->>PI: broken のリビジョンの一覧を取得する
        PI-->>DD: 404（配信していない配信元）
        DD->>PI: broken の文書を単語で検索する
        PI-->>DD: 404（配信していない配信元）
        DD->>PI: sample の文書 1 を取得する
        PI-->>DD: 文書の値
      ```

      <!-- /map -->
    expected:
      - 配信元の一覧が broken を配信していない配信元として、違反したキーのパスと理由つきで返却する
      - broken の文書の取得・リビジョンの一覧・単語での検索が、配信していない配信元として 404 を返却する
      - sample の文書 1 の取得は文書の値を返却する
    test: test_error_when_source_not_served
  - name: 異常シナリオ（無いリビジョンを指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 正常シナリオと同じ配信元
        notes: id `sample`
      - name: project-index
        description: sample を端末の設定に並べて起動した project-index
    flow: |-
      <!-- map: {"title": "異常シナリオ（無いリビジョンを指す）"} -->

      ```mermaid
      sequenceDiagram
        participant DD as dev-docs の画面のサーバー
        participant PI as project-index（読み取り API）

        DD->>PI: sample の文書 1 を、無いブランチ名を指して取得する
        PI-->>DD: 無いリビジョンのエラー
        DD->>PI: sample の文書の一覧を、無いブランチ名を指して取得する
        PI-->>DD: 無いリビジョンのエラー
      ```

      <!-- /map -->
    expected:
      - 文書の取得と文書の一覧が、指したリビジョンが無いことをリビジョンの名前つきでエラーとして返却する
      - sample のフォルダのファイルとブランチは変わらない
    test: test_error_when_ref_not_found
  - name: 異常シナリオ（無い文書のパスを指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 正常シナリオと同じ配信元
        notes: id `sample`
      - name: project-index
        description: sample を端末の設定に並べて起動した project-index
    flow: |-
      <!-- map: {"title": "異常シナリオ（無い文書のパスを指す）"} -->

      ```mermaid
      sequenceDiagram
        participant DD as dev-docs の画面のサーバー
        participant PI as project-index（読み取り API）

        DD->>PI: sample の範囲に無いパスの文書を取得する
        PI-->>DD: 404（文書が無い）
      ```

      <!-- /map -->
    expected:
      - 文書の取得が、文書が無いことを 404 で返却する
    test: test_error_when_path_not_found
  - name: 異常シナリオ（検討事項の文書が 1 つに決まらない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 正常シナリオと同じ配信元に、`decisions.folders` の 2 つのフォルダへ同じ ID `D-2` の文書を置いた状態
        notes: id `sample`。`D-3` の文書はどのフォルダにも無い
      - name: project-index
        description: sample を端末の設定に並べて起動した project-index
    flow: |-
      <!-- map: {"title": "異常シナリオ（検討事項の文書が 1 つに決まらない）"} -->

      ```mermaid
      sequenceDiagram
        participant DD as dev-docs の画面のサーバー
        participant PI as project-index（読み取り API）

        DD->>PI: sample の検討事項の ID の一覧を取得する
        PI-->>DD: D-2 と、当たるフォルダの数 2
        DD->>PI: 検討事項 D-2 の文書を取得する
        PI-->>DD: 1 つに決まらないエラー（2 つのフォルダ）
        DD->>PI: 検討事項 D-3 の文書を取得する
        PI-->>DD: 404（文書が無い）
      ```

      <!-- /map -->
    expected:
      - 検討事項の ID の一覧が、`D-2` を当たるフォルダの数 2 で返却する
      - D-2 の取得が、文書が 1 つに決まらないことを、文書のある 2 つのフォルダつきでエラーとして返却する
      - D-3 の取得が、文書が無いことを 404 で返却する
    test: test_error_when_decision_not_unique
lead: dev-docs の画面のサーバーが読み取り API で配信元と文書を取得するシナリオを定め、画面のサーバーからの読み取りの流れを変えるときに参照する。
issue: 14
visibility: internal
primary_actor: dev-docs の画面のサーバー
stakeholders:
  - name: dev-docs の画面のサーバー
    interest: 配信元の読み込みと検索を自分で持たずに、取得した文書の値と種類のスキーマから利用者へ文書の画面を表示できる
  - name: 利用者
    interest: 画面で読む文書・検索の結果が、エージェントが文書の MCP で読む内容と同じになる
trigger: dev-docs の画面のサーバーが、利用者の画面の操作（文書を開く・リビジョンを切り替える・差分を開く・検索する）を受けて読み取り API を呼ぶ
preconditions:
  - project-index が待ち受け、端末の設定に配信元が並んでいる
success_guarantee: 読み取り API が、配信中の配信元の文書を文書の MCP と同じ読み込みの結果で返却する。`converters[]` を指す種類の文書は、変換のスクリプトが出した Markdown を返却する。
minimal_guarantee: 読み取り API の呼び出しは配信元のファイルを変えない。1 つの文書・配信元の失敗は、ほかの文書・配信元の取得を止めない。
frequency: 利用者が画面を操作するたび
priority: 高
refs:
  - SC-1#scenarios[正常シナリオ]
  - SC-1#scenarios[異常シナリオ（配信できない配信元がある）]
notes:
  差分: 2 つのリビジョンの差分は、dev-docs の画面のサーバーが 2 つのリビジョンの文書の取得の結果から作る。
test_file: tests/e2e/単一ユースケース/test_画面のサーバーが文書を読む.py
