id: SC-10
title: "設定・スクリプトを変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample（Git 管理外のフォルダ）。`converters[]` を指す種類の文書を持つ
        notes: '`project-index.yaml` の `description` を書き換えておく'
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>AD: check_project（sample のパス）
        AD-->>A: 違反 0 件・索引の同期の件数・設定のバージョンの新旧
        A->>AD: try_convert（sample の converters[] を指す種類の文書）
        AD-->>A: 変換のスクリプトが出した Markdown
        A->>AD: reload
        AD-->>A: 読み直した配信元
        A->>DM: describe
        DM-->>A: 新しい description
      ```

      <!-- /map -->
    expected:
      - '`check_project` が違反と索引の同期の件数を 0 で返す'
      - '`try_convert` が sample の `converters[]` を指す種類の文書を、変換のスクリプトが出した Markdown で返し、sample のフォルダは変わらない'
      - '`reload` の後の `describe` が書き換えた `description` を返す'
      - '`reload` の前後で `/mcp` のセッションが切れない'
    test: test_normal
  - name: 正常シナリオ（設定のバージョンが古い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 古い配信元
        description: '`version` がサーバーが読めるバージョンより古い `project-index.yaml` を持つ配信元'
        notes: id `old`
    flow: |-
      <!-- map: {"title": "正常シナリオ（設定のバージョンが古い）"} -->

      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP

        A->>AD: check_project（old のパス）
        AD-->>A: 違反 0 件と、設定が古いこと
      ```

      <!-- /map -->
    expected:
      - '`check_project` が old の設定のバージョンとサーバーが読めるバージョンを、古い設定として返す'
    test: test_normal_when_config_version_old
  - name: 異常シナリオ（変えた設定が検証に通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: '`project-index.yaml` から `documents[0].paths` を消しておく'
    flow: |-
      <!-- map: {"title": "異常シナリオ（変えた設定が検証に通らない）"} -->

      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>AD: check_project（sample のパス）
        AD-->>A: 違反（キーのパスと理由）
        A->>DM: search_docs（source: sample）
        DM-->>A: 変える前の設定での文書
      ```

      <!-- /map -->
    expected:
      - '`check_project` が `documents[0].paths` と理由を返す'
      - '`reload` を呼ぶまで sample は変える前の設定で配信される'
    test: test_error_when_config_invalid
  - name: 異常シナリオ（変換スクリプトが失敗する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: 変換スクリプトを 0 以外の終了コードで終わるように書き換えておく
    flow: |-
      <!-- map: {"title": "異常シナリオ（変換スクリプトが失敗する）"} -->

      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP

        A->>AD: try_convert（sample の文書）
        AD-->>A: スクリプトの終了コードと標準エラー
      ```

      <!-- /map -->
    expected:
      - '`try_convert` がエラーとしてスクリプトの終了コードと標準エラーを返す'
      - sample のフォルダと配信は変わらない
    test: test_error_when_converter_fails
  - name: 正常シナリオ（管理の MCP で nav を書く）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
      - name: 文書のタグ
        description: sample の文書 1 の `tags` を `[mcp]`、文書 2 を `[設計]`、文書 3 を `[mcp, 設計]` にする
      - name: project-index
        description: sample を配信している project-index
        notes: '`cwd` は sample のワークツリー'
    flow: |-
      <!-- map: {"title": "正常シナリオ（管理の MCP で nav を書く）"} -->

      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant AM as 管理の MCP（/admin/mcp）
        participant F as ワークツリーの project-index.yaml

        A->>AM: nav の項目を書くツール（タブ mcp を加え、auto の filter に tags が mcp）
        AM->>AM: 書いた後の nav をスキーマと check_filter で検証する
        AM->>F: nav を書く
        AM-->>A: 書いた nav と、条件に当たる文書の数（2）
        A->>AM: nav の項目を書くツール（タブ mcp の filter を tags が 設計 に直す）
        AM->>F: nav を書く
        AM-->>A: 書いた nav と、条件に当たる文書の数（2）
        A->>AM: nav の項目を書くツール（タブ bad を加え、filter の op に無い値 like）
        AM->>AM: check_filter に通らない
        AM-->>A: エラー（書かない）
        A->>AM: nav の項目を書くツール（タブ none を加え、filter に tags が none）
        AM->>F: nav を書く
        AM-->>A: 書いた nav と、0 件に当たる警告
      ```

      <!-- /map -->
    expected:
      - ワークツリーの `project-index.yaml` の `nav` にタブ `mcp` が加わり、`auto` の `filter` が `tags` が `mcp` になる
      - 1 回目の応答の条件に当たる文書の数が 2（文書 1・文書 3）
      - 直した後、タブ `mcp` の `filter` が `tags` が `設計` になり、条件に当たる文書の数が 2（文書 2・文書 3）
      - '`op` が `like` の `filter` は `isError: true` を返し、タブ `bad` を書かない'
      - '`tags` が `none` の `filter` はタブ `none` を書いたうえで、0 件に当たる警告を返す'
      - '`nav` 以外のキーは書き換わらない'
    test: test_normal_when_nav_written_by_admin_mcp
  - name: 正常シナリオ（エイリアスのキーと nav の条件を点検する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: エイリアスのキーの違反と 0 件の条件
        description: 起動するの正常シナリオ（エイリアスのキーと nav の条件を検証する）と同じ違反と条件を、sample のワークツリーで書く
    flow: |-
      <!-- map: {"title": "正常シナリオ（エイリアスのキーと nav の条件を点検する）"} -->

      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant AM as 管理の MCP（/admin/mcp）

        A->>AM: check_project(ワークツリーのパス)
        AM->>AM: エイリアスのキーを取り込んだスキーマで検証し、nav の条件に当たる文書を数える
        AM-->>A: 違反と警告の一覧
      ```

      <!-- /map -->
    expected:
      - '`check_project` が、エイリアスのキーの違反を文書のパスとともに返す'
      - '`check_project` が、0 件に当たる `nav` の条件を警告として返す'
      - 取り込んだスキーマの取り込み元のバージョンを返す
    test: test_normal_when_check_project_reports_alias_and_nav
  - name: 正常シナリオ（スクリプトを default_ref から動かす）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
      - name: default_ref のスクリプト
        description: 'sample の `develop` ブランチのスクリプトを次のようにする。変換スクリプトは本文の先頭に `develop` の文字を加える。`on: [read]` の validator は文書 1 に違反 `develop-rule` を出す'
        notes: クローン本体は `master` を checkout し、`master` の変換スクリプトは何も加えず、validator は違反を出さない
      - name: project-index
        description: sample を配信している project-index
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      <!-- map: {"title": "正常シナリオ（スクリプトを default_ref から動かす）"} -->

      ```mermaid
      sequenceDiagram
        actor A as エージェント
        actor U as 利用者
        participant S as project-index のサーバー
        participant G as sample のリポジトリ

        A->>S: search_docs(filter: id が文書 1)
        S->>G: default_ref の validator を動かす
        S-->>A: 文書 1 と notes の違反 develop-rule
        U->>S: 変換を使う文書を開く
        S->>G: default_ref のスクリプトで変換する
        S-->>U: develop の文字が付いた本文
      ```

      <!-- /map -->
    expected:
      - '`search_docs` の文書 1 の `notes` に違反 `develop-rule` が出る'
      - 変換した本文の先頭に `develop` の文字が付く
    test: test_normal_when_scripts_run_from_default_ref
  - name: 正常シナリオ（ワークツリーのスクリプトを動かす）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: default_ref のスクリプト
        description: 正常シナリオ（スクリプトを default_ref から動かす）と同じ `develop` の変換スクリプト
      - name: ワークツリー
        description: sample の `.claude/worktrees/x`。変換スクリプトを、本文の先頭に `worktree-x` の文字を加えるように書き換えて commit していない
        notes: 配信元の設定の `worktrees` は既定（`[./.claude/worktrees/*]`）
    flow: |-
      <!-- map: {"title": "正常シナリオ（ワークツリーのスクリプトを動かす）"} -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant AM as 管理の MCP
        participant S as project-index のサーバー
        participant WT as ワークツリー x

        U->>AM: try_convert(path: ワークツリー x のパス, file: 変換を使う文書)
        AM->>WT: ワークツリーの変換スクリプトで変換する
        AM-->>U: worktree-x の文字が付いた本文
        U->>S: 読み取り API で変換を使う文書を取得する
        S-->>U: default_ref のスクリプトで変換した develop の文字が付いた本文
      ```

      <!-- /map -->
    expected:
      - ワークツリー x のパスを渡した `try_convert` の本文の先頭に `worktree-x` の文字が付き、`develop` の文字は付かない
      - 読み取り API の文書の取得（ワークツリーを指さない）は `develop` の文字が付いた本文を返す
    test: test_normal_when_scripts_run_from_worktree
  - name: 正常シナリオ（ワークツリーの設定に追加した種類の文書を作る）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: ワークツリー
        description: sample の `.claude/worktrees/x`。`project-index.yaml` に、`develop` に無い種類 `term`（スキーマと置き場所の行）を追加して commit していない
        notes: 配信元の設定の `worktrees` は既定（`[./.claude/worktrees/*]`）
    flow: |-
      <!-- map: {"title": "正常シナリオ（ワークツリーの設定に追加した種類の文書を作る）"} -->

      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant DM as 文書の MCP
        participant WT as ワークツリー x

        A->>DM: describe(source: sample, worktree: x)
        DM-->>A: ワークツリーの設定の種類の一覧（term あり）
        A->>DM: write_docs(source: sample, worktree: x, create・kind: term)
        DM->>WT: ワークツリーの設定の term の置き場所へ文書を作成する
        DM-->>A: 作成した文書
      ```

      <!-- /map -->
    expected:
      - '`worktree` に x を指定した `describe` の種類の一覧に `term` がある'
      - '`worktree` に x を指定した `write_docs` の `create`（`kind: term`）が、ワークツリー x の `term` の置き場所に文書を作成する'
      - クローン本体の `develop` の作業ツリーには文書が作成されない
    test: test_normal_when_kind_added_in_worktree
  - name: 正常シナリオ（参照するスキーマのリビジョンを上げる）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: スキーマの配信元
        description: 配信元を追加する『正常シナリオ（ほかの配信元のスキーマを参照する）』と同じ schemas
        notes: タグ `v2` で `note.schema.yaml` に必須のキー `owner` を追加している
      - name: サンプルの配信元
        description: '`documents[0].schema` で schemas の `schemas/note.schema.yaml` をリビジョン `v1` で指して配信中の、Git 管理外のフォルダの sample'
        notes: '`project-index.yaml` の `documents[0].schema` のリビジョンを `v2` に書き換えておく'
    flow: |-
      <!-- map: {"title": "正常シナリオ（参照するスキーマのリビジョンを上げる）"} -->

      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>DM: describe(source: sample, kind: note)
        DM-->>A: v1 のスキーマ
        A->>AD: check_project（sample のパス）
        AD-->>A: 違反 0 件
        A->>AD: reload
        A->>DM: describe(source: sample, kind: note)
        DM-->>A: v2 のスキーマ
        A->>DM: write_docs（owner を持たない文書を作る）
        DM-->>A: エラー（owner が無い違反）
      ```

      <!-- /map -->
    expected:
      - '`reload` の前の `describe` は `owner` の無い v1 のスキーマを返す'
      - '`reload` の後の `describe` は `owner` を必須にした v2 のスキーマを返す'
      - '`reload` の後、`owner` を持たない文書の `write_docs` が `owner` の違反で書かれない'
    test: test_normal_when_schema_ref_raised
lead: 利用者かエージェントが配信元の設定・スキーマ・スクリプトを変え、管理の MCP で確認してから `reload` で配信に入れるシナリオを定め、設定の変更の流れを変えるときに参照する。
issue: 14
primary_actor: 利用者・エージェント（Claude Code）
stakeholders:
  - name: 利用者
    interest: サーバーを再起動せずに設定の変更を入れられ、壊れた変更は配信に入る前に分かる
  - name: エージェント（Claude Code）
    interest: 変換の結果を、配信元のフォルダを変えずに先に見られる
trigger: 配信元の `project-index.yaml`・スキーマ・スクリプトを変えた後、管理の MCP を呼ぶ
preconditions:
  - project-index が待ち受け、配信元を配信している
success_guarantee: '`reload` の後、変えた設定で配信元が配信される。`/mcp` のセッションは切れない。'
minimal_guarantee: '`check_project` と `try_convert` は配信元のフォルダと配信の状態を変えない。'
frequency: 設定・スクリプトを変えるたび
priority: 中
refs:
  - SC-1#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_設定・スクリプトを変える.py
