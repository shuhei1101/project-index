        M-->>A: エラー（読み取り専用の種類の操作の位置と、書き込みはデータを持つアプリで行う旨）
      ```

      <!-- /map -->
    expected:
      - '`isError: true` で、種類 `notes_db` の文書は読み取り専用であることと、該当する操作の位置を返却する'
      - 同じ呼び出しの文書 1 の update も書き込まず、文書 1 のファイルも変わらない（`atomic` を省いたとき）
      - '`delete_docs` で `n1` を指しても同じエラーを返却する'
      - '`data/notes.db` とワークツリーのファイルは変わらない'
    test: test_error_when_sqlite_doc_written
lead: エージェントが文書の MCP で、作業ツリーの YAML の文書を検査に合格させてから作成・修正・削除するシナリオを定め、書き込みの流れを変えるときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: action:書き込み
  - name: topic:エージェント
  - name: tool:mcp
primary_actor: エージェント（Claude Code）
stakeholders:
  - name: エージェント（Claude Code）
    interest: 変える項目だけを渡して、スキーマと検査に通る文書だけを書ける。通らないときは直し方が分かる
  - name: 利用者
    interest: 書き込みが作業中のワークツリーと `scope.write` に当たる配信元にだけ入り、クローン本体は変わらない。project-index は commit しない
trigger: エージェントが文書を作成・修正・改名・削除するか、複数の文書の単語を置換する
preconditions:
  - project-index が起動し、配信元を配信している
  - 呼び出しの引数に、フックが作業場所 `cwd` と会話キーを入れている
  - エージェントが直す文書を `search_docs` で読み、`version` を持っている
success_guarantee: 変更を当てた後の文書が配信元のスキーマと `validators[]` に通り、作業ツリー（Git 管理外の配信元はそのフォルダ）のファイルだけが書き換わる。新しいバージョンが返る。変えた Markdown の値は、mdmark の CLI を使えるときは点検に通っており、使えないとき（CLI が無い・制限時間を超えた）は点検できなかった理由が返る。
minimal_guarantee: '検査に通らない書き込み、改名後の ID が既にある文書と重なる改名、mdmark の警告がある Markdown の値の書き込み、`scope.write` に当たらない作業場所からの書き込み、クローン本体への書き込み、本文のファイルのパスが配信元の外を指す書き込み、書き込みの期限を過ぎた書き込みは、ファイルを 1 つも書き換えない（`atomic: true` のときは他の操作も書かない）。書き込まなかったときは `isError: true` で理由を返却する。'
frequency: 作業のたび
priority: 高
