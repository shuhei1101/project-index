id: SC-17
title: 画面のサーバーが直コミットで書き込む
lead: dev-docs の画面のサーバーが、画面で溜めた複数の文書の書き込みと削除を書き込みの API へ 1 回で送信し、検査に合格させてから 1 つのコミットにまとめて既定のブランチへプッシュするシナリオを定め、画面のサーバーからの書き込みの流れを変えるときに参照する。
primary_actor: dev-docs の画面のサーバー
stakeholders:
- name: 利用者
  interest: 画面で修正した配信元のメタデータを、Issue と作業 PR を経ずに、まとめて 1 回で登録した直後からリモートに残せる
- name: dev-docs の画面のサーバー
  interest: 作業場所を持たずに、溜めた修正を 1 回の要求で検査・書き込み・コミット・プッシュまで終えられ、1 つでも合格しなければどの修正も入らない
- name: 配信元のリポジトリ
  interest: 直コミットを許可した種類の文書だけが、検査に合格した内容で、既定のブランチに 1 回の要求につき 1 コミットで入る
trigger: 利用者が画面で溜めた修正の登録を選び、dev-docs の画面のサーバーが書き込みの API を呼ぶ
preconditions:
- 配信元の読み書きの方法が `git` で、直コミットの設定を持つ
- 直コミットの設定のコミットするブランチを指すワークツリーが、配信元の `worktrees` に該当する
- 端末の設定で、その配信元への作業場所を持たない要求の直コミットを許可している
- 索引のサーバーを動かしている利用者の Git の認証で、リモートへプッシュできる
success_guarantee: 1 回の要求で書き換わる全ての文書（操作に伴って書き換わる参照元を含む）が直コミットを許可した種類で、検査に合格した内容のとき、書き込みと削除が 1 つのコミットになり、コミットするブランチのリモートに入る。応答に操作ごとの文書のバージョンとコミットの SHA・ブランチが返る。コミットに入るのは、その要求が書き込んだ・消したファイルと生成物だけ。
minimal_guarantee: 1 つでも操作が断られた要求は、どの文書も書き込まず、リモートを変えず、ワークツリーにこの要求が書き込んだ変更を残さない。ワークツリーにあった未プッシュのコミットと未コミットの変更は消さない。断ったときは、断った操作の位置と理由を返却する。
frequency: 利用者が画面で溜めた修正を登録するたび
priority: 高
scenarios:
- name: 正常シナリオ
  setup:
  - name: Mock
    description: なし（実環境で実行。dev-docs の画面のサーバーの代わりにテストのコードが書き込みの API を HTTP で呼ぶ）
  - name: サンプルの配信元
    description: 種類 `note`（直コミットを許可する）と種類 `rule`（許可しない）のスキーマと YAML と、文書の一覧を書き出す `generators[]` と、`project-index.yaml` を持つ git リポジトリ（クローン本体は `master`）と、2 つのワークツリー（`.claude/worktrees/x` と、`develop` を指す `.claude/worktrees/develop`。どちらも sample の `worktrees` に該当する）
    notes: id `sample`。`scope.read`・`scope.write` は sample のフォルダ
  - name: sample のリモート
    description: テスト用の一時フォルダのベアリポジトリ。sample の `origin` で、`master` と `develop` を持つ
    notes: '`develop` のワークツリーの HEAD は `origin/develop` と同じで、未コミットの変更が無い'
  - name: 直コミットの設定
    description: sample の種類 `note` の直コミットを許可し、コミットするブランチを `develop` にする。端末の設定で、作業場所を持たない要求の直コミットを sample の種類 `note` で許可する
  - name: 書き換える文書と消す文書
    description: sample の `develop` にコミット済みの種類 `note` の文書 1 と文書 2
    notes: テストのコードは、読み取り API で develop のリビジョンの文書 1・文書 2 のバージョンを取得しておく
  flow: |-
    <!-- map: {"title": "正常シナリオ"} -->

    ```mermaid
    sequenceDiagram
      participant DD as dev-docs の画面のサーバー
      participant PI as project-index（書き込みの API）
      participant WT as develop のワークツリー
      participant R as sample のリモート

      DD->>PI: sample へ、文書 1 の部分更新・文書 2 の削除の操作（それぞれ取得したバージョン）とコミットの説明を 1 回で送信する
      PI->>PI: オリジンが project-index と同じか、ブラウザ以外からの要求であることを確認する
      PI->>PI: 端末の設定で作業場所を持たない要求の直コミットが許可され、全ての操作の種類 note が直コミットの許可に該当することを確認する
      PI->>PI: リポジトリの排他を取る
      PI->>R: 最新を取得する
      PI->>WT: origin/develop を早送りで取り込む
      PI->>PI: HEAD が origin/develop と同じで、書き込むファイルと生成物に未コミットの変更が無いことを確認する
      PI->>PI: 全ての操作をスキーマと validators に通し、バージョンの一致と秘密の値が無いことを確認する
      PI->>PI: 操作で書き換わる全ての文書（参照元を含む）の種類が直コミットの許可に該当することを確認する
      PI->>WT: 文書 1 を書き換え、文書 2 のファイルを消し、generators を実行する
      PI->>WT: 書き換えた・消したファイルと生成物だけを 1 つのコミットにする
      PI->>R: develop をプッシュする
      PI->>PI: 排他を放す
      PI-->>DD: 操作ごとの文書の id・状態・バージョンと、コミットの SHA とブランチ
    ```

    <!-- /map -->
  expected:
  - 応答が成功で、文書 1 の状態が `updated`、文書 2 の状態が `deleted` で、コミットの SHA とブランチ `develop` を返却する
  - sample のリモートの `develop` に 1 コミットだけが増え、その SHA が応答の SHA と一致する。コミットの説明は送信した説明で、変更は文書 1・文書 2 のファイルと `generators[]` の生成物だけ
  - develop のワークツリーの HEAD が `origin/develop` と同じで、`git status` に変更が出ない
  - sample のワークツリー x とクローン本体は変わらない
  - 読み取り API で develop のリビジョンを指した文書 1 の取得が書き換えた後の値と応答のバージョンを返却し、文書 2 の取得は無い文書として断られる
  test: test_normal
