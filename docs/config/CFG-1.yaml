title: '設定: 索引のサーバー'
lead: 索引のサーバーが参照する設定のファイルと環境変数の一覧。
files:
  - file: ${XDG_CONFIG_HOME:-~/.config}/project-index/settings.yaml
    manages: 端末の設定（配信元の一覧と権限・`state_dir`・`log_dir`・`port`・`bind`・`seen_retention_days`・`script_timeout_sec`）
    notes: git 管理外。場所は環境変数 `PROJECT_INDEX_CONFIG` で上書きする。キーの一覧は公開ドキュメント『設定』、型は MOD-67 の `TerminalConfig`
  - file: project-index.yaml
    manages: 配信元の設定（文書の範囲・種類・参照するブランチ・検査と変換と生成のスクリプト・`nav`・`decisions`・`github`）
    notes: 各リポジトリの直下に配置し、git で管理する。端末の設定の `config` でほかの名前も指定できる。管理の MCP にフォルダを渡したときは `project-index.yaml`、無ければ移行の間の `dev-docs.yaml` を探す（MOD-10 の `CONFIG_FILE`・`LEGACY_CONFIG_FILE`）
  - file: project-index.local.yaml
    manages: 配信元の設定の端末ごとの上書き
    notes: 各リポジトリの直下に配置し、`.gitignore` する
notes:
  状態のフォルダ: 会話記録の SQLite・リビジョンの書き出し・変換の結果は `${XDG_STATE_HOME:-~/.local/state}/project-index` に配置する。場所は環境変数 `PROJECT_INDEX_STATE_DIR`、無ければ端末の設定のキー `state_dir` で上書きする
  待ち受けのポート: 環境変数 `PROJECT_INDEX_PORT` を優先し、無ければ端末の設定のキー `port`（既定 8786）。プラグインの `.mcp.json` も同じ環境変数を参照する
id: CFG-1
visibility: internal
