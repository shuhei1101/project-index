title: テスト実行方法
lead: project-index のテスト種別ごとの実行コマンドと前提を定め、テストや lint を実行するときに参照する。
tags:
  - name: topic:testing
    main: true
  - name: topic:単体テスト
  - name: topic:結合テスト
  - name: tool:pytest
layers:
  - id: TL-1
    name: 単体テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/unit/
      ```
    description: pytest で実行する。プロセスの外のもの（ネットワーク・常駐のサーバー）に依存しない。
    prerequisites:
      - 外部依存なし
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {単体テストファイルパス}
        ```
    parallel: true
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; if gh run download "$run_id" -n test-log -D "/tmp/test-log-$run_id"; then cat "/tmp/test-log-$run_id/test.log"; else gh run view "$run_id" --log-failed; fi; exit $rc)
      ```
  - id: TL-2
    name: 結合テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/integration/
      ```
    description: |-
      pytest で実行する。一時フォルダに git の配信元を作り、アプリを HTTP のテストのクライアントで呼ぶ。起動・再起動・更新のテストは `project-index serve` を子プロセスで空きポートに起動する。
      `{結合テストのパス}` には、結合テストのファイル・フォルダか pytest のノード ID（`{ファイル}::{関数}`）を空白で区切って指定する
    prerequisites:
      - git と python3 が `PATH` にある
      - 更新のテストは、依存を uv のキャッシュから入れる（`UV_OFFLINE=1`。先に `uv sync` でキャッシュを作っておく）
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {結合テストのパス}
        ```
    parallel: false
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=integration -f paths="{結合テストのパス}" | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; if gh run download "$run_id" -n test-log -D "/tmp/test-log-$run_id"; then cat "/tmp/test-log-$run_id/test.log"; else gh run view "$run_id" --log-failed; fi; exit $rc)
      ```
  - id: TL-3
    name: E2E テスト
    run_all: 未確定
  - id: TL-4
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-5
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-6
    name: lint
    run_all: |-
      ```bash
      (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run pyright || rc=1; uv run complexipy src tests || rc=1; exit $rc)
      ```
    description: ruff で linter・formatter の check を、pyright（strict）で型検査を、complexipy で cognitive complexity を検査する。型検査と cognitive complexity はプロジェクト全体に回す。
    prerequisites:
      - 検査の設定は `pyproject.toml` が持つ
    location: local
id: TP-1
visibility: internal
prerequisites:
  - Python 3.14 と uv（`uv sync` で開発の依存を入れておく）
