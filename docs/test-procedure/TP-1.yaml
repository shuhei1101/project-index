title: テスト実行方法
lead: project-index のテスト種別ごとの実行コマンドと前提を定め、テストや lint を実行するときに参照する。
tags:
  - name: topic:testing
    main: true
  - name: topic:単体テスト
  - name: topic:結合テスト
  - name: tool:pytest
layers:
  - id: TL-1
    name: 単体テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/unit/
      ```
    description: pytest で実行する。プロセスの外のもの（ネットワーク・常駐のサーバー）に依存しない。
    prerequisites:
      - 外部依存なし
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {単体テストファイルパス}
        ```
    parallel: true
  - id: TL-2
    name: 結合テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/integration/
      ```
    description: pytest で実行する。一時フォルダに git の配信元を作り、アプリを HTTP のテストのクライアントで呼ぶ。起動・再起動・更新のテストは `project-index serve` を子プロセスで空きポートに起動する
    prerequisites:
      - git と python3 が `PATH` にある
      - 更新のテストは、依存を uv のキャッシュから入れる（`UV_OFFLINE=1`。先に `uv sync` でキャッシュを作っておく）
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {結合テストファイルパス}
        ```
    parallel: false
  - id: TL-3
    name: E2E テスト
    run_all: 未確定
  - id: TL-4
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-5
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-6
    name: lint
    run_all: |-
      ```bash
      (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run pyright || rc=1; uv run complexipy src tests || rc=1; exit $rc)
      ```
    description: ruff で linter・formatter の check を、pyright（strict）で型検査を、complexipy で cognitive complexity を検査する。型検査と cognitive complexity はプロジェクト全体に回す。
    prerequisites:
      - 検査の設定は `pyproject.toml` が持つ
id: TP-1
visibility: internal
prerequisites:
  - Python 3.14 と uv（`uv sync` で開発の依存を入れておく）
