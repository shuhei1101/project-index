id: MOD-180
title: 索引のサーバー / SKILL.md の生成 / cli.py
lead: '`project-index skill-md` の生成のモードと検査のモードの処理を受け持ち、SKILL.md の生成の cli.py を修正するときに参照する。'
constants:
  - name: EXIT_SKILL_INVALID
    title: 組み立てられないときの終了コード
    container: project_index/features/skill_md/cli.py
    usecase: SKILL.md の生成
    summary: 生成のモードでエージェントフローかスキーマが読み込めない・合わない、`ref` が解決できない、`skill.path` が配信元の外部を指すときの終了コード
    value: '1'
  - name: VALIDATE_ON_ENV
    title: 検査の時点の環境変数
    container: project_index/features/skill_md/cli.py
    usecase: SKILL.md の生成
    summary: 値が `delete` のとき、検査のモードを削除の検査にする環境変数（IF-37 の `request`）
    value: "'PROJECT_INDEX_VALIDATE_ON'"
  - name: DELETE_IDS_ENV
    title: 削除する文書の環境変数
    container: project_index/features/skill_md/cli.py
    usecase: SKILL.md の生成
    summary: 削除する文書の `id` を 1 行に 1 件で受け取る環境変数（IF-37 の `request`）
    value: "'PROJECT_INDEX_DELETE_IDS'"
functions:
  - name: run_skill_md
    title: SKILL.md の生成の実行
    container: project_index/features/skill_md/cli.py
    usecase: SKILL.md の生成
    role: 入口
    summary: '`--check` が無ければ SKILL.md を生成し、あれば標準入力のエージェントフローを検査する'
    kind: 関数
    scope: public
    is_async: false
    thread_safe: false
    side_effects: 生成のモードは SKILL.md を書き換え・削除し、標準出力・標準エラーに書く。検査のモードは標準入力を読み、標準出力に書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`skill-md` の解析結果（`check: bool`・`paths: list[str]`）'
    returns:
      type: int
      description: 終了コード。生成を終えたときと検査のモードは 0
    process: |-
      1. 配信元の直下を作業ディレクトリ（`Path.cwd()`）にする
      2. `args.check` が真か
         - 真: 標準入力を UTF-8 で全て読み、環境変数 `VALIDATE_ON_ENV` が `delete` なら `check_deletion`（`delete_ids` は `DELETE_IDS_ENV` の空でない行）、それ以外なら `check_replacement` の問題を `path`・`rule`・`fix` の辞書の配列の JSON にして標準出力に出し、0 を返却する
         - 偽: 続ける（`args.paths` は使用しない）
      3. `load_agent_flows`・`build_skill_files`・`write_changed`・`remove_orphans` を順に呼ぶ
         - `InvalidAgentFlowError` の場合、問題の行を標準エラーに出して `EXIT_SKILL_INVALID` を返却する（標準出力には何も出さない）
      4. 書き換えたパスと削除したパスを合わせて昇順にし、1 行に 1 件ずつ標準出力に出し、0 を返却する
    exceptions:
      - name: なし（終了コード 1）
        condition: 生成のモードで `InvalidAgentFlowError`（インターフェース定義の `InvalidAgentFlow`）
        message: 問題の行（`Problem.line()`）
    unit_tests:
      - name: test_run_skill_md
        case: 正常
        summary: 書き換えたパスを出す
        condition: '`check=False`、`type: skill` の a を持つ一時フォルダを作業ディレクトリにする'
        mock: なし（`monkeypatch.chdir`、`capsys`）
        expected: 0 を返却し、標準出力が a の `skill.path` の 1 行で、標準エラーが空
        exception: '-'
      - name: test_run_skill_md_when_invalid
        case: 異常
        summary: 組み立てられない
        condition: '`check=False`、a の `skill.path` が `../outside/SKILL.md`'
        mock: なし（`monkeypatch.chdir`、`capsys`）
        expected: 1 を返却し、標準出力が空で、標準エラーに a のパスと `skill.path`
        exception: なし（終了コード 1）
      - name: test_run_skill_md_when_check
        case: 正常
        summary: 検査のモードは違反があっても 0
        condition: '`check=True`、標準入力に `skill.path` を `../outside/SKILL.md` にした a'
        mock: なし（`monkeypatch.chdir`・`monkeypatch` で `sys.stdin`、`capsys`）
        expected: 0 を返却し、標準出力が `path` が `skill.path` の違反 1 件の JSON の配列
        exception: '-'
      - name: test_run_skill_md_when_check_delete
        case: 正常
        summary: 削除の検査は環境変数で切り替える
        condition: '`check=True`、標準入力に a が `ref` で埋め込む c、環境変数 `PROJECT_INDEX_VALIDATE_ON=delete`・`PROJECT_INDEX_DELETE_IDS=c`'
        mock: なし（`monkeypatch.chdir`・`monkeypatch.setenv`・`monkeypatch` で `sys.stdin`、`capsys`）
        expected: 0 を返却し、標準出力が `path` が `$` の違反 1 件の JSON の配列
        exception: '-'
      - name: test_run_skill_md_when_orphan
        case: 正常
        summary: 削除したパスも出す
        condition: '`check=False`、`type: skill` の a と、`docs/agent-flow/b.yaml`（無い）を指す生成元のコメントを持つ `skills/b/SKILL.md` を持つ一時フォルダを作業ディレクトリにする'
        mock: なし（`monkeypatch.chdir`、`capsys`）
        expected: 0 を返却し、標準出力が a の `skill.path` と `skills/b/SKILL.md` の 2 行（昇順）で、`skills/b/SKILL.md` が無い
        exception: '-'
    refs:
      - to: MOD-181
        item: functions[build_skill_files]
        type: references
        when: 呼び出し先の引数・戻り値・例外を変えるときに、呼び出す側の処理を合わせる。
notes:
  決まり: 生成のモードの失敗だけを終了コードにし、検査のモードは違反を JSON で出して常に 0 で終える。
visibility: internal
tags:
  - name: topic:スキル
    main: true
  - name: action:生成
  - name: topic:cli
test_files:
  - tests/unit/project_index/features/skill_md/test_cli.py
