id: MOD-105
title: 索引のサーバー / スクリプトの実行
lead: スクリプトの実行の分類の構成図・ファイルの並び・決まりを定め、スクリプトの実行のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/integrations/
  └─ scripts.py   # ScriptResult / run_script / check_runnable / スクリプトの失敗の例外
  ```
notes:
  受け持つこと: 配信元の設定の `validators[]`・`converters[]`・`generators[]` のコマンドを、配信元の直下で子プロセスとして制限時間つきで動かす。
