constants:
  - name: DOCS_MCP_NAME
    title: 文書の MCP の名前
    container: project_index/server/mcp/docs.py
    usecase: 共通
    summary: '`initialize` で返すサーバーの名前'
    value: '"project-index"'
  - name: INSTRUCTIONS_MAX_CHARS
    title: instructions の上限の字数
