classes:
  - name: DocsMCPServer
    title: 接続ごとに instructions を描く文書の MCP
    container: project_index/server/mcp/docs.py
    usecase: 共通
    role: 入口
    summary: '`initialize`・`server/discover` のたびに instructions を描き直す `MCPServer`'
    description: |-
      `MCPServer` を継承する。mcp 2.3.0 は接続ごとに instructions を作るフックを持たず、instructions を返す経路が 2 つある。
      `initialize` の応答は lowlevel の `Server.create_initialization_options()` が属性 `instructions` を読んで作り、2026-07-28 版（`MODERN_PROTOCOL_VERSIONS`）の `server/discover` の応答は既定の処理 `Server._handle_discover` が同じ属性を直接読んで作る。
      そのため初期化で、lowlevel の `Server`（`self._lowlevel_server`）のインスタンスの `create_initialization_options` を `setattr` で置き換え、`server/discover` を公開の `add_request_handler` で置き換えて、どちらも描画してから属性を差し替えて元の処理を呼ぶ。
      `initialize` は読み取りのループの中で同期に実行されるため、描画の関数は Git を呼ばない（文書の MCP の instructions の描画）。
    kind: クラス
    methods:
      - name: __init__
        title: 初期化
        kind: メソッド
        summary: 名前と instructions の描画を受け取り、`initialize`・`server/discover` のたびに描画する
        scope: public
        args:
          - name: name
            title: 名前
            type: str
            required: true
            passing: positional
            description: '`initialize` で返すサーバーの名前'
          - name: instructions
            title: instructions の描画
            type: Callable[[], str]
            required: true
            passing: keyword
            description: 呼ぶたびに今の instructions を返す関数
        returns:
          type: None
          description: '-'
        process: |-
          1. `super().__init__(name, instructions=instructions())` で作る
          2. lowlevel の `Server` の今の `create_initialization_options` を記録し、`*args`・`**kwargs` を受けて、`instructions()` を lowlevel の `Server` の属性 `instructions` に入れてから記録したメソッドを呼んで返す関数を、`setattr` でインスタンスの `create_initialization_options` に入れる
          3. lowlevel の `Server` の今の `_handle_discover` を記録し、`ctx`・`params` を受けて、`instructions()` を属性 `instructions` に入れてから記録した処理を await して返す async の関数を、`add_request_handler("server/discover", types.RequestParams, 関数)` で登録する
        unit_tests:
          - name: test_docs_mcp_server_when_initialize
            case: 正常
            summary: '`initialize` のたびに描き直す'
            condition: 呼ぶたびに `"v1"`・`"v2"`・`"v3"` を順に返す描画の関数で作り、`initialize` を 2 回（別の接続）呼ぶ
            mock: instructions の描画（偽物）
            expected: 描画の関数は作るときに 1 回、`initialize` ごとに 1 回呼ばれ、1 回目の `initialize` の `instructions` が `"v2"`、2 回目が `"v3"`。ツールの一覧は変わらない
            exception: '-'
          - name: test_docs_mcp_server_when_discover
            case: 正常
            summary: '`server/discover` のたびに描き直す'
            condition: 呼ぶたびに `"v1"`・`"v2"`・`"v3"` を順に返す描画の関数で作り、2026-07-28 版で `server/discover` を 2 回呼ぶ
            mock: instructions の描画（偽物）
            expected: 1 回目の `server/discover` の `instructions` が `"v2"`、2 回目が `"v3"`。`supported_versions`・`capabilities` は既定の処理と同じ
            exception: '-'
functions:
  - name: build_docs_mcp
    title: 文書の MCP の組み立て
    kind: 関数
    container: project_index/server/mcp/docs.py
    usecase: 共通
    role: 入口
    summary: 7 つのツールを持つ文書の MCP を作る
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 起動の『配線済みの関数』
    returns:
      type: mcp.server.mcpserver.MCPServer
      description: 文書の MCP（`stateless_http`・`json_response` はアプリの組み立てが `streamable_http_app()` の引数で渡す）
    process: |-
      1. `DocsMCPServer(DOCS_MCP_NAME, instructions=functools.partial(_docs_instructions, handlers))` を作る（接続ごとに instructions を描く文書の MCP）
      2. `DOCS_TOOL_NAMES` のツールを、`description` を `handlers.prompts.render(tool_prompt_id("docs", 名前))` にして `TOOL_ANNOTATIONS` の注釈で登録する。引数はインターフェース定義の `request` をキーワード引数で受ける（`list_changes` の `from` は `from_: Annotated[str | None, Field(validation_alias="from")]` で受け、ツールの入力のスキーマでは `from` を出す。`alias` は関数の呼び出しで `TypeError` になるため使わない）
         - 要求のモデルのフィールドが `description` を持つ場合、その説明を入力のスキーマの項目の説明に出す（`Annotated[型, Field(description=...)]`）
         - 今のツールの説明（`search_docs`・`write_docs`・`list_changes` の引数の説明の文と `trace_related` の説明を含む）は、削らずに各ツールの YAML へ移す
         - 引数の型の誤り・`Literal` に無い値は、SDK が関数を呼ぶ前に `isError` の結果にする。入力のスキーマに無いキーは SDK が捨てる
      3. 各ツールは次の順で処理する
         - 引数で要求のモデル（`SearchRequest` など）を作る
         - 要求が指す配信元を決め（指す配信元の決定）、`await handlers.registry.wait_for(...)` でその行の読み込みだけを待つ（初期化とツールの一覧は待たない）
         - サービスを `asyncio.to_thread` で呼ぶ（引数は `handlers` の属性）
         - `write_docs`・`delete_docs` の結果の `applied` が `True` の場合、`cwd` から書ける配信元を裏で検査し直す（配信元の検査のキャッシュ.裏での検査の流し直し）
         - 結果をツールの結果にする（`write_docs`・`delete_docs` の `render` は `None`。`search_docs` は `functools.partial(render_search_markdown, source_label=result.source_label)`、`list_changes` は `functools.partial(render_changes_markdown, source_label=request.source or "作業中の配信元")`、`list_match_words` は用語の一覧の文を渡す）
         - `ProjectIndexError` と `pydantic.ValidationError` はツールのエラーの変換の `CallToolResult(is_error=True)` をそのまま返す。それ以外の例外は `[error]` ツールの処理に失敗した（ツール名・例外）を書いて MCP の既定に任せる
      4. 作った MCP を返す
    unit_tests:
      - name: test_build_docs_mcp
        case: 正常
        summary: ツールと注釈
        condition: '`list_tools` を呼ぶ'
        mock: 配線済みの関数（偽物）
        expected: 7 つのツールが並び、`list_match_words` の `readOnlyHint` が `True`、`delete_docs` の `destructiveHint` が `True`、`search_docs` の `readOnlyHint` が `True`
      - name: test_build_docs_mcp_when_call
        case: 正常
        summary: サービスへの受け渡し
        condition: '`search_docs(source="sample", format="json")` を呼ぶ'
        mock: '`search_docs`（結果を返す偽物）'
        expected: サービスに `SearchRequest(source="sample")` が渡り、`structuredContent` を返す
      - name: test_build_docs_mcp_when_error
        case: 正常
        summary: エラーの変換
        condition: サービスが `UnknownKindError` を送る
        mock: '`write_docs`（送る偽物）'
        expected: '`isError` が `True`'
      - name: test_build_docs_mcp_when_descriptions
        case: 正常
        summary: ツールの説明をプロンプトの YAML から描画する
        condition: '`list_tools` を呼ぶ'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: '7 つのツールの説明がそれぞれ `prompts.render(tool_prompt_id("docs", 名前))` と同じ。`search_docs` の説明に `not`・`glob`・`@matches`・`sections`・`lines`・`describe(source, kind)`・`group_by: tags`、`list_changes` の説明に `contains`、`write_docs` の説明に `describe(source, kind)`、`trace_related` の説明に `implements` があり、入力のスキーマの `sections`・`lines`・`contains` の項目が `description` を持つ'
      - name: test_build_docs_mcp_when_instructions
        case: 正常
        summary: instructions をプロンプトの YAML から描画する
        condition: '`initialize` を呼ぶ'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: '配信元が無いとき、`instructions` が `prompts.render(DOCS_INSTRUCTIONS_PROMPT_ID, {"sources": [], "omitted": 0})` と同じで、`grep`・`action:`・`topic:`・`tool:` を含む'
      - name: test_build_docs_mcp_when_loading
        case: 正常
        summary: ツールの呼び出しは指す配信元の読み込みを待ち、スレッドを持たない
        condition: '`SourceRegistry(loading=True)` のまま `search_docs(source="sample")` を 13 本並べて呼び、`tools/list` を呼ぶ。その後 `reload` する'
        mock: なし（一時フォルダの配信元）
        expected: '`reload` の前に `tools/list` が答え、`search_docs` はまだ答えない（既定の executor のスレッドを使っていない）。`reload` の後に 13 本とも結果を返す'
  - name: _docs_instructions
    title: 文書の MCP の instructions の描画
    kind: 関数
    container: project_index/server/mcp/docs.py
    usecase: 共通
    role: 変換
    summary: プロンプトの文と、配信中の配信元と使う場面の一覧を 4,096 字に収めて描き、並べた配信元の裏での確認を依頼する
    scope: internal
    thread_safe: true
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: '`registry`・`prompts` を使う'
    returns:
      type: str
      description: instructions
    process: |-
      1. `handlers.registry.served()`（待たずに今のキャッシュを読む）から、設定の `when` が空でない配信元を `sources[]` の順に並べ、`{"id": ID, "when": when の 1 行目}` の並びにする
      2. `handlers.prompts.render(DOCS_INSTRUCTIONS_PROMPT_ID, {"sources": 並び, "omitted": 0})` を描く
      3. 描いた文が `INSTRUCTIONS_MAX_CHARS` を超える間、並びの末尾を 1 つ除いて `omitted` を 1 増やして描き直す（並びが空になっても `omitted` が 1 以上なら案内だけを描く）
      4. 1 で並べた全ての配信元の ID で、配信元の一覧.裏での確認の実行（`refresh_later`）を呼ぶ（待たない）
      5. 描いた文を返す
    unit_tests:
      - name: test_docs_instructions
        case: 正常
        summary: 使う場面を持つ配信元を端末の設定の順に並べる
        condition: '配信中の配信元が other（`when` 1 行）・sample（`when` 2 行）・old（`when` なし）の順'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式。`registry.refresh_later` は受け取った ID を記録する偽物）
        expected: other・sample の順に ID と `when` の 1 行目があり、sample の 2 行目と old が無い。`refresh_later` に other・sample の ID が渡る
        exception: '-'
      - name: test_docs_instructions_when_exceeds_limit
        case: 正常
        summary: 上限を超える配信元を末尾から除く
        condition: '`when` の 1 行目が 200 字の配信元 30 件（`src01`〜`src30`）'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: 字数が 4,096 以下で、一覧が `src01` から途中を飛ばさず並び、並んだ件数と案内の件数の合計が 30
        exception: '-'
      - name: test_docs_instructions_when_no_source_guide
        case: 正常
        summary: 使う場面を持つ配信元が無い
        condition: 配信中の配信元が `when` を持たない old だけ
        mock: 配線済みの関数（偽物）
        expected: '`prompts.render(DOCS_INSTRUCTIONS_PROMPT_ID, {"sources": [], "omitted": 0})` と同じ文'
        exception: '-'
  - name: _wait_target
    title: 指す配信元の決定
    kind: 関数
    container: project_index/server/mcp/docs.py
    usecase: 共通
    role: 変換
    summary: 要求のモデルから、待つ配信元の行を決める指す行の待ちの引数を作る
    scope: internal
    args:
      - name: request
        title: 要求
        type: BaseModel
        required: true
        passing: positional
        description: 文書の MCP のツールの要求のモデル（`source`・`cwd`・`worktree`・`outside_scope` を持つものだけを見る）
    returns:
      type: dict[str, Any]
      description: 指す行の待ちのキーワード引数（`ids`・`cwd`・`every` のどれか 1 つ）
    process: |-
      1. `source` が `"*"` か、並びが `"*"` を含む場合、`every=True`
      2. `source` が文字列か並びの場合、`ids` にその ID を並べる
      3. `source` が無く、`outside_scope` が `True` の場合（作業範囲の外の一覧）、`every=True`
      4. `source` が無い場合、`cwd` に `worktree` か `cwd` を入れる（どちらも無ければ空の引数にし、待たない）
    unit_tests:
      - name: test_wait_target
        case: 正常
        summary: 要求ごとの待つ行の決め方
        condition: '`SearchRequest(source="a")`・`SearchRequest(source=["a", "*"])`・`DescribeRequest(outside_scope=True)`・`WriteRequest(cwd="/w/a", operations=[])`・`DescribeRequest()`'
        mock: なし
        expected: '`{"ids": ["a"]}`・`{"every": True}`・`{"every": True}`・`{"cwd": "/w/a"}`・`{}`'
refs:
  - IF-2#
  - IF-6#
  - IF-7#
  - IF-4#
  - IF-3#
  - IF-1#
notes:
  instructions のプロンプトの変数: '`content/prompts/mcp/docs/instructions.yaml` は `vars` に `sources`（`id`・`when` を持つ辞書の並び）と `omitted`（載せなかった件数）を持ち、条件 `sources or omitted` の部品で、配信元と使う場面の一覧（`` `{id}`: {when} `` の行）と、`omitted` が 1 以上のときの載せなかった件数と `describe(outside_scope: true)` の案内（作業場所から使える配信元と作業範囲の外で参照できる配信元の使う場面を引ける）を描く。コードは文を持たない'
  trace_related のツールの説明: '`content/prompts/mcp/docs/tools/trace-related.yaml` は「起点の文書やコードのパスから、related をたどって関連する文書を返す。設計書を起点に direction: in で呼ぶと、via.type が implements の文書がその設計書を実装するコード、コードを起点にすると tests の文書がそのテストになる。」を持つ（インターフェース定義『関連のたどり』の `direction` の補足）'
