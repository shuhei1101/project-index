  - name: unresolved_related
    title: 当たらない関連
    container: project_index/features/documents/fields.py
    usecase: 起動
    role: 判定
    summary: 文書の `related` のうち、`to` が配信元の文書の ID の集合に無い関連の `to` を返す
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: metadata
        title: メタデータ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の解決済みのメタデータ（`Document.metadata`）
      - name: ids
        title: 文書の ID の集合
        type: AbstractSet[str]
        required: true
        passing: positional
        description: 配信元の全ての文書の ID
    returns:
      type: list[str]
      description: 当たらない `to` の並び（`related` の順）
    process: |-
      1. `metadata` の `related` が配列でなければ空の並びを返す
      2. 要素ごとに、文字列の `to` を持ち、文字列の `source` を持たない要素だけを見て（`source` が無い・`null` の要素を同じ配信元への関連として扱う。`related_links` と同じ読み方）、`to` が `ids` に無ければ加える
      3. 並びを返す
    unit_tests:
      - name: test_unresolved_related
        case: 正常
        summary: source を持たない関連だけを照合する
        condition: '`related` が `[{to: src/b.py}, {to: src/z.py}, {to: other-doc, source: other}, {to: src/y.py, source: null}, {type: tests}]`、`ids` が `{src/a.py, src/b.py}`'
        mock: なし
        expected: '`["src/z.py", "src/y.py"]`'
        exception: '-'
      - name: test_unresolved_related_when_not_list
        case: 正常
        summary: related が配列でない
        condition: '`related` が無いメタデータと、`related` が文字列のメタデータ'
        mock: なし
        expected: どちらも `[]`
        exception: '-'
  - name: field_arrays
    title: 列名の指す配列の取得
    kind: 関数
    container: project_index/features/documents/fields.py
    usecase: 書き込み
    role: 読み取り
    summary: 列名が指す配列を、文書の中の元の配列のまま出現順に返す
    description: 参照元の `related` の列から行を除く処理が、返った配列をその場で書き換える。`**.` で始まる列名では、最上位と入れ子の全ての配列を返す。
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: path
        title: 列名
        type: str
        required: true
        passing: positional
        description: '`related`・`meta.refs`・`**.refs[]` の形の列名。末尾の `[]` は配列そのものを指すものとして扱う'
    returns:
      type: list[list[Any]]
      description: 列名が指す配列（複製しない元の配列）の並び。配列でない値・たどれない場所は含めない
    process: |-
      1. 『項目のパスの分解』で分け、末尾の `ArraySelector(key=None)` を 1 つ除く。残りに `ArraySelector` があれば `InvalidArgumentError` を送る
      2. 先頭が `AnyDepth` の場合、『項目の取得』と同じ順で文書の中の全ての辞書をたどり、辞書ごとに残りのパスをたどった値が配列なら並べる
      3. それ以外は、パスをたどった値が配列ならその 1 つを並べる
      4. 並びを返す
    exceptions:
      - name: InvalidArgumentError
        condition: 末尾以外に `[]`・`[{キー}]` を含むか、パスの書式が誤っている
        message: '{path}: 配列を指す列名ではありません'
    unit_tests:
      - name: test_field_arrays
        case: 正常
        summary: 最上位と入れ子の配列を元のまま返す
        condition: '`{"refs": [1], "functions": [{"refs": [2]}, {"name": "g"}]}` を `**.refs[]`、同じ内容を `refs`'
        mock: なし
        expected: '`**.refs[]` が 2 つの配列で、返った 2 つ目の配列を空にすると内容の `functions[0].refs` も空になる。`refs` は最上位の配列 1 つ'
        exception: '-'
      - name: test_field_arrays_when_not_list
        case: 正常
        summary: 配列でない・無い列
        condition: '`{"refs": "x"}` を `refs`、`{}` を `**.refs[]`'
        mock: なし
        expected: どちらも `[]`
        exception: '-'
  - name: resolve_ref_path
    title: 参照の型の項目のパスの解決
    kind: 関数
    container: project_index/features/documents/fields.py
    usecase: 書き込み
    role: 読み取り
    summary: 参照の型の項目のパス（`#` の後）を、文書と種類のスキーマでキーと位置の並びに解く
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書 1 件の内容に当てるスキーマ（文書のストアの `row_schema`。最上位に `$defs` を持ち得る）
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: '`#` の後（`functions[save#2].process`・`notes[main.py の補足]`）'
    returns:
      type: list[str | int]
      description: 辞書のキーと配列の位置の並び
    process: |-
      1. `[` から `]` までを 1 つの区切りとし、`[]` の外の `.` で名前を区切る。`[` を閉じない・空の名前は `InvalidArgumentError`
      2. 内容とスキーマを先頭から一緒にたどる。スキーマの `$ref`（`#/$defs/...`）は最上位の `$defs` で解き、辞書のキーは `properties.{キー}`（無ければ `additionalProperties`）、配列の要素は `items` へ進む
      3. 名前と、辞書に対する `[{キー}]` はそのキーを並びに加える。値が辞書でない・キーが無い場合は `InvalidArgumentError`
      4. 配列に対する `[{値}]` は、スキーマの `x-key` のキーがその値の最初の要素の位置を加える。その値の要素が無く、値の末尾が `#{整数}` なら、`#` の前の値の要素のその順番（ 1 始まり）の位置を加える。`x-key` が無い・該当する要素が無い・順番が要素の数を超える場合は `InvalidArgumentError`
      5. 並びを返す
    exceptions:
      - name: InvalidArgumentError
        condition: 書式が誤っている
        message: 項目のパス {path} の記載方法が誤っています（例 `#functions[save].process`・`#functions[save#2].process`・`#notes[main.py の補足]`）
      - name: InvalidArgumentError
        condition: '`x-key` を持たない配列'
        message: '{path}: {配列のパス} は x-key を持たない配列です'
      - name: InvalidArgumentError
        condition: 該当する要素が無い
        message: '{path}: {配列のパス} に {x-key} が {値} の要素がありません'
      - name: InvalidArgumentError
        condition: 順番が要素の数を超える
        message: '{path}: {x-key} が {値} の要素は {数} 個です'
      - name: InvalidArgumentError
        condition: キーが無い・辞書でない
        message: '{path}: {辞書のパス} にキー {キー} がありません'
    unit_tests:
      - name: test_resolve_ref_path
        case: 正常
        summary: x-key の値と順番で要素を指す
        condition: '`functions`（`$ref` で `x-key: name` の配列）が `load`・`save`・`save` の内容を `functions[save].process` と `functions[save#2].process`'
        mock: なし
        expected: '`["functions", 1, "process"]` と `["functions", 2, "process"]`'
        exception: '-'
      - name: test_resolve_ref_path_when_dict_key
        case: 正常
        summary: '`.` を含む辞書のキー'
        condition: '`{"notes": {"main.py の補足": "x"}}` を `notes[main.py の補足]`'
        mock: なし
        expected: '`["notes", "main.py の補足"]`'
        exception: '-'
      - name: test_resolve_ref_path_when_unresolved
        case: 異常
        summary: 要素・キーを指せない
        condition: 同じ内容と `x-key` を持たない配列 `steps` で、`steps[a].body`・`functions[missing].process`・`functions[save#3].process`・`notes[missing]`
        mock: なし
        expected: どれも `InvalidArgumentError` で、理由が順に x-key の無い配列・要素が無い・要素は 2 個・キーが無い
        exception: '`x-key` を持たない配列・該当する要素が無い・順番が要素の数を超える・キーが無い'
  - name: set_field_at
    title: 並びで指した項目の書き込み
    kind: 関数
    container: project_index/features/documents/fields.py
    usecase: 書き込み
    role: 書き込み
    summary: キーと位置の並びで指した場所へ値を書く
    scope: public
    thread_safe: false
    side_effects: '`data` を書き換える'
    args:
      - name: data
        title: 内容
        type: MutableMapping[str, Any]
        required: true
        passing: positional
        description: 書き換える内容
      - name: tokens
        title: キーと位置の並び
        type: Sequence[str | int]
        required: true
        passing: positional
        description: 参照の型の項目のパスの解決の結果（`.` を含むキーも 1 つのキー）
      - name: value
        title: 値
        type: object
        required: true
        passing: positional
        description: 書く値
    returns:
      type: None
      description: '-'
    process: 1. 『項目の書き込み』の手順 2〜5 を、項目のパスを分けた並びの代わりに `tokens` で行う（『項目の書き込み』も分けた並びでこの関数を呼ぶ）
    exceptions:
      - name: InvalidArgumentError
        condition: 途中の値の型が合わない・位置が配列の長さを超える
        message: 『項目の書き込み』と同じ
    unit_tests:
      - name: test_set_field_at
        case: 正常
        summary: '`.` を含むキーへ書く'
        condition: '`{"notes": {"main.py の補足": "x"}}` へ `["notes", "main.py の補足"]` = `y`'
        mock: なし
        expected: '`{"notes": {"main.py の補足": "y"}}`'
        exception: '-'
  - name: resolve_array
    title: 配列の項目の解決
    kind: 関数
    container: project_index/features/documents/fields.py
    usecase: 書き込み
    role: 読み取り
    summary: '`add_to`・`remove_from` のキーの項目のパスを、文書の中の 1 つの値へ解決して返す'
    scope: public
    thread_safe: false
    side_effects: '`create` が `True` で項目が無いとき、`data` に空の配列を書く'
    args:
      - name: data
        title: 内容
        type: MutableMapping[str, Any]
        required: true
        passing: positional
        description: 操作を当てている内容
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書 1 件の内容に当てるスキーマ。`#` で始まるパスの `x-key` の解決に使用する
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: '`#` で始まる参照の型の項目のパスか、要素の選び方を含まない項目のパス'
      - name: create
        title: 無ければ作る
        type: bool
        required: true
        passing: keyword
        description: '`#` で始まらないパスの項目が無いとき、空の配列を書いて返すか'
    returns:
      type: object | None
      description: 文書の中の値そのもの（複製しない）。項目が無く `create` が `False` のときは `None`
    process: |-
      1. `path` が `#` で始まる場合、`#` の後を『参照の型の項目のパスの解決』で `data` と `schema` からキーと位置の並びに解き、その並びでたどった値を返す（項目を作らない）
      2. それ以外は、要素の選び方（`[]`・`[{キー}]`・`**.`）を含まないパスだけをキーと位置の並びに分ける
      3. 並びでたどれれば、その値を返す
      4. たどれず `create` が `True` なら、『並びで指した項目の書き込み』で空の配列を書いて、その配列を返す。`False` なら `None` を返す
    exceptions:
      - name: InvalidArgumentError
        condition: '`#` で始まるパスを解けない（`x-key` の無い配列・要素が無い・キーが無い）・`#` で始まらないパスが要素の選び方を含む'
        message: '`{path}: ...` の理由 1 件。要素の選び方を含むパスは `#` で始めて `x-key` の値で要素を指すことを添える'
    unit_tests:
      - name: test_resolve_array
        case: 正常
        summary: 参照の型の項目のパスで要素の中の配列を返す
        condition: '`models`（`x-key: name`）が `{name: Row, properties: [a]}`・`{name: Col, properties: [b]}` の内容とスキーマに `#models[Row].properties`'
        mock: なし
        expected: 返した値が内容の `models[0].properties` と同じオブジェクト
        exception: '-'
      - name: test_resolve_array_when_plain_missing
        case: 正常
        summary: 要素の選び方を含まないパスの項目が無い
        condition: '`{}` に `tags` を `create=True` と `create=False` で'
        mock: なし
        expected: '`create=True` は `[]` を返して内容が `{tags: []}`、`create=False` は `None` で内容は変わらない'
        exception: '-'
      - name: test_resolve_array_when_index
        case: 正常
        summary: 位置で指すパス
        condition: '`{functions: [{refs: [x]}]}` に `functions[0].refs`'
        mock: なし
        expected: '`functions[0].refs` の配列そのもの'
        exception: '-'
      - name: test_resolve_array_when_selector
        case: 異常
        summary: '`#` で始まらず要素の選び方を含むパス'
        condition: 同じ `models` の内容に `models[Row].properties`・`models[].properties`・`**.properties`
        mock: なし
        expected: どれも `InvalidArgumentError` で、内容は変わらない
        exception: 要素の選び方を含む
      - name: test_resolve_array_when_unresolved
        case: 異常
        summary: 参照の型の項目のパスを解けない
        condition: 同じ内容に `#models[Zzz].properties`
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: 要素が無い
visibility: internal
