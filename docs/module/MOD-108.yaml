notes:
  例外の配置先: どの分類の関数も、呼び出し側へ返す失敗は `shared/errors.py` の子クラスで送る。スクリプトの実行の失敗（スクリプトの実行の分類）と YAML を読めないことは、それぞれの分類の例外で送り、呼び出し側が `Violation` か本文の誤りに変える。
  受け持つこと: 端末の設定の API への書き込みの要求のオリジンの確認も受け持つ。
