id: MOD-22
title: 索引のサーバー / 説明 / types.py
lead: '`describe` の要求と結果の型を受け持ち、説明の types.py を修正するときに参照する。'
data_models:
  - name: DescribeRequest
    title: 説明の要求
    container: project_index/features/describe/types.py
    usecase: 説明
    role: DTO
    summary: '`describe` の引数'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。キーの意味はインターフェース定義『配信元の説明』の `request`。'
    properties:
      - name: source
        title: 配信元
        type: str | None
        access: 公開
        default: None
        description: '`None` は使える配信元の一覧'
      - name: kind
        title: 種類
        type: str | None
        access: 公開
        default: None
        description: '`source` を渡したときだけ'
      - name: worktree
        title: ワークツリー
        type: str | None
        access: 公開
        default: None
        description: 設定とスキーマを読むワークツリー
      - name: format
        title: 形式
        type: Literal['markdown', 'json']
        access: 公開
        default: '"markdown"'
        description: 返却する形式
      - name: cwd
        title: 作業場所
        type: str | None
        access: 公開
        default: None
        description: セッションの作業場所（フックが入れる）。ツールの入力のスキーマの説明に `CWD_DESCRIPTION`（[権限と作業場所の types.py](id:MOD-8)）を持つ
      - name: outside_scope
        title: 作業範囲の外も読むか
        type: bool
        access: 公開
        default: 'False'
        description: '`True` のとき、`scope` に該当しない配信元を `outside_read` が真なら作業範囲の外（参考）として参照する（`source` が ID 1 つのとき）。`source` を省いたときは、使用できる配信元の一覧に作業範囲の外で参照できる配信元の一覧を加える'
  - name: KindSummary
    title: 種類の概要
    container: project_index/features/describe/types.py
    usecase: 説明
    role: DTO
    summary: 種類の一覧の 1 行
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 種類の ID
        type: str
        access: 公開
        description: '`documents[].id`'
      - name: description
        title: 説明
        type: str
        access: 公開
        description: スキーマの `description`。無ければ行の `title`、どちらも無ければ空
  - name: SourceListResult
    title: 使える配信元の一覧
    container: project_index/features/describe/types.py
    usecase: 説明
    role: DTO
    summary: 引数なしの結果
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: workplace
        title: 作業場所
        type: Workplace
        access: 公開
        description: 作業場所の説明の結果
      - name: sources
        title: 配信元
        type: list[SourceAccess]
        access: 公開
        description: 使える配信元の結果
      - name: outside_sources
        title: 作業範囲の外で参照できる配信元
        type: list[OutsideSource] | None
        access: 公開
        default: None
        description: '`outside_scope` が `True` のときだけリスト（0 件は空）。`format: json` は空のリストと `None` を落とすので、どちらも `outside_sources` のキーを持たない'
      - name: warnings
        title: 警告
        type: list[str]
        access: 公開
        default: '[]'
        description: '警告の収集の結果。`format: json` は空のリストを落とすので、0 件のときは `warnings` のキーを持たない'
  - name: OutsideSource
    title: 作業範囲の外で参照できる配信元
    container: project_index/features/describe/types.py
    usecase: 説明
    role: DTO
    summary: 作業範囲の外で参照できる配信元の一覧の 1 行
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 配信元の ID
        type: str
        access: 公開
        description: 配信元の ID
      - name: description
        title: 説明
        type: str
        access: 公開
        description: 配信元の設定の `description`
      - name: when
        title: 使う場面
        type: list[str]
        access: 公開
        default: '[]'
        description: 配信元の設定の `when`
  - name: SourceGuideResult
    title: 配信元の説明書
    container: project_index/features/describe/types.py
    usecase: 説明
    role: DTO
    summary: '`source` だけの結果'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: 配信元の ID
      - name: instructions
        title: 説明書
        type: str
        access: 公開
        description: 配信元の設定の `instructions` をそのまま
      - name: when
        title: 使う場面
        type: list[str]
        access: 公開
        default: '[]'
        description: '配信元の設定の `when`。`format: json` は空のリストを落とすので、0 件のときは `when` のキーを持たない'
      - name: kinds
        title: 種類
        type: list[KindSummary]
        access: 公開
        description: 有効な文書の行の順
      - name: outside_scope
        title: 作業範囲の外から読んだか
        type: bool
        access: 公開
        default: 'False'
        description: 読んだ場所の `outside_scope`
      - name: refs
        title: ブランチとタグ
        type: dict[str, list[str]] | None
        access: 公開
        description: '`{branches, tags}`（リビジョンの一覧の名前だけ）。Git でない配信元は `None`'
        default: None
      - name: worktrees
        title: ワークツリー
        type: list[WorktreeInfo] | None
        access: 公開
        description: ワークツリーの一覧。Git でない配信元は `None`
        default: None
  - name: KindSchemaResult
    title: 種類のスキーマ
    container: project_index/features/describe/types.py
    usecase: 説明
    role: DTO
    summary: '`source`・`kind` の結果'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: 配信元の ID
      - name: kind
        title: 種類
        type: str
        access: 公開
        description: 種類の ID
      - name: schema_text
        title: スキーマの YAML
        type: str
        access: 公開
        description: スキーマのファイルの内容そのまま（`markdown` で返す）
      - name: schema
        title: スキーマ
        type: dict[str, Any]
        access: 公開
        description: 読んだスキーマ（`json` で返す）
      - name: metadata
        title: メタデータの対応
        type: dict[str, str]
        access: 公開
        description: 行の `metadata`（共通のキー → 列名）。持たない行は空
      - name: outside_scope
        title: 作業範囲の外から読んだか
        type: bool
        access: 公開
        default: 'False'
        description: 読んだ場所の `outside_scope`
