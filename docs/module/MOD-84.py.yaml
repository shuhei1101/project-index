      - name: test_write_docs_when_direct_commit_not_permitted_workplace
        case: 異常
        summary: 直コミットを呼べない作業場所は取得の前に断る
        condition: ベアリポジトリのコミットするブランチを 1 コミット先に進め、`direct_commit_scope` に該当しない作業場所から `commit` つきの `create`
        mock: なし（一時フォルダのベアリポジトリ）
        expected: '`DirectCommitNotPermittedError`。クローンの追跡ブランチとワークツリーの HEAD が変わらない（取得していない）'
        exception: 直コミットを呼べない作業場所
      - name: test_write_docs_when_commit_branch_worktree
        case: 異常
        summary: コミットするブランチのワークツリーへの書き込みはリポジトリの排他を待つ
        condition: リポジトリの排他を握ったまま、コミットするブランチのワークツリーへ `commit` を省いて書き込む（書き込みの期限を短くする）
        mock: なし
        expected: '`WriteDeadlineExceededError`。ファイルは変わらない'
        exception: 待ち時間の上限までに排他を握れない
      - name: test_write_docs_when_other_worktree
        case: 正常
        summary: 別のワークツリーへの書き込みは待たない
        condition: リポジトリの排他を握ったまま、コミットするブランチでないワークツリーへ `commit` を省いて書き込む
        mock: なし
        expected: '待たずに書き込み、`applied: true`'
      - name: test_write_docs_when_existing_body_file_adopted
        case: 正常
        summary: 既にあるファイルを本文のファイルにする
        condition: '`records: items`・`body_file: path` の行（要素 n1 の `path` が `n1.md`、要素 n3・n5 は `path` を持たない）で、どの要素も指さない `notes/n6.md`・`notes/n7.md`・`notes/n8.md` を先に作る。`data: {id: n6, path: n6.md}` の `create`、n3 の `set: {path: n7.md}`、n5 の `data: {id: n5, path: n8.md}` の `replace` を順に呼ぶ'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）。配信元とワークツリーは一時フォルダ
        expected: '3 件とも通り、要素がそれぞれ `path: n6.md`・`n7.md`・`n8.md` を持つ。`notes/n6.md`・`notes/n7.md`・`notes/n8.md` は書き込みの前と同じで、`diff` に `@@` の行が無く、`version` が組み立てた文書のバージョン'
      - name: test_write_docs_when_existing_body_file_rejected
        case: 異常
        summary: 既にあるファイルを本文のファイルにできない
        condition: '同じ行と、1 ファイル 1 文書の行（`docs/*.yaml`、文書 1 は `docs/doc-1.yaml`）。`@body` を持たない `create` で `path` が `n1.md`・`index.yaml`・`../docs/doc-1.yaml` の 3 件と、`path: n6.md`・`@body` の `create` を 1 件ずつ。要素が 0 件の管理用の YAML（`items: []`）で `path: index.yaml` の `create` も 1 件。別に、1 回の呼び出しで `@body` を持たずに `path: n6.md` を指す `create` を 2 件'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: どれも `ValidationFailedError` で違反の `path` が `path`。決まりに `n1`・行の ID `notes` と管理用の YAML・`doc-1` を含み、`@body` を持つ件の直し方に `@body` を除くことを含む。2 件の呼び出しは添字 1 の違反で `n6` を含む。どのファイルも変わらない
        exception: '`atomic` で検査に通らない操作がある'
      - name: test_write_docs_when_non_document_file_not_adoptable
        summary: 配信元の文書でないファイルを本文のファイルにできない
        case: 異常
        condition: '`records: items`・`body_file: path` の行 `notes`（`schema: schemas/notes.schema.yaml`）と、`paths: [drafts/*.yaml]`・`exclude: [drafts/skip.yaml]` の行 `drafts`、どの行も指さない `generators[]` の行 `generate`（`run: [python3, scripts/generate.py]`）を持つ配信元。`@body` を持たない `create` で `path` が `../project-index.yaml`・`../scripts/generate.py`・`../drafts/skip.yaml`・`../schemas/notes.schema.yaml` の 4 件を 1 件ずつ。別に、`paths_base` で `root` を配信元のフォルダの 1 つ上にした配信元で、設定のファイル・スクリプトを指す `create` を 1 件ずつ'
        exception: 本文のファイルが配信元の文書でないファイルを指す
        expected: どれも `ValidationFailedError` で違反の `path` が `path`。決まりに、配信元の設定であること・`generators[generate]`・行の ID `drafts` と除外したファイルであること・`documents[notes].schema` を含み、`paths_base` の配信元でも配信元の設定・スクリプトとして断る。どのファイルも変わらない
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
      - name: test_write_docs_when_sqlite_kind
        case: 異常
        summary: SQLite の行の種類への操作を、適用する前に ReadOnlyKindError で断る
        condition: '文書 1 の update・`n1` の update・`kind: notes_db` の create の 3 件。`atomic` を省く'
        mock: なし
        expected: '`ReadOnlyKindError` の `positions` が `operations[1]`・`operations[2]` で、文書 1 のファイルが変わらない'
      - name: test_write_docs_when_sqlite_kind_not_atomic
        case: 正常
        summary: 'atomic: false では通る操作だけを書き込む'
        condition: '同じ 3 件を `atomic: false` で渡す'
        mock: なし
        expected: '`applied: true` で `results[0].status` が `updated`、`results[1]`・`results[2]` が `failed` と `ReadOnlyKindError` の理由'
      - name: test_write_docs_when_replace_text_matches_sqlite
        case: 正常
        summary: replace_text は SQLite の行の文書を置換の対象にしない
        condition: '`filter` が YAML の文書と `n1` の両方に該当する `replace_text`'
        mock: なし
        expected: YAML の文書だけを置換し、`data/notes.db` が変わらない
      - name: test_write_docs_when_direct_commit_body_not_allowed
        case: 異常
        summary: 本文の直コミットを断る種類の本文が変わる操作を断る
        condition: '`direct_commit.kinds` が `[note, {id: files, body: false}]` の配信元で、`commit` つきの `files` の行への `set: {@body: x}`・`text_edits` の `@body`・`new_path` つきの `rename`、行の本文がリンクする `note` の文書の `rename`、`fields` を省いた `replace_text` を 1 件ずつ'
        mock: なし（一時フォルダのベアリポジトリ）
        expected: 5 件とも添字 0 と `files` の行の ID の違反の `ValidationFailedError`。ワークツリーとベアリポジトリは変わらない
        exception: 本文の直コミットを断る種類の本文が変わる
      - name: test_write_docs_when_direct_commit_metadata_only
        case: 正常
        summary: 本文の直コミットを断る種類のメタデータだけを直コミットする
        condition: '同じ配信元で、`commit` つきの `files` の行への `set: {description: 変えた説明, tags: [topic:a]}`'
        mock: なし（一時フォルダのベアリポジトリ）
        expected: '`applied=True`。ベアリポジトリに増えたコミットの変更に本文のファイルが入らない'
  - name: delete_docs
    title: 文書の削除
    kind: 関数
    container: project_index/features/write/service.py
    usecase: 書き込み
    role: サービス
    summary: '`delete_docs` の要求を処理して削除の結果を返す'
    scope: public
    thread_safe: true
    side_effects: 作業ツリーのファイルを消す。`unlink` のときは参照元の文書を書き換える。`generators[]` を動かす
    args:
      - name: request
        title: 削除の要求
        type: DeleteRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 今の文書を読む
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 参照を外した文書の検査と、削除の前の検査
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        required: true
        passing: injected
        description: 削除を 1 つずつにする
      - name: timeout_sec
        title: 制限時間
        type: float
        required: true
        passing: keyword
        description: '`generators[]` の制限時間'
      - name: limits
        title: 呼び出しの期限
        type: CallLimits | None
        required: false
        default: None
        passing: keyword
        description: 文書の書き込みと同じ
      - name: repo_locks
        title: リポジトリごとの排他
        type: RepositoryLocks
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
    returns:
      type: DeleteResult
      description: 削除の結果
    process: |-
      1. `targets` が 1〜`OPERATIONS_MAX` 件でなければ `InvalidArgumentError` を送る
      2. 書く場所を解き、配信元の排他を握り、今の文書を集める（文書の書き込みと同じ）
      3. 対象ごとに確かめる。失敗した対象は `failed` の行にする
         - 文書が無ければ近い ID を添えた `DocumentNotFoundError`
         - Git 管理外の配信元で種類の行が `writable` でなければ `DeleteNotAllowedError`
         - バージョンの確かめ（前回読んだ内容は無し）
         - 同じ配信元の残る文書のうち、メタデータの `related` に `to` が消す文書の ID で `source` の無い行を持つ文書を集める。あれば `on_referenced` が `fail` なら参照元を添えた `DocumentReferencedError`、`unlink` なら参照元の `related` の列（種類の行の `metadata.related` の列名。無ければ `related`）からその行を除く操作を作る。除く配列は『列名の指す配列の取得』で取り、列名が `**.` で始まるときは最上位と入れ子の全ての配列から除く
      4. `atomic` が `True` で `failed` があれば、最初の失敗の例外を送る
      4.5. 削除の前の検査（`_check_delete_validators`）: 手順 3 で残った対象ごとに、文書の検査.`check_delete` を `delete_ids`（残った対象の `id`）と `deadline`（手順 5 と同じ）で呼ぶ
         - 違反のあった対象は、添字つきの `ValidationFailedError` で `failed` の行にする。`atomic` が `True` なら、その例外を送る
         - `atomic` が `False` で違反があった場合、その対象を `delete_ids` から除き、残る対象の検査をやり直す。新規の違反が出なくなるまで繰り返す（最大で対象の件数の回数）。参照を外す操作は、最後まで残った対象の分だけにする
      5. 参照を外した文書を文書の検査に通す（違反は `ValidationFailedError`。`deadline` は `limits` があれば `limits.write_deadline`）
      6. `dry_run` なら `applied=False` で、`unlinked` に参照を外す文書と外した後のバージョンを入れて返す
      7. `limits` がある場合、文書の書き込みの手順 9 と同じに期限を確かめる
      8. ファイル 1 つの文書はファイルを消し、`records` の文書は配列から要素を除いて、往復編集の書き出し（`original` はそのファイルの作業ツリーの文字列）でファイルを置き換える。`body_file` の行の文書は本文のファイルも消す（本文のファイルを持たない要素は要素だけを除く）。要素を除いた後の同じ管理用の YAML の要素が同じ本文のファイルを指すときと、本文のファイルが無いときは消さない。参照を外した文書を、往復編集の書き出し（`original` は参照元のファイルの作業ツリーの文字列）で書き、文書のストア.キャッシュを捨てる
      9. 消した種類の `after_write` の生成を、文書の書き込みと同じに動かす（引数は消したファイルのパス。制限時間も同じ）
      10. `applied=True` で、`unlinked` に参照を外した文書と新しいバージョンを入れて返す

      `request.commit` がある場合は、文書の書き込みの直コミットと同じに進める（書き換わる文書は消す文書と参照を外す文書。`write_once` は手順 3〜5・7〜9 を行い、消すファイルも `check_clean` にかける）。`commit` が無くコミットするブランチのワークツリーへ書く場合の排他も同じ
    exceptions:
      - name: DocumentReferencedError
        condition: '`on_referenced: fail` で参照されている'
        message: '`{id} は {参照元} から参照されています`'
      - name: DeleteNotAllowedError
        condition: Git 管理外の配信元で `writable` でない種類
        message: '`{kind} は削除を許していません（documents[].writable）`'
      - name: VersionMismatchError
        condition: バージョンが違う
        message: '`{id} は参照した後に変わっています（今のバージョン {version}）`'
      - name: DocumentNotFoundError
        condition: 無い文書を指した
        message: '`文書がありません: {id}`'
      - name: WriteDeadlineExceededError
        condition: 検査の前後か、ファイルを消す・置き換える前に `limits.write_deadline` を過ぎている
        message: 『期限』.期限の確認のまま
      - name: ValidationFailedError
        condition: '削除の時点（`on` に `delete`）の `validators[]` が違反を返却した（`atomic: true`）'
        message: 添字つきの違反（検査の出力の `path`・`rule`・`fix`）
    unit_tests:
      - name: test_delete_docs
        case: 正常
        summary: ワークツリーから消す
        condition: 参照されていない文書 2 を消す
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`status` が `deleted`、ワークツリーのファイルが無く、クローン本体のファイルは残る'
      - name: test_delete_docs_when_unlink
        case: 正常
        summary: 参照も外す
        condition: '文書 1 の `related` が指す文書 2 を `on_referenced: unlink` で消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 文書 2 のファイルが無く、文書 1 の `related` に文書 2 が無く、`unlinked` に文書 1 と新しいバージョン
      - name: test_delete_docs_when_records
        case: 正常
        summary: 配列の要素を消す
        condition: '`records` の行の 2 件目を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: ファイルの配列が 1 件になり、消した要素の `body_file` の指すファイルも無い
      - name: test_delete_docs_when_referenced
        case: 異常
        summary: 参照されている
        condition: '同じ削除を `on_referenced: fail` で'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`DocumentReferencedError` の `referrers` が文書 1、どのファイルも変わらない'
        exception: '`on_referenced: fail` で参照されている'
      - name: test_delete_docs_when_not_allowed
        case: 異常
        summary: 削除を許していない
        condition: 'Git 管理外の配信元で `writable: false` の種類の文書'
        mock: なし
        expected: '`DeleteNotAllowedError` の `kind` が種類の ID'
        exception: Git 管理外の配信元で `writable` でない種類
      - name: test_delete_docs_when_deadline_passed
        case: 異常
        summary: 消す前に期限を過ぎている
        condition: 残りの時間が 0 の `write_deadline` を持つ `limits` で文書 2 を消す
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）・時計（偽物）
        expected: '`WriteDeadlineExceededError`、文書 2 のファイルが残る'
        exception: 検査の前後か、ファイルを消す・置き換える前に `limits.write_deadline` を過ぎている
      - name: test_delete_docs_when_body_file_shared
        case: 正常
        summary: ほかの要素も指す本文のファイルを残す
        condition: '`records`・`body_file` の行で、要素 n1・n3 が同じ `n1.md` を指す。n3 を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 配列が n1 だけになり、`n1.md` は変わらない
      - name: test_delete_docs_when_unlink_nested
        case: 正常
        summary: 入れ子の参照も外す
        condition: '行の `metadata` が `{related: "**.refs[]"}`。文書 n1 の最上位の `refs` と `functions[0].refs` がどちらも n2 を指し、最上位の `refs` は n3 も指す。n2 を `on_referenced: unlink` で消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: n1 の最上位の `refs` が n3 だけになり、`functions[0].refs` が空になる。`unlinked` に n1
        exception: '-'
      - name: test_delete_docs_when_unlink_indent_preserved
        case: 正常
        summary: 参照を外した文書の配列の字下げを保つ
        condition: '文書 2 が `related:` の直下に `- ` を字下げ無しで `{to, type}` の要素を 2 つ並べ、その 1 つが文書 1 を指す。文書 1 を `on_referenced: unlink` で消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 文書 2 のファイルは、文書 1 を指す要素の 2 行だけが消え、残る行は書き込み前の文字列と一致する（`- ` が字下げ無しのまま）
      - name: test_delete_docs_when_records_indent_preserved
        case: 正常
        summary: '`records` の要素の削除で管理用の YAML の配列の字下げを保つ'
        condition: '`records: items`・`body_file: path` の行の管理用の YAML が `items:` の直下に `- ` を字下げ無しで 2 要素を並べる。2 件目を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 管理用の YAML は 2 件目の要素の 2 行だけが消え、1 件目は字下げ無しのまま残る
      - name: test_delete_docs_when_body_file_absent
        case: 正常
        summary: 本文のファイルを持たない要素を削除する
        condition: '`records: items`・`body_file: path` の行で、要素 n1（`path: n1.md`）と `path` を持たない n4。n4 を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 配列が n1 だけになり、`notes/n1.md` は残る
      - name: test_delete_docs_when_delete_validator_fails
        case: 異常
        summary: 削除の時点の検査に合格しない
        condition: '文書 2 に違反を出す `on: [delete]` の検査を持つ行で、文書 2 を削除する'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`ValidationFailedError` の違反の `index` が 0、文書 2 のファイルが残る'
        exception: 削除の時点の `validators[]` が違反を返却した
      - name: test_delete_docs_when_delete_validator_retry
        case: 正常
        summary: 'atomic: false で failed の対象を除いて検査をやり直す'
        condition: '`on: [delete]` の検査が、文書 1 には常に違反を出し、文書 2 には `PROJECT_INDEX_DELETE_IDS` に文書 1 が無いときだけ違反を出す。文書 1・文書 2・文書 3 を `atomic: false` で削除する'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 文書 1・文書 2 が `failed`、文書 3 が `deleted` で、文書 1・文書 2 のファイルが残り、文書 3 のファイルが無い
        exception: '-'
      - name: test_delete_docs_when_sqlite_kind
        case: 異常
        summary: SQLite の行の文書の削除を ReadOnlyKindError で断る
        condition: '`targets` が文書 1 と `n1`'
        mock: なし
        expected: '`ReadOnlyKindError` の `positions` が `targets[1]` で、文書 1 のファイルが残る'
      - name: test_delete_docs_when_direct_commit_body_not_allowed
        case: 異常
        summary: 本文の直コミットを断る種類の本文のファイルを削除する操作を断る
        condition: '`direct_commit.kinds` が `[note, {id: files, body: false}]` の配信元で、`commit` つきで本文のファイルを持つ `files` の行を削除する'
        mock: なし（一時フォルダのベアリポジトリ）
        expected: 添字 0 と行の ID の違反の `ValidationFailedError`。行と本文のファイルが残り、ベアリポジトリは変わらない
        exception: 本文の直コミットを断る種類の本文のファイルを削除する
  - name: commit_documents
    title: 書き込みと削除の直コミット
    kind: 関数
    container: project_index/features/write/service.py
    usecase: 直コミット
    role: サービス
    summary: 書き込みの API の要求を処理し、書き込みと削除を 1 つの直コミットにして結果を返す
    scope: public
    args:
      - name: request
        title: 要求
        type: CommitDocumentsRequest
        required: true
        passing: positional
        description: 書き込みの API の本文から作った要求
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
      - name: repo_locks
        title: リポジトリごとの排他
        type: RepositoryLocks
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
      - name: timeout_sec
        title: スクリプトの制限時間
        type: float
        required: true
        passing: keyword
        description: 文書の書き込みと同じ
      - name: now
        title: 今の時刻
        type: datetime | None
        required: false
        default: None
        passing: keyword
        description: 文書の書き込みと同じ
      - name: limits
        title: 呼び出しの期限
        type: CallLimits | None
        required: false
        default: None
        passing: keyword
        description: 無ければ既定の期限
      - name: state_dir
        title: 状態のフォルダ
        type: Path
        required: true
        passing: keyword
        description: 端末の設定の `state_dir`。衝突したときの一時のワークツリーの配置先
      - name: reload_sources
        title: 配信元の再読み込み
        type: Callable[[], object]
        required: true
        passing: keyword
        description: 管理の MCP の `reload` と同じ処理。起動の配線が渡す
    returns:
      type: CommitDocumentsResult
      description: 書き込みと削除の結果とコミットの結果
    process: |-
      1. `writes` と `deletes` の件数の合計が `OPERATIONS_MAX` 件を超えるか、`source_config` も無いまま 0 件なら `InvalidArgumentError` を送る。`writes` は文書の書き込みの操作の確かめ（`_check_operations`）にかける

      2. `registry.get_for_docs(request.source)` で配信元を引き、直コミットの書き込む先（`resolve_commit_plan`）で計画を作る。許可する種類は作業場所でなく、書き込みの API から直コミットできる種類（`write_api_committable_kinds`）にする。空で `writes`・`deletes` があれば取得の前に、配信元の `direct_commit.kinds` を `kinds` に添え、`next_steps` で端末の設定の `sources[].direct_commit.write_api_kinds` を示す `DirectCommitNotPermittedError` を送る。`source_config` があれば、取得の前に配信元の設定の許可の確認（`check_source_config_permitted`）と配信元の設定のファイル（`source_config_relative_path`）を呼ぶ

      3. 文書の書き込みの直コミット（`request.commit` がある場合）の手順 3・4 と同じ排他・`dry_run`・直コミットを進めるの順に進める。`write_once` は 1 つの書く場所と文書の集まり（`_Session`）で次を行う
         - `request.base_commit` がある場合、最初に編集を始めたときのコミットの確認（`verify_base_commit`、`timeout` は書き込みの期限までの残り）で 40 桁の SHA を求める
         - `source_config` がある場合、ワークツリーの `project-index.yaml` を読み、`content_hash` が `source_config.expected_version` と違えばパス `sourceConfig` の `VersionMismatchError` を送る。配信元の設定の検査（`check_source_config_content`、`current` は読んだ内容、`root` はワークツリーの配信元のフォルダ）にかけ、書き換えた後の値で作った配信元の設定のスキーマを、続く `writes`・`deletes` の検査に使用する。秘密の値の検出も `content` にかける
         - `writes` を文書の書き込みと同じに当て（`_apply_operations`、`atomic` は `True`）、続けて `deletes` を文書の削除と同じに当てる（`_apply_deletes`、`on_referenced` は要求の値、`atomic` は `True`）。どちらかで失敗したら、`writes`・`deletes` の別と添字を付けた例外を送る
         - 直コミットの確認（文書の書き込みの `_check_commit_content`）を、書き込みと削除で書き換わる全ての文書（参照を外す文書を含む）について、手順 2 の許可する種類で行う。`direct_commit.kinds` に無い種類は `ValidationFailedError`、`direct_commit.kinds` にあって許可する種類に無い種類は `DirectCommitNotPermittedError` にする（前者を先に判定する）
         - 書き込むファイル（`source_config` があれば `project-index.yaml` を含む）を `check_clean` にかけ、`project-index.yaml` に `source_config.content` を書き、書き込みと削除を全て書き、書き込みと削除の種類の生成を文書の書き込みの直コミットと同じ制限時間で動かす
         - 書いた・消したファイルを返す（直コミットを進めるが 1 つのコミットにする）

      4. 手順 3 が衝突にする例外（`CONFLICT_ERRORS`）で失敗し、`request.base_commit` がある場合（例外が `ValidationFailedError` で違反が全て決まり `protected_key` のときは衝突にせず、そのまま送る）、手順 3 の排他を握ったまま衝突したときのブランチへのコミット（`keep_in_branch`、`commit` は `dry_run` でないとき `True`、`now` が `None` なら今の UTC の時刻）を呼ぶ。ほかの例外と、`base_commit` が無い要求の例外はそのまま送る
         - `write_once` は、受け取ったフォルダを書く場所にして（作業場所の配信元の読み込み。`scope.write` を確認しない）、手順 3 の `write_once` と同じ当て・直コミットの確認・書き込み・生成を行い、書いた・消したファイルを返す（`check_clean` は呼ばない）。直コミットの確認の `direct_commit.kinds`・許可する種類・読み取り専用の種類・秘密の値の検査は手順 2 の今の配信元（`registry.get_for_docs` の配信元）の設定で判定し、受け取ったフォルダで読み込んだ配信元からはスキーマ・`validators[]`・`generators[]` と文書の値だけを使用する。`source_config` がある場合、配信元の設定の検査の `current`（書き換えられないキーを比べる相手）は手順 3 で取り込んだ後のワークツリーの `project-index.yaml`（今の `origin/{コミットするブランチ}`）にし、バージョンの照合とスキーマ・起動の検証は受け取ったフォルダの `project-index.yaml` で行う
         - `keep_in_branch` の `timeout` は書き込みの期限までの残り、`respond_by` は `limits.respond_by` にする
         - `keep_in_branch` が例外で失敗した場合、手順 3 の例外を送る（一時のワークツリーの例外は捨てる）
           - `CONFLICT_ERRORS` に当たらない例外の場合、`[warning]` 衝突したときのブランチに残せなかった（配信元・`base_commit`・例外）
         - 書き込みの期限を過ぎた場合は `WriteDeadlineExceededError` を送る

      5. `source_config` を含むコミットをプッシュして排他を放した後、`reload_sources` を呼ぶ。例外で失敗したら `[warning]` 配信元の設定の再読み込みに失敗した（配信元・例外）を書き、`reloaded` を `False` にする（コミットは戻さない）

      6. 排他を放した後、`dry_run` でなく、手順 2 の配信元の `direct_commit_on_conflict` がある場合、衝突したときのスクリプトの実行（`run_conflict_script`）を呼ぶ。`cwd` はクローン本体の直下、`env` は配信元の ID・ブランチ・コミット・`base_commit` の 40 桁の SHA・コミットするブランチ・`message`、`timeout_sec` は `limits.respond_by` の残りと `timeout_sec` の短い方にする

      7. `applied`・`writes`（書き込みの結果）・`deletes`（削除の結果）・`unlinked`・`commit`・`source_config`（`source_config` を受けたとき、書き込んだ後のバージョン・差分・手順 5 の再読み込みの結果）で返す。衝突した場合は `applied` を `False`・`writes`・`deletes`・`unlinked` を一時のワークツリーの結果・`commit` を `None` にし、`conflict` に手順 4 のブランチとコミット・`base_commit` の 40 桁の SHA・手順 3 の例外の違反（`errors`）・手順 6 の結果を入れる。会話の記録は残さない（会話キーを持たない）
    unit_tests:
      - name: test_commit_documents
        case: 正常
        summary: 書き込みと削除を 1 つのコミットにする
        condition: '一時フォルダの git の配信元とベアリポジトリ、`write_api_kinds: [note]`。文書 n1 の `update` と n2 の削除'
        mock: なし（一時フォルダの git）
        expected: '`applied` が `True`、リモートのコミットが 1 つ増え、変更が n1・n2 のファイルだけ'
      - name: test_commit_documents_when_not_permitted
        case: 異常
        summary: 書き込みの API の許可が無ければ取得の前に断る
        condition: '`write_api_kinds` が空'
        mock: なし（一時フォルダの git）
        expected: '`DirectCommitNotPermittedError` で、リモートとワークツリーは変わらない'
      - name: test_commit_documents_when_disallowed_kind_rewritten
        case: 異常
        summary: 配信元が許可していない種類の参照元が書き換わると検査の不合格
        condition: '種類 `rule` の r1 が n2 を参照し、`on_referenced: unlink` で n2 を削除'
        mock: なし（一時フォルダの git）
        expected: '`ValidationFailedError` で、違反のパスが `deletes[0]`'
      - name: test_commit_documents_when_one_invalid
        case: 異常
        summary: 1 つの操作の違反でどれも書かない
        condition: n1 の正しい `update` と、スキーマに違反する n2 の `update`
        mock: なし（一時フォルダの git）
        expected: '`ValidationFailedError` で、違反のパスが `writes[1]`。n1 のファイルも変わらない'
      - name: test_commit_documents_when_dry_run
        case: 正常
        summary: 試しに書くと何も変えない
        condition: '正常と同じ要求に `dry_run: True`'
        mock: なし（一時フォルダの git）
        expected: '`applied` が `False`、`commit` が `None`、リモートとワークツリーは変わらない'
      - name: test_commit_documents_when_sqlite_kind
        case: 異常
        summary: 直コミットを許可していても SQLite の行の文書を断る
        condition: '`direct_commit.kinds[]` と `write_api_kinds` に `notes_db` があり、`writes` に `n1` の部分更新'
        mock: git の取得とプッシュを差し替える
        expected: '`ReadOnlyKindError` で、取得とプッシュを呼ばない'
      - name: test_commit_documents_when_conflict
        case: 正常
        summary: 衝突したら修正をブランチに残してスクリプトを実行する
        condition: '`baseCommit` を添えた n1 の `update` の後に、別のコミットで n1 の同じ項目を変えてプッシュする。端末の設定の sample の行に、環境変数を出力する `on_conflict.command`'
        mock: なし（一時フォルダの git）
        expected: '`applied` が `False`、`conflict.branch` の親が `baseCommit`、`conflict.errors` に `VersionMismatchError` の行、`conflict.script.stdout` にブランチの名前。リモートとコミットするブランチは変わらない'
      - name: test_commit_documents_when_conflict_without_script
        case: 正常
        summary: スクリプトの指定が無ければブランチだけを残す
        condition: 衝突する要求で、端末の設定に `on_conflict` が無い
        mock: なし（一時フォルダの git）
        expected: '`conflict.branch` があり、`conflict.script` が `None`'
      - name: test_commit_documents_when_conflict_deleted
        case: 正常
        summary: 書き換える文書が削除されていてもブランチに残す
        condition: '`baseCommit` の後に n1 を削除したコミットがあり、要求は n1 の `update`'
        mock: なし（一時フォルダの git）
        expected: '`conflict.errors` に `DocumentNotFoundError` の行があり、ブランチに n1 の変更がある'
      - name: test_commit_documents_when_conflict_invalid_at_base
        case: 異常
        summary: 編集を始めたときのコミットでも合格しなければ今のブランチの理由で断る
        condition: 衝突する要求で、`baseCommit` の文書にもスキーマに違反する値を書く
        mock: なし（一時フォルダの git）
        expected: '`VersionMismatchError` で、ブランチが増えず、一時のワークツリーが残らない'
        exception: 編集を始めたときのコミットでも合格しない
      - name: test_commit_documents_when_base_unusable
        case: 異常
        summary: 起点に使えない編集を始めたときのコミットを断る
        condition: '`baseCommit` にクローンに無い SHA'
        mock: なし（一時フォルダの git）
        expected: '`BaseCommitUnusableError` で `reason` が `not_found`、ワークツリーは変わらない'
      - name: test_commit_documents_when_conflict_dry_run
        case: 正常
        summary: 試しに書くと衝突してもブランチを作らない
        condition: '衝突する要求に `dry_run: True`'
        mock: なし（一時フォルダの git）
        expected: '`conflict` の `branch`・`commit`・`script` が `None` で、ブランチが増えず、スクリプトを実行しない'
      - name: test_commit_documents_when_not_conflict_error
        case: 異常
        summary: 衝突にしないエラーは今と同じに断る
        condition: '`baseCommit` を添え、`write_api_kinds` に無い種類を書き換える'
        mock: なし（一時フォルダの git）
        expected: '`DirectCommitNotPermittedError` で、ブランチが増えない'
      - name: test_commit_documents_when_conflict_kind_removed
        case: 異常
        summary: 編集を始めた後に直コミットの許可から外した種類はブランチに残さない
        condition: '`baseCommit` の後に、n1 を変えたコミットと、配信元の設定の `direct_commit.kinds` から `note` を外したコミットをプッシュし、要求は n1 の `update`'
        mock: なし（一時フォルダの git）
        expected: 今のブランチで断った例外で、ブランチが増えず、一時のワークツリーが残らない
      - name: test_commit_documents_when_body_not_allowed
        case: 異常
        summary: 本文の直コミットを断る種類の本文の変更を含む要求を断る
        condition: '`direct_commit.kinds` が `[note, {id: files, body: false}]`、`write_api_kinds` が `[note, files]` の配信元で、`writes` に `note` の文書の `update` と `files` の行の `set: {@body: x}`'
        mock: なし（一時フォルダのベアリポジトリ）
        expected: '`writes[1]` の違反の `ValidationFailedError`。`note` の文書も書き換わらず、ベアリポジトリは変わらない'
        exception: 本文の直コミットを断る種類の本文が変わる
      - name: test_commit_documents_when_source_config
        case: 正常
        summary: 配信元の設定と文書を 1 つのコミットにして再読み込みする
        condition: '`direct_commit.config: true`・`write_api_config: true` の配信元で、`nav` を変えた `source_config` と n1 の `update`'
        mock: なし（一時フォルダの git）。`reload_sources` は呼ばれたことを記録する偽物
        expected: リモートのコミットが 1 つ増え、変更が `project-index.yaml`・n1 だけ。`source_config.reloaded` が `True` で、`reload_sources` が 1 回呼ばれる
      - name: test_commit_documents_when_source_config_not_permitted
        case: 異常
        summary: 配信元の設定の許可が無ければ取得の前に断る
        condition: '`write_api_config` が偽'
        mock: なし（一時フォルダの git）
        expected: '`SourceConfigNotPermittedError` で、リモートとワークツリーは変わらない'
      - name: test_commit_documents_when_source_config_protected
        case: 異常
        summary: 書き換えられないキーを変えると断る
        condition: '`generators[0].run` を変えた `source_config`'
        mock: なし（一時フォルダの git）
        expected: '`ValidationFailedError` の違反のパスが `sourceConfig.generators`。生成を実行しない'
      - name: test_commit_documents_when_source_config_version_mismatch
        case: 異常
        summary: 配信元の設定のバージョンが合わない
        condition: 古い `expected_version` の `source_config`
        mock: なし（一時フォルダの git）
        expected: パス `sourceConfig` の `VersionMismatchError`
      - name: test_commit_documents_when_reload_failed
        case: 正常
        summary: 再読み込みに失敗してもコミットを戻さない
        condition: '`reload_sources` が例外を送る偽物'
        mock: '`reload_sources`'
        expected: '`applied` が `True`、`source_config.reloaded` が `False`、リモートのコミットが 1 つ増える'
      - name: test_commit_documents_when_conflict_protected_key
        case: 異常
        summary: 編集を始めたときのコミットを添えても書き換えられないキーの変更は衝突にしない
        condition: '`base_commit` を添え、`generators[0].run` を変えた `source_config`'
        mock: なし（一時フォルダの git）
        expected: 違反のパスが `sourceConfig.generators` の `ValidationFailedError` で、ブランチが増えず、一時のワークツリーを作らない
        exception: 書き換えられないキーが変わる
      - name: test_commit_documents_when_conflict_protected_key_changed_after_base
        case: 異常
        summary: 編集を始めた後に書き換えられないキーが変わったときは今の値と比べて断る
        condition: '`base_commit` の後に `generators` を変えたコミットをプッシュし、要求は `base_commit` の `project-index.yaml` の `nav` だけを変えた `source_config`'
        mock: なし（一時フォルダの git）
        expected: 違反のパスが `sourceConfig.generators` の `ValidationFailedError` で、ブランチが増えない
        exception: 書き換えられないキーが変わる
