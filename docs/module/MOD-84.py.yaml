        condition: '`body_file: meta.path` の行で、本文のファイルを持つ n1（`meta: {path: n1.md}`）と持たない n3。n1 の `data: {id: n1, meta: {path: n1.md}, title: t}` の `replace`、n1 の `set: {meta.path: n1.md, title: u}`、n3 の `set: {meta.path: n3.md, @body: 本文}` を順に呼ぶ'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 3 件とも通り、n1 の `title` が `u`、`notes/n3.md` が作られ、`notes/n1.md` は変わらない
      - name: test_write_docs_when_nested_body_file_rejected
        case: 異常
        summary: 入れ子の `body_file` の列を除く・片方だけを渡す操作
        condition: '同じ行で、n1 への `data: {id: n1}` の `replace`・`unset: [meta.path]`、n3 への `set: {@body: x}` を 1 件ずつ'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 3 件とも `InvalidArgumentError` で、違反の `path` が `data.meta.path`・`unset.meta.path`・`set.meta.path`。管理用の YAML は変わらない
      - name: test_write_docs_when_direct_commit_checks
        case: 異常
        summary: 直コミットの確認で断る
        condition: '`commit` つきで、1 回目は許可していない種類の `create`、2 回目は GitHub のトークンを含む `create`、3 回目は `committable_kinds` に無い種類。`run_direct_commit` は実際に呼ぶ'
        mock: なし（一時フォルダのベアリポジトリ）
