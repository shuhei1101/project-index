functions:
  - name: check_version
    title: バージョンの確かめ
    kind: 関数
    container: project_index/features/write/service.py
    usecase: 書き込み
    role: 検証
    summary: '`expected_version` が今の文書と同じかを確かめる'
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 今の文書
        type: Document
        required: true
        passing: positional
        description: 今の文書
      - name: expected
        title: 読んだときのバージョン
        type: str | Mapping[str, str]
        required: true
        passing: positional
        description: バージョンか、項目のパス → 値のハッシュ
      - name: last_read
        title: 前回読んだ内容
        type: LastRead | None
        required: true
        passing: keyword
        description: 差分を作る元（無ければ差分を空にする）
    returns:
      type: None
      description: 同じなら何も返さない
    process: |-
      1. 文字列なら `document.version` と比べる。辞書なら項目ごとに今の値の値のハッシュと比べる
      2. 違う場合、今のバージョンと、`last_read` があればその内容と今の本文の差分の行（変更.差分の行）を添えた `VersionMismatchError` を送る（`next_steps` に `search_docs` で再取得して呼び直すこと）
    exceptions:
      - name: VersionMismatchError
        condition: バージョンが違う
        message: '`{id} は参照した後に変わっています（今のバージョン {version}）`'
    unit_tests:
      - name: test_check_version_when_fields
        case: 正常
        summary: 項目ごとのハッシュ
        condition: '`name` だけを変えた文書に、`{description: 今の値のハッシュ}`'
        mock: なし
        expected: 送らない
      - name: test_check_version_when_mismatch
        case: 異常
        summary: 違うバージョン
        condition: 古いバージョンと、その内容の前回読んだ内容
        mock: なし
        expected: '`VersionMismatchError` の `current` が今のバージョン、`diff` に `-`・`+` の行'
        exception: バージョンが違う
  - name: write_docs
    title: 文書の書き込み
    kind: 関数
    container: project_index/features/write/service.py
    usecase: 書き込み
    role: サービス
    summary: '`write_docs` の要求を処理して書き込みの結果を返す'
    scope: public
    thread_safe: true
    side_effects: 作業ツリーのファイルを作る・書き換える。`generators[]` を動かす。会話の記録に編集を残す
    args:
      - name: request
        title: 書き込みの要求
        type: WriteRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 今の文書を読み、書いた後にキャッシュを捨てる
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 書き込みの検査
      - name: seen
        title: 会話の記録
        type: SeenStore
        required: true
        passing: injected
        description: 前回読んだ内容と編集の記録
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        required: true
        passing: injected
        description: 書き込みを 1 つずつにする
      - name: timeout_sec
        title: 制限時間
        type: float
        required: true
        passing: keyword
        description: '`generators[]` の制限時間（`script_timeout_sec`）'
      - name: now
        title: 今
        type: datetime | None
        required: false
        default: None
        passing: keyword
        description: テスト用。`created`・`updated` に入れる日時
      - name: limits
        title: 呼び出しの期限
        type: CallLimits | None
        required: false
        default: None
        passing: keyword
        description: 文書の MCP が要求ごとに作る期限。`None` は期限を持たない
      - name: repo_locks
        title: リポジトリごとの排他
        type: RepositoryLocks
        required: true
        passing: keyword
        description: 直コミットと、コミットするブランチのワークツリーへの書き込みで握る
    returns:
      type: WriteResult
      description: 書き込みの結果
    process: |-
      1. `operations` が 1〜`OPERATIONS_MAX` 件でない・`op` ごとの必須のキーが無い場合、添字つきの違反で `InvalidArgumentError` を送る
      2. 書く場所を解く（書く場所の解決）
      3. 配信元の排他を握る（配信元ごとの排他.握る）
      4. 今の文書を集め（文書のストア.文書を集める）、ID → 文書の辞書にする。変更を当てるファイルは、パス → 往復編集の読み込みの内容で持つ
      5. 操作を順に当てる。失敗した操作は `failed` の行にして次へ進む
         - `create` の場合、種類の行を引き（無ければ `UnknownKindError`）、`writable` でなければ `documents[].writable` の違反にする。ID が無ければ IDを作る（`ids.format` も無ければ `id` が必須の違反）。ID が既にあれば違反。配置先は新しい文書の配置先。Git 管理外の配信元で、種類の行の `write_dates` が真なら `created`・`updated` に `now` を入れる（以下、日時を入れるかは書き換える文書の種類の行で決める）
         - `rename` の場合、文書が無ければ近い ID を添えた `DocumentNotFoundError`。バージョンの確かめをし、`new_id`・`new_path` の引数の誤り（どちらも無い・ID の列の値を持たない文書への `new_id`・`body_file` を持たない `records` の文書と本文のファイルを持たない要素（`body_path` が `None`）への `new_path`・`new_path` が行の `paths` に当たらないか `exclude[]` に当たるか既にあるファイル）は添字つきの `InvalidArgumentError`。`new_id` が `ids.format` に合わないか既にある ID なら `new_id` の違反。`new_path` が無い 1 ファイル 1 文書は改名後のパスで移す先を決める。改名後の ID は、ID の列の値を持つ文書は `new_id`（省いたら改名前の ID）、ID がパスの文書は改名後のパス（`records: files` は本文のファイルのパス、1 ファイル 1 文書は YAML のパス）にする。ID の列の値を持つ文書だけ ID の列に `new_id` を入れ（ID がパスの文書は ID の列に何も入れない）、`body_file` の文書は `body_file` の列を管理用の YAML のフォルダからの相対にして本文のファイルを移す（改名後の本文のパスへ今の本文を、改名前の本文のパスへ `None` を持つ）。1 ファイル 1 文書は改名後のパスへ ID を入れた内容を、改名前のパスへ `None` を持つ。続けて、同じ配信元のほかの全ての文書を参照の書き換え（`related_column` はその文書の種類の行の `metadata.related` の列、`skip` は ID の列と `body_file` の列、`old_id` は改名前の ID、`new_id` は改名後の ID、`moved` はパスが変わったときの（改名前のパス, 改名後のパス）で変わらなければ `None`）にかけ、`body_file` の行の文書のうち本文のファイルの拡張子が `.md` の文書は、同じ本文のファイルを前に扱っていなければ、書く予定の内容で読んだ本文を本文の参照の書き換え（`base_dir` は本文のファイルのフォルダ、ほかは同じ）にもかけ、書き換えた本文を本文のファイルのパス → 本文で持つ。要素か本文のどちらかを書き換えた文書を参照元として検査し（本文だけを書き換えた文書は要素の内容をそのまま書き出し、書き換えた本文を組み立てに渡す）、`references` は要素の箇所に本文の箇所を続ける。改名した文書の改名後の内容も、同じ `old_id`・`new_id` で `moved` を `None` にした参照の書き換えにかける（自分を指す `{旧 ID}#...`・`id:{旧 ID}` を書き換える）。Git 管理外の配信元では、改名した文書と参照元の文書のそれぞれの種類の行の `write_dates` が真なら `updated` に `now` を入れる。結果は改名した文書の `renamed` の行と、参照元ごとの `updated`（`references` つき）の行を同じ添字で並べる
         - `replace_text` の場合、`filter` を検索の条件の確かめで確かめ、今の文書のうち条件の照合に当たる書き込みを許す種類の文書ごとに、`fields` から `@body` を除いて列名への読み替えにかけて文字列の値の置換（`skip` は ID の列と `body_file` の列。`fields` が `@body` だけのときは空の並び）を当てる。`fields` が無いか `@body` を含み、本文のファイルの拡張子が `.md` で、同じ本文のファイルを前に扱っていなければ、書く予定の内容で読んだ本文を本文の置換にかけ、件数を足して置換した本文を本文のファイルのパス → 本文で持つ。件数が 0 の文書は飛ばす。Git 管理外の配信元では、置換した文書の種類の行の `write_dates` が真なら `updated` に `now` を入れる。置換した文書を検査し、1 件でも違反があれば違反に文書の `id` を添えてその操作全体を `failed` にし、どの文書の変更も持たない。結果は置換した文書ごとの `updated`（`count` つき）の行を同じ添字で並べる
         - `update`・`replace` の場合、文書が無ければ近い ID を添えた `DocumentNotFoundError`。バージョンの確かめ（前回読んだ内容は会話の記録）。Git 管理外の配信元で、文書の種類の行の `write_dates` が真なら `updated` に `now` を入れ、`replace` は `created` を引き継ぐ
         - 操作を、`create` は `kind` の行、`update`・`replace` は文書の種類の行で、オブジェクトの配列への書き戻し（`update` は今の内容を渡す）にかけてから列名への読み替えにかける。`create` の ID は行の `metadata.id` の列（無ければ `id`）に入れる
         - `@body` を受け付けるかを確かめる。種類の行が `body_file` を持たない文書への `@body`、`unset`・`add_to`・`remove_from` の `@body`、`body_file` の行の `create` で `data` に `body_file` の列と `@body` の片方だけがあること（列だけで、文書のストアの本文のファイルのパスの解決で解いたパスが作業ツリーに無いときは `data.@body`（直し方は `@body` を加えるか先に本文のファイルを作成する）、`@body` だけは `data.{列}` の違反。列だけで作業ツリーにあるときは違反にせず、次の本文の手順で既にある本文のファイルとして扱う。どちらも無ければ本文のファイルを持たない要素を作る）、本文のファイルを持つ文書への `update`・`replace` で `body_file` の列の値が今の値と違うこと（`unset` で列を外すことと、`replace` の `data` に列が無いことを含む）、本文のファイルを持たない要素（『本文のファイルを持たない要素の判定』）への `update`・`replace` で列の値と `@body` の片方だけを渡すこと（`create` と同じ違反）と `text_edits` の `field: @body`（`text_edits[{n}].field` の違反）は、添字つきの違反で `InvalidArgumentError` にする。列の有無と値は、`update` の `set`・`unset` は項目のパスのキーの一致で、`create`・`replace` の `data` は項目のパスをたどって決める
         - `body_file` の行の文書は、本文の適用（`current_body` は `update`・`replace` が今の文書の本文、`create` が `None`）で新しい本文を求める。本文のファイルを持たない要素は、`create` と、列の値と `@body` を持たない `update`・`replace` では新しい本文を持たず、列の値と `@body` を持つ `update`・`replace` は `create` と同じく本文のファイルを作り、列の値だけで既にあるファイルを指す `update`・`replace` は `create` と同じくそのファイルを取り込む。本文のファイルのパスは文書のストアの本文のファイルのパスの解決で解き、`create`（本文のファイルを作る・取り込む `update`・`replace` を含む）で次のどれかに当たれば、`path` が `body_file` の列名の違反を `failed` の行に入れる（手順 6 では `ValidationFailedError` として送る）。(a) `None`（配信元の外）。(b) `@body` を持ち、作業ツリーに既にあるファイルか同じ呼び出しの前の操作が作る・取り込む本文のファイル（直し方は、既にあるファイルを本文のファイルにするなら `@body` を除き、本文を記載するなら新規のファイルのパスにする）。(c) `@body` を持たず、文書のファイル（今の文書の `body_path` と同じ呼び出しの前の操作が作る・取り込む本文のファイル、配信元の有効な行の `paths` に該当し `exclude[]` に該当しないファイル。行の照合は要素が 0 件の管理用の YAML・読み込めないファイルも文書の有無によらず当てる）。決まりにその文書の ID（`records` の行の管理用の YAML のときは、行の ID と管理用の YAML であること。1 ファイル 1 文書で読み込めた文書が無いときは行の ID）を含め、直し方は配信元の文書のファイル・設定・スクリプト・除外したファイル・スキーマのどれでもないパスを指定する。(d) `@body` を持たず、(c) に当たらない配信元の文書でないファイル。次の順に照合し、最初に当たった種類を決まりに含める（直し方は (c) と同じ）。配信元の設定のファイル（`config_files` のうち `root` の中にあるものを `root` からのパスにしたもの。決まりは配信元の設定であること）→ `validators[]`・`converters[]`・`generators[]` の行の `run` の要素のうち絶対パスでないものを、配信元のフォルダからのパスとして `config_path` で `root` からのパスにして正規化したもの（決まりは行の場所 `{テーブル}[{ID}]`）→ 有効な行の `paths` に該当し `exclude[]` に該当するファイル（決まりは行の ID と除外したファイルであること）→ 有効な行の文字列の `schema` を同じく `config_path` で `root` からのパスにして正規化したもの（決まりは行の場所 `documents[{ID}].schema`）。オブジェクトの `schema`（ほかの配信元の参照）は照合しない。(c)・(d) に当たらず `@body` を持たないときは、新しい本文を持たず、そのパスを同じ呼び出しの中で取り込んだ本文のファイルとして持つ（本文のファイルは書き換えず、組み立ては作業ツリーのファイルを読む）。新しい本文は、本文のファイルのパス → 本文で持ち、後の操作が同じ本文のファイルに当たるときは当てた後の本文に重ねる
         - 操作を当てる。`records` の文書は配列の要素を、それ以外はファイルの内容を置き換える。`update`・`replace` は文書のストアの `row_schema` で引いた種類の 1 文書のスキーマを `schema` に渡す
         - `update` は、オブジェクトの配列への書き戻しと操作を当てるに同じ空の `skipped` の並びを渡し、集めた並びを指定したキーへの戻し（`given` は書き戻しの前の操作）にかけて、成功した行の `skipped` に入れる
         - 変更を当てた後のファイルの内容を往復編集の書き出し（`original` は、既にあるファイルに当てるときはそのファイルの作業ツリーの文字列、新しいファイルを作る `create` は `None`）で文字列にし、文字列からの文書の組み立て（`read_body` は、新しい本文を持つ本文のファイルならその本文、無ければ作業ツリーのファイルを返す）で文書にして、文書の検査.検査する（`on="write"`、`create` は `new=True`、`deadline` は `limits` があれば `limits.write_deadline`）。違反はスキーマの説明の添付にかけ（スキーマは文書のストア.文書に当てるスキーマ）、添字を付けて `failed` の行に入れる。添字を付けるときは `schema` を保つ
         - 検査するで違反が無ければ、文書の検査.Markdownの値を点検する（`deadline` は検査すると同じ。`previous` は `update`・`replace` が操作の前の文書の `data`、`create` が `None`。`stopped` は同じ呼び出しの前の点検が返した `stopped`）。違反は添字を付けて `failed` の行に入れ、点検できなかったキーは成功した行の `unchecked` に入れる。返った `stopped` を次の操作へ引き継ぐ
         - 後の操作が同じファイルに当たるときは、当てた後の内容に重ねる
         - `WriteDeadlineExceededError` は `failed` の行にせず、`atomic` によらずそのまま送る（何も書かない）
      6. `atomic` が `True` で `failed` があれば、最初の失敗の例外（`ValidationFailedError` は全ての違反を、`InvalidArgumentError` はその操作の違反を添字つきで）を送り、何も書かない
      7. 成功した行の `version` は組み立てた文書のバージョン、`diff` は今の本文との差分の行（変更.差分の行）にする。`body_file` の行の文書は、要素を YAML に書き出した文字列どうしの差分の行に続けて、本文が変わったときは `@@ {本文のファイルのパス}` の行と本文の差分の行を並べる
      8. `dry_run` なら `applied=False` で返す
      9. `limits` がある場合、ファイルを置き換える前に `limits.write_deadline` の『期限』.期限の確認を呼ぶ（過ぎていれば `WriteDeadlineExceededError` が伝わり、何も書かない）
      10. 新しい本文を持つ本文のファイル、変わったファイルの順にファイルの置き換えで書き、文書のストア.キャッシュを捨てる。書き始めた後は、期限を過ぎても全てのファイルを書き終える
      11. 書いた種類の `after_write` の生成を、ID の重なりを除いて順にスクリプトの実行（`cwd=target.config_base`（設定ファイルのフォルダ）・引数に書いたファイルのパス・制限時間・`at`）で動かす。制限時間は、`limits` があれば `limits.respond_by` の『期限』.制限時間の切り詰めに `timeout_sec` を渡した値、無ければ `timeout_sec`。制限時間が 0 の生成は動かさず `[warning]` 応答の上限までの時間が無いため書き込み後の生成を実行しなかった（配信元・生成の ID）を書き、結果は変えない。`at` は、`target.worktree` が `None` で `source.config_commit` がある場合に（`source.main_root`, `source.config_commit`）。`ScriptError` は `[warning]` 書き込み後の生成に失敗した（配信元・生成の ID・理由）を書き、結果は変えない
      12. 会話の記録に書いた文書を `edited` で残す
      13. `applied=True` で返す

      `request.commit` がある場合は、手順 2〜13 の代わりに次のように進める（直コミット）。

      1. `atomic` が `False` か `worktree` がある場合、添字を持たない違反で `InvalidArgumentError` を送信する
      2. 配信元を引き（`source` が `None` なら作業中の配信元）、直コミットの書き込む先で計画を作る。続けて `committable_kinds` が空なら、取得の前に許可する種類を添えた `DirectCommitNotPermittedError` を送信する。書く場所は、`write_once` のたびに取り込んだ後の計画のワークツリーの設定で作る（作業場所の配信元の読み込み。`scope.write` を確認しない）
      3. `dry_run` なら、排他を握って手順 4・5 と下の「直コミットの確認」だけを行い、`applied=False` で返す（取得・コミット・プッシュをしない）
      4. リポジトリごとの排他.握る（`timeout` は書き込みの期限までの残り）、配信元ごとの排他.握るの順に握り、直コミットを進めるを呼ぶ。`write_once` は次を行う
         - 手順 4・5・6・7 を行う
         - 直コミットの確認: 変更を当てた後に書き換わる文書の種類を集め、`committable_kinds` に無い種類が `direct_commit.kinds` にあれば `DirectCommitNotPermittedError` を送信する。`direct_commit.kinds` に無い種類の文書と、`direct_commit.metadata_only_kinds` の種類で本文のファイル（`body_path` と本文）が前後で変わる文書（作る・移す・削除するを含む。本文のファイルを持たない文書は対象外）と、`secret_findings`（書き換わる文書ごとに前後の `data` と本文）の検出は、添字と文書の ID を付けた違反にして `ValidationFailedError` を送信する
         - 書き込むファイル（新しい本文と変わったファイル）を `check_clean` にかけ、手順 9・10 を行う
         - 手順 11 の生成を、制限時間を `limits.respond_by` の残り − `DIRECT_COMMIT_PUSH_SEC` − `DIRECT_COMMIT_MARGIN_SEC` と `timeout_sec` の短い方にして動かす。制限時間が 0 以下・`ScriptError`・生成が配信元に無い場合は、`[warning]` を書かずに `DirectCommitGeneratorError` を送信する
         - 書いたファイルを返す
      5. 会話の記録に書いた文書を `edited` で残し、`applied=True` と `commit` で返す

      `request.commit` が無く、書く場所のワークツリーが指すブランチが `direct_commit.branch` か `direct_commit.branches` に該当する場合は、手順 3 の前にリポジトリごとの排他.握るを呼ぶ
    exceptions:
      - name: InvalidArgumentError
        condition: 件数・必須のキー・`text_edits` の一致・共通のキーと列名の重なり
        message: '`引数が正しくありません: {違反の数} 件`'
      - name: ValidationFailedError
        condition: '`atomic` で検査に通らない操作がある'
        message: '`検査に通らない操作があります: {違反の数} 件`'
      - name: VersionMismatchError
        condition: '`atomic` でバージョンが違う'
        message: '`{id} は参照した後に変わっています（今のバージョン {version}）`'
      - name: DocumentNotFoundError
        condition: '`atomic` で無い文書を指した'
        message: '`文書がありません: {id}`'
      - name: UnknownKindError
        condition: '`create` の種類が無い'
        message: '`{source}: 種類 {kind} はありません`'
      - name: SourceNotWritableError
        condition: 書く場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から書き込めません`'
      - name: TargetIsCloneError
        condition: 書く場所の解決が送る
        message: '`{id} のクローン本体には書き込みません`'
      - name: WriteDeadlineExceededError
        condition: 検査の前後か、ファイルを置き換える前に `limits.write_deadline` を過ぎている
        message: 『期限』.期限の確認のまま
    unit_tests:
      - name: test_write_docs
        case: 正常
        summary: ワークツリーへの部分更新
        condition: 'ワークツリー x の `cwd` で、文書 1 に `set: {name: 新しい名前}`'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）。配信元とワークツリーは一時フォルダ
        expected: '`applied` が `True`、`status` が `updated`、ワークツリー x のファイルの `name` だけが変わり、クローン本体と commit は変わらない'
      - name: test_write_docs_when_create
        case: 正常
        summary: ID を作って生成を動かす
        condition: '`ids.format: {kind}-{slug}`・`after_write: [index]` の行に `create`'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`status` が `created`、`id` が `sample-...`、配置先にファイルができ、`index` の生成が 1 回動く'
      - name: test_write_docs_when_dry_run
        case: 正常
        summary: 試しに書く
        condition: '`dry_run: true` で `set`'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`applied` が `False`、`diff` があり、ファイルは変わらない'
      - name: test_write_docs_when_partial
        case: 正常
        summary: 一部だけ書く
        condition: '`atomic: false` で通る操作と、スキーマに通らない操作'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 0 番目が `updated`、1 番目が `failed` で `errors` に違反、0 番目のファイルだけ変わる
      - name: test_write_docs_when_not_git
        case: 正常
        summary: Git 管理外の日時
        condition: Git 管理外の配信元に `create`、続けて `update`
        mock: '`now` に 2 つの日時'
        expected: '`created` は 1 つ目の日時のまま、`updated` が 2 つ目の日時'
      - name: test_write_docs_when_invalid
