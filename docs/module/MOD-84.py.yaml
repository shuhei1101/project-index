        exception: '`atomic` で検査に通らない操作がある'
      - name: test_write_docs_when_mdmark_unavailable
        case: 正常
        summary: mdmark を使えない
        condition: '`body` の `set` を 2 件。1 件目の点検が `stopped` に R を入れて点検できなかったキーを返す'
        mock: '`DocumentChecker.check_markdown`（受けた `stopped` を記録する）・作業場所の配信元の読み込み（受け取った配信元を返す偽物）'
        expected: '`applied` が `True`、両方の行の `unchecked` が `body`（理由 R）、2 件目の呼び出しの `stopped` が R'
        exception: '-'
      - name: test_write_docs_when_tags_are_objects
        case: 正常
        summary: オブジェクトの配列のタグへ書き戻す
        condition: '行 `rules` が `metadata: {tags: tags[].name, main_tags: tags[main].name}`。`tags: [{name: a, main: true}, {name: b}]` の文書 `r1` に `add_to: {tags: [c]}`、続けて `set: {main_tags: [c]}`'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`r1` のファイルの `tags` が 1 回目の後に `[{name: a, main: true}, {name: b}, {name: c}]`、2 回目の後に `[{name: a}, {name: b}, {name: c, main: true}]`'
        exception: '-'
      - name: test_write_docs_when_deadline_passed
