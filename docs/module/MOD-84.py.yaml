        mock: 一時フォルダの配信元。検査は合格を返す
        expected: '`results` が `renamed`（`path: docs/doc-9.yaml`、`renamed_from: doc-2`）と文書 1 の `updated`（`references` 1 件）で、`docs/doc-2.yaml` が無く `docs/doc-9.yaml` がある'
      - name: test_write_docs_when_rename_invalid
