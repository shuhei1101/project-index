        condition: '行 `decisions` が `metadata: {name: title}`。文書 `d1` に `set: {name: 新しい名前}`、続けて `create`（`data: {name: 決定 2}`）'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
