        condition: '`validators[]` の無い種類。残りの時間が 0 の `write_deadline` を持つ `limits` で `set`'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）・時計（偽物）
        expected: '`WriteDeadlineExceededError`、ワークツリー x のファイルは変わらず、会話の記録に `edited` が残らない'
        exception: 検査の前後か、ファイルを置き換える前に `limits.write_deadline` を過ぎている
      - name: test_write_docs_when_deadline_passed_not_atomic
        case: 異常
        summary: '`atomic: false` でも期限の超過は全体を止める'
        condition: '`atomic: false` で 2 件の `set`。文書の検査.検査するが 1 件目で `WriteDeadlineExceededError` を送る'
        mock: '`DocumentChecker.check`（1 件目で送る偽物）・作業場所の配信元の読み込み（受け取った配信元を返す偽物）'
        expected: '`WriteDeadlineExceededError`、`failed` の行を返さず、どのファイルも変わらない'
        exception: 検査の前後か、ファイルを置き換える前に `limits.write_deadline` を過ぎている
