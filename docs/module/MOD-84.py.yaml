        mock: 一時フォルダの配信元
        expected: 前者は `InvalidArgumentError`、後者は `new_id` の違反の `ValidationFailedError` で、ファイルは変わらない
      - name: test_write_docs_when_replace_text
        case: 正常
        summary: 一括置換
        condition: タグ `topic:a` の文書 2 件と持たない文書 1 件が `旧語` を持つ。`replace_text`・`filter` は `topic:a`
        mock: 一時フォルダの配信元。検査は合格を返す
        expected: '`results` が同じ添字の 2 行（`count` つき）で、条件に当たらない文書は変わらない'
      - name: test_write_docs_when_replace_text_invalid
        case: 異常
        summary: 置換した文書が検査に合格しない
        condition: '同じ文書で、種類のスキーマが `name` に改行を許可しない。`new` に改行を含む値、`atomic: false`'
        mock: 一時フォルダの配信元
        expected: '`replace_text` の行が `failed` で違反に 2 件目の文書の `id` が入り、どの文書も変わらない'
      - name: test_write_docs_when_rename_body_references
        case: 正常
        summary: 改名で本文のファイルの中のリンクも追随する
        condition: '文書 2（`docs/doc-2.yaml`）を、`records: items`・`body_file: path` の行の要素 n1 の `notes/n1.md` が `[文書 2](id:doc-2)` と `[文書 2](../docs/doc-2.yaml)` で指し、要素 n2 の `notes/n2.py` も `id:doc-2` を持つ。`rename`・`new_id: doc-9`'
        mock: 一時フォルダの配信元。検査は合格を返す
        expected: '`results` に n1 の `updated`（`references` が `path: @body` の 2 件、`diff` に `@@ notes/n1.md`）があり、`notes/n1.md` の 2 つのリンクが `doc-9` を指し、`notes/n2.py` と `notes/index.yaml` は変わらず、n2 の行は無い'
      - name: test_write_docs_when_replace_text_body
        case: 正常
        summary: 一括置換で本文のファイルも置換する
        condition: '同じ行の要素 n1（タグ `topic:a`）の `notes/n1.md` が `旧語` を 2 つ、n3（タグ `topic:a`）の `notes/n3.py` が `旧語` を持ち、要素の YAML は `旧語` を持たない。n4（タグ `topic:a`）は n1 と同じ `n1.md` を指す。1 回目は `replace_text`・`filter` は `topic:a`、2 回目は前の状態に `fields: [name]`、3 回目は前の状態に `fields: [@body]`'
        mock: 一時フォルダの配信元。検査は合格を返す
        expected: '1 回目と 3 回目は n1 の行だけが `count: 2` で `notes/n1.md` の `旧語` が全て `新語` になり、`notes/n3.py` は変わらず n3・n4 の行は無い。2 回目は置換した文書が無く `results` が空で、本文のファイルは変わらない'
  - name: delete_docs
    title: 文書の削除
    kind: 関数
    container: project_index/features/write/service.py
    usecase: 書き込み
    role: サービス
    summary: '`delete_docs` の要求を処理して削除の結果を返す'
    scope: public
    thread_safe: true
    side_effects: 作業ツリーのファイルを消す。`unlink` のときは参照元の文書を書き換える。`generators[]` を動かす
    args:
      - name: request
        title: 削除の要求
        type: DeleteRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 今の文書を読む
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 参照を外した文書の検査
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        required: true
        passing: injected
        description: 削除を 1 つずつにする
      - name: timeout_sec
        title: 制限時間
        type: float
        required: true
        passing: keyword
        description: '`generators[]` の制限時間'
      - name: limits
        title: 呼び出しの期限
        type: CallLimits | None
        required: false
        default: None
        passing: keyword
        description: 文書の書き込みと同じ
    returns:
      type: DeleteResult
      description: 削除の結果
    process: |-
      1. `targets` が 1〜`OPERATIONS_MAX` 件でなければ `InvalidArgumentError` を送る
      2. 書く場所を解き、配信元の排他を握り、今の文書を集める（文書の書き込みと同じ）
      3. 対象ごとに確かめる。失敗した対象は `failed` の行にする
         - 文書が無ければ近い ID を添えた `DocumentNotFoundError`
         - Git 管理外の配信元で種類の行が `writable` でなければ `DeleteNotAllowedError`
         - バージョンの確かめ（前回読んだ内容は無し）
         - 同じ配信元の残る文書のうち、メタデータの `related` に `to` が消す文書の ID で `source` の無い行を持つ文書を集める。あれば `on_referenced` が `fail` なら参照元を添えた `DocumentReferencedError`、`unlink` なら参照元の `related` の列（種類の行の `metadata.related` の列名。無ければ `related`）からその行を除く操作を作る。除く配列は『列名の指す配列の取得』で取り、列名が `**.` で始まるときは最上位と入れ子の全ての配列から除く
      4. `atomic` が `True` で `failed` があれば、最初の失敗の例外を送る
      5. 参照を外した文書を文書の検査に通す（違反は `ValidationFailedError`。`deadline` は `limits` があれば `limits.write_deadline`）
      6. `dry_run` なら `applied=False` で、`unlinked` に参照を外す文書と外した後のバージョンを入れて返す
      7. `limits` がある場合、文書の書き込みの手順 9 と同じに期限を確かめる
      8. ファイル 1 つの文書はファイルを消し、`records` の文書は配列から要素を除いて、往復編集の書き出し（`original` はそのファイルの作業ツリーの文字列）でファイルを置き換える。`body_file` の行の文書は本文のファイルも消す。要素を除いた後の同じ管理用の YAML の要素が同じ本文のファイルを指すときと、本文のファイルが無いときは消さない。参照を外した文書を、往復編集の書き出し（`original` は参照元のファイルの作業ツリーの文字列）で書き、文書のストア.キャッシュを捨てる
      9. 消した種類の `after_write` の生成を、文書の書き込みと同じに動かす（引数は消したファイルのパス。制限時間も同じ）
      10. `applied=True` で、`unlinked` に参照を外した文書と新しいバージョンを入れて返す
    exceptions:
      - name: DocumentReferencedError
        condition: '`on_referenced: fail` で参照されている'
        message: '`{id} は {参照元} から参照されています`'
      - name: DeleteNotAllowedError
        condition: Git 管理外の配信元で `writable` でない種類
        message: '`{kind} は削除を許していません（documents[].writable）`'
      - name: VersionMismatchError
        condition: バージョンが違う
        message: '`{id} は参照した後に変わっています（今のバージョン {version}）`'
      - name: DocumentNotFoundError
        condition: 無い文書を指した
        message: '`文書がありません: {id}`'
      - name: WriteDeadlineExceededError
        condition: 検査の前後か、ファイルを消す・置き換える前に `limits.write_deadline` を過ぎている
        message: 『期限』.期限の確認のまま
    unit_tests:
      - name: test_delete_docs
        case: 正常
        summary: ワークツリーから消す
        condition: 参照されていない文書 2 を消す
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`status` が `deleted`、ワークツリーのファイルが無く、クローン本体のファイルは残る'
      - name: test_delete_docs_when_unlink
        case: 正常
        summary: 参照も外す
        condition: '文書 1 の `related` が指す文書 2 を `on_referenced: unlink` で消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 文書 2 のファイルが無く、文書 1 の `related` に文書 2 が無く、`unlinked` に文書 1 と新しいバージョン
      - name: test_delete_docs_when_records
        case: 正常
        summary: 配列の要素を消す
        condition: '`records` の行の 2 件目を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: ファイルの配列が 1 件になり、消した要素の `body_file` の指すファイルも無い
      - name: test_delete_docs_when_referenced
        case: 異常
        summary: 参照されている
        condition: '同じ削除を `on_referenced: fail` で'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`DocumentReferencedError` の `referrers` が文書 1、どのファイルも変わらない'
        exception: '`on_referenced: fail` で参照されている'
      - name: test_delete_docs_when_not_allowed
        case: 異常
        summary: 削除を許していない
        condition: 'Git 管理外の配信元で `writable: false` の種類の文書'
        mock: なし
        expected: '`DeleteNotAllowedError` の `kind` が種類の ID'
        exception: Git 管理外の配信元で `writable` でない種類
      - name: test_delete_docs_when_deadline_passed
        case: 異常
        summary: 消す前に期限を過ぎている
        condition: 残りの時間が 0 の `write_deadline` を持つ `limits` で文書 2 を消す
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）・時計（偽物）
        expected: '`WriteDeadlineExceededError`、文書 2 のファイルが残る'
        exception: 検査の前後か、ファイルを消す・置き換える前に `limits.write_deadline` を過ぎている
      - name: test_delete_docs_when_body_file_shared
        case: 正常
        summary: ほかの要素も指す本文のファイルを残す
        condition: '`records`・`body_file` の行で、要素 n1・n3 が同じ `n1.md` を指す。n3 を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 配列が n1 だけになり、`n1.md` は変わらない
      - name: test_delete_docs_when_unlink_nested
        case: 正常
        summary: 入れ子の参照も外す
        condition: '行の `metadata` が `{related: "**.refs[]"}`。文書 n1 の最上位の `refs` と `functions[0].refs` がどちらも n2 を指し、最上位の `refs` は n3 も指す。n2 を `on_referenced: unlink` で消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: n1 の最上位の `refs` が n3 だけになり、`functions[0].refs` が空になる。`unlinked` に n1
        exception: '-'
      - name: test_delete_docs_when_unlink_indent_preserved
        case: 正常
        summary: 参照を外した文書の配列の字下げを保つ
        condition: '文書 2 が `related:` の直下に `- ` を字下げ無しで `{to, type}` の要素を 2 つ並べ、その 1 つが文書 1 を指す。文書 1 を `on_referenced: unlink` で消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 文書 2 のファイルは、文書 1 を指す要素の 2 行だけが消え、残る行は書き込み前の文字列と一致する（`- ` が字下げ無しのまま）
      - name: test_delete_docs_when_records_indent_preserved
        case: 正常
        summary: '`records` の要素の削除で管理用の YAML の配列の字下げを保つ'
        condition: '`records: items`・`body_file: path` の行の管理用の YAML が `items:` の直下に `- ` を字下げ無しで 2 要素を並べる。2 件目を消す'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 管理用の YAML は 2 件目の要素の 2 行だけが消え、1 件目は字下げ無しのまま残る
