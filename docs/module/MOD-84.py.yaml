      - name: test_write_docs_when_rename_body_references
        case: 正常
        summary: 改名で本文のファイルの中のリンクも追随する
        condition: '文書 2（`docs/doc-2.yaml`）を、`records: items`・`body_file: path` の行の要素 n1 の `notes/n1.md` が `[文書 2](id:doc-2)` と `[文書 2](../docs/doc-2.yaml)` で指し、要素 n2 の `notes/n2.py` も `id:doc-2` を持つ。`rename`・`new_id: doc-9`'
        mock: 一時フォルダの配信元。検査は合格を返す
        expected: '`results` に n1 の `updated`（`references` が `path: @body` の 2 件、`diff` に `@@ notes/n1.md`）があり、`notes/n1.md` の 2 つのリンクが `doc-9` を指し、`notes/n2.py` と `notes/index.yaml` は変わらず、n2 の行は無い'
      - name: test_write_docs_when_replace_text_body
        case: 正常
        summary: 一括置換で本文のファイルも置換する
        condition: '同じ行の要素 n1（タグ `topic:a`）の `notes/n1.md` が `旧語` を 2 つ、n3（タグ `topic:a`）の `notes/n3.py` が `旧語` を持ち、要素の YAML は `旧語` を持たない。n4（タグ `topic:a`）は n1 と同じ `n1.md` を指す。1 回目は `replace_text`・`filter` は `topic:a`、2 回目は前の状態に `fields: [name]`、3 回目は前の状態に `fields: [@body]`'
        mock: 一時フォルダの配信元。検査は合格を返す
        expected: '1 回目と 3 回目は n1 の行だけが `count: 2` で `notes/n1.md` の `旧語` が全て `新語` になり、`notes/n3.py` は変わらず n3・n4 の行は無い。2 回目は置換した文書が無く `results` が空で、本文のファイルは変わらない'
      - name: test_write_docs_when_without_dates
        case: 正常
        summary: 日時を付けない種類
        condition: 'Git 管理外の配信元で、`write_dates: false` の種類 `items`（スキーマは `additionalProperties: false`）と `write_dates` を省いた種類 `memos`。`items` の i1 が `related` で `memos` の m1 を指す。`items` の `create`・i1 の `update`・`replace`・`rename`、m1 の `rename`、`replace_text` を順に呼ぶ'
        mock: '`now` に日時。配信元は一時フォルダ'
        expected: どの操作も通り、`items` の文書は `created`・`updated` を持たない。m1 の改名後の文書は `updated` が `now`
      - name: test_write_docs_when_body_file_absent
        case: 正常
        summary: 本文のファイルを持たない要素の作成・更新・改名・本文の付与
        condition: '`records: items`・`body_file: path` の行で、`path` を持たない要素 n3・n5。`data: {id: n4}` の `create`、n3 の `set: {title: t}`、n3 の `set: {path: n3.md, @body: 本文}`、n5 の `rename`（`new_id: n9`）を順に呼ぶ'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）。配信元とワークツリーは一時フォルダ
        expected: 'n4 は要素だけが加わり `notes/` にファイルが増えない。n3 の `title` が変わる。その後 n3 が `path: n3.md` を持ち `notes/n3.md` が作られ、`diff` に `@@ notes/n3.md` の行がある。n9 の改名で `notes/` のファイルは変わらない'
      - name: test_write_docs_when_body_file_absent_rejected
        case: 異常
        summary: 本文のファイルの有無を片方だけで切り替える操作
        condition: '同じ行で、`data: {id: n6, @body: x}` の `create`、本文のファイルを持たない n3 への `set: {@body: x}`・`set: {path: n3.md}`（`notes/n3.md` は無い）・`text_edits: [{field: @body}]`・`new_path`、本文のファイルを持つ n1 への `unset: [path]` と `path` の無い `data` の `replace` を 1 件ずつ'
        mock: 作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: 7 件とも `InvalidArgumentError` で、違反の `path` が `data.path`・`set.path`・`set.@body`・`text_edits[0].field`・`new_path`・`unset.path`・`data.path`。ファイルは変わらない
      - name: test_write_docs_when_nested_body_file
