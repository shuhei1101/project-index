        condition: '`commit` つきで、生成が終了コード 1 で終わる'
        mock: なし
        expected: '`DirectCommitGeneratorError`。書いたファイルが戻り、コミットが増えない'
        exception: 生成が失敗する
      - name: test_write_docs_when_direct_commit_invalid_arguments
        case: 異常
