notes:
  受け持つこと: |-
    待ち受けるのは、読み取り API・文書の MCP・管理の MCP・セッションの開始。
    再起動を要求されて止まったときは、同じプロセスを `serve` で置き換える。
    例外から problem+json への変換もここで登録する。
