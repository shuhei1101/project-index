id: MOD-120
title: 索引のサーバー / 起動
lead: |-
  `project-index serve`・`migrate` で部品を配線し、API と MCP を 1 つのアプリで待ち受ける起動の分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/
  ├─ main.py                    # Handlers / build_handlers / reload_sources / discard_source_caches / run_serve / run_migrate / PortInUseError
  └─ server/
     ├─ app.py                  # build_app / route_operation_id / SlashlessMcpPathMiddleware（ルートと MCP のマウント）
     ├─ lifespan.py             # build_lifespan（MCP のセッションの管理と記録の削除）
     ├─ error_handlers.py       # register_error_handlers（problem+json）
  ```
