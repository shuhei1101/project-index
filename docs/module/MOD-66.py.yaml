id: MOD-66
title: 索引のサーバー / 端末の設定 / service.py
lead: '`sources[]` の保存。'
test_files:
  - tests/unit/project_index/features/settings/test_service.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        端末の設定の入口 ..> 配信元の保存 : PUT
        配信元の保存 ..> 端末の設定の検証 : 書く前
        配信元の保存 ..> 配信元の読み直し : 書いた後
        class 端末の設定の入口 {
          <<function>>
        }
        class 配信元の保存 {
          <<function>>
        }
        class 端末の設定の検証 {
          <<function>>
        }
        class 配信元の読み直し {
          <<function>>
        }
        click 端末の設定の入口 href "./MOD-65.py.yaml#端末の設定の入口"
        click 端末の設定の検証 href "./MOD-64.py.yaml#端末の設定の検証"
        click 配信元の読み直し href "./MOD-89.py.yaml#配信元の読み直し"
functions:
  - name: save_sources
    title: 配信元の保存
    kind: 関数
    container: project_index/features/settings/service.py
    usecase: 端末の設定の保存
    role: サービス
    summary: '`settings.yaml` の `sources` だけを書き換え、検証に通ったら書いて配信元を読み直す'
    scope: public
    thread_safe: true
    side_effects: 端末の設定のファイルを書き換え、配信元の一覧を入れ替える
    args:
      - name: sources
        title: 配信元
        type: Sequence[SourceEntry]
        required: true
        passing: positional
        description: 保存する `sources[]` の全行
      - name: path
        title: 設定のファイル
        type: Path
        required: true
        passing: injected
        description: 端末の設定のパス
      - name: reload
        title: 配信元の読み直し
        type: Callable[[TerminalConfig], list[SourceStatus]]
        required: true
        passing: injected
        description: 起動の『配線済みの関数』の `reload_sources`
      - name: lock
        title: 端末の設定の排他
        type: threading.Lock
        required: true
        passing: injected
        description: 端末の設定の読み書きと読み直しの排他
    returns:
      type: list[SourceStatus]
      description: 読み直した後の配信元ごとの状態（配信元の『配信元の状態』）
    process: |-
      1. `lock` を取る
      2. 端末の設定を往復編集の形で読み（往復編集の読み込み）、`sources` だけを送られた行に置き換える。`config` は要素の数によらず配列で書く。既定値と同じキー（`enabled: true`・`outside_read: true`・空の `scope.read` など）は書かない
      3. 置き換えた値を検証する（端末の設定の検証）
         - 違反がある場合、ファイルを書かずに `TerminalConfigInvalidError` を送る
      4. 一時ファイルに書いてから置き換える（往復編集の書き出し・ファイルの置き換え）
         - `[info]` 端末の設定の sources を保存した（パス・行数）
      5. 端末の設定を読み直し（端末の設定の読み込み）、`reload` で配信元を読み直して状態を返す（起動の『配信元の読み直し』）
    exceptions:
      - name: TerminalConfigInvalidError
        condition: 置き換えた後の端末の設定がスキーマに通らない
        message: '違反ごとに `{キーのパス}: {理由}`'
        notes: 入口が 422 にする
    unit_tests:
      - name: test_save_sources
        case: 正常
        summary: sources だけを書き換えコメントを保つ
        condition: '`port` にコメントを持つ設定に、行を 1 つ足した `sources`'
        mock: 配信元の読み直し（`serving` を 2 つ返す偽物）
        expected: ファイルの `sources` が 2 行で、`port` の行とコメントはそのまま。`reload` が書いた後の設定で 1 回呼ばれる
      - name: test_save_sources_when_defaults
        case: 正常
        summary: 既定値のキーを書かない
        condition: '`enabled: true`・`scope.read: []`・`config` が要素 1 つの行'
        mock: 配信元の読み直し（偽物）
        expected: ファイルの行に `enabled` と `scope` が無く、`config` が要素 1 つの配列
      - name: test_save_sources_when_outside_read_false
        case: 正常
        summary: 既定値と違う outside_read を書く
        condition: '`outside_read: false` の行'
        mock: 配信元の読み直し（偽物）
        expected: 'ファイルの行に `outside_read: false` がある'
      - name: test_save_sources_when_invalid
        case: 異常
        summary: 検証に通らない
        condition: '2 行とも `id: a`'
        mock: 配信元の読み直し（偽物）
        expected: '`TerminalConfigInvalidError` で、ファイルは元のまま、`reload` は呼ばれない'
        exception: 置き換えた後がスキーマに通らない
  - name: add_source
    title: 配信元の 1 行の追加
    kind: 関数
    container: project_index/features/settings/service.py
    usecase: 端末の設定の配信元の 1 行の追加
    role: サービス
    summary: 同じ id の行が無ければ `settings.yaml` の `sources` の末尾に 1 行追加して配信元を読み直し、あれば内容が同じかを返す
    scope: public
    thread_safe: true
    side_effects: 端末の設定のファイルを書き換え、配信元の一覧を入れ替える（追加したときだけ）
    args:
      - name: source
        title: 配信元の行
        type: SourceEntry
        required: true
        passing: positional
        description: 追加する行
      - name: path
        title: 設定のファイル
        type: Path
        required: true
        passing: injected
        description: 端末の設定のパス
      - name: reload
        title: 配信元の読み直し
        type: Callable[[TerminalConfig], list[SourceStatus]]
        required: true
        passing: injected
        description: 起動の『配線済みの関数』の `reload_sources`
      - name: lock
        title: 端末の設定の排他
        type: threading.Lock
        required: true
        passing: injected
        description: 端末の設定の読み書きと読み直しの排他（配信元の保存と同じ）
    returns:
      type: SourceAddResult
      description: '`added` と読み直した後の状態か、`exists` と内容が同じか'
    process: |-
      1. `lock` を取る
      2. 端末の設定を往復編集の形で読み（往復編集の読み込み）、`sources` に、配信元の ID（配信元の『行の配信元の ID』。`id`、無ければ設定の `name`）が `source` と同じ行があるかを探す。`source` の ID が求まらないときは探さない
         - ある場合、既定値と同じ値を書いたキーと書かないキーを同じとみなして行を比べ、`exists` と内容が同じか（`same`）を返す（ファイルは書かない）
      3. `sources` の末尾に行を加える。書き方は配信元の保存と同じ（`config` は配列、既定値と同じキーは書かない）
      4. 加えた値を検証する（端末の設定の検証）
         - 違反がある場合、ファイルを書かずに `TerminalConfigInvalidError` を送る
      5. 一時ファイルに書いてから置き換え、端末の設定を読み直して `reload` で配信元を読み直し、`added` と状態を返す
         - `[info]` 端末の設定の sources に 1 行追加した（パス・id）
    exceptions:
      - name: TerminalConfigInvalidError
        condition: 加えた後の端末の設定がスキーマに通らない
        message: '違反ごとに `{キーのパス}: {理由}`'
        notes: 入口が 422 にする
    unit_tests:
      - name: test_add_source
        case: 正常
        summary: 末尾に追加して読み直す
        condition: '`sources` に sample の 1 行の設定に extra を追加'
        mock: '`reload`（状態を返す偽物）'
        expected: '`added` で、ファイルの `sources` が sample・extra の順、コメントと他のキーが変わらず、`reload` が 1 回呼ばれる'
      - name: test_add_source_when_same_id
        case: 正常
        summary: 同じ id の行があれば追加しない
        condition: '`sources` に extra がある設定に、同じ内容の extra と `config` が違う extra を 1 回ずつ'
        mock: '`reload`（呼ばれた数を数える）'
        expected: 1 回目は `exists`・`same` が `True`、2 回目は `exists`・`same` が `False`。ファイルは変わらず、`reload` は呼ばれない
      - name: test_add_source_when_invalid
        case: 異常
        summary: 加えた後にスキーマに通らない
        condition: '`id` が `Sample Docs` の行'
        mock: '`reload`（呼ばれた数を数える）'
        expected: '`TerminalConfigInvalidError` で、ファイルは変わらず、`reload` は呼ばれない'
        exception: スキーマに通らない
      - name: test_add_source_when_same_name
        case: 正常
        summary: id を省略した行どうしを設定の name で照合する
        condition: '`name: sample` の設定を `id` を省略して指す行を持つ設定に、同じ `id` を省略した行'
        mock: '`reload`（呼ばれた数を数える）'
        expected: '`exists`・`same` が `True`。ファイルは変わらず、`reload` は呼ばれない'
      - name: test_add_source_when_id_matches_name
        case: 正常
        summary: id を書いた行を、id を省略した既存の行の name と照合する
        condition: '`name: sample` の設定を `id` を省略して指す行を持つ設定に、同じ設定を指す `id: sample` の行'
        mock: '`reload`（呼ばれた数を数える）'
        expected: '`exists`・`same` が `False`。ファイルは変わらず、`reload` は呼ばれない'
