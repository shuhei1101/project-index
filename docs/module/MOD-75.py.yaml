classes:
  - name: DocumentChecker
    title: 文書の検査
    container: project_index/features/validation/service.py
    usecase: 共通
    role: サービス
    summary: 1 件の文書に全ての検査を通し、違反をまとめて返す
    description: |-
      読み取りの `validators[]` の結果は (配信元, 種類, 検査の ID, 文書のバージョン) でキャッシュし、同じ内容でスクリプトを動かし直さない。
      書き込みの検査はキャッシュせず、毎回動かす。
    kind: クラス
    properties:
      - name: store
        title: 文書のストア
        type: DocumentStore
        access: 公開
        description: 種類のスキーマを引く
      - name: timeout_sec
        title: 制限時間
        type: float
        access: 公開
        description: 端末の設定の `script_timeout_sec`
      - name: _read_cache
        title: 読み取りの結果
        type: OrderedDict[tuple[str, str, str, str], list[Violation]]
        access: 内部 (_)
        description: 上限は `VALIDATOR_ON_READ_CACHE`
      - name: _lock
        title: 排他
        type: threading.Lock
        access: 内部 (_)
        description: '`_read_cache` を守る'
    methods:
      - name: check
        title: 検査する
        summary: スキーマ・ID の形・関連の種類・`validators[]` を順に通す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`validators[]` のスクリプトを動かす'
        args:
          - name: target
            title: 読み書きの場所
            type: Target
            required: true
            passing: positional
            description: スクリプトを動かす場所（`target.base`）とスキーマを読む場所
          - name: document
            title: 文書
            type: Document
            required: true
            passing: positional
            description: 検査する文書（書き込みでは、書こうとしている内容で作った文書）
          - name: 'on'
            title: 通す時点
            type: Literal['read', 'write']
            required: true
            passing: keyword
            description: '`validators[].on` と照らす'
          - name: new
            title: 新しい文書か
            type: bool
            required: false
            default: 'False'
            passing: keyword
            description: '`True` のときだけ `ids.format` を確かめる'
          - name: deadline
            title: 書き込みの期限
            type: Deadline | None
            required: false
            default: None
            passing: keyword
            description: 書き込み・削除の検査で渡す。`None` は期限を持たない（読み取りの検査）
        returns:
          type: list[Violation]
          description: 違反。検査の順に並ぶ
        process: |-
          1. 文書に当てるスキーマ（文書のストア.文書に当てるスキーマ）を `store.row_schema(target, kind)` で引いて『スキーマの検査』を通す（`records` の行は要素に 1 行のスキーマを、それ以外はファイルの内容に種類のスキーマを当てる）。`schema_file` には行の `schema_path` を渡す（`SchemaRef` は `{source}:{path}@{ref}`）
          2. `new` なら『IDの形の検査』を通す
          3. 『関連の種類の検査』をメタデータに通す
          4. 行の `validators` の ID ごとに `source.script("validators", id)` を引き、`on` が行の `on` にあるものだけを通す
             - `on` が `read` の場合、`_read_cache` にキャッシュがあればそれを使う
             - `deadline` がある場合、動かす前に『期限』.期限の確認を呼ぶ（過ぎていれば `WriteDeadlineExceededError` が伝わる）
             - スクリプトの実行の『スクリプトの実行』を `cwd=target.config_base`（設定ファイルのフォルダ）・`stdin`（`body`）・制限時間（`deadline` があれば『期限』.制限時間の切り詰めに `timeout_sec` を渡した値、無ければ `timeout_sec`）・`at` で呼び（`at` は `target.worktree` が `None` で `source.config_commit` がある場合に（`source.main_root`, `source.config_commit`））、『検査の出力の解釈』で違反にする
             - `ScriptError` の場合、`path` が `$`、`rule` が `{id}: 検査を実行できませんでした（{メッセージ}）` の違反にする（キャッシュしない）
             - `deadline` がある場合、動かした後（`ScriptError` のときも）に『期限』.期限の確認を呼ぶ。残りの時間でスクリプトを止めたときは、違反ではなく `WriteDeadlineExceededError` が伝わる
          5. 違反を返す
        unit_tests:
          - name: test_document_checker_check
            case: 正常
            summary: 検査の順とまとめ
            condition: スキーマ違反 1 件・知らない関連の種類 1 件・`validators` が 1 件の違反を出す文書を `on="write"`
            mock: なし（検査は `sys.executable -c` のスクリプト）
            expected: 3 件をスキーマ・関連・スクリプトの順で返す
            exception: '-'
          - name: test_document_checker_check_when_on_read
            case: 正常
            summary: 通す時点とキャッシュ
            condition: '`on: [read]` の検査と `on: [write]` の検査を持つ行で、同じ文書を `on="read"` で 2 回'
            mock: '`run_script`（呼ばれた数を数える）'
            expected: '`read` の検査だけが 1 回呼ばれる'
            exception: '-'
          - name: test_document_checker_check_when_script_fails
            case: 正常
            summary: 検査が動かない
            condition: 終了コード 1 で終わる検査
            mock: なし
            expected: 1 件で、`rule` に「検査を実行できませんでした」
            exception: '-'
          - name: test_document_checker_check_when_new
            case: 正常
            summary: 新しい文書の ID
            condition: '`ids.format` が `{kind}-{slug}` で ID が `X`、`new=True` と `new=False`'
            mock: なし
            expected: '`new=True` だけ `id` の違反がある'
            exception: '-'
          - name: test_document_checker_check_when_records
            case: 正常
            summary: records の行の要素に 1 行のスキーマを当てる
            condition: '行 `notes`（`records: files`、`schema` が `templates/files.schema.yaml` のコピー）の要素 `{path: a.md}` の文書を `on="read"`'
            mock: なし
            expected: 空の並び（`'files' is a required property` を返さない）
            exception: '-'
          - name: test_document_checker_check_when_deadline_capped
            case: 異常
            summary: 期限までの残りの時間でスクリプトを止める
            condition: '`timeout_sec=30`、残りの時間が 2 秒の `deadline`。スクリプトの実行が時計を 3 秒進めて `ScriptTimeoutError` を送る'
            mock: スクリプトの実行（受けた制限時間を記録する偽物）・時計（偽物）
            expected: '`WriteDeadlineExceededError`。スクリプトの実行に渡った制限時間が 2'
            exception: '`deadline` があり、検査のスクリプトを動かす前か動かした後に期限を過ぎている'
          - name: test_document_checker_check_when_deadline_passed
            case: 異常
            summary: 期限を過ぎた後はスクリプトを動かさない
            condition: 残りの時間が 0 の `deadline`
            mock: スクリプトの実行（呼ばれた回数を記録する偽物）・時計（偽物）
            expected: '`WriteDeadlineExceededError`。スクリプトの実行が呼ばれない'
            exception: '`deadline` があり、検査のスクリプトを動かす前か動かした後に期限を過ぎている'
          - name: test_document_checker_check_when_script_timed_out
            case: 正常
            summary: '`script_timeout_sec` で止めたスクリプトは違反'
            condition: '`timeout_sec=1`、残りの時間が 30 秒の `deadline`。スクリプトの実行が時計を 1 秒進めて `ScriptTimeoutError("制限時間（1 秒）を超えたため、スクリプトを止めました。")` を送る'
            mock: スクリプトの実行（送る偽物）・時計（偽物）
            expected: '違反 1 件、`rule` が `{id}: 検査を実行できませんでした（制限時間（1 秒）を超えたため、スクリプトを止めました。）`'
        exceptions:
          - name: WriteDeadlineExceededError
            condition: '`deadline` があり、検査のスクリプトを動かす前か動かした後に期限を過ぎている'
            message: 『期限』.期限の確認のまま
      - name: check_markdown
        title: Markdownの値を点検する
        summary: 書き込む文書の変えた Markdown の値を mdmark の点検に通す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: mdmark の CLI を値ごとに起動する
        args:
          - name: target
            title: 読み書きの場所
            type: Target
            required: true
            passing: positional
            description: mdmark を動かす場所（`target.base`）とスキーマを読む場所
          - name: document
            title: 文書
            type: Document
            required: true
            passing: positional
            description: 書こうとしている内容で作った文書（検査するで違反の無かったもの）
          - name: previous
            title: 操作の前の内容
            type: Mapping[str, Any] | None
            required: true
            passing: keyword
            description: 操作を当てる前の文書の `data`。`create` は `None`
          - name: stopped
            title: 止めた理由
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 同じ書き込みの前の文書の点検で止めた理由
          - name: deadline
            title: 書き込みの期限
            type: Deadline | None
            required: false
            default: None
            passing: keyword
            description: 書き込みの期限。`None` は期限を持たない
        returns:
          type: MarkdownCheck
          description: 違反・点検できなかったキー・止めた理由
        process: |-
          1. 文書に当てるスキーマを `store.row_schema(target, kind)` で引く
          2. 変えたMarkdownの値（`document.data`・`previous`・スキーマ）を引く。空なら空の `MarkdownCheck`（`stopped` は引数のまま）を返す
          3. Markdownの値の点検（`cwd=target.base`・`timeout_sec`・`stopped`・`deadline`）を返す
        unit_tests:
          - name: test_document_checker_check_markdown
            case: 正常
            summary: 変えた値だけを点検に渡す
            condition: '`body` が `contentMediaType: text/markdown` の種類で、前 `{body: a}`、後 `{body: b}` の文書'
            mock: '`check_markdown_values`（受けた値を記録する）'
            expected: '`{"body": "b"}` と `cwd=target.base` で呼ばれる'
          - name: test_document_checker_check_markdown_when_unchanged
            case: 正常
            summary: Markdown の値を変えない
            condition: '前も後も `{body: a}`'
            mock: '`check_markdown_values`'
            expected: 空の `MarkdownCheck` で、`check_markdown_values` は呼ばれない
      - name: clear
        title: キャッシュを捨てる
        summary: 読み取りの結果のキャッシュを捨てる
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_read_cache` を空にする'
        returns:
          type: None
          description: '-'
        process: 1. `_read_cache` を空にする（起動の『配信元の再読み込み』が呼ぶ）
constants:
  - name: VALIDATOR_ON_READ_CACHE
    title: 読み取りの検査の結果の数
    container: project_index/features/validation/service.py
    usecase: 共通
    summary: 読み取りの `validators[]` の結果をキャッシュする件数の上限。超えたら使ったのが古いものから捨てる
    value: '4096'
