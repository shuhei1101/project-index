notes:
  分類: 分類ごとのファイルの並びと決まりは、分類ごとの束ねる設計書（[スクリプトの実行](id:MOD-105) など、名前が `索引のサーバー / {分類}` の設計書）が持つ
  移した元: shuhei1101/dev-docs の `src/dev_docs/` のうち、文書の MCP・管理の MCP・配信元の読み込みと検査・`converters[]` の実行・端末の設定・読み取り API の分類を移した。スキーマ駆動の Markdown への変換と画面の API・画面の配信は dev-docs に残す
  バージョン: パッケージのバージョンは `pyproject.toml` の `version` が持ち、実行中はインストールしたパッケージのメタデータを参照する。リリースのバージョンは `version.ini` とタグが持ち、パッケージのバージョンとは統一しない
id: MOD-1
