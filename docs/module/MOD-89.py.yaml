data_models:
  - name: Handlers
    title: 配線済みの関数
    container: project_index/main.py
    usecase: 共通
    role: 合成の起点
    summary: 入口（読み取り API・MCP）が使う部品を 1 回だけ作ってまとめたもの
    description: |-
      `dataclass(frozen=True)`。入口はこの属性から部品を引き、部品を自分で作らない。
      サービスは同期の関数で、入口は `asyncio.to_thread` で呼ぶ。テストは属性を偽物に差し替えた `Handlers` を作る。
    properties:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        access: 公開
        description: 起動時に読んだ端末の設定（`sources` の保存後は `registry` が新しい値で動く。`port` など再起動が要るキーはこの値のまま）
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        access: 公開
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        access: 公開
        description: 文書を読む（文書のストア）
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        access: 公開
        description: リビジョンを `state_dir` へ書き出す（履歴）
      - name: converter
        title: 変換
        type: ConvertService
        access: 公開
        description: 文書を Markdown にする（変換）
      - name: seen
        title: 会話の記録
        type: SeenStore
        access: 公開
        description: 会話ごとの返却済み・前回読んだ内容（会話の記録）
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        access: 公開
        description: 書き込み・削除を配信元ごとに 1 つずつにする（書き込み）
      - name: settings_lock
        title: 端末の設定の排他
        type: threading.Lock
        access: 公開
        description: 端末の設定の保存と再読み込みを 1 つずつにする
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        access: 公開
        description: 検索の検査の結果と、書き込み・削除の検査（検査）
      - name: reload_sources
        title: 配信元の再読み込み
        type: Callable[[TerminalConfig], list[SourceStatus]]
        access: 公開
        description: '『配信元の再読み込み』をこの `Handlers` の部品でまとめたもの。配信元の保存が呼ぶ'
      - name: restart
        title: 再起動の制御
        type: RestartControl
        access: 公開
        description: 再起動と更新の要求を 1 つずつにし、`run_serve` が止まった後に同じプロセスを置き換えるかを持つ（再起動と更新）
      - name: checks
        title: 配信元の検査のキャッシュ
        type: SourceChecks
        access: 公開
        description: 配信元ごとの最後の検査の結果（`describe` の警告が読む）
      - name: prompts
        title: プロンプトの一式
        type: PromptSet
        access: 公開
        description: 起動のときに読んだプロンプトの YAML（文書の MCP・管理の MCP が描画する。書き換えは再起動で効かせる）
      - name: reload_changed
        title: 変わった配信元の再読み込み
        type: Callable[[TerminalConfig], list[SourceStatus]]
        access: 公開
        description: 『変わった配信元の再読み込み』をこの `Handlers` の部品でまとめたもの。配信元の 1 行の追加・変更・削除が呼ぶ
