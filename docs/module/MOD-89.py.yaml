        description: 検査の結果を持たせる
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        required: true
        passing: injected
        description: 裏で default_ref の commit を書き出す
    returns:
      type: threading.Thread
      description: 裏の書き出しのスレッド（テストが join する）
    process: |-
      1. 文書のストア・文書の検査・変換のキャッシュを捨てる（文書のストア.全て捨てる・文書の検査.キャッシュを捨てる・変換.キャッシュを捨てる）
      2. 渡した配信元の ID の検査の結果を捨てる（配信元の検査のキャッシュ.結果の破棄）
      3. 渡した配信元で『配信元の検査と書き出しの開始』を呼び、返ったスレッドを返す
  - name: log_source_check
