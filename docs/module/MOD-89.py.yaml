    summary: プロンプトの YAML が無い・違反するときの終了コード
    value: '4'
functions:
  - name: run_serve
    title: 待ち受けの開始
    kind: 関数
    container: project_index/main.py
    usecase: 起動
    role: 入口
    summary: 端末の設定を読み、配信元を配線して待ち受け、停止の合図まで動く。再起動を要求されて止まったときは同じプロセスを置き換える
    scope: public
    side_effects: ポートで待ち受ける。`log_dir` にログを書く。標準出力・標準エラーに書く。再起動のときはプロセスを `os.execv` で置き換える
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`serve` の解析結果（使う値は無い）'
    returns:
      type: int
      description: 終了コード。停止の合図で止まったとき 0
    process: |-
      1. 端末の設定のパスを決め（端末の設定のパス）、端末の設定を読み（端末の設定の読み込み）、待ち受けのポートを決める（待ち受けのポート）
         - `TerminalConfigInvalidError` の場合、違反ごとに `{ファイル}: {パス}: {理由}`（違反が無ければ例外の本文）を標準エラーに出し、`EXIT_CONFIG_INVALID` を返す
      2. `log_dir` を作り、`logging` を設定する。ログは標準エラーと `{log_dir}/project-index.log`（`RotatingFileHandler`）に書く。端末の設定の知らないキーを警告のログに書く（知らないキーのログ）
      3. ポートで待ち受けられるか確かめる（ポートの確かめ）
         - `PortInUseError` の場合、`{bind}:{port} は使用中です。PROJECT_INDEX_PORT で別のポートを指定できます` を標準エラーに出し、`EXIT_PORT_IN_USE` を返す
      4. 部品を配線し（部品の配線）、アプリを組み立てる（アプリの組み立て）
         - `PromptInvalidError` の場合、違反ごとに `{file}: {path}: {reason}` を標準エラーに出し、`EXIT_PROMPT_INVALID` を返す
      5. 標準出力に `http://{bind}:{port}/` を出し、配信元の読み込みを裏で始める（配信元の読み込みの開始）
      6. `uvicorn.Server(uvicorn.Config(app, host=bind, port=port, log_config=None, timeout_graceful_shutdown=script_timeout_sec * SHUTDOWN_WAIT_FACTOR))` を作り、再起動の制御に取り付けて（サーバーの取り付け）`run()` する
         - 確かめた後に他のプロセスがポートを取り、uvicorn が待ち受けに失敗して止まった場合（`server.started` が `False`）、手順 3 と同じ本文を出して `EXIT_PORT_IN_USE` を返す
      7. 止まった後、再起動を要求済み（`handlers.restart.requested`）かで分ける
         - 要求済みの場合、ログのハンドラーを閉じ、`os.execv(sys.executable, [sys.executable, *SERVE_ARGV])` で同じプロセスを置き換える
         - 要求が無い場合、0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 端末の設定が無い・違反する
        message: '標準エラーに `{ファイル}: {パス}: {理由}` を全て'
      - name: なし（終了コード 3）
        condition: ポートで待ち受けられない
        message: '`{bind}:{port} は使用中です。PROJECT_INDEX_PORT で別のポートを指定できます`'
      - name: なし（終了コード 4）
        condition: プロンプトの YAML が無い・読めない・スキーマに違反する・描画できない
        message: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て'
    callees:
      - MOD-34#classes[RestartControl].methods[requested]
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けて配信元を出す
        condition: 配信できる配信元 1 つの端末の設定を `PROJECT_INDEX_CONFIG` に入れる
        mock: '`uvicorn.Server.run`（何もせず戻る。`started` を `True` にする）'
        expected: 0 を返し、標準出力に `http://127.0.0.1:{port}/` が配信元の ID より前に出る（`run` の後に読み込みのスレッドを join して確かめる）、`uvicorn.Config` の `host` が `127.0.0.1`
      - name: test_run_serve_when_config_invalid
        case: 異常
        summary: 端末の設定が違反する
        condition: '`sources[0]` に `config` が無く `port` が文字列'
        mock: なし
        expected: 2 を返し、標準エラーに `sources[0].config` と `port` の 2 行
        exception: 端末の設定が違反する
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使用中
        condition: テストが先に待ち受けたポートを `PROJECT_INDEX_PORT` に入れる
        mock: なし
        expected: 3 を返し、標準エラーにポートの番号と `PROJECT_INDEX_PORT`
        exception: ポートで待ち受けられない
      - name: test_run_serve_when_prompt_invalid
        case: 異常
        summary: プロンプトの YAML が違反する
        condition: 配信できる配信元 1 つの端末の設定。同梱した YAML を一時フォルダへ複製して `mcp/docs/tools/search-docs.yaml` から `kind` を削除し、そのフォルダを `PROJECT_INDEX_PROMPTS_DIR` に入れる
        mock: '`uvicorn.Server.run`（呼ばれた数を数える）'
        expected: 4 を返し、標準エラーに `search-docs.yaml` のパスと `kind` があり、`uvicorn.Server.run` が呼ばれない
        exception: プロンプトの YAML が違反する
      - name: test_run_serve_when_restart
        case: 正常
        summary: 再起動の要求で同じプロセスを置き換える
        condition: 配信できる配信元 1 つの端末の設定。`uvicorn.Server.run` の中で `handlers.restart.request()` を呼ぶ
        mock: '`uvicorn.Server.run`（`started` を `True` にして再起動を要求して戻る）・`os.execv`（呼ばれた引数を記録する偽物）'
        expected: '`os.execv` が `sys.executable` と `[sys.executable, "-m", "project_index", "serve"]` で 1 回呼ばれる。`uvicorn.Config` の `timeout_graceful_shutdown` が `script_timeout_sec * 1.5`'
  - name: check_port
    title: ポートの確かめ
    kind: 関数
    container: project_index/main.py
    usecase: 起動
    role: 検証
    summary: 待ち受けのアドレスとポートで待ち受けられるかを、一度 bind して確かめる
    scope: public
    args:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        required: true
        passing: positional
        description: 端末の設定の `bind`
      - name: port
        title: ポート
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
    returns:
      type: None
      description: 待ち受けられるときは何も返さない
    process: |-
      1. `socket.socket(AF_INET, SOCK_STREAM)` に uvicorn と同じく `SO_REUSEADDR` を付けて `(bind, port)` へ bind し、すぐに閉じる
         - `OSError`（`EADDRINUSE`・`EACCES`）の場合、`PortInUseError` を送る
    exceptions:
      - name: PortInUseError
        condition: bind に失敗する
        message: '`{bind}:{port} は使用中です`'
    unit_tests:
      - name: test_check_port
        case: 正常
        summary: 空いているポート
        condition: OS が払い出して閉じたポート
        mock: なし
        expected: 送らない
      - name: test_check_port_when_in_use
        case: 異常
        summary: 使用中のポート
        condition: テストが `listen` しているポート
        mock: なし
        expected: '`PortInUseError` の `port` がそのポート'
        exception: bind に失敗する
      - name: test_check_port_when_time_wait
        case: 正常
        summary: 閉じたばかりの接続が残るポート
        condition: '`SO_REUSEADDR` 付きで待ち受けて 1 本受け、サーバー側から接続と待ち受けを閉じた直後のポート'
        mock: なし
        expected: 送らない
  - name: build_handlers
    title: 部品の配線
    kind: 関数
    container: project_index/main.py
    usecase: 起動
    role: 合成の起点
    summary: 端末の設定から部品を 1 回だけ作り、配線済みの関数にする（配信元は読まない）
    scope: public
    side_effects: '`state_dir` の下にフォルダを作る'
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 読んだ端末の設定
    returns:
      type: Handlers
      description: 配線済みの関数
    process: |-
      1. プロンプトの一式を読む（`load_prompts(prompts_dir(os.environ), required=mcp_prompt_ids())`）。`PromptInvalidError` はそのまま送る
      2. `state_dir` を作る
      3. 配信元の一覧・リビジョンの書き出し（`{state_dir}/snapshots`）・文書のストア・変換（`{state_dir}/converted`、制限時間は `script_timeout_sec`）・会話の記録（`{state_dir}/seen.sqlite3`、保持日数は `seen_retention_days`）・文書の検査（制限時間は `script_timeout_sec`）・配信元ごとの排他・再起動の制御を作る。配信元の検査のキャッシュは `on_checked` に『配信元の検査の結果のログ』を渡して作る。配信元の一覧は `loading=True` で作り、組み立て直した配信元か ID の重なりで入れ替えた配信元を 1 つ受け取って『配信元のキャッシュの破棄』をこれらの部品で呼ぶ関数を `on_rebuilt` に渡す
      4. 『配信元の再読み込み』をこれらの部品でまとめた関数を作る（呼ぶのは配信元の読み込みの開始と配信元の保存）。関数は、再読み込みした後に起動時の端末の設定の `sources` と `unknown_keys` を新しい端末の設定の値に差し替え、新しい端末の設定の知らないキーを警告のログに書く（知らないキーのログ）
      5. 『変わった配信元の再読み込み』をこれらの部品でまとめた関数を作る（呼ぶのは配信元の 1 行の追加・変更・削除）。再読み込みした後の差し替えと警告のログは手順 4 と同じ
      6. プロンプトの一式・これらの部品・手順 4・5 の関数を持つ `Handlers` を返す
    exceptions:
      - name: PromptInvalidError
        condition: プロンプトの YAML が無い・読めない・スキーマに違反する・描画できない
        message: 違反を全て `problems` に持つ
    unit_tests:
      - name: test_build_handlers
        case: 正常
        summary: 部品を作り配信元は読まない
        condition: '`state_dir` が無い一時フォルダの下、配信できる配信元 1 つと検証に失敗する配信元 1 つ'
        mock: なし
        expected: '`state_dir` ができ、`registry.loading` が `True` で `registry.statuses()` が空。`handlers.reload_sources(terminal)` の後は `registry.served()` が 1 つ、`registry.statuses()` が 2 つ。`prompts` が `mcp/docs/instructions` を持ち、`session-context` を持たない'
      - name: test_build_handlers_when_out_of_sync
        case: 正常
        summary: 初回の読み込みでもずれを警告のログに書く
        condition: 行 `rules` に `title` の無い文書が 1 件ある配信元 `sample` 1 つ。`build_handlers` の後に `handlers.reload_sources(terminal)` を呼ぶ
        mock: なし（一時フォルダの配信元と `caplog`）
        expected: '`sample` の `metadata` の列の欠けの警告が 1 件あり、`registry.served()` が 1 つ'
      - name: test_build_handlers_when_default_ref_moved
        case: 正常
        summary: default_ref が進んだ後は新しい設定で文書を読む
        condition: '`default_ref` の `rules` の行に `metadata` が無い Git の配信元 `a` と、`name: 文書 1`・`title: タイトル` の文書 1 件。1 回読んだ後に、`rules` の行へ `metadata: {name: title}` を足す commit を積む'
        mock: なし（一時フォルダで `git init`）
        expected: '`registry.get("a")` の後に `store` で読んだ文書の `metadata.name` が `タイトル`'
        exception: '-'
      - name: test_build_handlers_when_prompt_invalid
        case: 異常
