    scope: public
    thread_safe: true
    side_effects: 文書のストア・文書の検査・変換のキャッシュと配信元の検査の結果を捨てる。裏のスレッドを起こす
    args:
      - name: sources
        title: 配信元
        type: list[ServedSource]
        required: true
        passing: positional
        description: 警告を確かめる配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: キャッシュを捨てる
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: キャッシュを捨てる
      - name: converter
        title: 変換
        type: ConvertService
        required: true
        passing: injected
        description: キャッシュを捨てる
      - name: checks
        title: 配信元の検査のキャッシュ
        type: SourceChecks
        required: true
