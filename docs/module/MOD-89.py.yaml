    usecase: 端末の設定の保存
    role: 合成の起点
    summary: 配信元の一覧を再読み込みし、配信元の内容をキャッシュした部品のキャッシュを捨てる
    scope: public
    thread_safe: true
    side_effects: 配信元の一覧を入れ替え、文書のストア・文書の検査・変換のキャッシュと配信元の検査の結果を捨てる。裏で検査とリビジョンの書き出しを始め、待たない
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 再読み込みする端末の設定
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 再読み込みする配信元の一覧
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: キャッシュを捨てる
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: キャッシュを捨てる
      - name: converter
        title: 変換
        type: ConvertService
        required: true
        passing: injected
        description: キャッシュを捨てる
      - name: checks
        title: 配信元の検査のキャッシュ
        type: SourceChecks
        required: true
        passing: injected
        description: 配信元のキャッシュの破棄へ渡す
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        required: true
        passing: injected
        description: 配信元のキャッシュの破棄へ渡す
    returns:
      type: list[SourceStatus]
      description: 再読み込みした後の配信元ごとの状態
    process: |-
      1. 配信元の一覧を再読み込みする（配信元の一覧.再読み込みする）
      2. 配信中の配信元で『配信元のキャッシュの破棄』を呼ぶ（裏の検査と書き出しは待たない）
      3. 手順 1 の状態を返す
    unit_tests:
      - name: test_reload_sources
        case: 正常
