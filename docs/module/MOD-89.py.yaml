    container: project_index/main.py
    usecase: 中身が変わったファイルの一覧
    role: 入口
    summary: '`project-index changed` の解析結果で変わったファイルを集め、起点とあわせて 1 つの JSON で出す'
    kind: 関数
    scope: public
    side_effects: 標準出力・標準エラーに書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`changed` の解析結果（`root`・`files_yaml`）'
    returns:
      type: int
      description: 終了コード。出し終えたとき 0
    process: |-
      1. `root` を `Path` にし、フォルダでなければ「`{root}: フォルダがありません`」を標準エラーに出して 2 を返す
      2. 中身が変わったファイルの一覧（`find_changed`）を作る
         - `FilesYamlNotFoundError` の場合、「`{パス}: 管理用の YAML がありません`」を標準エラーに出して 2 を返す
         - `ValueError`（確認の時点の読み取りが送る `checkpoint` の形の違い）の場合、「`{管理用の YAML}: checkpoint の {メッセージ}`」を標準エラーに出して 2 を返す
      3. `missing_commit` があれば、「記録した commit `{commit}` が無いため、起点を `{base.kind}` に切り替えました」を標準エラーに出す
      4. `{"base": {"kind", "value"}, "files": [...]}` を `json.dumps(ensure_ascii=False)` で標準出力に出して 0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: '`--root` が無いかフォルダでない（`RootNotFound`）'
        message: '`{root}: フォルダがありません`'
      - name: なし（終了コード 2・管理用の YAML）
        condition: '`--files-yaml` が無い（`FilesYamlNotFound`）'
        message: '`{パス}: 管理用の YAML がありません`'
      - name: なし（終了コード 2・checkpoint）
        condition: '`checkpoint` の形が違う（`InvalidCheckpoint`）'
        message: '`{管理用の YAML}: checkpoint の {メッセージ}`'
    unit_tests:
      - name: test_run_changed
        case: 正常
        summary: 起点とファイルを JSON で出す
        condition: '`find_changed` が `base=(CHECKPOINT_COMMIT, "abc")`・`files=("a.md",)` を返す'
        mock: '`find_changed`（monkeypatch）'
        expected: '0 を返し、標準出力を `json.loads` した結果が `{"base": {"kind": "checkpoint_commit", "value": "abc"}, "files": ["a.md"]}`、標準エラーが空'
        exception: '-'
      - name: test_run_changed_when_commit_missing
        case: 正常
        summary: 起点を切り替えた旨を出す
        condition: '`find_changed` が `missing_commit="dead"` を持つ結果を返す'
        mock: '`find_changed`（monkeypatch）'
        expected: 0 を返し、標準エラーに `dead` と起点の種類
        exception: '-'
      - name: test_run_changed_when_files_yaml_not_found
        case: 異常
        summary: 管理用の YAML が無い
        condition: '`files_yaml` に無いパス'
        mock: なし（`tmp_path`・`capsys`）
        expected: 2 を返し、標準出力が空で、標準エラーに渡したパス
        exception: なし（終了コード 2・管理用の YAML）
      - name: test_run_changed_when_checkpoint_invalid
        case: 異常
        summary: 壊れた checkpoint
        condition: '`find_changed` が `ValueError("checked_at: ISO 8601 の日時")` を送る'
        mock: '`find_changed`（monkeypatch）'
        expected: 2 を返し、標準出力が空で、標準エラーに `checked_at`
        exception: なし（終了コード 2・checkpoint）
    refs:
      - to: MOD-106-8
        item: functions[find_changed]
        type: references
        when: 呼び出し先の `find_changed` の引数・戻り値を変えるときに、呼び出す側の処理を合わせる。
