id: MOD-127
title: 索引のサーバー / 読み取り API
lead: |-
  読み取り API の分類の構成図・ファイルの並び・決まりを定め、読み取り API のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/features/read/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # NavTab / NavItem / NavAutoCount / ConversionError / GitHubTarget / SearchItem / SearchResult / SourceConfigResponse / DocumentListItem / DocumentListResponse / DocumentValueResponse / DecisionItem / DecisionResponse
  ├─ paths.py      # page_path / find_page / read_target
  ├─ nav.py        # nav_auto_counts / check_nav_filters / nav_warnings
  ├─ search.py     # search_words
  ├─ service.py    # get_source_config / list_documents / get_document / list_decisions / get_decision
  └─ route.py      # build_read_router（/sources の下）
  ```
