notes:
  受け持つこと: |-
    dev-docs の画面のサーバーなどが呼ぶ読み取り API（配信元の一覧と状態・配信元の設定・文書の一覧と取得・検討事項・語での検索・リビジョンの一覧）。
    端末の設定の取得・保存・1 行の追加は端末の設定の入口が持つ。
