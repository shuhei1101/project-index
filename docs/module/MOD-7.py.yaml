functions:
  - name: find_worktree
    title: ワークツリーの解決
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 共通
    role: 読み取り
    summary: パスが配信元のどのワークツリーの中かを返す
    scope: public
    thread_safe: true
    args:
      - name: source
        title: 配信元
        type: ServedSource
        required: true
        passing: positional
        description: 照らす配信元
      - name: path
        title: パス
        type: Path
        required: true
        passing: positional
        description: 正規化したパス（`cwd` か引数 `worktree`）
    returns:
      type: Path | None
      description: 当たったワークツリーの直下。当たらなければ `None`
    process: |-
      1. `path` 自身とその親を深いほうから順に、`worktree_globs` のどれかに `fnmatch` で当たるかを確かめ、最初に当たったパスを返す（glob の `*` は `/` をまたがない）
      2. どれにも当たらなければ `None` を返す
    unit_tests:
      - name: test_find_worktree
        case: 正常
        summary: ワークツリーの中のフォルダ
        condition: '`worktree_globs: [/r/.claude/worktrees/*]`、`/r/.claude/worktrees/x/docs`'
        mock: なし
        expected: '`Path("/r/.claude/worktrees/x")`'
      - name: test_find_worktree_when_outside_repo
        case: 正常
        summary: リポジトリの外のワークツリー
        condition: '`worktree_globs` に `/repo/aituber-develop`、`/repo/aituber-develop/src`'
        mock: なし
        expected: '`Path("/repo/aituber-develop")`'
      - name: test_find_worktree_when_clone
        case: 正常
        summary: クローン本体
        condition: '`/r/docs`'
        mock: なし
        expected: '`None`'
  - name: access_of
    title: 権限の判定
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 共通
    role: 読み取り
    summary: 作業場所から配信元への権限を決める
    scope: public
    thread_safe: true
    args:
      - name: source
        title: 配信元
        type: ServedSource
        required: true
        passing: positional
        description: 照らす配信元
      - name: cwd
        title: 作業場所
        type: Path | None
        required: true
        passing: positional
        description: 正規化した作業場所
    returns:
      type: AccessLevel | None
      description: '`write`・`read`、どちらにも当たらなければ `None`'
    process: |-
      1. `cwd` が `None` の場合、`None` を返す
      2. `cwd` が配信元のワークツリーの中なら（ワークツリーの解決）、照らすパスを `config_root`（設定ファイルのフォルダ）に置き換える
      3. `scope_write` のどれかに当たれば `write`、`scope_read` のどれかに当たれば `read`、どちらにも当たらなければ `None` を返す（globの照合）
    unit_tests:
      - name: test_access_of_when_write
        case: 正常
        summary: 読み書き
        condition: '`scope_write: [/r]`、`cwd` が `/r`'
        mock: なし
        expected: '`write`'
      - name: test_access_of_when_read
        case: 正常
        summary: 読み取りだけ
        condition: '`scope_read: [/a/**]`、`cwd` が `/a/b`'
        mock: なし
        expected: '`read`'
      - name: test_access_of_when_worktree
        case: 正常
        summary: ワークツリーは配信元のフォルダとみなす
        condition: '`scope_write: [/r]`、`cwd` が `/r/.claude/worktrees/x`'
        mock: なし
        expected: '`write`'
      - name: test_access_of_when_none
        case: 正常
        summary: 当たらない
        condition: '`cwd` が `/other`、または `None`'
        mock: なし
        expected: '`None`'
  - name: current_source
    title: 作業中の配信元
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 共通
    role: 読み取り
    summary: 作業場所を含む配信元のうち、直下が一番深いものを返す
    scope: public
    thread_safe: true
    args:
      - name: sources
        title: 配信中の配信元
        type: Sequence[ServedSource]
        required: true
        passing: positional
        description: 配信元の一覧.配信中
      - name: cwd
        title: 作業場所
        type: Path | None
        required: true
        passing: positional
        description: 正規化した作業場所
    returns:
      type: tuple[ServedSource, Path | None] | None
      description: 作業中の配信元と、`cwd` が入っているワークツリー。無ければ `None`
    process: |-
      1. `cwd` が `None` なら `None` を返す
      2. 配信元ごとに、`cwd` がワークツリーの中ならそのワークツリーを、そうでなければ `config_root`（設定ファイルのフォルダ）を候補にし、候補が `cwd` 自身かその親なら配信元を拾う
      3. 拾った配信元のうち候補のパスが一番深い（部品の数が多い）ものを返す。同じ深さは `sources` の先のもの
    unit_tests:
      - name: test_current_source
        case: 正常
        summary: 一番深い配信元
        condition: '`root` が `/r` の a と `/r/tmp/ws` の b、`cwd` が `/r/tmp/ws/x`'
        mock: なし
        expected: b と `None`
      - name: test_current_source_when_worktree
        case: 正常
        summary: ワークツリーの中
        condition: a のワークツリー `/r/.claude/worktrees/x` の中の `cwd`
        mock: なし
        expected: a と `Path("/r/.claude/worktrees/x")`
      - name: test_current_source_when_none
        case: 正常
        summary: どの配信元の中でもない
        condition: '`cwd` が `/other`'
        mock: なし
        expected: '`None`'
      - name: test_current_source_when_paths_base_set
        case: 正常
        summary: 基準のフォルダが上でも設定ファイルのフォルダで判定する
        condition: 配信元 brain（`root` が repo の直下、`config_dir` が `content/node-docs/brain`）と配信元 repo（`root` が repo の直下）、`cwd` が repo の直下
        mock: なし
        expected: repo を返す（brain の候補は `content/node-docs/brain` で、`cwd` の親でない）
  - name: available_sources
    title: 使える配信元
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 共通
    role: 読み取り
    summary: 作業場所から使える配信元と権限を並べる
    scope: public
    thread_safe: true
    args:
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: cwd
        title: 作業場所
        type: str | None
        required: true
        passing: positional
        description: MCP の引数 `cwd`
    returns:
      type: list[SourceAccess]
      description: '`sources[]` の順。使える配信元が無ければ空'
    process: |-
      1. `cwd` を正規化する（パスの正規化）
      2. 配信中の配信元ごとに権限を決め（権限の判定）、`None` でないものを `SourceAccess` にする。`current` は作業中の配信元か（作業中の配信元）。`description`・`when` は配信元の設定の値
    unit_tests:
      - name: test_available_sources
        case: 正常
        summary: 権限と作業中を付ける
        condition: sample（`cwd` を `scope.write` に含む・`root` が `cwd`）と notes（`scope.read` だけ）と other（当たらない）
        mock: 配信元の一覧（3 つを返す偽物）
        expected: '`[sample write current, notes read]`'
      - name: test_available_sources_when_no_cwd
        case: 正常
        summary: 作業場所が無い
        condition: '`cwd` が `None`'
        mock: 配信元の一覧（偽物）
        expected: 空
  - name: outside_readable_sources
    title: 作業範囲の外で読める配信元
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 配信元を調べる
    role: 読み取り
    summary: 作業場所の `scope` に当たらず、`outside_read` が真の配信元を並べる
    scope: public
    thread_safe: true
    args:
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: cwd
        title: 作業場所
        type: str | None
        required: true
        passing: positional
        description: MCP の引数 `cwd`
    returns:
      type: list[ServedSource]
      description: '`sources[]` の順。当たる配信元が無ければ空'
    process: |-
      1. `cwd` を正規化する（パスの正規化）
      2. 配信中の配信元のうち、権限が `None`（権限の判定）で `outside_read` が真のものを並べる
    unit_tests:
      - name: test_outside_readable_sources
        case: 正常
        summary: scope に当たらず outside_read が真の配信元だけを並べる
        condition: 'sample（`cwd` を `scope.write` に含む）・notes（`scope.read` だけ）・other（当たらない・`outside_read: true`）・closed（当たらない・`outside_read: false`）'
        mock: 配信元の一覧（4 つを返す偽物）
        expected: '`[other]`'
      - name: test_outside_readable_sources_when_no_cwd
        case: 正常
        summary: 作業場所が無い
        condition: '`cwd` が `None`、other（`outside_read: true`）'
        mock: 配信元の一覧（偽物）
        expected: '`[other]`（どの `scope` にも当たらない）'
  - name: describe_workplace
    title: 作業場所の説明
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 配信元を調べる
    role: 読み取り
    summary: 作業場所がどの配信元のクローン本体かワークツリーかを返す
    scope: public
    thread_safe: true
    args:
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: cwd
        title: 作業場所
        type: str | None
        required: true
        passing: positional
        description: MCP の引数 `cwd`
    returns:
      type: Workplace
      description: 作業場所
    process: 1. `cwd` を正規化し、作業中の配信元とワークツリーを引いて（作業中の配信元）`Workplace` にする
    unit_tests:
      - name: test_describe_workplace
        case: 正常
        summary: ワークツリーの中
        condition: sample のワークツリーの中の `cwd`
        mock: 配信元の一覧（偽物）
        expected: '`source_id` が sample、`worktree` がそのワークツリー'
  - name: resolve_read_targets
    title: 読む場所の解決
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 共通
    role: 読み取り
    summary: MCP の `source`・`ref`・`worktree`・`cwd` から、読む配信元ごとの場所を解く
    scope: public
    thread_safe: true
    args:
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: source
        title: 配信元
        type: str | list[str] | None
        required: false
        default: None
        passing: keyword
        description: 配信元の ID・ID の配列・`*`。`None` は作業中の配信元
      - name: ref
        title: リビジョン
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 読むリビジョン
      - name: worktree
        title: ワークツリー
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 読むワークツリーのパス
      - name: cwd
        title: 作業場所
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 作業場所
      - name: outside_scope
        title: 作業範囲の外も読むか
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: '`True` のとき、`source` が ID 1 つで権限の無い配信元を、`outside_read` が真なら読む'
    returns:
      type: list[Target]
      description: 読む配信元ごとの場所（`source` の順、`*` は `sources[]` の順）
    process: |-
      1. `cwd` を正規化する
      2. 読む配信元を決める
         - `None` の場合、作業中の配信元にする。無ければ使える配信元を添えた `SourceNotReadableError` を送る
         - `*` の場合、権限のある配信中の配信元を全てにする（権限の無い配信元は黙って外す）
         - ID か配列の場合、それぞれを引き（配信元の一覧.引く。`UnknownSourceError`・`SourceNotServedError` はそのまま伝える）、権限が無ければ `SourceNotReadableError` を送る
         - ID 1 つで権限が無く、`outside_scope` が `True` で配信元の `outside_read` が真の場合、断らずに `access` を `read`、`outside_scope` を `True` にした場所にし、`[info]` 作業範囲の外を読んだ（`cwd`・配信元の ID）を要求のログに書く
         - `SourceNotReadableError` の `fix` は、ID 1 つの配信元の `outside_read` が真で `outside_scope` を渡していないときだけ、`outside_scope: true` で作業範囲の外（参考）として読めることを案内する
      3. 配信元が 2 つ以上で `ref` か `worktree` を渡された場合、`InvalidArgumentError` を送る
      4. 配信元ごとに場所を決める
         - `worktree` を渡された場合、そのパスがワークツリーに当たらなければ `WorktreeNotMatchedError` を送る。当たればそのワークツリーを `ref` なしで読む
         - `ref` を渡された場合、Git の管理外の配信元なら `InvalidArgumentError` を送る。そうでなければ `root` をその `ref` で読む
         - どちらも無く、`cwd` が配信元のワークツリーの中の場合、そのワークツリーを `ref` なしで読む
         - どちらも無く、作業中の配信元か Git の管理外の配信元の場合、`root` を `ref` なしで読む
         - それ以外は `root` を `default_ref` で読む
      5. `ref` で読む場所は、`ref` を履歴の『リビジョンの解決』（`date_base` は配信元の `default_ref`）で 1 回だけ解き、解いた commit を `Target.commit` に持たせる。ブランチ名の `ref` も要求ごとに解き直し、要求をまたいで commit を控えない
      6. `Target` の並びを返す
    exceptions:
      - name: SourceNotReadableError
        condition: '`cwd` が配信元の `scope` に当たらない（`outside_scope` が `True` のときは、加えて `outside_read` が偽か `source` が ID 1 つでない）、または `source` を省いて作業中の配信元が無い'
        message: '`{id} はこの作業場所（{cwd}）から参照できません`'
        notes: '`available` に使える配信元、`next_steps` に `describe()` で使える配信元を見ること'
      - name: WorktreeNotMatchedError
        condition: '`worktree` が配信元の `worktrees` に当たらない'
        message: '`{worktree} は {id} のワークツリーに該当しません`'
      - name: InvalidArgumentError
        condition: 複数の配信元に `ref`・`worktree` を渡した、または Git の管理外の配信元に `ref` を渡した
        message: '`ref は 1 つの Git の配信元を指すときだけ指定できます`'
      - name: RefNotFoundError
        condition: '`ref`（渡されなければ `default_ref`）を commit に解けない'
        message: 履歴の『リビジョンの解決』のまま
    unit_tests:
      - name: test_resolve_read_targets
        case: 正常
        summary: 作業中の配信元は作業ツリーを読む
        condition: '`source` なし、`cwd` が sample のクローン本体'
        mock: 配信元の一覧（偽物）
        expected: sample の `Target` で `ref` が `None`、`base` が `root`
      - name: test_resolve_read_targets_when_other_source
        case: 正常
        summary: 作業中でない Git の配信元は既定のリビジョン
        condition: '`source: notes`（Git、`default_ref: develop`、`cwd` は `scope.read` に当たる）'
        mock: 配信元の一覧（偽物）、履歴の『リビジョンの解決』（`develop` を固定の commit に解く偽物）
        expected: '`ref` が `develop`、`commit` が偽物の解いた commit で、リビジョンの解決が 1 回だけ呼ばれる'
      - name: test_resolve_read_targets_when_worktree_cwd
        case: 正常
        summary: ワークツリーの中から読む
        condition: '`cwd` が sample のワークツリー `/r/.claude/worktrees/x`、`root` が `/r/docs-src`、`repo_root` が `/r`'
        mock: 配信元の一覧（偽物）
        expected: '`base` が `/r/.claude/worktrees/x/docs-src`、`worktree` が `/r/.claude/worktrees/x`'
      - name: test_resolve_read_targets_when_all
        case: 正常
        summary: '`*` は読める配信元だけ'
        condition: '`source: "*"`、配信元 3 つのうち 2 つに権限'
        mock: 配信元の一覧（偽物）
        expected: 2 つの `Target`
      - name: test_resolve_read_targets_when_not_readable
        case: 異常
        summary: 権限が無い
        condition: '`source: other`、`cwd` が other の `scope` に当たらない'
        mock: 配信元の一覧（偽物）
        expected: '`SourceNotReadableError` の `available` に使える配信元'
        exception: '`scope` に当たらない'
      - name: test_resolve_read_targets_when_worktree_not_matched
        case: 異常
        summary: ワークツリーに当たらない
        condition: '`worktree: /tmp/x`'
        mock: 配信元の一覧（偽物）
        expected: '`WorktreeNotMatchedError` の `patterns` に `worktree_globs`'
        exception: '`worktrees` に当たらない'
      - name: test_resolve_read_targets_when_ref_on_folder
        case: 異常
        summary: Git の管理外に ref
        condition: 'Git の管理外の notes に `ref: main`'
        mock: 配信元の一覧（偽物）
        expected: '`InvalidArgumentError` の違反のパスが `ref`'
        exception: Git の管理外の配信元に `ref`
      - name: test_resolve_read_targets_when_outside_scope
        case: 正常
        summary: 作業範囲の外を参考に読む
        condition: '`source: other`、`outside_scope: true`、`cwd` が other の `scope` に当たらず、other の `outside_read` が `True`'
        mock: 配信元の一覧（偽物）
        expected: other の `Target` で `outside_scope` が `True`、`access` が `read`。`[info]` のログに `cwd` と `other`
        exception: '-'
      - name: test_resolve_read_targets_when_outside_scope_in_scope
        case: 正常
        summary: scope に当たる配信元には付けない
        condition: '`source: sample`、`outside_scope: true`、`cwd` が sample のクローン本体'
        mock: 配信元の一覧（偽物）
        expected: '`outside_scope` が `False`、ログを書かない'
        exception: '-'
      - name: test_resolve_read_targets_when_outside_scope_all
        case: 正常
        summary: '`*` には効かない'
        condition: '`source: "*"`、`outside_scope: true`、other は `scope` に当たらない'
        mock: 配信元の一覧（偽物）
        expected: other の `Target` を含まない
        exception: '-'
      - name: test_resolve_read_targets_when_ref_not_found
        case: 異常
        summary: 解けない ref
        condition: '`source: notes`（Git）、`ref: nope`'
        mock: 配信元の一覧（偽物）、履歴の『リビジョンの解決』（`RefNotFoundError` を送る偽物）
        expected: '`RefNotFoundError` をそのまま伝える'
        exception: '`ref` を commit に解けない'
      - name: test_resolve_read_targets_when_outside_read_disabled
        case: 異常
        summary: 外から読むのを断る配信元
        condition: '`source: other`、`outside_scope: true`、other の `outside_read` が `False`'
        mock: 配信元の一覧（偽物）
        expected: '`SourceNotReadableError` で、`fix` が `outside_scope` を案内しない'
        exception: '`scope` に当たらない'
      - name: test_resolve_read_targets_when_not_readable_guides_outside
        case: 異常
        summary: 外から読めることを案内する
        condition: '`source: other`、`outside_scope` なし、other の `outside_read` が `True`'
        mock: 配信元の一覧（偽物）
        expected: '`SourceNotReadableError` の `fix` に `outside_scope: true`'
        exception: '`scope` に当たらない'
  - name: resolve_write_target
    title: 書く場所の解決
    kind: 関数
    container: project_index/features/access/service.py
    usecase: 書き込む
    role: 読み取り
    summary: MCP の `source`・`worktree`・`cwd` から、書き込む場所を解く
    scope: public
    thread_safe: true
    args:
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: source
        title: 配信元
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 配信元の ID。`None` は作業中の配信元
      - name: worktree
        title: ワークツリー
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 書き込むワークツリーのパス
      - name: cwd
        title: 作業場所
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 作業場所
    returns:
      type: Target
      description: 書き込む場所（`ref` は常に `None`、`access` は `write`。ワークツリーへ書くときの `source` はそのワークツリーの設定で読み直した配信元）
    process: |-
      1. `cwd` を正規化し、配信元を決める。`None` なら作業中の配信元、無ければ使える配信元を添えた `SourceNotWritableError` を送る
      2. 権限が `write` でなければ、使える配信元を添えた `SourceNotWritableError` を送る
      3. 書くワークツリーを決める
         - `worktree` を渡された場合、当たらなければ `WorktreeNotMatchedError` を送る
         - 渡されず、`cwd` がワークツリーの中ならそのワークツリー
      4. ワークツリーが無く、配信元が Git の配信元の場合、`clone` にクローン本体（`main_root`、無ければ `repo_root`）を入れた `TargetIsCloneError` を送る
      5. ワークツリーへ書く場合、配信元をワークツリーの設定で読み直す（作業場所の配信元の読み込み）。検証に通らなければ `ValidationFailedError` を送る
      6. Git の管理外は登録済みの配信元と `root`、ワークツリーは読み直した配信元とその `base` を `Target` にして返す
    exceptions:
      - name: SourceNotWritableError
        condition: '`cwd` が配信元の `scope.write` に当たらない'
        message: '`{id} にはこの作業場所（{cwd}）から書き込めません`'
      - name: WorktreeNotMatchedError
        condition: '`worktree` が配信元の `worktrees` に当たらない'
        message: '`{worktree} は {id} のワークツリーに該当しません`'
      - name: TargetIsCloneError
        condition: Git の配信元で、書く先がクローン本体になる
        message: '`{clone} はクローン本体です。worktree でワークツリーを指してください`'
      - name: ValidationFailedError
        condition: ワークツリーの配信元の設定が検証に通らない
        message: 作業場所の配信元の読み込みの `ValidationFailedError` をそのまま送る
    unit_tests:
      - name: test_resolve_write_target
        case: 正常
        summary: ワークツリーへ書く
        condition: '`cwd` が sample のワークツリーの中で `scope.write` に当たる'
        mock: 配信元の一覧（偽物）・作業場所の配信元の読み込み（受け取った配信元を返す偽物）
        expected: '`worktree` がそのワークツリー、`access` が `write`'
      - name: test_resolve_write_target_when_folder
        case: 正常
        summary: Git の管理外はフォルダへ書く
        condition: Git の管理外の notes、`cwd` が `scope.write` に当たる
        mock: 配信元の一覧（偽物）
        expected: '`base` が notes の `root`、`worktree` が `None`'
      - name: test_resolve_write_target_when_read_only
        case: 異常
        summary: 読み取りだけ
        condition: '`cwd` が `scope.read` だけに当たる'
        mock: 配信元の一覧（偽物）
        expected: '`SourceNotWritableError` の `available` にその配信元が `read` で載る'
        exception: '`scope.write` に当たらない'
      - name: test_resolve_write_target_when_clone
        case: 異常
        summary: クローン本体へは書かない
        condition: '`cwd` が sample のクローン本体で `worktree` なし'
        mock: 配信元の一覧（偽物）
        expected: '`TargetIsCloneError` の `clone` が `repo_root`'
        exception: 書く先がクローン本体
      - name: test_resolve_write_target_when_clone_and_config_in_worktree
        case: 異常
        summary: 設定をワークツリーから読む配信元でも、クローン本体のパスを返す
        condition: sample の `repo_root` がワークツリー y、`main_root` がクローン本体で、`cwd` がクローン本体で `worktree` なし
        mock: 配信元の一覧（偽物）
        expected: '`TargetIsCloneError` の `clone` が `main_root` で、ワークツリー y ではない'
        exception: 書く先がクローン本体
      - name: test_resolve_write_target_when_worktree_config
        case: 正常
        summary: ワークツリーの設定で読み直した配信元を使う
        condition: '`worktree` に sample のワークツリーを指定する'
        mock: 配信元の一覧（偽物）・作業場所の配信元の読み込み（ワークツリーの設定の配信元を返す偽物）
        expected: '`source` が作業場所の配信元の読み込みの返した配信元そのもので、作業場所の配信元の読み込みが sample とそのワークツリーで 1 回呼ばれる'
      - name: test_resolve_write_target_when_folder_not_reloaded
        case: 正常
        summary: Git の管理外は読み直さない
        condition: Git の管理外の notes、`cwd` が `scope.write` に当たる
        mock: 配信元の一覧（偽物）・作業場所の配信元の読み込み（呼ばれたら失敗する偽物）
        expected: '`source` が登録済みの notes のまま、作業場所の配信元の読み込みが呼ばれない'
      - name: test_resolve_write_target_when_worktree_config_invalid
        case: 異常
        summary: ワークツリーの設定が検証に通らない
        condition: '`worktree` に sample のワークツリーを指定し、ワークツリーの設定が検証に通らない'
        mock: 配信元の一覧（偽物）・作業場所の配信元の読み込み（`ValidationFailedError` を送る偽物）
        expected: '`ValidationFailedError` がそのまま送られる'
        exception: ワークツリーの設定が検証に通らない
