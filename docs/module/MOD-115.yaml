id: MOD-115
title: 索引のサーバー / 検査
lead: |-
  文書を種類のスキーマ・`ids.format`・`related.types`・`validators[]` で検査し、違反を返却する検査の分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
tags:
  - name: action:検査
    main: true
  - name: topic:スキーマ
  - name: tool:jsonschema
directory: |-
  ```text
  src/project_index/features/validation/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ rules.py      # check_schema / check_id_format / check_related
  ├─ scripts.py    # parse_validator_output（validators[] の出力の解釈）
  └─ service.py    # DocumentChecker（検査をまとめて通す・読み取りの結果のキャッシュ）
  ```
