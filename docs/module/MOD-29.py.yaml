      - name: get
        title: ID で引く
        summary: ID の並びの順に文書を返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: ids
            title: 文書の ID
            type: Sequence[str]
            required: true
            passing: positional
            description: 引く ID の並び
          - name: kinds
            title: 種類
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 絞る文書の行の ID
        returns:
          type: list[Document]
          description: '`ids` の順の文書（同じ ID を 2 回渡すと 2 回返す）'
        process: |-
          1. `load` で文書を集め、ID → 文書の辞書を作る
          2. `ids` の順に引く
          3. 無い ID がある場合、ID ごとに `difflib.get_close_matches`（`n=CANDIDATE_COUNT`、`cutoff=CANDIDATE_CUTOFF`）で近い ID を引き、`DocumentNotFoundError` を送る
          4. 文書の並びを返す
        exceptions:
          - name: DocumentNotFoundError
            condition: 無い ID がある
            message: '`{source}: 文書 {missing} はありません`。`candidates` に無い ID ごとの近い ID'
          - name: UnknownKindError
            condition: '`kinds` に無い種類がある'
            message: '`load` のまま'
        unit_tests:
          - name: test_document_store_get
            case: 正常
            summary: 渡した順
            condition: '`a`・`b` があり、`["b", "a"]`'
            mock: なし（`tmp_path`）
            expected: '`b`・`a` の順'
            exception: '-'
          - name: test_document_store_get_when_missing
            case: 異常
            summary: 無い ID と近い候補
            condition: '`rule-auth` があり、`["rule-auht", "zzz"]`'
            mock: なし（`tmp_path`）
            expected: '`DocumentNotFoundError` の `missing` が 2 件、`candidates["rule-auht"]` が `["rule-auth"]`、`candidates["zzz"]` が空'
            exception: 無い ID がある
      - name: schema
        title: 種類のスキーマ
        summary: 読む場所に合わせた種類のスキーマを返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: kind
            title: 種類
            type: str
            required: true
            passing: positional
            description: 文書の行の ID
        returns:
          type: dict[str, Any]
          description: JSON Schema
        process: |-
          1. `source.table(kind)` で行を引く
          2. `target.ref` と `target.worktree` がどちらも `None` の場合と、行の `schema_path` が `SchemaRef` の場合、起動時のスキーマを返す（読む場所によらず参照したリビジョンのスキーマ）。起動時のスキーマは `target.source`（ワークツリーでは、ワークツリーの設定で作り直した配信元）が設定を読んだときに解いたスキーマ。`$ref` を解いた起動時のスキーマは `_startup_schemas` に (配信元の ID, 行の ID, 行の定義のハッシュ) でキャッシュし、呼ぶたびに解き直さない。解き始めたときの `_generation` と解き終えたときの `_generation` が違う（その間に `clear` された）場合は、結果を返すがキャッシュしない
          3. `target.ref` がある場合、`repo_root`・読む場所の commit（`load` と同じ）・スキーマのファイル（設定ファイルのフォルダからの相対パスを `source.config_path` で `root` からにしたもの）の `repo_root` からの相対パスで `_revision_schemas` を引き、当たればそのまま返す（リビジョンの書き出しとファイルの `stat` をしない）。
             当たらなければ、`load` と同じ読むフォルダの `source.config_path(schema_path)` を『YAMLの読み込み』で読み、`$ref` を解いた結果を `_revision_schemas` にキャッシュする
             - ファイルが無い・読めない場合、手順 2 のスキーマを使い、キャッシュしない
          4. ワークツリーの場合、読むフォルダの `source.config_path(schema_path)` を `_schemas` から引き、更新日時か大きさが違えば『YAMLの読み込み』で再読み込みする
             - ファイルが無い・読めない場合、手順 2 のスキーマを使う
          5. `$ref` を解いたスキーマを返す（スキーマの参照の解決。基準は手順 2〜4 で使った `schema_path`）。ワークツリーで解いた結果は `_schemas` にキャッシュする
        exceptions:
          - name: UnknownKindError
            condition: '`kind` が有効な文書の行に無い'
            message: 配信元の『文書の行を引く』のまま
        unit_tests:
          - name: test_document_store_schema_when_worktree
            case: 正常
            summary: ワークツリーのスキーマ
            condition: ワークツリーで `schemas/rule.schema.yaml` の `required` を書き換えた
            mock: なし（`tmp_path`）
            expected: 書き換えたスキーマを返し、クローン本体では起動時のスキーマを返す
            exception: '-'
          - name: test_document_store_schema_when_ref
            case: 正常
            summary: '`$ref` を解いて返す'
            condition: '`schemas/rule.schema.yaml` の `properties.body` が `共通.schema.yaml#/$defs/markdown`'
            mock: なし（`tmp_path`）
            expected: '`properties.body` が `$ref` を持たず `markdown` の中身'
            exception: '-'
          - name: test_document_store_schema_when_revision
            case: 正常
            summary: リビジョンのスキーマは commit でキャッシュする
            condition: Git の配信元で `schemas/rule.schema.yaml` を commit した後、作業ツリーで `required` を書き換え、`commit` に最初の commit を持つ読む場所で 2 回呼ぶ
            mock: '`snapshots.checkout`（本物を包んで呼ばれた回数を記録する）'
            expected: 2 回とも commit した `required` のスキーマを返し、`snapshots.checkout` が 1 回だけ呼ばれる
          - name: test_document_store_schema_when_revision_shared_repo
            case: 正常
            summary: 同じリポジトリで root の違う配信元のスキーマを取り違えない
            condition: 1 つのリポジトリの `docs/` と `dev/` を `root` にした配信元 2 つが、どちらも種類 `rule` を持ち、`schemas/rule.schema.yaml` の `required` が違う。同じ commit を持つ読む場所で、順に `schema` を呼ぶ
            mock: なし（`tmp_path` に `git init`）
            expected: それぞれの配信元の `required` のスキーマを返す
          - name: test_store_schema_when_paths_base_set
            case: 正常
            summary: 基準のフォルダが上でもスキーマは設定ファイルのフォルダから読む
            condition: '`root` が repo の直下、`config_dir` が `content/node-docs/brain` の配信元を、ワークツリーと `ref` の 2 つの読む場所で引く'
            mock: なし（一時フォルダで `git init`）
            expected: どちらも `content/node-docs/brain/note.schema.yaml` の内容のスキーマを返す
          - name: test_document_store_schema_when_startup_cached
            case: 正常
            summary: 起動時のスキーマを解き直さない
            condition: クローン本体を指す読む場所で、`$ref` を持つ種類のスキーマを 2 回引く
            mock: スキーマの参照の解決（本物を包んで呼ばれた回数を記録する）
            expected: スキーマの参照の解決が 1 回だけ呼ばれ、`clear` の後にもう一度呼ばれる
          - name: test_document_store_schema_when_cleared_during_resolve
            case: 正常
            summary: 解いている間に clear されたスキーマは記録しない
            condition: クローン本体を指す読む場所で、起動時のスキーマを解く途中で `clear` を呼ぶようにして、スキーマを 2 回引く
            mock: 起動時のスキーマの解決（本物を包んで、呼ばれた回数を記録し、解いた後に `clear` を呼ぶ）
            expected: 起動時のスキーマの解決が 2 回呼ばれる（1 回目の結果を記録していない）
          - name: test_document_store_schema_when_schema_ref_differs
            case: 正常
            summary: 同じ配信元の ID でも行の定義が違う起動時のスキーマを取り違えない
            condition: '行 `rule` の `schema` が `SchemaRef`（`ref: v1`）で、`schemas[rule]` の `required` が `[a]` の配信元と、同じ ID で `ref: v2`・`required` が `[b]` の配信元を作る。前者のクローン本体を指す読む場所、後者のワークツリーを指す読む場所、前者の読む場所の順に `schema` を呼ぶ'
            mock: なし（`tmp_path`）
            expected: '`required` が `[a]`・`[b]`・`[a]` の順に返る'
            exception: '-'
      - name: row_schema
        title: 文書に当てるスキーマ
        summary: 文書 1 件の内容に当てるスキーマを返す。`records` を持つ行は 1 行のスキーマ
        description: 検査・変換・検索と変更の項目の一覧が、`schema` の代わりに呼ぶ。
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: kind
            title: 種類
            type: str
            required: true
            passing: positional
            description: 文書の行の ID
        returns:
          type: dict[str, Any]
          description: JSON Schema。`records` の行で 1 行のスキーマを取り出せないときは空の辞書
        process: |-
          1. `schema(target, kind)` で種類のスキーマを得る
          2. 行の `records` が `None` の場合、そのまま返す
          3. `records` がある場合、records の行の 1 行のスキーマ（`records_item_schema`）に、種類のスキーマの最上位の `$defs`（あれば）を加えて返す。`None` なら空の辞書を返す
        exceptions:
          - name: UnknownKindError
            condition: '`kind` が有効な文書の行に無い'
            message: '`schema` のまま'
        unit_tests:
          - name: test_document_store_row_schema
            case: 正常
            summary: ファイル 1 つが 1 文書の行はそのまま
            condition: 行 `rules`（`records` なし）
            mock: なし（`tmp_path`）
            expected: '`schema` と同じスキーマ'
          - name: test_document_store_row_schema_when_records
            case: 正常
            summary: records の行は 1 行のスキーマ
            condition: '行 `notes`（`records: files`）の `schema` が `templates/files.schema.yaml` のコピー'
            mock: なし（`tmp_path`）
            expected: '`required` が `[path]` で、`properties` のキーが `files` の `items` と同じで、最上位の `$defs`（`inject_when` の型）のキーを持つスキーマ'
          - name: test_document_store_row_schema_when_records_defs
            case: 正常
            summary: records の行は最上位の $defs を残す
            condition: '行 `notes`（`records: files`）の `schema` が、`$defs` に自分を指す循環する定義 `node` を持ち、`files` の `items` が `$ref` で `node` を指す'
            mock: なし（`tmp_path`）
            expected: 返したスキーマが最上位の `$defs.node` を持ち、残った `#/$defs/node` の参照先がその中にある
          - name: test_document_store_row_schema_when_items_missing
            case: 正常
            summary: 1 行のスキーマを取り出せない
            condition: 行 `notes` の `schema` が `properties.files.items` を持たない
            mock: なし（`tmp_path`）
            expected: 空の辞書
          - name: test_document_store_row_schema_when_many_documents
            case: 正常
            summary: 文書の数だけ呼んでも git を文書の数だけ起動しない
            condition: Git の配信元で行 `rules` の文書 50 件を commit し、`ref` に `develop`、`commit` に解いた commit を持つ読む場所で `load` した後、文書ごとに `row_schema` を呼ぶ
            mock: '`run_git`（本物を包んで呼ばれた回数を記録する）'
            expected: '`row_schema` の 50 回の呼び出しで `run_git` が呼ばれない'
      - name: invalidate
        title: キャッシュを捨てる
        summary: 書き込んだファイルのキャッシュを捨てる
        description: 更新日時の分解能より短い間に同じ大きさで書き換えたときも、書き込みの直後の読み取りで古い内容を返さないように、書き込みが呼ぶ。
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_files` と `_schemas` から該当のキーを削除する'
        args:
          - name: paths
            title: ファイル
            type: Iterable[Path]
            required: true
            passing: positional
            description: 書き込んだ・削除したファイルの絶対パス
        returns:
          type: None
          description: '-'
        process: |-
          1. 渡されたパスごとに `_keys_by_path` から `_files` のキー（全ての文書の行）を取り出して削除する（`_files` 全体はたどらない）
          2. 渡されたパスの `_schemas` のキーを削除する
        unit_tests:
          - name: test_document_store_invalidate
            case: 正常
            summary: 同じ大きさ・同じ更新日時の書き換え
            condition: '`load` の後、`rules/a.yaml` を同じ大きさで書き換えて `os.utime` で更新日時を戻し、`invalidate` してから `load`'
            mock: なし（`tmp_path`）
            expected: 書き換えた内容を返す
            exception: '-'
          - name: test_document_store_invalidate_when_many_worktrees
            case: 正常
            summary: ほかのワークツリーのキャッシュをたどらない
            condition: ワークツリー 30 件（各 1 ファイル）を `load` した後、1 件目のワークツリーの 1 ファイルを `invalidate` してから、要求の記録の範囲（`ExecutionSlots().request`）の中で 1 件目のワークツリーを `load` する
            mock: なし（`tmp_path`）
            expected: 書き換えた内容を返し、記録の `scanned` が 1（1 件目のワークツリーの前回のキーの数。ほかのワークツリーの数によらない）
            exception: '-'
      - name: clear
        title: 全て捨てる
        summary: 全てのキャッシュを捨てる
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_files`・`_schemas`・`_revision_schemas`・`_dates` を空にする（`_revision_files`・`_trees` は残す）'
        returns:
          type: None
          description: '-'
        process: |-
          1. `_files`・`_schemas`・`_revision_schemas`・`_dates`・`_startup_schemas`・`_worktrees` を空にし、`_generation` を 1 つ増やす（起動の『配信元の再読み込み』と『配信元のキャッシュの破棄』が呼ぶ）
          2. `_revision_files`・`_trees` は、commit の blob と文書の行の定義で中身が決まり古くならないので残す
      - name: location
        title: 文書の場所
        summary: 文書のファイルの絶対パスを返す。リビジョンを読んだ文書は返さない
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 文書を読んだ場所
          - name: document
            title: 文書
            type: Document
            required: true
            passing: positional
            description: '`target` から読んだ文書'
        returns:
          type: str | None
          description: 絶対パス。`target.ref` があるときは `None`
        process: |-
          1. `target.ref` がある場合、`None` を返す
          2. 読むフォルダ（`read_root(target)`。ワークツリーはワークツリーの中）と `document.body_path`（無ければ `document.path`）を結んだ絶対パスを文字列で返す
        unit_tests:
          - name: test_document_store_location
            case: 正常
            summary: 作業ツリーと body_file
            condition: '`ref` の無い読む場所で、`path` が `rules/a.yaml` の文書と `body_path` が `src/a.py` の文書'
            mock: なし（`tmp_path`）
            expected: '`{tmp_path}/rules/a.yaml` と `{tmp_path}/src/a.py`'
            exception: '-'
          - name: test_document_store_location_when_worktree
            case: 正常
            summary: ワークツリー
            condition: '`worktree` を持つ読む場所'
            mock: なし
            expected: ワークツリーの中の絶対パス
            exception: '-'
          - name: test_document_store_location_when_ref
            case: 正常
            summary: リビジョン
            condition: '`ref` を持つ読む場所'
            mock: なし
            expected: '`None`'
            exception: '-'
      - name: has_worktree
        title: ワークツリーを読み込んだか
        kind: メソッド
        summary: 読む場所のワークツリーを一度でもたどり終えたかを返す
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: '`worktree` を持つ読む場所'
        returns:
          type: bool
          description: '`target.base` が `_worktrees` にあれば `True`'
        process: 1. `_lock` の中で `target.base` が `_worktrees` にあるかを返す（ファイルの `stat` をしない）
        unit_tests:
          - name: test_document_store_has_worktree
            case: 正常
            summary: 読み込んだ後だけ True
            condition: ワークツリー x を指す読む場所で、`load` の前と後に呼ぶ
            mock: なし（`tmp_path` に `git init` と `git worktree add`）
            expected: 前が `False`、後が `True`。`clear` の後は `False`
      - name: find_page
        title: 文書のページの特定
        summary: 読む場所の文書から、文書のページのパスに該当する文書を返却する
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`load` と同じ'
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読み取りの場所が返したもの
          - name: page
            title: 文書のページのパス
            type: str
            required: true
            passing: positional
            description: 探すパス
          - name: doc_id
            title: 文書の ID
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 文書の取得の `id`
        returns:
          type: Document | None
          description: 該当する文書。無ければ `None`
        process: |-
          1. `load(target)` を呼ぶ
          2. `target.ref` がある場合、`_revision_loads` のその読み込みの文書のページの索引で引く（文書の数によらず辞書を 1〜2 回引くだけにする）
             - `doc_id` がある場合、`file_ids` を (`page`, `doc_id`) で引く
             - 無い場合、`pages` を `page` で引き、無ければ `files` を `page` で引く
          3. `target.ref` が無い場合、`load` の文書をこのファイルの関数『文書のページの特定』（`find_page`）で照合する

          文書のページの索引は、読み込みの結果の文書を行の順にたどり、同じキーでは先に現れた文書を残して作る。規則はこのファイルの関数『文書のページの特定』（`find_page`）と同じ
             - `pages`: このファイルの関数『文書のページのパス』（`page_path`）→ 文書
             - `files`: 文書のファイルのパスと本文のファイルのパス → 文書
             - `file_ids`: (文書のファイルのパスか本文のファイルのパス, 文書の ID) → 文書
        unit_tests:
          - name: test_document_store_find_page
            case: 正常
            summary: 文書のページの特定と同じ文書を返却する
            condition: Git の配信元で `rules/a.yaml`・`files.yaml` の行（`guide.md` を本文に持つ）・`terms.yaml` の行 `term-1`・`term-2` を commit し、`ref` を持つ読む場所と持たない読む場所で、`rules/a`・`rules/a.yaml`・`guide.md`・`terms.yaml` と `doc_id` `term-2`・無いパスを引く
            mock: なし（`tmp_path` に `git init`）
            expected: '`rules/a`・`rules/a.yaml` は `rules/a.yaml` の文書、`guide.md` は `guide.md` を本文に持つ行の文書、`terms.yaml` と `doc_id` `term-2` は `term-2` の文書、無いパスは `None`。`ref` を持つ読む場所と持たない読む場所で同じ文書'
      - name: file_updated
        title: リビジョンのファイルの日時
        summary: Git の配信元で、読む場所のリビジョンでファイルを最後に変えた commit の日時を返却する
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読み取りの場所が返したもの
          - name: path
            title: パス
            type: str
            required: true
            passing: positional
            description: 配信元の直下からのファイルのパス
        returns:
          type: datetime | None
          description: commit の日時。Git の管理外の配信元と、`target.ref` が無く日時を持たないファイルは `None`
        process: |-
          1. ファイルの日時（`_file_dates(target, revision)`。`revision` は `target.ref` があれば `_commit_of(target)`、無ければ `None`）を `path` で引き、あれば `updated` を返却する
          2. 無い場合、`target.ref` があれば、`_commit_of(target)` の commit の日時（履歴の『commit の日時』`commit_date(repo_root, commit)`。commit ごとに git を 1 回だけ呼ぶ）を返却する。`target.ref` が無ければ `None` を返却する

          作業ツリーのファイルを `stat` しない
        unit_tests:
          - name: test_document_store_file_updated_when_ref
            case: 正常
            summary: マージ commit で追加したファイルの日時
            condition: Git の配信元で、ブランチ `feature` に `main` をマージした commit で `rules/m.yaml` を追加し、作業ツリーは `main`。`ref` が `feature` の読む場所で `rules/m.yaml` を引く
            mock: なし（`tmp_path` に `git init`。`GIT_COMMITTER_DATE` を渡す）
            expected: マージ commit の日時
            exception: '-'
          - name: test_document_store_file_updated_when_ref_and_no_dates
            case: 正常
            summary: リビジョンに日時を持たないパス
            condition: 同じ配信元で、`ref` が `feature` の読む場所でリビジョンに無い `rules/none.yaml` を引く
            mock: なし
            expected: '`feature` の commit の日時'
            exception: '-'
          - name: test_document_store_file_updated_when_not_git
            case: 正常
            summary: Git の管理外
            condition: '`is_git` が `False` の配信元で `ref` の無い読む場所'
            mock: なし（`tmp_path`）
            expected: '`None`'
            exception: '-'
constants:
  - name: CANDIDATE_COUNT
    title: 近い ID の候補の数
    container: project_index/features/documents/store.py
    usecase: 共通
    summary: 無い ID ごとに添える近い ID の数の上限
    value: '5'
  - name: TREE_KEEP
    title: キャッシュする commit の blob の数
    container: project_index/features/documents/store.py
    usecase: 共通
    summary: '`_trees` にキャッシュする (`repo_root`, commit) の上限。リビジョンの書き出しの `SNAPSHOT_KEEP` と同じ値にする'
    value: '20'
  - name: CANDIDATE_CUTOFF
    title: 近さの下限
    container: project_index/features/documents/store.py
    usecase: 共通
    summary: 近い ID とみなす `difflib.get_close_matches` の `cutoff`
    value: '0.6'
  - name: WORKTREE_KEEP
    title: 保持するワークツリーの数
    container: project_index/features/documents/store.py
    usecase: 読み取り
    summary: ワークツリーのたどった結果を保持する数。超えたら古く使ったものから捨てる（`TREE_KEEP` と同じ数）
    value: '20'
  - name: REVISION_LOAD_KEEP
    title: 保持するリビジョンの読み込みの数
    container: project_index/features/documents/store.py
    usecase: 共通
    summary: 配信元ごとに保持するリビジョンの読み込みの結果の数。超えたら最も前に使用したものから捨てる。読み取り API のログ（2026-11-20）で 1 つの配信元に 10 分の間に届いた `ref` の種類の最大 3（`ref` を省いた要求を含み、文書の MCP の `default_ref` と同じ commit）に安全率 20% を掛けて切り上げた。ai-monitor の commit 1 つ分の保持で増えるメモリは最大 72MB（tracemalloc の実測）で、最大 288MB
    value: '4'
functions:
  - name: check_sync
    title: メタデータのずれの確かめ
    container: project_index/features/documents/store.py
    usecase: 起動
    role: サービス
    summary: 配信元のクローン本体の文書を読み、`metadata` の列の欠け・管理用の YAML のずれ・当たらない関連・行どうしの同じファイルの重なり・文書の ID の重なり・エイリアスのキーの違反を求める
    description: 起動時と再読み込みのときに呼ぶ。[shuhei1101/dev-docs#4 管理用のプラグインを作る](https://github.com/shuhei1101/dev-docs/issues/4) の `check_project` も呼ばれるたびにこの関数で求め直す。
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
      - name: source
        title: 配信中の配信元
        type: ServedSource
        required: true
        passing: positional
        description: 確かめる配信元
    returns:
      type: SyncReport
      description: ずれの並び（ずれが無ければ空）
    process: |-
      1. `source.root` を `walk_files` で 1 回だけたどり、そのパスを `files` に渡して `Target(source, source.root, None, None, "read")` で文書を集める（文書のストア.文書を集める）
      2. 文書ごとに、その行で metadataの列の欠けを求め、`{行の id}: {文書の id}: {キー}（{列名}）` で `missing_refs` に加える
      3. `records` と `body_file` を持つ行ごとに、行に当たる管理用の YAML（手順 1 のパスを渡したファイルの収集）ごとに、その YAML から作った文書の `body_path` と行と手順 1 のパスと、その行でない有効な行（`others`）と、有効な `records`・`body_file` の行（その行を含む）に当たる管理用の YAML のうち、その YAML のフォルダより深いフォルダにあるもののフォルダ（`nested_dirs`）と、Git が無視するパス（`ignored`）を渡して索引に無いファイルを求め、`{行の id}: {パス}` で `unindexed_files` に加える
         - `ignored` は、`source.is_git` のときだけ手順 3 の前に 1 回だけ無視されているパスの一覧（`ignored_paths(source.root)`）で求める。`is_git` が偽（`storage.type: disk`・Git 管理外）のときと、`None` が返ったときは空にする
      4. 手順 1 の `problems` のうち `reason` が `missing_body_file` のものを `{path}: {detail}` で `missing_body_files` に加える
      5. 手順 1 の文書の ID の集合を 1 回だけ作り、文書ごとに当たらない関連を求めて `{行の id}: {文書の id}: {to}` で `unresolved_related` に加える
      6. 有効な行ごとに、行が文書にするファイルを求め、ファイルごとに行の ID を `documents[]` の順で重なりなく集める。`records` を持たない行は、手順 1 のパスを渡したファイルの収集（`collect_files(source.root, table, files=files)`）で集めたファイル（YAML として読めず文書にならないファイルも含む）。`records`・`body_file` の行は、手順 1 の `documents` と `duplicates` のその行の文書の `body_path`。`body_file` の無い `records` の行は数えない。2 つ以上の行の ID を持つファイルを、パスの昇順に `{ファイル}: {行の id}・{行の id}` で `duplicate_files` に加える
      7. 手順 1 の `duplicates` を `path` の昇順（同じパスは `duplicates` の順）に並べ、除外した文書ごとに手順 1 の `documents` から同じ ID の先の文書を参照する。文書のファイルは `body_path` があれば `body_path`、無ければ `path` とする。2 つの文書の `kind` が違い、ファイルが同じで、そのファイルを手順 6 で `duplicate_files` に数えたときは飛ばし、それ以外は `{文書の id}: {先の文書の kind}（{先の文書のファイル}）・{除外した文書の kind}（{除外した文書のファイル}）` で `duplicate_ids` に加える
      8. 手順 1 の文書でエイリアスの集めをし、`violations` を `alias_violations` にする
      9. `sqlite` を持つ有効な行ごとに、`source.root`・行・行の番号で表と列の確認（`inspect_table`）を呼び、違反と警告を `{行の id}: {理由}` で `sqlite_warnings` に加える
      10. `SyncReport` を返す

      手順 1〜9 は全て、文書のストアの裏の処理の関所（`store.gate`）の裏の処理の 1 件の中で行う。手順 1 の `walk_files` はファイル 1 件ごと、手順 2・5 は文書 1 件ごと、手順 3 は管理用の YAML 1 件ごとに裏の処理の繰り返し（`gate.each`）で回し、`ignored_paths`・手順 6・7・8 はそれぞれ 1 件（`gate.unit`）、手順 9 は行 1 つごとに 1 件にする。関所は入れ子では一番外の 1 件だけが休むため、手順 1〜9 の全体を 1 つの 1 件で包まない。裏の処理のスレッドでなければ関所は何もしない
    unit_tests:
      - name: test_check_sync
        case: 正常
        summary: 3 種のずれ
        condition: '行 `rules` が `metadata: {name: title}` で 2 件中 1 件に `title` が無い。行 `src` の `src/files.yaml` が `a.py`・`c.py` を持ち、`src/` に `a.py`・`d.py` を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`missing_refs` が 1 件（`name` の `title`）、`unindexed_files` が `["src: src/d.py"]`、`missing_body_files` が 1 件（`c.py`）'
        exception: '-'
      - name: test_check_sync_when_clean
        case: 正常
        summary: ずれが無い
        condition: 全ての文書に `title` があり、管理用の YAML とファイルがそろう
        mock: なし
        expected: 4 つの並びが空
        exception: '-'
      - name: test_check_sync_when_alias_violation
        case: 正常
        summary: エイリアスのキーの違反
        condition: '`alias_type: term` の行の文書 1 件の `aliases` が `3`'
        mock: なし（一時フォルダの配信元）
        expected: '`alias_violations` が 1 件で、`doc` がその文書のパス'
        exception: '-'
      - name: test_check_sync_when_walked_once
        case: 正常
        summary: 配信元のフォルダを 1 回だけたどる
        condition: test_check_sync と同じ配信元（行 `rules`・`src`）
        mock: '`walk_files`（本物を包んで呼ばれた回数を記録する）'
        expected: '`walk_files` が 1 回だけ呼ばれ、結果が test_check_sync と同じ'
      - name: test_check_sync_when_related_unresolved
        case: 正常
        summary: どの文書にも該当しない関連
        condition: '行 `src` の `src/files.yaml` が `a.py`（`related: [{to: src/b.py}, {to: src/z.py}, {to: other-doc, source: other}]`）・`b.py` を持ち、`src/a.py`・`src/b.py` を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`unresolved_related` が `["src: src/a.py: src/z.py"]`'
        exception: '-'
      - name: test_check_sync_when_file_belongs_to_other_row
        case: 正常
        summary: ほかの行の文書になるファイルを索引に無いファイルに数えない
        condition: '行 `files`（`paths: [files.yaml]`・`records: files`・`body_file: path`）の直下の `files.yaml` が `src/a.py` を持ち、行 `prompts`（`paths: [content/prompts/**/*.yaml]`）を持つ配信元に、`src/a.py`・`content/prompts/p.yaml` を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`unindexed_files` が空'
        exception: '-'
      - name: test_check_sync_when_rows_share_file
        case: 正常
        summary: 2 つの行が同じファイルを文書にする
        condition: '行 `src`（`paths: [src/files.yaml]`・`records: files`・`body_file: path`）の `src/files.yaml` が `a.yaml`・`b.py` を持ち、行 `yaml`（`paths: [src/*.yaml]`）と `enabled: false` の行 `off`（`paths: [src/b.py]`）を持つ配信元に、`src/a.yaml`（`id: src/a.yaml`）・`src/b.py` を置く。ほかに行 `py`（`paths: [src/c.py]`）を持ち、`src/files.yaml` に `c.py` の行を加え、YAML として読めるが辞書でない `src/c.py`（`a = 1`）を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`duplicate_files` が `["src/a.yaml: src・yaml", "src/c.py: src・py"]` で（行 `py` は `src/c.py` を文書にできないが数える）、`src/b.py`・`src/files.yaml` を含まない（`src/a.yaml` の 2 つの文書は ID が重なる）'
        exception: '-'
      - name: test_check_sync_when_nested_index
        case: 正常
        summary: 深い管理用の YAML の範囲を直下の管理用の YAML で数えない
        condition: '行 `root`（`paths: [files.yaml]`）の直下の `files.yaml` が `README.md` を持ち、行 `src`（`paths: [src/files.yaml]`）の `src/files.yaml` が `a.py` を持つ配信元に、`README.md`・`src/a.py`・`src/b.py` を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`unindexed_files` が `["src: src/b.py"]` だけ（`root:` で始まる行が無い）'
        exception: '-'
      - name: test_check_sync_when_same_row_nested_index
        case: 正常
        summary: 同じ行の深い管理用の YAML の範囲も浅い管理用の YAML で数えない
        condition: '行 `notes`（`paths: [notes/**/files.yaml]`・`records: files`・`body_file: path`）に当たる `notes/files.yaml`（`x.md` を持つ）と `notes/a/files.yaml`（`y.md` を持つ）があり、`notes/x.md`・`notes/a/y.md`・`notes/a/z.md` を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`unindexed_files` が `["notes: notes/a/z.md"]` の 1 件だけ（`notes/files.yaml` の側で `notes/a/` の下を数えない）'
        exception: '-'
      - name: test_check_sync_when_ids_overlap
        case: 正常
        summary: 文書の ID が重なる
        condition: '行 `rules`（`paths: [docs/*.yaml]`）・行 `notes`（`paths: [notes/*.yaml]`）・行 `src`（`paths: [src/files.yaml]`・`records: files`・`body_file: path`。`src/files.yaml` が `a.yaml` を持つ）・行 `yaml`（`paths: [src/a.yaml]`）をこの順に持つ配信元に、`docs/a.yaml`・`docs/b.yaml`・`notes/c.yaml`（どれも `id: a`）と `src/a.yaml`（`id: src/a.yaml`）を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`duplicate_ids` が `["a: rules（docs/a.yaml）・rules（docs/b.yaml）", "a: rules（docs/a.yaml）・notes（notes/c.yaml）"]` で、同じファイルの重なりに数えた `src/a.yaml` を含まない'
        exception: '-'
      - name: test_check_sync_when_git_ignored
        case: 正常
        summary: Git の配信元で Git が無視するファイルを数えない
        condition: '行 `root`（`paths: [files.yaml]`・`records: files`・`body_file: path`）の `files.yaml` が `README.md` を持ち、`.gitignore` が `dist/` と `.pytest_cache/` を無視する Git の配信元（`is_git` が真）に、`README.md`・`dist/app.js`・`.pytest_cache/x`・`docs/new.md` を置く'
        mock: なし（一時フォルダで `git init`）
        expected: '`unindexed_files` が `["root: docs/new.md"]` だけ'
        exception: '-'
      - name: test_check_sync_when_not_git_ignored
        case: 正常
        summary: Git でない配信元では Git が無視するファイルも数える
        condition: test_check_sync_when_git_ignored と同じフォルダを `is_git` が偽の配信元にする
        mock: '`ignored_paths`（呼ばれないことを確かめる）'
        expected: '`unindexed_files` に `root: dist/app.js`・`root: .pytest_cache/x`・`root: docs/new.md` があり、`ignored_paths` を呼ばない'
        exception: '-'
      - name: test_check_sync_when_background
        case: 正常
        summary: 裏の処理のスレッドでは、読み込みの外の処理も休みを挟んで進む
        condition: 文書 3 件の配信元を、関所の `foreground` の中で、別のスレッドの `background` の中で検査する。関所の 1 件の中にいない間に文書の重なりを求める処理が呼ばれたかを記録する
        mock: 関所の休み（偽物。呼ばれた回数を数える）、`missing_ref_fields`・`unresolved_related`（呼ばれたときに関所の 1 件の中かを記録してから本物を呼ぶ包み）
        expected: 結果が関所を使わないときと同じで、包みの呼び出しが全て 1 件の中。休みが文書の数より多く呼ばれる
      - name: test_check_sync_when_sqlite
        case: 正常
        summary: SQLite の行の開けないファイルと上限の超過を警告にする
        condition: '`limit: 1` で 2 行の行 `notes_db` と、ファイルの無い行 `missing_db`'
        mock: なし（一時フォルダの配信元）
        expected: '`sqlite_warnings` が 2 件で、`missing_db: ` で始まる開けない理由と、`notes_db: ` で始まる配信しない行の数 1'
  - name: page_path
    title: 文書のページのパス
    kind: 関数
    container: project_index/features/documents/store.py
    usecase: 文書の取得
    role: 変換
    summary: 文書を URL のパスにする（読み取り API の語での検索・サイドバーも使用する）
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 文書
    returns:
      type: str
      description: '`path` から拡張子を落とした形。`records` の文書は `{拡張子を落とした path}/{id}`'
    process: 1. `PurePosixPath(path).with_suffix("")` にし、`record_index` があれば `/{id}` を続ける
    unit_tests:
      - name: test_page_path
        case: 正常
        summary: ファイルと records
        condition: '`docs/a.yaml` の文書と、`docs/rules.yaml` の `records` の `r-1`'
        mock: なし
        expected: '`docs/a` と `docs/rules/r-1`'
  - name: find_page
    title: 文書のページの特定
    kind: 関数
    container: project_index/features/documents/store.py
    usecase: 文書の取得
    role: 判定
    summary: 文書の並びから、文書のページのパスに当たる文書を探す
    scope: public
    thread_safe: true
    args:
      - name: documents
        title: 文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: 配信元の文書
      - name: page
        title: 文書のページのパス
        type: str
        required: true
        passing: positional
        description: 探すパス
      - name: doc_id
        title: 文書の ID
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 文書の取得の `id`。指すと、`path` か `body_path` が `page` と同じ文書の中から文書の ID で選ぶ
    returns:
      type: Document | None
      description: 無ければ `None`
    process: |-
      1. `doc_id` を指した場合、`path` か `body_path` が `page` と同じで、文書の ID が `doc_id` と同じ最初の文書を返し、無ければ `None` を返す（以降の手順は実行しない）
      2. 文書のページのパス（`page_path`）が `page` と同じ文書を返す
      3. 無ければ、`path` か `body_path` が `page` と同じ最初の文書を返す（`try_convert` と同じ引き方）
      4. どちらにも無ければ `None` を返す
    unit_tests:
      - name: test_find_page
        case: 正常
        summary: 文書のページのパスで当たる
        condition: 文書のページのパスが `rules/a` の文書と `page` が `rules/a`
        mock: なし
        expected: その文書
      - name: test_find_page_when_body_path
        case: 正常
        summary: 本文のファイルのパスで当たる
        condition: '`path` が `notes/files.yaml`・`body_path` が `notes/b.md` の管理用の YAML の行の文書と `page` が `notes/b.md`'
        mock: なし
        expected: その文書
      - name: test_find_page_when_missing
        case: 正常
        summary: どれにも当たらない
        condition: '`page` が `no/such`'
        mock: なし
        expected: '`None`'
      - name: test_find_page_when_doc_id
        case: 正常
        summary: 文書の ID で行の文書を選ぶ
        condition: '`path` が `terms.yaml` で `body_path` の無い行の文書 `term-1`・`term-2` と、`page` が `terms.yaml`・`doc_id` が `term-2`'
        mock: なし
        expected: '`term-2` の文書。`doc_id` を省くと `term-1`'
      - name: test_find_page_when_doc_id_missing
        case: 正常
        summary: 文書の ID が一致しない
        condition: '`page` が `terms.yaml`・`doc_id` が `no-such`、`page` が `terms/term-2`（文書のページのパス）・`doc_id` が `term-2`'
        mock: なし
        expected: どちらも `None`
visibility: internal
notes:
  SQLite の表の行: '`documents[].sqlite` を持つ行はファイルを集めず、読む場所によらず配信元の `_sqlite_rows` の `rows`（配信元のフォルダはクローン本体）を呼んで文書を加える。リビジョンやワークツリーの結果のキャッシュには SQLite の行の文書を含めず、返すたびに `rows` の結果をつなぐ。`rows` の `warnings` は、1 件ずつ `path` が `sqlite.file`・`reason` が `unreadable`・`detail` が `{行の id}: {警告}` の `LoadProblem` にして `problems` に加える。`schema`・`row_schema` は `sqlite` を持つ行に `columns_schema` の結果を返す'
