classes:
  - name: DocumentStore
    title: 文書のストア
    container: project_index/features/documents/store.py
    usecase: 共通
    role: キャッシュ
    summary: 読む場所（`Target`）ごとに文書を集め、ファイルごとに結果をキャッシュする
    description: |-
      キャッシュのキーはファイルの絶対パス・文書の行の ID・文書の行の定義のハッシュ。更新日時（`st_mtime_ns`）と大きさが変わったファイルだけを再読み込みする。
      `ref` を持つ読む場所は、ファイルの blob の SHA と日時をキーの照合に使い、commit をまたいで変わらないファイルの結果を使い回す（`_revision_files`）。
      ワークツリーの設定で文書の行（`metadata`・`schema` など）が変わったときは、行の定義のハッシュが変わるので、`clear` を通らずに前の行で読んだ結果を使わない。行の定義のハッシュは `_table_hash`（`DocumentTable` の全ての項目の `repr` の SHA-256）。
    kind: クラス
    properties:
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        access: 公開
        description: '`ref` のある `Target` を読むときに使う'
      - name: _files
        title: ファイルのキャッシュ
        type: dict[tuple[Path, str, str], tuple[int, int, list[Document], list[LoadProblem], tuple[tuple[str, int, int], ...]]]
        access: 内部 (_)
        description: (絶対パス, 文書の行の ID, 文書の行の定義のハッシュ) → (更新日時, 大きさ, 文書, 理由, 文書が指す本文のファイルの (パス, 更新日時, 大きさ) のパスの順の並び)
      - name: _seen_keys
        title: 読んだ場所ごとの収集のキー
        type: dict[tuple[Path, frozenset[str]], set[tuple[Path, str, str]]]
        access: 内部 (_)
        description: (読むフォルダ, 読んだ行の ID の集合) → 前回の読み込みの収集で当たった `_files` のキー。手順 5 で、前回あって今回無いキーだけを捨てるために使う。辞書の読み書きは `_lock` の中でする
      - name: _keys_by_path
        title: パスごとのキー
        type: dict[Path, set[tuple[Path, str, str]]]
        access: 内部 (_)
        description: 絶対パス → そのパスを持つ `_files` のキー（行ごと）。`invalidate` が `_files` 全体をたどらずに引く。`_files` へ入れる・捨てるときに一緒に更新する
      - name: _schemas
        title: スキーマのキャッシュ
        type: dict[Path, tuple[int, int, dict[str, Any]]]
        access: 内部 (_)
        description: スキーマの絶対パス → (更新日時, 大きさ, 読んだスキーマ)。ワークツリーの読む場所が使う
      - name: _revision_schemas
        title: リビジョンのスキーマのキャッシュ
        type: dict[tuple[Path, str, str], dict[str, Any]]
        access: 内部 (_)
        description: (`repo_root`, 解いた commit, スキーマのファイルの `repo_root` からの相対パス) → `$ref` を解いたスキーマ。commit のファイルは書き換わらないので、ファイルの `stat` を取らずに引く。相対パスは `source.root.relative_to(repo_root) / table.schema_path` で、同じリポジトリの `root` の違う配信元を分ける
      - name: _dates
        title: 日時のキャッシュ
        type: dict[tuple[Path, str, str], dict[str, FileDates]]
        access: 内部 (_)
        description: (作業ツリー, 解いた commit, 配信元の `root` の `repo_root` からの相対パス) → 配信元の直下からのパスに直した履歴の『ファイルの日時』の結果。commit が変わればキーが変わり、同じリポジトリの `root` の違う配信元を分ける
      - name: _revision_files
        title: リビジョンのファイルのキャッシュ
        type: dict[tuple[Path, str, str, str, str], tuple[str, tuple[tuple[str, str], ...], tuple[tuple[str, FileDates | None], ...], list[Document], list[LoadProblem]]]
        access: 内部 (_)
        description: |-
          (`repo_root`, 配信元の ID, ファイルの `repo_root` からの相対パス, 文書の行の ID, 文書の行の定義のハッシュ) → (ファイルの blob の SHA, 文書が指す本文のファイルの (パス, blob の SHA) のパスの順の並び, ファイルと本文のファイルの (パス, 日時) の並び, 文書, 理由)。
          `ref` を持つ読む場所が使い、commit をまたいで、blob と日時の変わらないファイルの読み込みを使い回す。
          中身は commit の blob と文書の行の定義で決まり古くならないので、`clear` では空にしない。
          文書の行の定義のハッシュは `DocumentTable` の全ての項目の `repr` の SHA-256 で、`paths`・`metadata` などが変われば別のキーになる
      - name: _trees
        title: commit のファイルの blob のキャッシュ
        type: dict[tuple[Path, str], dict[str, str]]
        access: 内部 (_)
        description: (`repo_root`, 解いた commit) → `repo_root` からの相対パス → blob の SHA。通常のファイル（`100644`・`100755`）と、リンク先が同じ commit の通常のファイルのシンボリックリンク（`120000`。値はリンク先の blob の SHA）だけを持ち、サブモジュールとリンク先の無いシンボリックリンクは持たない。`TREE_KEEP` 件を超えたら古く入れたものから捨てる。commit の中身は変わらないので、`clear` では空にしない
      - name: _lock
        title: 排他
        type: threading.Lock
        access: 内部 (_)
        description: キャッシュの辞書の読み書きを守る（ファイルの読み込みはロックの外で行う）
      - name: _worktrees
        title: ワークツリーのたどった結果
        type: dict[Path, _WorktreeWalk]
        access: 内部 (_)
        description: 'ワークツリーの読むフォルダ → ファイルの一覧・フォルダごとの更新日時・行の定義のハッシュごとの収集の結果。`_WorktreeWalk` はこのファイルの中の `@dataclass(slots=True)`（`files: list[str]`・`folders: dict[str, int]`・`collected: dict[str, list[str]]`）'
      - name: _worktree_locks
        title: ワークツリーごとの排他
        type: dict[Path, threading.Lock]
        access: 内部 (_)
        description: 同じワークツリーのたどりと読み込みを 1 つずつにする。後から来た呼び出しは先の読み込みの終わりを待ち、その結果を使う。辞書への追加は `_lock` の中で行う
      - name: _startup_schemas
        title: 起動時のスキーマのキャッシュ
        type: dict[tuple[str, str, str], dict[str, Any]]
        access: 内部 (_)
        description: (配信元の ID, 行の ID, 行の定義のハッシュ) → `$ref` を解いた起動時のスキーマ。ワークツリーの設定で作り直した配信元と配信中の配信元は、行の `schema`（`SchemaRef` の `ref` など）が違えば別のキーになる
      - name: _generation
        title: clear の回数
        type: int
        access: 内部 (_)
        description: '`clear` のたびに 1 つ増やす。`clear` の前に解き始めた起動時のスキーマを `_startup_schemas` に書き戻さないために使う'
      - name: gate
        title: 裏の処理の関所
        type: BackgroundGate
        access: 公開
        default: BackgroundGate()
        description: 裏の検査が読むとき、要求の応答中はファイル 1 件ごとに休ませる（起動のときに `Handlers.gate` を渡す）
      - name: _blob_readers
        title: blob の読み取り
        type: dict[Path, BlobReader]
        access: 内部 (_)
        description: '`repo_root` → 履歴の blob の読み取り。`from_blobs` の `load` が初めてそのリポジトリを読むときに作り、捨てない（子プロセスはリポジトリごとに 1 本）'
      - name: _collected
        title: commit の収集の結果
        type: dict[tuple[Path, str, str, str], list[str]]
        access: 内部 (_)
        description: (`repo_root`, 配信元の ID, 解いた commit, 文書の行の定義のハッシュ) → 『ファイルの収集』の結果。commit の中身と行の定義で決まり古くならないので `clear` では空にしない。`_trees` から捨てた (`repo_root`, commit) の要素も一緒に捨て、`TREE_KEEP` 件の commit の分に抑える
      - name: _revision_loads
        title: リビジョンの読み込みの結果
        type: dict[tuple[Path, str], OrderedDict[tuple[str, tuple[str, ...]], _RevisionLoad]]
        access: 内部 (_)
        description: '(`repo_root`, 配信元の ID) → 使用した順の (解いた commit, 読んだ文書の行の定義のハッシュの並び) → 読み込みの結果。`_RevisionLoad` はこのファイルの中の `@dataclass(slots=True, frozen=True)`（`result: LoadResult`・`pages: dict[str, Document]`・`files: dict[str, Document]`・`file_ids: dict[tuple[str, str], Document]`）。commit の中身と行の定義で決まり古くならないので `clear` では空にしない。(`repo_root`, 配信元の ID) ごとに `REVISION_LOAD_KEEP` 件まで持つ。辞書の読み書きは `_lock` の中でする'
      - name: _sqlite_rows
        title: SQLite の表の行のキャッシュ
        type: dict[str, SqliteRowCache]
        access: 内部 (_)
        description: 配信元の ID → `SqliteRowCache`。ワークツリー・リビジョンごとに分けない
    methods:
      - name: load
        title: 文書を集める
        summary: 読む場所の文書を、文書の行ごとに集めて返す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: キャッシュを更新する。`ref` があればリビジョンを書き出す
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 権限と作業場所の『読む場所の解決』の結果
          - name: kinds
            title: 種類
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 絞る文書の行の ID。`None` は有効な全ての行
          - name: files
            title: たどったファイル
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 読むフォルダを `walk_files` でたどったパス。呼び出し元が既にたどったときに渡す。`None` は `load` が 1 回だけたどる
          - name: from_blobs
            title: 書き出さずに読む
            type: bool
            required: false
            default: 'False'
            passing: keyword
            description: '`True` は、`ref` のある読む場所を状態のフォルダへ書き出さずに commit の blob から読む（文書の一覧が渡す）。`files` を渡したときと `ref` が無いときは使わない'
        returns:
          type: LoadResult
          description: 集めた文書と読めなかったファイル
        process: |-
          `target.ref` があり `files` が `None` の場合、`_revision_loads` を (`repo_root`, 配信元の ID) と (読む場所の commit, 読む文書の行の定義のハッシュの並び) で引き、該当すれば手順 1〜6 をせずに保持した `LoadResult` を返却する（使用した順の末尾へ移す）。`from_blobs` の真偽はキーに含めない（同じ commit と行の定義なら同じ文書になる）

          1. 読むフォルダを決める
             - `target.ref` が `None` の場合、`target.base`
             - `target.ref` があり、`from_blobs` が偽か `files` がある場合、読む場所の commit（下の「読む場所の commit」）を `snapshots.checkout` で書き出し、その下に `source.root` の `repo_root` からの相対パスをつなぐ
             - `target.ref` があり、`from_blobs` が真で `files` が `None` の場合、書き出さずに `source.root` にする。手順 4 のファイルは、読む場所の commit のファイルの blob（`_trees`）のうち `source.root` の下にあり『たどるパスの判定』に当たるパスを、`source.root` からのパスにして得る（`walk_files` でたどらない）
          2. 文書の行を決める。`kinds` があれば `source.table` で引き（無い種類は `UnknownKindError`）、無ければ `enabled` の全ての行
          3. Git の配信元の場合、履歴の『ファイルの日時』を `_dates` から作業ツリー・commit・配信元の `root` の `repo_root` からの相対パスで引く。無ければ、作業ツリー（ワークツリーか `repo_root`）と commit（`ref` があれば読む場所の commit、無ければ作業ツリーの `HEAD` を解いた SHA）で呼び、配信元の直下からのパスに直してキャッシュする
          4. 読むフォルダのファイルを、`files` が無ければ `walk_files` で 1 回だけたどって得る。行ごとにそのパスを渡して『ファイルの収集』でファイルを集める。集めたファイル 1 件ごとの照合と読み込み（下の 2 つ）は、裏の処理の関所の裏の処理の 1 件（`gate.unit`。裏の処理のスレッドでなければ何もしない）の中で行う
             - `target.worktree` があり `target.ref` と `files` が `None` の場合、手順 4・5 をワークツリーごとの排他（`_worktree_locks`）の中で行い、たどった結果を `_worktrees` に持つ。排他を待った秒数を今の要求の記録に足す（`current_record().add_lock_wait`。要求の外なら足さない）
               - `_worktrees` に無い場合、『フォルダごとの列挙』でたどり、ファイルの一覧と、フォルダごとの更新日時を記録する。手順 7 の前に `[info]` ワークツリーを読み込んだ（配信元・ワークツリーのパス・秒数）を書く
               - `_worktrees` にある場合、記録したフォルダごとに `stat` を取る。更新日時が変わった・無くなったフォルダがあればたどり直して置き換え、無ければ記録したファイルの一覧を使う（たどり直しではログを書かない）
               - 『ファイルの収集』の結果を、行の定義のハッシュごとに `_worktrees` に持ち、ファイルの一覧が変わらなければ集め直さない
               - 読み込みを終えたら `_worktrees` の末尾に入れ（使った順）、`WORKTREE_KEEP` 件を超えたら先頭から捨てる（そのワークツリーの `_worktree_locks` も除く）。捨てたワークツリーは、次に指されたときに初めての読み込みとして再読み込みする
             - `target.ref` が `None` の場合、ファイルごとに `stat` を取る。`_files` を (絶対パス, 行の ID, 行の定義のハッシュ) で引き、更新日時と大きさが同じで、理由に `missing_body_file` が無く、本文のファイルの (パス, 更新日時, 大きさ) も同じならキャッシュした結果を使い、それ以外は『ファイルの読み込み』で読んで `_files` を置き換える
             - `target.ref` がある場合、読む場所の commit のファイルの blob の SHA を `_trees` から引く（無ければ `git ls-tree -r --full-tree {commit}` を 1 回だけ起動してキャッシュする）。`_revision_files` の blob の SHA が同じで、理由に `missing_body_file` が無く、本文のファイルの (パス, blob の SHA) と、ファイルと本文のファイルの日時（手順 3）も同じならキャッシュした結果を使い、それ以外は『ファイルの読み込み』で読んで `_revision_files` を置き換える。blob の SHA が無いファイルは読まない
                         - `from_blobs` が真で書き出さない場合、『ファイルの読み込み』の代わりに、ファイルの blob の内容を `_blob_readers` の `repo_root` の blob の読み取り（無ければ作る）の『blobの文字列』で読み、『文字列からの文書の組み立て』（`root` は `source.root`）で文書にする。本文のファイルは、同じ commit の `_trees` の blob を同じ読み取りで読む関数（`read_body`）で読む。UTF-8 で読めないファイルは、『ファイルの読み込み』と同じく `unreadable` の理由にする
                         - 行ごとの『ファイルの収集』の結果を `_collected` に (`repo_root`, 配信元の ID, 読む場所の commit, 行の定義のハッシュ) で持ち、当たれば集め直さない（書き出しを読むときも同じ）
          5. `_seen_keys` を (読むフォルダ, 読んだ行の ID の集合) で引き、前回の収集で当たり今回当たらなかった `_files` のキーだけを削除する（削除されたファイルと、行の定義が変わる前のキー。`_keys_by_path` からも除く）。今回当たったキーで `_seen_keys` を置き換える。`_files` 全体はたどらず、たどったキーの数（前回のキーの数）を今の要求の記録に足す（`current_record().add_scanned`。要求の外なら足さない）。
             `target.ref` がある場合は、読んだ行ごとに、`_revision_files` のキーのうち `repo_root`・配信元の ID・行の ID が同じで、今回の commit のファイルに当たらないもの、または行の定義のハッシュが違うものを削除する（`_revision_files` を今の commit と行の定義のファイルの数に抑える）
          6. 行の順に文書を並べ、先に現れた ID を残して、後に現れた同じ ID の文書を `duplicate_id` にする（`detail` に ID と先の文書のファイル）。除外した文書は `duplicates` に行の順で入れる
          7. `target.ref` があり `files` が `None` の場合、結果を文書のページの索引（`find_page` の「文書のページの索引」）とともに `_revision_loads` の末尾に入れ、(`repo_root`, 配信元の ID) ごとに `REVISION_LOAD_KEEP` 件を超えたら先頭（最も前に使用した commit）から捨てる。`LoadResult` を返却する

          読む場所の commit は、`target.commit` があればそのまま使い、無ければ `target.ref` を履歴の『リビジョンの解決』（`date_base` は配信元の `default_ref`）で解く。
          1 回の `load` の中では、手順 1 と手順 3 で同じ commit を使い、解き直さない。
        exceptions:
          - name: UnknownKindError
            condition: '`kinds` に有効な文書の行に無い種類がある'
            message: 配信元の『文書の行を引く』のまま
          - name: RefNotFoundError
            condition: '`target.commit` が無く、`target.ref` を commit に解けない'
            message: 履歴の『リビジョンの解決』のまま
        unit_tests:
          - name: test_document_store_load
            case: 正常
            summary: 行ごとに集める
            condition: '行 `rules`（`rules/*.yaml`）と `notes`（`notes/files.yaml` の `records: files`・`body_file: path` で `.md`）に 2 件ずつ、Git の管理外の配信元'
            mock: なし（`tmp_path`）
