id: MOD-113-1
title: 索引のサーバー / 本文のリンク
lead: setup が関連の候補を作るときに、Markdown と YAML の本文のリンクとパスが指す配信元の中のファイルを取り出す本文のリンクの分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/features/links/
  ├─ __init__.py   # 空
  ├─ types.py      # LinkVia / LinkTarget / FileLinks
  └─ service.py    # links_files / file_links / collect_yaml_strings / extract_links / find_paths / resolve_relative / to_json_line（対象の選択・取り出し・出力の形）
  ```
notes:
  受け持つこと: ファイルを書き換えない。対象のファイルは `project-index files` と同じ判定（文書のストアの `indexable_files`）で選び、指す先の候補は文書のストアの `walk_files` で集める。関連の `type` は決めない（setup が決める）。
