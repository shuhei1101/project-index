id: MOD-28
title: 索引のサーバー / 文書のストア / schema.py
lead: 種類のスキーマの `$ref` の解決と、`records` の行のスキーマを受け持ち、文書のストアの schema.py を修正するときに参照する。
test_files:
  - tests/unit/project_index/features/documents/test_schema.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書のストア ..> スキーマの参照の解決
        class 文書のストア {
          <<class>>
        }
        class スキーマの参照の解決 {
          <<function>>
        }
        click 文書のストア href "id:MOD-29#classes[DocumentStore]"
functions:
  - name: resolve_schema_refs
    title: スキーマの参照の解決
    kind: 関数
    container: project_index/features/documents/schema.py
    usecase: 共通
    role: 変換
    summary: 種類のスキーマの `$ref` を参照先の中身で置き換えたスキーマを返す
    scope: public
    args:
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 読んだ種類のスキーマ
      - name: base
        title: スキーマのファイル
        type: Path | PurePosixPath
        required: true
        passing: positional
        description: '相対の `$ref`（`共通.schema.yaml#/$defs/markdown` など）を解く基準のファイル。`read` を渡すときはリポジトリの直下からのパス'
      - name: read
        title: 読み取り
        type: Callable[[str], str | None] | None
        required: false
        default: None
        passing: keyword
        description: リポジトリの直下からのパスのファイルの中身を返す関数（無ければ `None`）。`None` はディスクから読む
    returns:
      type: dict[str, Any]
      description: '`$ref` を解いたスキーマ（最上位の `$defs` は、中の `$ref` を解いて残し、別のファイルの中で循環する定義を加える）'
    process: |-
      1. 参照先のファイルは、`$ref` を持つファイルのフォルダからのパスで『YAMLの読み込み』で読み、同じファイルは 1 回だけ読む（`read` があれば、`base` のフォルダからのパスを正規化して `read` で読む。`..` でリポジトリの直下より上を指す参照先は無いものとして扱う）
      2. 値を先頭からたどり、`$ref` を持つオブジェクトは参照先の中身に、`$ref` 以外のキーを重ねたものに置き換えて続けてたどる
      3. 最上位の `$defs` は参照先として残し、各定義 `{名前}` の中の `$ref` を、たどっている途中の `$ref` に `{base}#/$defs/{名前}` を入れた状態から解く（自分自身へ戻る `#/$defs/{名前}` は解かずに残り、ほかのファイルを指す相対パスの `$ref` は解ける）
      4. たどっている途中の `$ref` に戻る（循環する）場合、その `$ref` は解かずに残す
         - `[warning]` スキーマの循環する参照を解かずに残した（ファイル・`$ref`）。手順 3 で `$defs` の定義を解く途中の循環では出さない
         - 参照先が `base` で、`$ref` がファイルのパスを持つ（別のファイルから `base` へ戻る）場合、その `$ref` を `#{参照先の JSON Pointer}` に書き換える（`$ref` 以外のキーはそのまま残す）
         - 参照先が `base` と別のファイルの場合、その `$ref` を、参照先の定義を最上位の `$defs` へ加えた名前を指す `#/$defs/{名前}` に書き換える（`$ref` 以外のキーはそのまま残す）
           - 名前は `{base のフォルダからの参照先のファイルの相対パス}#{参照先の JSON Pointer}`（例: `common.schema.yaml#/$defs/tree`）。種類のスキーマの最上位の `$defs` の名前と重なる場合は、重ならなくなるまで末尾に `-{2 からの連番}` を付ける
           - `$ref` には、名前を JSON Pointer の 1 つの区切りとしてエスケープ（`~` → `~0`・`/` → `~1`）し、URL エンコードして入れる
           - 加える定義は、参照先の定義を、たどっている途中の `$ref` をその参照先だけにした状態から解いたもの。同じ参照先は 1 回だけ加え、2 回目からは同じ名前を指す（名前は定義を解く前に登録する）
           - `[warning]` は、手順 3 と同じく加える定義を解く途中の循環では出さない
      5. 参照先が無い・読めない場合、その `$ref` は解かずに残す
         - `[warning]` スキーマの参照を解けなかった（ファイル・`$ref`・理由）
    unit_tests:
      - name: test_resolve_schema_refs
        case: 正常
        summary: 同じファイルと別のファイルの参照
        condition: '`properties.a` が `#/$defs/x`、`properties.b` が `共通.schema.yaml#/$defs/markdown` で `title: B` を重ねる'
        mock: なし（`tmp_path`）
        expected: '`a` が `$defs.x` の中身、`b` が `markdown` の中身に `title: B` を重ねたもの'
      - name: test_resolve_schema_refs_when_cycle
        case: 正常
        summary: 循環する参照
        condition: '`$defs.node.properties.children.items` が `#/$defs/node`'
        mock: なし
        expected: '`children.items` が `$ref` のまま残り、`[warning]` が 1 件'
      - name: test_resolve_schema_refs_when_relative_ref_in_defs
        case: 正常
        summary: '`$defs` の中の相対パスの参照と循環する参照'
        condition: '`properties.entries.items` が `#/$defs/entry`、`$defs.entry.properties.summary` が `共通.schema.yaml#/$defs/summary`、`$defs.entry.properties.children.items` が `#/$defs/entry`'
        mock: なし（`tmp_path`）
        expected: '`$defs.entry.properties.summary` と `properties.entries.items.properties.summary` が `summary` の中身になり、`$defs.entry.properties.children.items` は `#/$defs/entry` のまま残る。返したスキーマのどこにも `共通.schema.yaml` を指す `$ref` が無い'
      - name: test_resolve_schema_refs_when_cycle_in_other_file
        case: 正常
        summary: 別のファイルの中で循環する参照
        condition: '`properties.tree` が `共通.schema.yaml#/$defs/tree`、`共通.schema.yaml` の `$defs.tree.properties.children.items` が `#/$defs/tree`。種類のスキーマの最上位の `$defs` は `tree` を持たない'
        mock: なし（`tmp_path`）
        expected: '最上位の `$defs` に `共通.schema.yaml#/$defs/tree` の名前で `tree` の中身が加わり、`properties.tree.properties.children.items` と加えた定義の `properties.children.items` が、その名前を指す `$ref` になる。返したスキーマで jsonschema が入れ子の `children` を持つ値を検査でき、違反が無い。`[warning]` が 1 件'
      - name: test_resolve_schema_refs_when_cycle_in_other_file_with_same_name
        case: 正常
        summary: 別のファイルの中で循環する参照と同じ名前の定義
        condition: '`test_resolve_schema_refs_when_cycle_in_other_file` の条件に加え、種類のスキーマの最上位の `$defs` が `tree`（`type: string`）と `共通.schema.yaml#/$defs/tree`（`type: integer`）を持つ'
        mock: なし（`tmp_path`）
        expected: '種類のスキーマの `$defs.tree` と `$defs.共通.schema.yaml#/$defs/tree` はそのまま残り、`共通.schema.yaml` の `tree` は `共通.schema.yaml#/$defs/tree-2` の名前で加わる。返したスキーマで jsonschema が入れ子の `children` を持つ値を検査でき、違反が無い'
      - name: test_resolve_schema_refs_when_cycle_back_to_base
        case: 正常
        summary: 別のファイルから種類のスキーマへ戻る循環する参照
        condition: '`base` が `rule.schema.yaml`、`$defs.node.properties.child` が `共通.schema.yaml#/$defs/wrap`、`共通.schema.yaml` の `$defs.wrap.properties.inner` が `rule.schema.yaml#/$defs/node`'
        mock: なし（`tmp_path`）
        expected: '`$defs.node.properties.child.properties.inner` が `#/$defs/node` を指す `$ref` になり、返したスキーマのどこにも `rule.schema.yaml` を指す `$ref` が無い'
      - name: test_resolve_schema_refs_when_missing
        case: 正常
        summary: 参照先が無い
        condition: '`無い.schema.yaml#/$defs/x`'
        mock: なし
        expected: '`$ref` のまま残り、`[warning]` が 1 件'
      - name: test_resolve_schema_refs_when_read
        case: 正常
        summary: 読み取りの関数で参照先を読む
        condition: '`base` が `schemas/note.schema.yaml`、`read` が辞書を引く関数で、`共通.schema.yaml#/$defs/x` と `../../out.schema.yaml#/$defs/y` を指す'
        mock: なし
        expected: '`x` は `read("schemas/共通.schema.yaml")` の中身に解け、リポジトリの外を指す `y` は `$ref` のまま残る'
  - name: startup_schema
    title: 起動時のスキーマ
    kind: 関数
    container: project_index/features/documents/schema.py
    usecase: 共通
    role: 変換
    summary: 配信元が起動時に読んだ行のスキーマを、`$ref` を解いて返す
    description: 文書のストア・`check_project`・nav の描画が、行のスキーマを同じ読み方で引くために使う。
    scope: public
    args:
      - name: source
        title: 配信元
        type: ServedSource
        required: true
        passing: positional
        description: 配信中の配信元
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 引く行
    returns:
      type: dict[str, Any]
      description: '`$ref` を解いた行のスキーマ'
    process: |-
      1. `table.schema_path` が `SchemaRef` なら、`source.schemas[table.id]`（起動時に解いたもの）を返す
      2. それ以外は、`source.schemas[table.id]` を基準 `source.config_root / table.schema_path`（設定ファイルのフォルダ）でスキーマの参照の解決にかけて返す
    unit_tests:
      - name: test_startup_schema
        case: 正常
        summary: 相対パスとほかの配信元の参照
        condition: 相対パスの行（`$ref` を持つ）と、`SchemaRef` の行
        mock: なし（`tmp_path`）
        expected: 相対パスの行は `$ref` を解いたもの、`SchemaRef` の行は `source.schemas` のまま
  - name: records_item_schema
    title: records の行の 1 行のスキーマ
    container: project_index/features/documents/schema.py
    usecase: 共通
    role: 変換
    summary: ファイル全体のスキーマから `records` の要素 1 つのスキーマを取り出す
    description: 文書に当てるスキーマ（`row_schema`）と `check_project` の食い違いの検出が使う。
    kind: 関数
    scope: public
    args:
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: '`$ref` を解いた行のスキーマ'
      - name: records
        title: 要素のキー
        type: str
        required: true
        passing: positional
        description: 行の `records`
    returns:
      type: dict[str, Any] | None
      description: '`properties.{records}.items`。辞書でない・無いときは `None`'
    process: |-
      1. `schema` の `properties` が辞書で、その `records` の値が辞書で、その `items` が辞書なら `items` を返す
      2. それ以外は `None` を返す
    unit_tests:
      - name: test_records_item_schema
        case: 正常
        summary: 要素のスキーマを取り出す
        condition: '`templates/files.schema.yaml` を読んだスキーマと `files`'
        mock: なし
        expected: '`required` が `[path]` の `items`'
      - name: test_records_item_schema_when_missing
        case: 正常
        summary: 要素のスキーマが無い
        condition: '`properties.files` が `{type: array}` だけのスキーマ、`properties` が無いスキーマ、`files` 以外の `records`'
        mock: なし
        expected: どれも `None`
