title: プラグイン / 配布
lead: Claude Code のプラグイン project-index と、それを掲載するマーケットプレースのファイルの並び。
directory: |-
  ```tree
  .claude-plugin/
  └── marketplace.json      マーケットプレース project-index と、掲載するプラグインの一覧
  plugins/
  └── project-index/
      └── .claude-plugin/
          └── plugin.json   プラグインの名前と説明
  ```
notes:
  分類の追加: MCP の接続（`.mcp.json`）・SessionStart と PreToolUse のフック（`hooks/`）・global-setup と setup のスキル（`skills/`）は、接続先の索引のサーバーと一緒に shuhei1101/dev-docs#114 で `plugins/project-index/` の下へ加える
  バージョン: マーケットプレースに掲載するプラグインのため、`marketplace.json` の `plugins[].version` と `plugin.json` の `version` はどちらも持たない
id: MOD-2
