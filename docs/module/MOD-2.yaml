title: プラグイン / 配布
lead: プラグイン project-index とマーケットプレースのファイルの並びを定め、プラグインの配布物を追加・変更するときに参照する。
directory: |-
  ```tree
  .claude-plugin/
  └── marketplace.json        マーケットプレース project-index と、掲載するプラグインの一覧
  plugins/
  └── project-index/
      ├── .claude-plugin/
      │   └── plugin.json     プラグインの名前と説明
      ├── .mcp.json           文書の MCP（project-index）と管理の MCP（project-index-admin）の接続先
      ├── hooks/
      │   ├── hooks.json      SessionStart・PreToolUse のフックの登録
      │   ├── session_start.py  セッション開始のフック（MOD-5）
      │   └── pre_tool_use.py   ツール実行前のフック（MOD-4）
      └── skills/
          ├── global-setup/
          │   └── SKILL.md    端末に project-index を用意するスキル
          └── setup/
              └── SKILL.md    フォルダを配信元として端末の設定に並べるスキル
  ```
notes:
  移した元: shuhei1101/dev-docs の `plugins/dev-docs/` の `hooks/`・`skills/` と `.mcp.json` を移した。MCP のサーバーの名前を `project-index`・`project-index-admin` にしたため、ツールの完全名は `mcp__plugin_project-index_project-index__{ツール}` になる（確認ログ）
  バージョン: マーケットプレースに掲載するプラグインのため、`marketplace.json` の `plugins[].version` と `plugin.json` の `version` はどちらも持たない
id: MOD-2
visibility: internal
