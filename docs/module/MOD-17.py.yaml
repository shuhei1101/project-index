id: MOD-17
title: 索引のサーバー / 変換 / service.py
lead: '`converters[]` の実行と結果のキャッシュを受け持ち、変換の service.py を修正するときに参照する。'
tags:
  - name: topic:変換
    main: true
  - name: topic:markdown
  - name: action:変換
  - name: tool:mdmark
test_files:
  - tests/unit/project_index/features/convert/test_service.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        変換 ..> スクリプトの実行 : converters[]
        変換 ..> 変換の結果 : 返す
