id: MOD-83
title: 索引のサーバー / 書き込み / placement.py
lead: 新しい文書の配置先を受け持ち、書き込みの placement.py を修正するときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: action:書き込み
  - name: action:検証
  - name: tool:ruamel.yaml
test_files:
  - tests/unit/project_index/features/write/test_placement.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の書き込み ..> 新しい文書の配置先
        文書の書き込み ..> 指定した文書の配置先
        class 文書の書き込み {
          <<function>>
        }
        class 新しい文書の配置先 {
          <<function>>
        }
        class 指定した文書の配置先 {
          <<function>>
        }
        click 文書の書き込み href "id:MOD-84#functions[write_docs]"
functions:
  - name: new_document_path
    title: 新しい文書の配置先
    kind: 関数
    container: project_index/features/write/placement.py
    usecase: 書き込み
    role: 判定
    summary: '`create` の文書を書くファイルを、文書の行の `paths` の先頭から決める'
    scope: public
    thread_safe: true
    args:
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 作る種類の行
      - name: doc_id
        title: 文書の ID
        type: str
        required: true
        passing: positional
        description: 作る文書の ID
    returns:
      type: tuple[str, bool]
      description: (配信元の直下からのパス, `records` の配列へ足すか)
    process: |-
      1. `records` がある場合、`paths[0]` が glob を含まなければ `(paths[0], True)` とし、`paths` が空か glob を含めば違反にする
      2. `records` が無い場合、`paths[0]` の最後の段の `*` を `doc_id` に置き換え、`**/` を除いたパスにする（例 `docs/**/*.yaml` → `docs/{doc_id}.yaml`）。glob を含まないパスと、置き換えた後のファイル名に glob（`*`・`?`・`[`）が残るパス（例 `docs/*-*.yaml`）は違反にする
      3. 決めたパスに文書の行.除外の名前に当たるかが `True` なら違反にする。`records` が無い場合は、続けて文書の行.この行の文書になるかが `False`（`**` 以外の glob を含むフォルダの階層を取り除いて `paths` のどれにも当たらない。例 `docs/*/README.md` → `docs/README.md`）なら違反にする。どちらも当てはまらなければ返す
      4. 違反は `path` が `operations[{i}].kind` の `InvalidArgumentError` で送る。配置先を決められないときは `rule` が `{kind} の新しい文書の配置先を決められません`、`fix` が `records` を持つ行では `documents[].paths の先頭を glob を含まない 1 つのファイルにしてください`、持たない行では、先頭が glob を含まないときは `documents[].paths の先頭を glob にしてください`、ファイル名に glob が残るときは `documents[].paths の先頭のファイル名の glob を * の 1 つだけにしてください`、決めたパスが `paths` に当たらないときは `documents[].paths の先頭のフォルダの階層の glob を ** にしてください`、除外の名前に当たるときは `rule` が `配置先 {パス} が {kind} の exclude に該当します`、`fix` が `id を変えるか、documents[].exclude から削除してください`
    exceptions:
      - name: InvalidArgumentError
        condition: 配置先を決められない
        message: '`{kind} の新しい文書の配置先を決められません`'
      - name: InvalidArgumentError
        condition: 配置先のファイル名が `exclude` に当たる
        message: '`配置先 {パス} が {kind} の exclude に該当します`'
    unit_tests:
      - name: test_new_document_path
        case: 正常
        summary: glob から決める
        condition: '`paths: [docs/**/*.yaml]` と `paths: [data/list.yaml]`・`records: items`'
        mock: なし
        expected: '`("docs/sample-doc.yaml", False)` と `("data/list.yaml", True)`'
      - name: test_new_document_path_when_excluded
        case: 異常
        summary: 配置先が除外の名前に当たる
        condition: '`paths: [docs/rule/*.yaml]`・`exclude: [index.yaml]` で `doc_id` が `index`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `kind`、`rule` に `docs/rule/index.yaml` を含む'
      - name: test_new_document_path_when_records_excluded
        case: 異常
        summary: 管理用の YAML の名前が除外の名前に当たる
        condition: '`paths: [src/files.yaml]`・`records: files`・`body_file: path`・`exclude: [files.yaml]`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `kind`、`rule` に `src/files.yaml` を含む'
      - name: test_new_document_path_when_records_glob
        case: 異常
        summary: records を持つ行で先頭が glob のため配置先を決められない
        condition: '`paths: [data/*.yaml]`・`records: items`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `kind`、`fix` が `documents[].paths の先頭を glob を含まない 1 つのファイルにしてください`'
      - name: test_new_document_path_when_no_glob
        case: 異常
        summary: records を持たない行で先頭が glob を含まないため配置先を決められない
        condition: '`paths: [docs/list.yaml]`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `kind`、`fix` が `documents[].paths の先頭を glob にしてください`'
      - name: test_new_document_path_when_filename_glob_remains
        case: 異常
        summary: records を持たない行で置き換えた後のファイル名に glob が残るため配置先を決められない
        condition: '`paths: [docs/*-*.yaml]`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `kind`、`fix` が `documents[].paths の先頭のファイル名の glob を * の 1 つだけにしてください`'
      - name: test_new_document_path_when_recursive_folder
        case: 正常
        summary: フォルダの階層が `**` だけで `paths` に当たる配置先は、ID がファイル名に入らなくても返却する
        condition: '`paths: [docs/**/index.yaml]`'
        mock: なし
        expected: '`("docs/index.yaml", False)`'
      - name: test_new_document_path_when_outside_paths
        case: 異常
        summary: records を持たない行で決めたパスが paths に当たらないため配置先を決められない
        condition: '`paths: [docs/*/README.md]` と `paths: [docs/*/*.yaml]`'
        mock: なし
        expected: どちらも `InvalidArgumentError` の違反の `path` が `kind`、`fix` が `documents[].paths の先頭のフォルダの階層の glob を ** にしてください`
  - name: requested_document_path
    title: 指定した文書の配置先
    kind: 関数
    container: project_index/features/write/placement.py
    usecase: 書き込み
    role: 判定
    summary: '`create` の `new_path` を正規化し、文書の行の文書になるパスかを確認して配置先にする'
    scope: public
    thread_safe: true
    args:
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 作る種類の行
      - name: new_path
        title: 指定したパス
        type: str
        required: true
        passing: positional
        description: '`create` の `new_path`（配信元の直下からのパス）'
    returns:
      type: str
      description: 正規化した配信元の直下からのパス
    process: |-
      1. `records` がある場合、違反にする（要素を追加する管理用の YAML は `paths` の先頭で決定する）
      2. `new_path` を `posixpath.normpath` で正規化する
      3. 正規化したパスが文書の行.この行の文書になるかが `False`（`paths` に該当しないか `exclude` に該当する。`..` で始まる配信元の外部を指すパスも該当しない）なら違反にする。当てはまらなければ返却する
      4. 違反は `path` が `operations[{i}].new_path` の `InvalidArgumentError` で送信する（添字は書き込みが付ける）。`records` があるときは `rule` が `{kind} は records を持つため create の new_path を受けません`、`fix` が `new_path を除いてください`。`paths`・`exclude` の違反は `rule` が `new_path（{正規化したパス}）が {kind} の paths に該当しないか exclude に該当します`、`fix` が `{kind} の documents[].paths に該当するパスを指定してください`（`rename` の `new_path` の違反と同じ文言）。既にあるファイルかは確認しない（書き込みが確認する）
    exceptions:
      - name: InvalidArgumentError
        condition: '`records` を持つ行に `new_path` を指定した'
        message: '`{kind} は records を持つため create の new_path を受けません`'
      - name: InvalidArgumentError
        condition: 正規化したパスが `paths` に該当しないか `exclude` に該当する
        message: '`new_path（{パス}）が {kind} の paths に該当しないか exclude に該当します`'
    unit_tests:
      - name: test_requested_document_path
        case: 正常
        summary: 指定したパスを正規化して返却する
        condition: '`paths: [chars/*/*.yaml]`・`exclude: [chars/*/definition.yaml]` で `new_path` が `chars/c1/./a1.yaml`'
        mock: なし
        expected: '`"chars/c1/a1.yaml"`'
      - name: test_requested_document_path_when_outside_paths
        case: 異常
        summary: paths に該当しない・exclude に該当する・配信元の外を指すパスを断る
        condition: 同じ行で `new_path` が `other/a2.yaml`・`chars/c1/definition.yaml`・`../outside/a2.yaml`
        mock: なし
        expected: どれも `InvalidArgumentError` の違反の `path` が `new_path`、`rule` に正規化したパスと `paths に該当しないか exclude に該当します` を含む
      - name: test_requested_document_path_when_records
        case: 異常
        summary: records を持つ行は new_path を受けない
        condition: '`paths: [data/list.yaml]`・`records: items` で `new_path` が `data/list.yaml`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `new_path`、`fix` が `new_path を除いてください`'
visibility: internal
