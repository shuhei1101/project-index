id: MOD-76
title: 索引のサーバー / 読み取り API / nav.py
lead: '`nav` の `auto` の当たる文書の数・`filter` の検証・警告（管理の MCP と配信元の説明が使う）。タブとサイドバーの組み立ては dev-docs の画面のサーバーが持つ。'
test_files:
- tests/unit/project_index/features/read/test_nav.py
diagrams:
- name: 全体
  diagram: |-
    classDiagram
      direction TD
      画面の構成の書き込み ..> nav の条件の数え
      画面の構成の書き込み ..> nav の条件の確かめ
      配信元の検査の控え ..> nav の警告
      nav の警告 ..> nav の条件の数え
      class 画面の構成の書き込み {
        <<function>>
      }
      class 配信元の検査の控え {
        <<class>>
      }
      class nav の条件の数え {
        <<function>>
      }
      class nav の条件の確かめ {
        <<function>>
