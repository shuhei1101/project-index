id: MOD-118
title: 索引のサーバー / 端末の設定
lead: |-
  端末の設定 `settings.yaml` をスキーマで検証して読み、端末の設定の API に送られた `sources[]` を、他のキーとコメントを保って書き換える。
  端末の設定の取得・保存の入口も持つ。
directory: |-
  ```text
  src/project_index/features/settings/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # TerminalConfig / SourceEntry / SourceScope / SourcePatch / SettingsSourceRow / SettingsSourcesView / SettingsSourcesRequest / SettingsSourcesResponse / SettingsSourcePatchRequest / SourceWriteResult / SettingsVersionMismatchError / SourceRowNotFoundError
  ├─ query.py      # config_path / load_terminal_config / read_settings_file / listen_port
  ├─ service.py    # save_sources / add_source / patch_source / delete_source
  └─ route.py      # build_settings_router（GET・PUT・POST /settings/sources、PATCH・DELETE /settings/sources/{id}）
  schemas/
  └─ settings.schema.yaml   # 端末の設定のスキーマ（JSON Schema 2020-12）
  ```
