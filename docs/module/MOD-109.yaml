id: MOD-109
title: 索引のサーバー / 変換
lead: |-
  `converters[]` を指す種類の文書を、配信元のスクリプトで Markdown にする変換の分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/features/convert/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # Converted / ConvertFailure
  ├─ decisions.py  # find_decisions / DECISION_ID / DECISION_DOCS_DIR（検討事項の文書を探す）
  └─ service.py    # ConvertService（converters[] の実行・結果のキャッシュ）
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        変換 ..> スクリプトの実行 : converters[]
        変換 ..> 変換の結果 : 返す
        変換の結果 o-- 変換の失敗
        class 変換 {
          +変換する(読み書きの場所, 文書) 変換の結果
          +キャッシュを捨てる() None
        }
        class スクリプトの実行 {
          <<function>>
        }
        class 変換の結果 {
          +Markdown: str
        }
        class 変換の失敗 {
          +理由: str
        }
        click 変換 href "id:MOD-17#classes[ConvertService]"
        click スクリプトの実行 href "id:MOD-88#functions[run_script]"
        click 変換の結果 href "id:MOD-18#data_models[Converted]"
notes:
  受け持つこと: |-
    変換の結果をキャッシュする。
    スキーマ駆動の Markdown への変換は dev-docs の画面のサーバーが持つ。
    検討事項の文書を探す処理もここに置く。
