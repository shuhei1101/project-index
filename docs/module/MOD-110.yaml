notes:
  受け持つこと: |-
    `list_changes` の処理。
    区間（commit・日時・ブランチ・タグ）か、この会話で前回読んだ時点から今までに変わった文書・変わったキー・差分の行を返す。
    変わったキーと差分の行は、書き込みの差分と文書の取得の `diff` も使う。
