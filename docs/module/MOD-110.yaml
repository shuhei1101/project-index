id: MOD-110
title: 索引のサーバー / 変更
lead: |-
  変更の分類の構成図・ファイルの並び・決まりを定め、変更のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/features/changes/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # ChangesRequest / ContainsQuery / RangePoint / ContainsChange / ChangeItem / ChangesResult
  ├─ compare.py    # changed_keys / diff_lines / count_occurrences
  ├─ render.py     # render_changes_markdown
  └─ service.py    # list_changes
  ```
