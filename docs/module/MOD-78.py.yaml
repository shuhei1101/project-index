constants:
  - name: SEARCH_QUERY_MAX
    title: 検索の語の文字数の上限
    container: project_index/features/read/search.py
    usecase: 語での検索
    summary: '`q` の文字数の上限'
    value: '200'
  - name: SEARCH_LIMIT_DEFAULT
    title: 語での検索の件数の既定
    container: project_index/features/read/search.py
    usecase: 語での検索
    summary: '`limit` を省いたときの件数'
    value: '20'
  - name: SEARCH_LIMIT_MAX
    title: 語での検索の件数の上限
    container: project_index/features/read/search.py
    usecase: 語での検索
    summary: '`limit` の上限'
    value: '100'
  - name: SNIPPETS_PER_DOC
    title: 文書ごとの一致した箇所の数
    container: project_index/features/read/search.py
    usecase: 語での検索
    summary: '`items[].snippets` の上限'
    value: '3'
functions:
  - name: search_words
    title: 語での検索
    kind: 関数
    container: project_index/features/read/search.py
    usecase: 語での検索
    role: サービス
    summary: 語を全て含む文書と一致した箇所を返す
    scope: public
    thread_safe: true
    args:
      - name: documents
        title: 文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: '読む場所の文書（`search: false` の行の文書を除いたもの）'
      - name: q
        title: 検索する語
        type: str
        required: true
        passing: positional
        description: 1〜`SEARCH_QUERY_MAX` 文字（入口が確かめる）
      - name: limit
        title: 件数
        type: int
        required: true
        passing: positional
        description: 1〜`SEARCH_LIMIT_MAX`
      - name: excluded
        title: 除外の判定
        type: Sequence[bool] | None
        required: false
        default: None
        passing: keyword
        description: '`documents` と同じ順の、`search_exclude` に該当するかの並び（`exclusion_flags` の結果）。`None` は全て該当しない'
      - name: include_excluded
        title: 除いた文書も返却するか
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: '`True` のとき、該当する文書も `excluded: True` を付けて返却する'
    returns:
      type: SearchResult
      description: 文書のページのパスの昇順
    process: |-
      1. `q` を NFKC と `casefold` をして空白で分ける
      2. 語の照合に当たる文書を文書のページのパスの昇順に並べる。`excluded` で該当する文書は、`include_excluded` が `False` なら除いて件数を数え、`True` なら残す。残した文書の総件数を数える
      3. 先頭から `limit` 件を、文書のページのパス・文書の ID・文書のファイルのパス（`path`）・名前と、本文の一致した箇所の抜き出し（前後 1 行、`SNIPPETS_PER_DOC` 件）と、本文の一致した行の数（抜き出しと同じ `body` の `contains` に語を並べた条件で、全ての行を数える）つきで返す。残した該当する文書は `excluded` を `True`、除いた件数が 1 件以上なら `excluded_count` に入れる
    unit_tests:
      - name: test_search_words
        case: 正常
        summary: 全ての語を含む文書だけ
        condition: '`q="foo bar"`、foo と bar を含む文書 1 つと foo だけの文書 1 つ'
        mock: なし
        expected: '`total_count` が 1、`snippets` に foo か bar を含む行'
      - name: test_search_words_when_record
        case: 正常
        summary: 行の文書の ID とファイルのパスを返す
        condition: '`q="beta"`、`path` が `terms.yaml` で `body_path` の無い行の文書 `term-1`（alpha）・`term-2`（beta）'
        mock: なし
        expected: '`items[0]` の `id` が `term-2`、`file_path` が `terms.yaml`、`path` が `terms/term-2`'
      - name: test_search_words_when_excluded
        case: 正常
        summary: 除く文書を既定で除き、指定で excluded を付けて返却する
        condition: '`q="夕焼け"`、どちらも夕焼けを含む文書 `a1`・`a2`、`excluded=[False, True]`。`include_excluded` が `False` と `True`'
        mock: なし
        expected: '`False` は `total_count` が 1・`items` が `a1`・`excluded_count` が 1。`True` は `total_count` が 2、`a2` だけ `excluded` が `True`、`excluded_count` が `None`'
      - name: test_search_words_when_many_matches
        case: 正常
        summary: 一致した行の数を snippets の上限に関わらず数える
        condition: '`q="foo bar"`、本文の 5 行が foo か bar を含み（1 行は両方を含む）、各行の間にどちらも含まない行を 2 行ずつ挟む文書と、名前だけが foo bar を含む文書'
        mock: なし
        expected: 本文の文書は `snippets` が `SNIPPETS_PER_DOC` 件で `match_count` が 5。名前だけの文書は `match_count` が 0
visibility: internal
