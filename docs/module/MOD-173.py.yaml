id: MOD-173
title: 索引のサーバー / 書き込みの後の通知 / types.py
lead: '`POST /_admin/post-write` の本文と応答の型と、通知の文面のプロンプトの ID・ルールの索引のファイル名を受け持ち、書き込みの後の通知の types.py を修正するときに参照する。'
data_models:
  - name: PostWriteRequest
    title: 書き込みの後の通知の要求
    container: project_index/features/post_write/types.py
    usecase: 書き込みの後の通知
    role: DTO
    summary: ツール実行後のフックが送信する本文
    description: '`pydantic.BaseModel`（`extra="ignore"`）。`paths` は 1 件以上。'
    properties:
      - name: session_id
        title: セッション ID
        type: str
        description: Claude Code のセッション ID
      - name: agent_id
        title: サブエージェントの ID
        type: str | None
        default: None
        description: メインのセッションは `None`
      - name: paths
        title: 書き込んだパス
        type: list[str]
        description: 書き込んだファイルの絶対パス。`min_length=1`
  - name: Notice
    title: 通知
    container: project_index/features/post_write/types.py
    usecase: 書き込みの後の通知
    role: DTO
    summary: 通知するファイル 1 件の判定
    description: '`pydantic.BaseModel`。'
    properties:
      - name: path
        title: パス
        type: str
        description: 通知するファイルの絶対パス
      - name: source
        title: 配信元の ID
        type: str
        description: ファイルを含む配信元
      - name: action
        title: 促す修正
        type: Literal['add_row', 'update_row']
        description: 管理用の YAML に行が無ければ `add_row`、あれば `update_row`
      - name: files_yaml
        title: 管理用の YAML
        type: str
        description: 行を持つ（持つべき）管理用の YAML の配信元の直下からのパス
  - name: PostWriteResponse
    title: 書き込みの後の通知の応答
    container: project_index/features/post_write/types.py
    usecase: 書き込みの後の通知
    role: DTO
    summary: 通知するファイルの判定と、文脈に追加する文面
    description: '`pydantic.BaseModel`。'
    properties:
      - name: notices
        title: 通知
        type: list[Notice]
        description: 今回通知するファイル。通知しないファイルは含めない
      - name: additional_context
        title: 文面
        type: str
        description: '`notices` が空なら空文字'
constants:
  - name: NOTICE_PROMPT_ID
    title: 文面のプロンプトの ID
    container: project_index/features/post_write/types.py
    usecase: 書き込みの後の通知
    summary: 通知の文面を描画するプロンプト（`content/prompts/hooks/post-write-notice.yaml`）の ID
    value: '"hooks/post-write-notice"'
  - name: RULE_INDEX_FILE
    title: ルールの索引のファイル名
    container: project_index/features/post_write/types.py
    usecase: 書き込みの後の通知
    summary: 配信元のフォルダの直下にあると、文面にルールの索引の 1 行を追加する rule-inject の索引
    value: '"rules.yaml"'
refs:
  - to: IF-35
    type: requires
    when: インターフェース定義『書き込みの後の通知の判定』の入出力を変えるときに、この設計書の型を合わせる。
visibility: internal
tags:
  - name: topic:通知
    main: true
  - name: topic:型ヒント
  - name: topic:メタデータ
