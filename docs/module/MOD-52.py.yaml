id: MOD-52
title: 索引のサーバー / 検索 / fields.py
lead: 項目の値・計算項目・使える項目・見出しの行を受け持ち、検索の fields.py を修正するときに参照する。
tags:
  - name: topic:クエリ
    main: true
  - name: action:検索
  - name: action:絞り込み
test_files:
  - tests/unit/project_index/features/search/test_fields.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        条件の確かめ ..> 使える項目
        条件の照合 ..> 項目の値
        本文の範囲の選択 ..> 見出しの行
        nav の警告 ..> 行の metadata の項目
        class 条件の確かめ {
          <<function>>
        }
        class 条件の照合 {
          <<function>>
        }
        class 使える項目 {
          <<function>>
        }
        class 項目の値 {
          <<function>>
        }
        class 見出しの行 {
          <<function>>
        }
        class 本文の範囲の選択 {
          <<function>>
        }
        class nav の警告 {
          <<function>>
        }
        class 行の metadata の項目 {
          <<function>>
        }
        click 条件の確かめ href "id:MOD-53#functions[check_filter]"
        click 条件の照合 href "id:MOD-53#functions[match_filter]"
        click 本文の範囲の選択 href "id:MOD-50#functions[select_ranges]"
        click nav の警告 href "id:MOD-76#functions[nav_warnings]"
constants:
  - name: COMPUTED_FIELDS
    title: 計算項目
    container: project_index/features/search/fields.py
    usecase: 検索
    summary: 文書から計算する項目
    value: '("@chars", "@path", "@sections", "@matches")'
  - name: DATE_FIELDS
    title: 日時の項目
    container: project_index/features/search/fields.py
    usecase: 検索
    summary: 値を日時として比べ、空なら並べ替えの末尾にする項目
    value: '("created", "updated")'
functions:
  - name: field_values
    title: 項目の値
    kind: 関数
    container: project_index/features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: 文書から項目の値を引き、比べられる値の並びにする
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 引く文書
      - name: field
        title: 項目
        type: str
        required: true
        passing: positional
        description: 項目
      - name: columns
        title: 共通のキーの列
        type: Mapping[str, str]
        required: false
        passing: keyword
        default: '{}'
        description: 文書の行の `metadata`（共通のキー → 列名）
    returns:
      type: list[Any]
      description: 値の並び。配列の項目は要素、値が無ければ空
    process: |-
      1. 項目で引き方を決める
         - `id`・`kind` の場合、文書の属性
         - `created`・`updated` の場合、文書の日時（無ければ空）
         - メタデータのキー（`METADATA_KEYS`）の場合、`document.metadata`
         - `body` の場合、本文
         - `*` の場合、`data` の全ての文字列の葉と本文
         - `@chars` は本文の文字数、`@path` は `document.path`（`records` の行は `{path}#{record_index}`）、`@sections` は Markdownの本文かが `True` の文書なら本文の見出しの文字列、それ以外は `data` の最上位のキーの並び
         - `@matches` は条件で決まり文書だけでは決まらないので、値を持たない（文書の検索が当たった行の数で数える）
         - `columns` のキーで `METADATA_KEYS` に無い場合、`data` から対応付けた列（`columns[項目]`）を項目の取得で取得する
         - それ以外は `data` を項目の取得で引く（`a[].b` は要素ごとの値の配列）
      2. 値が配列なら要素を、`None` なら空、それ以外は 1 要素の並びを返す
    unit_tests:
      - name: test_field_values
        case: 正常
        summary: 項目の種類ごとの値
        condition: '`tags: [a, b]`・`data.owner.name: x`・本文 `# 見出し`'
        mock: なし
        expected: '`tags` が `[a, b]`、`owner.name` が `[x]`、`@chars` が本文の文字数、`missing` が `[]`'
      - name: test_field_values_when_columns
        case: 正常
        summary: 行の metadata で対応付けた列の値
        condition: '`data.section: 使い方`、`columns: {category: section, name: title}`、`document.metadata.name: a`、項目 `category` と `name`'
        mock: なし
        expected: '`category` が `[使い方]`、`name` が `[a]`（`METADATA_KEYS` のキーは `document.metadata` のまま）'
      - name: test_field_values_when_array_item_keys
        case: 正常
        summary: 配列の中のオブジェクトのキーの値
        condition: '`data.uses: [{id: compare}, {id: list}, {name: x}]`、項目 `uses[].id`'
        mock: なし
        expected: '`[compare, list]`（`id` を持たない要素は入らない）'
  - name: known_fields
    title: 使える項目
    kind: 関数
    container: project_index/features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: 配信元の種類のスキーマから、条件・並べ替え・集計に使える項目の一覧を作る
    scope: public
    thread_safe: true
    args:
      - name: schemas
        title: 種類のスキーマ
        type: Iterable[Mapping[str, Any]]
        required: true
        passing: positional
        description: 読む文書に当てるスキーマ（`records` の行は 1 行のスキーマ）
    returns:
      type: dict[str, str]
      description: 項目のパス → 型（`string`・`number`・`boolean`・`array`・`object`・`date`）
    process: |-
      1. `id`・`kind`・`created`・`updated`・`METADATA_KEYS`・`body`・`*`・`COMPUTED_FIELDS` を入れる
      2. スキーマの `properties` を再帰でたどり、`a.b` のパスと `type`（`format: date`・`date-time` は `date`）を足す。配列の `items` の `properties` は `a[].b` のパスで追加し（入れ子の配列は `a[].b[].c`）、`a.b` のパスでは追加しない。最上位のスキーマの `items` は `[]` を付けずにたどる
      3. 型の食い違う同じパスは `string` にする
    unit_tests:
      - name: test_known_fields_when_array_items
        case: 正常
        summary: 配列の中のオブジェクトのキー
        condition: 'スキーマが `uses: {type: array, items: {type: object, properties: {id: {type: string}, refs: {type: array, items: {type: object, properties: {to: {type: string}}}}}}}` と `category: {type: object, properties: {id: {type: string}}}` を持つ'
        mock: なし
        expected: '`uses` が `array`、`uses[].id` が `string`、`uses[].refs[].to` が `string`、`category.id` が `string`。`uses.id`・`uses.refs.to` が無い'
  - name: heading_lines
    title: 見出しの行
    kind: 関数
    container: project_index/features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: Markdown の行の並びから、見出しの行番号・階層・文字列を集める（コードブロックの中は除く）
    description: '`@sections` の見出しの文字列（内部の `_headings`）もこの関数で作る。`HEADING` は `#` の並びを名前つきのグループで取り、階層にする。'
    scope: public
    thread_safe: true
    args:
      - name: lines
        title: 行
        type: Sequence[str]
        required: true
        passing: positional
        description: 本文の行の並び
    returns:
      type: list[Heading]
      description: 本文の先頭からの見出し
    process: |-
      1. 行を先頭からたどり、`FENCE` に当たる行でコードブロックの内外を切り替える
      2. コードブロックの外で `HEADING` に当たる行を、行番号（1 始まり）・`#` の数・見出しの文字列の `Heading` にする
    unit_tests:
      - name: test_heading_lines
        case: 正常
        summary: 階層とコードブロック
        condition: '`["# a", "", "## b ##", "```", "## c", "```", "### d"]`'
        mock: なし
        expected: '`Heading(1, 1, "a")`・`Heading(3, 2, "b")`・`Heading(7, 3, "d")`（`c` を含まない）'
    status: planned
  - name: as_datetime
    title: 日時への変換
    kind: 関数
    container: project_index/features/search/fields.py
    usecase: 検索
    role: 変換
    summary: 日時・日付・ISO 8601 の文字列を日時にする
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: object
        required: true
        passing: positional
        description: 項目の値
    returns:
      type: datetime | None
      description: 日時。日時にできない値は `None`
    process: |-
      1. 値の型で変換する
         - `datetime` の場合、そのまま返す
         - `date` の場合、その日の 0 時を端末のタイムゾーンの日時にして返す
         - `str` の場合、`datetime.fromisoformat` で読んで返す。読めなければ `None` を返す
         - それ以外の場合、`None` を返す
  - name: with_metadata_fields
    title: 行の metadata の項目
    kind: 関数
    container: project_index/features/search/fields.py
    usecase: 画面の構成の書き込み
    role: 読み取り
    summary: 使える項目に、文書の行の `metadata` で対応付けたキーを、対応付けた列の型で加える
    description: '`nav` の条件の確かめと数え（nav の警告・画面の構成の書き込み）だけが呼ぶ。`search_docs`・`list_changes` の使える項目は変えない。'
    scope: public
    thread_safe: true
    args:
      - name: fields
        title: 使える項目
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 使える項目の結果
      - name: rows
        title: 文書の行と行の使える項目
        type: Iterable[tuple[DocumentTable, Mapping[str, str]]]
        required: true
        passing: positional
        description: 有効な `documents[]` の行と、その行の文書に当てるスキーマだけで作った使える項目の組
    returns:
      type: dict[str, str]
      description: 項目のパス → 型。`fields` の複製にキーを加えたもの
    process: |-
      1. `fields` を複製する
      2. 行の並びの順に `metadata` のキーと列名をたどり、複製に無いキーを加える（`METADATA_KEYS`・スキーマの項目と、先の行で加えたキーは変えない）
         - 型は、その行の使える項目の列名（そのままの文字列）の型。無ければ `string`
      3. 加えた結果を返却する
    unit_tests:
      - name: test_with_metadata_fields
        case: 正常
        summary: 対応付けた列の型で加える
        condition: '行の使える項目が `section: string`・`labels: array`、行の `metadata` が `{category: section, kinds: labels, area: meta.area, all: "**.section", name: title}`'
        mock: なし
        expected: '`category` が `string`、`kinds` が `array`、`area` と `all` が `string`（そのままの列名が行の使える項目に無い）、`name` は `fields` のまま。引数の `fields` は変わらない'
      - name: test_with_metadata_fields_when_rows_differ
        case: 正常
        summary: 行ごとに型が食い違うキーと他の行のスキーマ
        condition: '行 A（使える項目に `section` が無い）の `metadata` が `{order: section}`、行 B（`section: number`・`labels: array`）の `metadata` が `{order: labels}`。`fields` は両方の行を合わせた使える項目'
        mock: なし
        expected: '`order` が `string`（先の行 A の型。行 B の `section: number` は使用しない）'
visibility: internal
