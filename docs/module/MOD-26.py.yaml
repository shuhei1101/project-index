id: MOD-26
title: 索引のサーバー / 文書のストア / indexable.py
lead: たどるフォルダと、管理用の YAML に記載するファイルの判定を受け持ち、文書のストアの indexable.py を修正するときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: topic:キャッシュ
  - name: action:読み込み
test_files:
  - tests/unit/project_index/features/documents/test_indexable.py
constants:
  - name: SKIP_DIRS
    title: たどらないフォルダ
    container: project_index/features/documents/indexable.py
    usecase: 共通
    summary: ファイルをたどるときに中に入らないフォルダ名
    value: frozenset({".git", "node_modules", "__pycache__", ".venv"})
  - name: SKIP_PATHS
    title: たどらないパス
    container: project_index/features/documents/indexable.py
    usecase: 共通
    summary: ファイルをたどるときに中に入らないフォルダの `root` からのパス（配信元の設定の `worktrees` の既定と同じ場所）
    value: frozenset({".claude/worktrees"})
  - name: BINARY_SNIFF_BYTES
    title: バイナリの判定で読む長さ
    container: project_index/features/documents/indexable.py
    usecase: 共通
    summary: 先頭のこのバイト数に NUL バイトがあればバイナリとみなす
    value: '8192'
  - name: LOCAL_FILE_PATTERN
    title: ローカル運用のファイル名
    container: project_index/features/documents/indexable.py
    usecase: 共通
    summary: 管理用の YAML に載せない `*.local.*` のファイル名の glob
    value: "'*.local.*'"
    description: ローカル運用の設定・管理用の YAML・スキーマと、Git が追跡しない `settings.local.json` などを除く。`fnmatch` でファイル名だけに当てる
functions:
  - name: walk_files
    title: 中をたどるファイルの列挙
    container: project_index/features/documents/indexable.py
    usecase: 共通
    role: 読み取り
    summary: フォルダの配下のファイルを、たどらないフォルダを飛ばして `root` からのパスで返す
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: start
        title: たどり始めるフォルダ
        type: str
        required: false
        default: '"."'
        passing: keyword
        description: '`root` からのパス。このフォルダの配下だけをたどる'
    returns:
      type: Iterator[str]
      description: '`root` からのパス（`/` 区切り）。順は `os.walk` のまま'
    process: |-
      1. `root / start` を `os.walk`（`followlinks=False`）でたどる。シンボリックリンクのフォルダには `os.walk` が入らないので、フォルダごとに `os.path.islink` を呼ばない
      2. 各フォルダで、`SKIP_DIRS` の名前のフォルダ・`root` からのパスが `SKIP_PATHS` にあるフォルダをたどる先から外す
      3. ファイルごとに `root` からのパスを作って返す
    unit_tests:
      - name: test_walk_files
        case: 正常
        summary: たどらないフォルダを飛ばす
        condition: '`a/x.md`・`.git/c`・`node_modules/m.js`・`.claude/worktrees/wt/y.md`・`.claude/z.md` を置く'
        mock: なし（`tmp_path`）
        expected: 昇順にして `[".claude/z.md", "a/x.md"]`
        exception: '-'
      - name: test_walk_files_when_start_given
        case: 正常
        summary: 始めるフォルダの配下だけをたどる
        condition: '`a/x.md`・`b/y.md` を置き、`start="a"`'
        mock: なし（`tmp_path`）
        expected: '`["a/x.md"]`'
        exception: '-'
      - name: test_walk_files_when_symlink_folder
        case: 正常
        summary: シンボリックリンクのフォルダをたどらない
        condition: '`a/x.md` と、`a` を指すシンボリックリンク `l` を置く'
        mock: なし（`tmp_path`）
        expected: '`["a/x.md"]`'
        exception: '-'
  - name: is_excluded_file
    title: 除外の条件の判定
    container: project_index/features/documents/indexable.py
    usecase: 共通
    role: 判定
    summary: ファイルが管理用の YAML に載せない除外の条件（バイナリ・空のファイル・`*.local.*` の名前のファイル）に当たるか
    description: 配信元によらず同じ固定の判定を使う。配信元に固有の除外は `documents[].exclude[]` が担う。
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: path
        title: ファイルのパス
        type: str
        required: true
        passing: positional
        description: '`root` からのパス'
    returns:
      type: bool
      description: 除外の条件に当たれば `True`
    process: |-
      1. ファイル名が `LOCAL_FILE_PATTERN`（`*.local.*`）に当たれば `True`
      2. ファイルの大きさが 0 バイトなら `True`
      3. ファイルの先頭 `BINARY_SNIFF_BYTES` バイトを読み、NUL バイトがあれば `True`
      4. それ以外は `False`
         - 手順 2・3 で `OSError` の場合、`False`（読めないファイルは読み込みの問題として別に出る）
    unit_tests:
      - name: test_is_excluded_file_when_binary
        case: 正常
        summary: NUL バイトを持つファイル
        condition: 先頭に NUL バイトを持つ `logo.png` を置く
        mock: なし（`tmp_path`）
        expected: '`True`'
        exception: '-'
      - name: test_is_excluded_file_when_empty
        case: 正常
        summary: 空のファイル
        condition: 0 バイトの `a/__init__.py` を置き、比べるために docstring と `from .x import y` だけの `b/__init__.py` も置く
        mock: なし（`tmp_path`）
        expected: '`a/__init__.py` が `True`、`b/__init__.py` が `False`'
        exception: '-'
      - name: test_is_excluded_file_when_generated_and_lock
        case: 正常
        summary: 生成物・ロック・ベンダーのコードは載せる
        condition: '`uv.lock`・`package-lock.json`・`src/vendor/a.py`・`web/dist/app.js`・`api_pb2.py`・`app.min.js` を置く'
        mock: なし（`tmp_path`）
        expected: どれも `False`
        exception: '-'
      - name: test_is_excluded_file_when_source
        case: 正常
        summary: 通常のコードは載せる
        condition: '`src/a.py`・`docs/a.md` を置く'
        mock: なし（`tmp_path`）
        expected: どちらも `False`
        exception: '-'
      - name: test_is_excluded_file_when_local_name
        case: 正常
        summary: '`*.local.*` の名前のファイル'
        condition: '`files.local.yaml`・`src/settings.local.json` を置き、比べるために `local.py`・`docs/locale.md` も置く'
        mock: なし（`tmp_path`）
        expected: '`files.local.yaml`・`src/settings.local.json` が `True`、`local.py`・`docs/locale.md` が `False`'
        exception: '-'
  - name: indexable_files
    title: 載せるファイルの一覧
    container: project_index/features/documents/indexable.py
    usecase: 載せるファイルの一覧
    role: 読み取り
    summary: 範囲の glob に当たるファイルのうち、除外の名前・除外のパス・除外の条件に当たらないものを返す
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: paths
        title: 範囲
        type: list[str]
        required: true
        passing: positional
        description: '`root` からの glob（`documents[].paths` と同じ書き方）'
      - name: exclude
        title: 除外の名前
        type: list[str]
        required: false
        default: '[]'
        passing: keyword
        description: ファイル名の glob。`/` を含む値は `root` からのパスの glob（`documents[].exclude[]` と同じ書き方）
      - name: exclude_paths
        title: 除外のパス
        type: list[str]
        required: false
        default: '[]'
        passing: keyword
        description: '`root` からのパスの glob（`documents[].paths` と同じ書き方）'
    returns:
      type: list[str]
      description: '`root` からのパスの昇順'
    process: |-
      1. `paths`・`exclude` を持つ文書の行（`DocumentTable`。`id` は `files`、`schema_path` は空）を作り、ファイルの収集（`collect_files`）で集める
      2. `exclude_paths` のどれかにパス全体が当たる（`PurePosixPath.full_match`。文書の行の `paths` と同じ判定）パスと、除外の条件の判定（`is_excluded_file`）が `True` のパスを除いて返す
    unit_tests:
      - name: test_indexable_files
        case: 正常
        summary: 除外の条件に当たるファイルを除く
        condition: '`src/a.py`・`src/b.py`・空の `src/pkg/__init__.py`・`src/uv.lock`・`.claude/worktrees/wt/src/c.py` を置き、`paths=["**"]`'
        mock: なし（`tmp_path`）
        expected: '`["src/a.py", "src/b.py", "src/uv.lock"]`'
        exception: '-'
      - name: test_indexable_files_when_exclude_given
        case: 正常
        summary: 除外の名前に当たるファイルも除く
        condition: '`src/a.py`・`src/b.py` を置き、`paths=["src/**"]`・`exclude=["b.py"]`'
        mock: なし（`tmp_path`）
        expected: '`["src/a.py"]`'
        exception: '-'
      - name: test_indexable_files_when_exclude_paths_given
        case: 正常
        summary: 除外のパスに当たるファイルも除く
        condition: '`src/a.py`・`content/prompts/p.yaml`・`content/readme.md` を置き、`paths=["**"]`・`exclude_paths=["content/prompts/**/*.yaml"]`'
        mock: なし（`tmp_path`）
        expected: '`["content/readme.md", "src/a.py"]`'
        exception: '-'
      - name: test_indexable_files_when_exclude_has_path
        case: 正常
        summary: 除外の名前に `/` を含む値はパスで当てる
        condition: '`src/a.py`・`src/b.py`・`lib/b.py` を置き、`paths=["**"]`・`exclude=["src/b.py"]`'
        mock: なし（`tmp_path`）
        expected: '`["lib/b.py", "src/a.py"]`'
        exception: '-'
  - name: walk_tree
    title: フォルダごとの列挙
    kind: 関数
    container: project_index/features/documents/indexable.py
    usecase: 読み取り
    role: 列挙
    summary: 中をたどるファイルの一覧と、たどったフォルダごとの更新日時を返す
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: たどるフォルダ
    returns:
      type: tuple[list[str], dict[str, int]]
      description: (`root` からのファイルのパスの一覧, `root` からのフォルダのパス（`root` は `.`）→ `st_mtime_ns`)
    process: |-
      1. 中をたどるファイルの列挙と同じに `os.walk` でたどり、同じフォルダを飛ばす
      2. たどったフォルダごとに `os.stat` の `st_mtime_ns` を記録する（たどる途中で無くなったフォルダは記録しない）
      3. ファイルの一覧とフォルダの更新日時を返す
    unit_tests:
      - name: test_walk_tree
        case: 正常
        summary: ファイルとフォルダの更新日時
        condition: '`a.yaml`・`rules/b.yaml`・空のフォルダ `empty/`・`node_modules/x.js` を置く'
        mock: なし（`tmp_path`）
        expected: ファイルは `a.yaml`・`rules/b.yaml`、フォルダは `.`・`rules`・`empty` で、それぞれの `st_mtime_ns` を持ち、`node_modules` は無い
visibility: internal
