id: MOD-65
title: 索引のサーバー / 端末の設定 / route.py
lead: 端末の設定のルーター（`GET`・`PUT`・`POST /settings/sources`）を受け持ち、端末の設定の route.py を修正するときに参照する。
test_files:
  - tests/unit/project_index/features/settings/test_route.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        端末の設定の入口 ..> 配信元の保存 : PUT
        端末の設定の入口 ..> 同じオリジンの確認 : PUT の前
