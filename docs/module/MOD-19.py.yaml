id: MOD-19
title: 索引のサーバー / 説明 / render.py
lead: '`describe` の結果の Markdown を受け持ち、説明の render.py を修正するときに参照する。'
tags:
  - name: topic:配信元
    main: true
  - name: topic:警告
  - name: action:案内
  - name: action:描画
test_files:
  - tests/unit/project_index/features/describe/test_render.py
functions:
  - name: render_describe_markdown
    title: 説明の Markdown
    kind: 関数
    container: project_index/features/describe/render.py
    usecase: 説明
    role: 変換
    summary: '`format: markdown` の本文を作る'
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 結果
        type: SourceListResult | SourceGuideResult | KindSchemaResult
        required: true
        passing: positional
        description: 描く結果
    returns:
      type: str
      description: Markdown
    process: |-
      1. 配信元の説明書と種類のスキーマは、`outside_scope` が `True` なら先頭に `作業範囲の外（参考）` の行を置く
      2. 使える配信元の一覧は、`作業場所: {cwd}（{配信元} のクローン本体 / ワークツリー）` の行と `| source | 権限 | description | when | 直コミット |` の表（作業中の配信元は権限に `（作業中）`。`when` 列は行を `<br>` でつなぎ、無ければ空。`直コミット` 列は `direct_commit_kinds` を `, ` でつなぎ、無ければ空）。`outside_sources` が `None` でなければ、空行・`作業範囲の外（参考）` の行・`| source | description | when |` の表を続ける（0 件は表の代わりに `なし` の行）。使える配信元が 0 件のときは、表の代わりに `使用できる配信元はありません。配信元にするときは /project-index:setup を実行します。` の行を置く。`warnings` が空でなければ、空行・`注意:` の行・警告ごとに `- {警告}` の行を続ける
      3. 配信元の説明書は、`when` が空でなければ `使う場面:` の行と行ごとの `- {行}` を置いて空行を挟み、`instructions` をそのまま置き、`| kind | description |` の表を続ける（`sqlite` が真の種類は description の後ろに `（SQLite の表の行・読み取り専用）` を付ける）。`direct_commit` があれば、空行・`直コミット:` の行・`- ブランチ: {ブランチ}`・（`branches` があれば）`- 上書きできるブランチ: {, で繋いだ名前}`・`- 種類: {, で繋いだ種類}`（`metadata_only_kinds` にある種類は、種類の ID の後ろに `（メタデータだけ）` を付ける）の行を続ける。`refs` があれば `ブランチ: {,で繋いだ名前}`・`タグ: {同じ}` の行、`worktrees` があれば `| ワークツリー | ブランチ |` の表を続ける
      4. 種類のスキーマは、`metadata` が空でなければ `| 共通のキー | 列名 |` の表を置き、```yaml でスキーマの YAML を囲む。`columns` があれば、YAML の代わりに `| 列 | 型 | 説明 |` の表と `SQLite の表の行の種類です。write_docs・delete_docs と list_changes の対象外です。` の行を置く
    unit_tests:
      - name: test_render_describe_markdown_when_source_when
        case: 正常
        summary: 使う場面の列と見出し
        condition: '一覧の sample の `when` が 2 行、notes が空。作業範囲の外の other の `when` が 1 行。説明書の `when` が 2 行と空のもの'
        mock: なし
        expected: '`| sample | write（作業中） | ... | {1 行目}<br>{2 行目} |`・notes の `when` 列が空・other の行に `when` がある。説明書は `使う場面:` と `- {行}` が `instructions` の前にあり、`when` が空の説明書には `使う場面:` が無い'
      - name: test_render_describe_markdown
        case: 正常
        summary: 一覧の表
        condition: sample（write・作業中）と notes（read）
        mock: なし
        expected: '`| sample | write（作業中） | ... |` と `| notes | read | ... |` の行'
      - name: test_render_describe_markdown_when_outside_sources
        case: 正常
        summary: 作業範囲の外で参照できる配信元の表
        condition: sample（write・作業中）と、`outside_sources` に other
        mock: なし
        expected: 使える配信元の表の後ろに `作業範囲の外（参考）` の行と `| other | ... |` の行があり、`outside_sources` が `None` の一覧には `作業範囲の外（参考）` の行が無い
      - name: test_render_describe_markdown_when_outside_sources_empty
        case: 正常
        summary: 作業範囲の外で参照できる配信元が 0 件
        condition: '`outside_sources` が空のリスト'
        mock: なし
        expected: '`作業範囲の外（参考）` の行の次が `なし` の行で、`| source | description |` の表が無い'
      - name: test_render_describe_markdown_when_warnings
        case: 正常
        summary: 注意の一覧
        condition: sample（write・作業中）と、`warnings` に 1 件
        mock: なし
        expected: 表の後に `注意:` の行と `- {警告}` の行があり、`warnings` が空の一覧には `注意:` の行が無い
      - name: test_render_describe_markdown_when_no_source
        case: 正常
        summary: 使える配信元が無い
        condition: '`sources` が空、`warnings` に 1 件'
        mock: なし
        expected: '`| source | 権限 | description |` の表が無く、`/project-index:setup` の行と `注意:` の行がある'
      - name: test_render_describe_markdown_when_metadata
        case: 正常
        summary: メタデータの対応の表
        condition: '`metadata` が `{name: title}` の種類のスキーマ'
        mock: なし
        expected: '`| name | title |` の行が YAML のコードブロックの前にある'
      - name: test_render_describe_markdown_when_outside_scope
        case: 正常
        summary: 作業範囲の外の表示
        condition: '`outside_scope: true` の配信元の説明書'
        mock: なし
        expected: 先頭の行が `作業範囲の外（参考）`
        exception: '-'
      - name: test_render_describe_markdown_when_direct_commit
        case: 正常
        summary: 直コミットの列と案内
        condition: '一覧の sample の `direct_commit_kinds` が `[note]`、notes が空。説明書の `direct_commit` が `branch: develop`・`branches: [data]`・`kinds: [note]`'
        mock: なし
        expected: 'sample の行の `直コミット` 列が `note`、notes の行が空。説明書は種類の表の後に `直コミット:`・`- ブランチ: develop`・`- 上書きできるブランチ: data`・`- 種類: note` の行がある'
      - name: test_render_describe_markdown_when_sqlite_kind
        case: 正常
        summary: SQLite の表の行の種類の列の表と対象外の旨
        condition: '`columns` が `id`（text）・`tags`（json）の種類のスキーマと、`sqlite` が真の種類 `notes_db` を持つ配信元の説明書'
        mock: なし
        expected: 種類のスキーマは `| id | text | ID |`・`| tags | json | タグ |` の行と対象外の旨の行を持ち ```yaml を持たない。説明書の `notes_db` の行に `（SQLite の表の行・読み取り専用）` が付く
      - name: test_render_describe_markdown_when_metadata_only_kinds
        case: 正常
        summary: 本文の直コミットを断る種類に印を付ける
        condition: '説明書の `direct_commit` が `branch: develop`・`kinds: [note, files]`・`metadata_only_kinds: [files]`'
        mock: なし
        expected: '`- 種類: note, files（メタデータだけ）` の行を出す'
visibility: internal
