id: MOD-106
title: 索引のサーバー / 会話の記録
lead: |-
  会話キーごとに返却した文書・前回参照した内容・閲覧と編集を SQLite に記録する会話の記録の分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
directory: |-
  ```text
  src/project_index/features/seen/
  ├─ __init__.py   # 公開する型と SeenStore の再エクスポート
  ├─ types.py      # SessionKey / LastRead / Activity / ReturnKind / ActivityKind
  └─ store.py      # SeenStore（SQLite への記録と読み出し）
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        会話の記録 ..> 会話キー : 受ける
        会話の記録 ..> 前回読んだ内容 : 返す
        会話の記録 ..> 閲覧と編集 : 返す
        class 会話の記録 {
          +返却済み(会話キー, 配信元, 種類, バージョン) set
          +返したことを記録する(会話キー, 配信元, 種類, 文書) None
          +前回読んだ内容(会話キー, 配信元, ID) dict
          +閲覧と編集を記録する(会話キー, 配信元, ID, 種類) None
          +閲覧と編集(会話キー, 配信元) list
          +会話の記録を消す(会話キー) int
          +古い記録の削除() int
        }
        class 会話キー {
          +セッションの ID: str
          +エージェントの ID: str
        }
        class 前回読んだ内容 {
          +ID: str
          +バージョン: str
          +内容: str
        }
        class 閲覧と編集 {
          +ID: str
          +種類: str
          +日時: datetime
        }
        click 会話の記録 href "id:MOD-59#classes[SeenStore]"
        click 会話キー href "id:MOD-60#data_models[SessionKey]"
        click 前回読んだ内容 href "id:MOD-60#data_models[LastRead]"
        click 閲覧と編集 href "id:MOD-60#data_models[Activity]"
notes:
  受け持つこと: |-
    1 セッション 1 回の省略・`list_changes` の前回読んだ時点・`trace_related` の関連の候補が読む。
