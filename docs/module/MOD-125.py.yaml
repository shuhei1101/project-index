functions:
  - name: get_source_config
    title: 配信元の設定の取得
    kind: 関数
    container: project_index/features/read/service.py
    usecase: 配信元の設定の取得
    role: サービス
    summary: 配信元の設定のうち、`nav`・`documents[]`（スクリプトのコマンドを除く）・`decisions.folders`・`github`・`diff` と、求めたときだけ行ごとの種類のスキーマを返す
    scope: public
    args:
      - name: target
        title: 読み取りの場所
        type: Target
        required: true
        passing: positional
        description: 読み取りの場所（`read_target`、`ref` なし）が返したもの
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 種類のスキーマを読む
      - name: schemas
        title: スキーマを求めるか
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: '`True` のとき、`schemas` に行ごとの種類のスキーマを入れる'
    returns:
      type: SourceConfigResponse
      description: 配信元の設定の応答
    process: |-
      1. 重ねた後の配信元の設定（`target.source.config`）から `nav`・`documents`・`decisions`・`github` を取り出す
      2. `documents[]` の各行から `validators`・`converters`・`generators` のコマンドを除く
      3. `decisions` が無ければ `{folders: []}` にする
      4. `diff` に `{ignore_keys: 配信元の設定の diff_ignore_keys}` を入れる
      5. `schemas` が `True` の場合、有効な `documents[]` の行ごとに `store.row_schema(target, 行の id)` を行の id をキーにして入れる。`False` なら `None` にする
    unit_tests:
      - name: test_get_source_config
        case: 正常
        summary: 画面が使うキーだけを返す
        condition: '`nav`・`documents[]`・`decisions.folders`・`github`・`converters[]` を持つ配信元'
        mock: なし（一時フォルダの配信元）
        expected: '`nav`・`documents`・`decisions`・`github`・`diff` を返し、`converters[]` のコマンドを含まず、`schemas` が `None`'
      - name: test_get_source_config_when_diff
        case: 正常
        summary: diff の値と既定の値
        condition: '`diff.ignore_keys` に `["updated", "rev"]` を書いた配信元と、`diff` を書いていない配信元'
        mock: なし（一時フォルダの配信元）
        expected: '`diff` が `{"ignore_keys": ["updated", "rev"]}` と `{"ignore_keys": ["updated"]}`'
      - name: test_get_source_config_when_schemas
        case: 正常
        summary: 行ごとの種類のスキーマを返す
        condition: '`$ref` を持つスキーマの種類 `design` と、`records: files` の種類 `files_guide` を持つ配信元で、`schemas` が `True`'
        mock: なし（一時フォルダの配信元）
        expected: '`schemas` のキーが `design`・`files_guide` で、値がそれぞれ `store.row_schema` と同じ'
      - name: test_get_source_config_when_no_decisions
        case: 正常
        summary: decisions を持たない
        condition: '`decisions` の無い配信元'
        mock: なし
        expected: '`decisions.folders` が空'
  - name: list_documents
    title: 文書の一覧
    kind: 関数
    container: project_index/features/read/service.py
    usecase: 文書の一覧
    role: サービス
    summary: 読み取りの場所の文書の ID・パス・種類・メタデータを、`documents[]` の行の順に返す
    scope: public
    args:
      - name: target
        title: 読み取りの場所
        type: Target
        required: true
        passing: positional
        description: 読み取りの場所（`read_target`）が返したもの
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読み込む
      - name: values
        title: 値を求めるか
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: '`True` のとき、各要素の `value` に文書の値を入れる'
      - name: common_keys
        title: 共通のキーを求めるか
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: '`True` のとき、各要素の `common_keys` に文書の `metadata` を入れる'
    returns:
      type: DocumentListResponse
      description: 文書の一覧の応答
    process: |-
      1. `store.load(target)` で文書を読み込む
      2. 文書ごとに `id`・`path`・`kind`・メタデータ（`name`・`description`・`tags`・`visibility`）・`body_path`・`version` と、`values` が `True` のときだけ `value`（文書の `data`）、`common_keys` が `True` のときだけ `common_keys`（文書の `metadata`）を `DocumentListEntry` にする
      3. `documents[]` の行の順、行の中はパスの順に並べ、`ref` に解決したリビジョンの名前を入れて返す
    unit_tests:
      - name: test_list_documents
        case: 正常
        summary: 行の順に並べる
        condition: 種類 `design` の YAML 2 件と、`files.yaml` の行の文書 1 件
        mock: なし（一時フォルダの配信元）
        expected: 3 件が行の順に並び、行の文書だけが `body_path` を持ち、各要素が文書の `version` を持ち、`value` と `common_keys` が `None`
      - name: test_list_documents_when_values
        case: 正常
        summary: 値を求めたときだけ値を入れる
        condition: 同じ配信元で `values` が `True`
        mock: なし（一時フォルダの配信元）
        expected: YAML の文書の `value` が YAML の値、行の文書の `value` が行の値
      - name: test_list_documents_when_common_keys
        case: 正常
        summary: 共通のキーを求めたときだけ文書の metadata を入れる
        condition: 種類 `design` の行が `metadata`（`related` を列名 `links` から取る）と `alias_type` を持つ配信元で、`common_keys` が `True`
        mock: なし（一時フォルダの配信元）
        expected: YAML の文書の `common_keys` が文書の `metadata` と同じで、`related` に `links` の値、`alias_type` に行の値を持ち、`value` が `None`
  - name: get_document
    title: 文書の取得
    kind: 関数
    container: project_index/features/read/service.py
    usecase: 文書の取得
    role: サービス
    summary: パスの文書の値・種類のスキーマ・メタデータを返し、`converters[]` を指す種類だけ変換する
    scope: public
    args:
      - name: target
        title: 読み取りの場所
        type: Target
        required: true
        passing: positional
        description: 読み取りの場所（`read_target`）が返したもの
      - name: path
        title: パス
        type: str
        required: true
        passing: positional
        description: 文書のファイルか本文のファイルのパス
      - name: doc_id
        title: 文書の ID
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 文書の取得の `id`
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書と種類のスキーマを読む
      - name: converter
        title: 変換
        type: ConvertService
        required: true
        passing: injected
        description: '`converters[]` を指す種類の変換'
    returns:
      type: DocumentValueResponse
      description: 文書の取得の応答
    process: |-
      1. `store.load(target)` の文書から、`path` の文書を引く（文書のページの特定。文書のファイル、無ければ本文のファイルが `path` と同じ最初の文書。`doc_id` を指したときは、そのうち文書の ID が `doc_id` と同じ文書）
         - 無い場合、`DocumentNotFoundError` を送出する
      2. 文書の値・種類のスキーマ（`store.row_schema(target, kind)` の `$ref` を解いた形）・メタデータ（`common_keys` に文書の `metadata` を入れる）・本文と本文のファイルのパス（管理用の YAML の行の文書だけ）を集める
         - YAML として読み込めない文書は、`value` を `None` にし、ファイルのパスと行と列を `conversion_error` に入れる
      3. 文書の種類の行が `converter` を持つ場合だけ、`converter.convert(target, document)` の `markdown` か `failure` を入れる
      4. `updated_at` に、Git の配信元はそのリビジョンでファイルを最後に変えた commit の日時、Git 管理外の配信元はファイルの更新日時を入れる
    exceptions:
      - name: DocumentNotFoundError
        condition: '`path` の文書が無い'
        message: '`{path}: 文書がありません`'
        notes: '入口が 404（`missing: doc`）にする'
    unit_tests:
      - name: test_get_document
        case: 正常
        summary: 値とスキーマを返し、変換しない
        condition: '`converters[]` を指さない種類の YAML の文書'
        mock: なし（一時フォルダの配信元）
        expected: '`value` が YAML の値、`schema` が種類のスキーマ、`metadata.common_keys` が文書の `metadata`、`markdown` が `None` で、`ConvertService.convert` を呼ばない'
      - name: test_get_document_when_body_path
        case: 正常
        summary: 本文のファイルのパスで引く
        condition: '`files.yaml` の行が `guide.md` を本文に持つ配信元で、`path` が `guide.md`'
        mock: なし
        expected: '`value` が行の値、`body` が `guide.md` の本文、`body_path` が `guide.md`'
      - name: test_get_document_when_doc_id
        case: 正常
        summary: 文書の ID で行の文書を選ぶ
        condition: '`terms.yaml` に `body_file` の無い行 `term-1`・`term-2` を持つ配信元で、`path` が `terms.yaml`・`doc_id` が `term-2`'
        mock: なし
        expected: '`value` が `term-2` の行の値、`metadata.id` が `term-2`'
      - name: test_get_document_when_converter
        case: 正常
        summary: converters[] を指す種類はスクリプトの Markdown を返す
        condition: '`converters[]` を指す種類の文書'
        mock: '`ConvertService.convert`（`# 変換した` を返す偽物）'
        expected: '`markdown` が `# 変換した`'
      - name: test_get_document_when_yaml_broken
        case: 正常
        summary: YAML を読み込めない文書
        condition: 読み込めない YAML の文書
        mock: なし
        expected: '`value` が `None` で、`conversion_error` にファイルのパスと行と列'
      - name: test_get_document_when_not_found
        case: 異常
        summary: 無いパス
        condition: '`path` が `no/such.yaml`'
        mock: なし
        expected: '`DocumentNotFoundError`'
        exception: 文書が無い
      - name: test_get_document_when_doc_id_not_found
        case: 異常
        summary: 文書の ID が一致しない
        condition: '`path` が `terms.yaml`・`doc_id` が `no-such`'
        mock: なし
        expected: '`DocumentNotFoundError`'
        exception: 文書が無い
  - name: list_decisions
    title: 検討事項の ID の一覧
    kind: 関数
    container: project_index/features/read/service.py
    usecase: 検討事項の ID の一覧
    role: サービス
    summary: '`decisions.folders` にある検討事項の ID と、ID ごとに当たるフォルダの数を返す'
    scope: public
    args:
      - name: source
        title: 配信元
        type: Source
        required: true
        passing: positional
        description: 読み取りの場所が解決した配信元
    returns:
      type: list[DecisionItem]
      description: ID の順に並べた一覧
    process: |-
      1. 検討事項の文書を探す（`find_decisions`）で、フォルダごとに `DECISION_ID` に当たるファイル名の ID を集める
      2. ID ごとにフォルダの数を数え、ID の順に返す
    unit_tests:
      - name: test_list_decisions
        case: 正常
        summary: フォルダの数を数える
        condition: 1 つ目のフォルダに `D-1`・`D-2`、2 つ目に `D-2` を置く
        mock: なし（一時フォルダ）
        expected: '`D-1` が 1、`D-2` が 2'
  - name: get_decision
    title: 検討事項の文書の取得
    kind: 関数
    container: project_index/features/read/service.py
    usecase: 検討事項の文書の取得
    role: サービス
    summary: '`decisions.folders` のうちちょうど 1 つのフォルダにある検討事項の文書の本文を返す'
    scope: public
    args:
      - name: source
        title: 配信元
        type: Source
        required: true
        passing: positional
        description: 読み取りの場所が解決した配信元
      - name: decision_id
        title: 検討事項の ID
        type: str
        required: true
        passing: positional
        description: 検討事項の ID
    returns:
      type: DecisionResponse
      description: 検討事項の文書の応答
    process: |-
      1. `decision_id` が `DECISION_ID` に当たらなければ `DecisionNotFoundError`（`reason` は `not_found`）を送出する
      2. 検討事項の文書を探す（`find_decisions`）で、`{フォルダ}/DECISION_DOCS_DIR/{ID}.md` があるフォルダを集める
         - 0 個の場合、`DecisionNotFoundError`（`reason` は `not_found`）を送出する
         - 2 個以上の場合、`DecisionNotFoundError`（`reason` は `ambiguous`、`folders` に当たったフォルダ）を送出する
      3. ファイルを UTF-8 で読み、変換せずに `body` に入れて返す
    exceptions:
      - name: DecisionNotFoundError
        condition: ID の形式に当たらない、当たるフォルダが 0 個か 2 個以上
        message: '`{ID}: 検討事項の文書が 1 つに決まりません`'
        notes: '`ProjectIndexError` の子。入口が 404（`missing: doc`・`reason`・`folders`）にする'
    unit_tests:
      - name: test_get_decision
        case: 正常
        summary: 1 つのフォルダにある文書を返す
        condition: 1 つ目のフォルダにだけ `D-1.md`
        mock: なし（一時フォルダ）
        expected: '`body` が `D-1.md` の本文、`folder` が 1 つ目のフォルダ'
      - name: test_get_decision_when_ambiguous
        case: 異常
        summary: 2 つのフォルダにある
        condition: '`D-2.md` を 2 つのフォルダに置く'
        mock: なし
        expected: '`DecisionNotFoundError` で `reason` が `ambiguous`、`folders` が 2 つ'
        exception: 1 つに決まらない
      - name: test_get_decision_when_invalid_id
        case: 異常
        summary: 形式に当たらない ID
        condition: '`decision_id` が `../secret`'
        mock: なし
        expected: '`DecisionNotFoundError` で、ファイルを読まない'
        exception: 形式に当たらない
