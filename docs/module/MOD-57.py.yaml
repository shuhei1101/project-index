id: MOD-57
title: 索引のサーバー / 検索 / terms.py
lead: 用語の一覧と、その Markdown を受け持ち、検索の terms.py を修正するときに参照する。
tags:
  - name: topic:クエリ
    main: true
  - name: action:検索
  - name: action:絞り込み
  - name: topic:用語
test_files:
  - tests/unit/project_index/features/search/test_terms.py
functions:
  - name: list_match_words
    title: 用語の一覧
    kind: 関数
    container: project_index/features/search/terms.py
    usecase: 用語の一覧
    role: サービス
    summary: '`alias_type` を持つ行の文書から、照合する語を指す文書の ID とともに返す'
    scope: public
    thread_safe: true
    args:
      - name: request
        title: 用語の一覧の要求
        type: MatchWordsRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
    returns:
      type: MatchWordsResult
      description: 照合する語の並び
    process: |-
      1. 読む場所を解く（読む場所の解決。`source`・`worktree`・`cwd`）
      2. 文書を集める（文書のストア.文書を集める）
      3. 除外の判定（`exclusion_flags(target, documents, store=store, today=今日)`）を求める。`include_excluded` が `False` の場合、該当する文書を除き、除いた文書のうち `alias_type` を持つ行の文書の数を数える
      4. エイリアスの集め（文書のストア）をし、`entries` で照合する単語の一覧を作る（`alias_type` を持つ行が無い配信元は空）。`include_excluded` が `True` の場合、該当する文書の ID を指す単語の `excluded` を `True` にする
      5. 数えた件数が 1 件以上なら `excluded_count` に入れて返却する
    exceptions:
      - name: SourceNotReadableError
        condition: 読む場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から参照できません`'
      - name: SourceNotServedError
        condition: 読む場所の解決が送る
        message: '`{id} は配信していません`'
    unit_tests:
      - name: test_list_match_words
        case: 正常
        summary: 用語の語と違反した文書の除外
        condition: '「作業範囲」（`aliases: [scope, 担当範囲]`）と「壊れた用語」（`aliases: 3`）を持つ sample'
        mock: なし（一時フォルダの配信元）
        expected: '`words` が `作業範囲`・`scope`・`担当範囲` の 3 件で、壊れた用語の語が無い'
        exception: '-'
      - name: test_list_match_words_when_no_alias_rows
        case: 正常
        summary: 用語の種類が無い
        condition: '`alias_type` を持つ行が無い配信元'
        mock: なし（一時フォルダの配信元）
        expected: '`words` が空'
        exception: '-'
      - name: test_list_match_words_when_search_excluded
        case: 正常
        summary: 除く文書の単語を既定で除き、指定で excluded を付ける
        condition: '行 `assets`（`metadata: {status: state, name: title, description: summary}`・`alias_type: term`・`search_exclude: {field: status, op: eq, values: [inactive]}`）の `a1`（active）・`a2`（inactive）。`include_excluded` が `False` と `True`'
        mock: なし（一時フォルダの配信元）
        expected: '`False` は `words` が `アセット1` だけで `excluded_count` が 1。`True` は `アセット2` も並び、その単語だけ `excluded` が `True`、`excluded_count` が `None`'
        exception: '-'
  - name: render_match_words_markdown
    title: 用語の一覧の文
    kind: 関数
    container: project_index/features/search/terms.py
    usecase: 用語の一覧
    role: 表示
    summary: 用語の一覧の結果を `| 単語 | 文書 | 種類 |` の表にする（除外の単語があれば `除外` の列を加える）
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 用語の一覧の結果
        type: MatchWordsResult
        required: true
        passing: positional
        description: 用語の一覧の戻り値
    returns:
      type: str
      description: Markdown。語が無ければ `用語はありません`
    process: |-
      1. 語が無ければ `用語はありません` を返す
      2. `| 単語 | 文書 | 種類 |` の表に単語ごとの行を並べる。`excluded` が `True` の単語が 1 つ以上あれば、末尾に `除外` の列を加えて該当する行に ✓ を出す
      3. `excluded_count` があれば、表の後に文書の検索と同じ通知（`excluded_note`）を続けて返却する（単語が無いときも続ける）
    unit_tests:
      - name: test_render_match_words_markdown
        case: 正常
        summary: 表と空
        condition: 語 3 件と、空の結果
        mock: なし
        expected: インターフェース定義の返り値例と同じ表と、`用語はありません`
      - name: test_render_match_words_markdown_when_excluded
        case: 正常
        summary: 除外の列と除いた件数の通知
        condition: '`excluded` が `True` の単語を含む結果と、`excluded_count` が 1 の結果'
        mock: なし
        expected: '前者は表に `除外` の列があり該当する行に ✓、後者は表の後に除いた件数と `include_excluded: true` で取得できること'
visibility: internal
