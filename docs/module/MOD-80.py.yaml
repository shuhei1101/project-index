        click 文書の書き込み href "id:MOD-84#functions[write_docs]"
        click 文書の削除 href "id:MOD-84#functions[delete_docs]"
functions:
  - name: apply_operation
    title: 操作を当てる
    kind: 関数
    container: project_index/features/write/apply.py
    usecase: 書き込み
    role: 変換
    summary: 文書の内容に 1 件の操作を当てた新しい内容を返す
    scope: public
    thread_safe: true
    args:
      - name: current
        title: 今の内容
        type: Mapping[str, Any] | None
        required: true
        passing: positional
        description: '`create` は `None`'
      - name: operation
        title: 操作
        type: Operation
        required: true
        passing: positional
        description: 当てる操作
      - name: schema
        title: スキーマ
        type: Mapping[str, Any] | None
        required: false
        default: None
        passing: keyword
        description: 文書 1 件の内容に当てるスキーマ（文書のストアの `row_schema`）。`text_edits[].field`・`add_to`・`remove_from` のキー・`unset` の要素の参照の型の項目のパスの解決と、`remove_from` の配列の `x-key` の取得に使用する
    returns:
      type: dict[str, Any]
      description: 新しい内容（`current` は書き換えない）
    process: |-
      1. `data`・`set` の `@body` のキーと、`field` が `@body` の `text_edits` は当てずに除く（本文の適用が当てる）
      2. `create`・`replace` は `data` の深いコピーを返す
      3. `update` は `current` の深いコピーに順に当てる
         - `set` の値は、オブジェクトなら今の値へ再帰でマージし、配列とスカラーは置き換える（項目の書き込み）
         - `unset` は要素を『項目の削除』（`schema` を渡す）で削除する。無い項目は飛ばす。要素を解けない（`InvalidArgumentError`。要素の選び方を含む・`#` で始まるパスを解けない）場合は、送られた理由で `unset.{要素}` の違反にする
         - `remove_from` はキーを『配列の項目の解決』（`create=False`。`schema` が `None` なら空のスキーマ）で解いた配列から削除する（`None` なら何もしない。配列でなければ違反）
           - 『配列の x-key の取得』が `None` の配列は、渡した値と等しい要素を全て除く（該当しない値は何もしない）
           - `x-key` を持つ配列は、オブジェクトの値はその値と等しい要素、オブジェクトでない値は要素が辞書で `x-key` のキーの値がその値と等しい要素を、削除する要素とする
           - 削除する要素が有るかは、除く前の配列で値ごとに判定する。1 つも無い値があれば、値ごとに `remove_from.{キー}` の違反（`rule` に削除する要素が無い値を入れる）にし、その配列は除かない
           - 違反が無ければ、どれかの値の削除する要素に当たる要素を全て除く
         - `add_to` はキーを『配列の項目の解決』（`create=True`。`schema` が `None` なら空のスキーマ）で解いた配列の末尾へ足す（配列でなければ違反。`#` で始まるキーは項目を作らない）。`remove_from` の後に当てる
         - `add_to`・`remove_from` のキーを解けない（`InvalidArgumentError`）場合は、送られた理由で `add_to.{キー}`・`remove_from.{キー}` の違反にする
         - `text_edits` は文字列の項目の `old` を `new` にする。`field` が `#` で始まる場合は、`#` の後を『参照の型の項目のパスの解決』で `schema` と今の内容からキーと位置の並びに解き、その並びで取得して『並びで指した項目の書き込み』で書く（解けなければ `text_edits[{n}].field` の違反。`schema` が `None` なら空のスキーマで解き、配列は `x-key` を持たない違反になる）。`#` で始まらない項目のパスを解けない場合と、取得した値が文字列でない場合も `text_edits[{n}].field` の違反。この 3 つの違反は `rule` をそのままにし、`fix` に『項目のパスの指し方の案内』（通る配列が全て `x-key` を持つときは `#` と `x-key` の値で指す、`x-key` を持たない配列を 1 つでも通るときは `#` を付けずに全ての配列を位置で指す、配列・オブジェクトそのものは `set`・`add_to`・`remove_from` で書き換える）を入れる。`replace_all` が `False` で一致が 1 か所でない場合は違反
      4. 違反は `Violation`（`path` は `set.a.b`・`text_edits[0].old` など。`old` の違反の `fix` に一致した数と、`replace_all` か前後の文字を含めること。`text_edits[{n}].field` の違反の `fix` は『項目のパスの指し方の案内』）を集めて `InvalidArgumentError` で送る
    exceptions:
      - name: InvalidArgumentError
        condition: 配列でない項目への追加・削除、`x-key` を持つ配列への `remove_from` の値に削除する要素が無い、`add_to`・`remove_from` のキーと `unset` の要素を解けない（要素の選び方を含む・`#` で始まるパスを解けない）、文字列でない項目への置き換え、`old` の一致が 1 か所でない
        message: '`操作を適用できません`'
    unit_tests:
      - name: test_apply_operation
        case: 正常
        summary: 部分更新の組み合わせ
        condition: '`{a: {b: 1, c: 2}, tags: [a, b], d: x}` に `set: {a: {b: 9}}`・`unset: [d]`・`add_to: {tags: [c]}`・`remove_from: {tags: [a]}`'
        mock: なし
        expected: '`{a: {b: 9, c: 2}, tags: [b, c]}`。`current` は変わらない'
      - name: test_apply_operation_when_text_edit_ambiguous
        case: 異常
        summary: 一致が 2 か所
        condition: '`description: "aXbXc"` に `{field: description, old: X, new: Y}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `text_edits[0].old`、`fix` に `2`'
        exception: '`old` の一致が 1 か所でない'
      - name: test_apply_operation_when_replace
        case: 正常
        summary: 置き換え
        condition: '`{a: 1, b: 2}` に `replace` の `data: {a: 3}`'
        mock: なし
        expected: '`{a: 3}`'
      - name: test_apply_operation_when_body
        case: 正常
        summary: '@body を要素に当てない'
        condition: '`create` の `data: {id: n2, path: n2.md, @body: 本文}` と、`update` の `set: {@body: x}`・`text_edits: [{field: @body, old: a, new: b}]`'
        mock: なし
        expected: '`create` の結果が `{id: n2, path: n2.md}` で、`update` の結果が `current` と同じ'
      - name: test_apply_operation_when_text_edit_ref_path
        case: 正常
        summary: 参照の型の項目のパスで配列の要素の中を置き換える
        condition: '`functions`（`x-key: name`）が `load`・`save`・`save` でどれも `process: a書き出す` の内容に、`text_edits: [{field: "#functions[save#2].process", old: 書き出す, new: 保存する}]` とスキーマ'
        mock: なし
        expected: 3 つ目の要素の `process` だけが `a保存する` になる
      - name: test_apply_operation_when_text_edit_ref_path_unresolved
        case: 異常
        summary: 参照の型の項目のパスが要素を指せない
        condition: 同じ内容に `#functions[missing].process` の `text_edits`
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `text_edits[0].field`、`fix` に `#functions[save].process`・位置で指す書き方・`set`・`add_to`・`remove_from`'
        exception: 該当する要素が無い
      - name: test_apply_operation_when_add_to_ref_path
        case: 正常
        summary: 参照の型の項目のパスで要素の中の配列へ追加・削除する
        condition: '`models`（`x-key: name`）が `{name: Row, properties: [a]}`・`{name: Col, properties: [b]}` の内容とスキーマに、`add_to: {"#models[Row].properties": [c]}`・`remove_from: {"#models[Row].properties": [a]}`'
        mock: なし
        expected: Row の `properties` が `[c]` で、Col の `properties` は `[b]` のまま
      - name: test_apply_operation_when_add_to_selector_path
        case: 異常
        summary: '`#` で始まらず要素の選び方を含むキー'
        condition: '同じ内容に `add_to: {"models[Row].properties": [d]}` と、`remove_from: {"models[Row].properties": [a]}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `add_to.models[Row].properties`・`remove_from.models[Row].properties`'
        exception: 要素の選び方を含む
      - name: test_apply_operation_when_add_to_ref_path_unresolved
        case: 異常
        summary: 参照の型の項目のパスを解けない・配列でない
        condition: '同じ内容に `add_to: {"#models[Zzz].properties": [d]}` と `remove_from: {"#models[Row].name": [d]}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `add_to.#models[Zzz].properties`・`remove_from.#models[Row].name`'
        exception: 要素が無い・配列でない
      - name: test_apply_operation_when_add_to_index_path
        case: 正常
        summary: 位置で指すキーは今までどおり
        condition: '`{functions: [{name: f}]}` に `add_to: {"functions[0].refs": [x]}`'
        mock: なし
        expected: '`{functions: [{name: f, refs: [x]}]}`'
      - name: test_apply_operation_when_unset_ref_path
        case: 正常
        summary: 参照の型の項目のパスで要素の中の項目を削除する
        condition: '同じ `models` の内容とスキーマに `unset: ["#models[Col].properties"]`'
        mock: なし
        expected: 'Col の要素が `{name: Col}` で、Row の `properties` は `[a]` のまま'
      - name: test_apply_operation_when_unset_unresolved
        case: 異常
        summary: '`unset` の要素を解けない'
        condition: '同じ内容とスキーマに `unset: ["models[Row].properties", "#models[Zzz].properties"]`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `unset.models[Row].properties`・`unset.#models[Zzz].properties`'
        exception: 要素の選び方を含む・要素が無い
      - name: test_apply_operation_when_remove_from_x_key
        case: 正常
        summary: x-key の値と要素のオブジェクトで削除する
        condition: '`flows`（`x-key: name`）が `{name: A, summary: s1}`・`{name: B, summary: s2}`・`{name: C, summary: s3}` の内容とスキーマに、`remove_from: {flows: [B, {name: C, summary: s3}, B]}`'
        mock: なし
        expected: '`flows` が `{name: A, summary: s1}` の 1 要素（同じ要素を指す値が 2 つあっても違反にしない）'
        exception: '-'
      - name: test_apply_operation_when_remove_from_x_key_missing
        case: 異常
        summary: x-key を持つ配列に削除する要素が無い値
        condition: '同じ内容とスキーマに `remove_from: {flows: [A, Z, {name: A, summary: x}]}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反が 2 件で、`path` がどちらも `remove_from.flows`、`rule` に `Z` と `{name: A, summary: x}` が入る。`current` は変わらない'
        exception: 削除する要素が無い
      - name: test_apply_operation_when_remove_from_without_x_key
        case: 正常
        summary: x-key を持たない配列は今までどおり
        condition: '`notes`（`x-key` を持たない文字列の配列）が `[a, b]` の内容とスキーマに `remove_from: {notes: [b, z]}`'
        mock: なし
        expected: '`notes` が `[a]` で違反は無い'
        exception: '-'
      - name: test_apply_operation_when_remove_then_add
        case: 正常
        summary: 1 つの操作で削除してから追加する
        condition: '`flows` の同じ内容とスキーマに `remove_from: {flows: [A]}` と `add_to: {flows: [{name: A, summary: s9}]}`、`x-key` を持たない `notes: [a]` に `remove_from: {notes: [a]}` と `add_to: {notes: [a]}`'
        mock: なし
        expected: '`flows` が B・C・`{name: A, summary: s9}` の順、`notes` が `[a]`'
        exception: '-'
      - name: test_apply_operation_when_text_edit_not_string
        case: 異常
        summary: 文字列でない項目を指す
        condition: 同じ内容に `#` で始まらない `functions[save].process` の `text_edits`（`[save]` はキー `save` が真の要素を選び、値が配列になる）
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `text_edits[0].field`、`rule` が `文字列ではない項目は置き換えられません`、`fix` が `test_apply_operation_when_text_edit_ref_path_unresolved` と同じ案内'
        exception: 文字列でない項目への置き換え
  - name: to_columns
    title: 列名への読み替え
    kind: 関数
    container: project_index/features/write/apply.py
    usecase: 書き込み
    role: 変換
    summary: 操作のキーのうち、種類の行の `metadata` に書いた共通のキーを列名へ読み替えた操作を返す
    scope: public
    thread_safe: true
    args:
      - name: operation
        title: 操作
        type: Operation
        required: true
        passing: positional
        description: 読み替える操作
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: '`create` は `kind` の行、`update`・`replace` は文書の種類の行'
      - name: index
        title: 操作の添字
        type: int
        required: true
        passing: keyword
        description: 違反の `path` に付ける `operations` の位置
    returns:
      type: Operation
      description: 読み替えた新しい操作（`operation` は書き換えない）
    process: |-
      1. `table.metadata` が空なら `operation` をそのまま返す
      2. `set`・`add_to`・`remove_from` のキー、`unset` の要素、`text_edits[].field` の項目のパスは、先頭のキー（『項目のパスの分解』の最初の要素）が `metadata` のキーなら、そのキーを列名に置き換えたパスにする（`name.x` と `name: title` なら `title.x`、入れ子の列名は `.` でつなぐ）
      3. `data` は、`metadata` のキーでないキーをそのまま複製し、`metadata` のキーの値を列名のパスへ『項目の書き込み』で入れた辞書にする
      4. 読み替えたパスが、同じ操作の同じ項目（`set`・`data` など）の読み替えなかったキーと同じ列を指す場合、`path` が `operations[{index}].{項目}.{共通のキー}`、`rule` が `{共通のキー} と {列名} は同じ列を指します`、`fix` がどちらか 1 つだけを渡すことの違反で `InvalidArgumentError` を送る
      5. 読み替えた操作を返す
    exceptions:
      - name: InvalidArgumentError
        condition: 共通のキーとその列名を同じ操作に両方渡した
        message: '`引数が正しくありません: {違反の数} 件`'
    unit_tests:
      - name: test_to_columns
        case: 正常
        summary: update の項目のパスを読み替える
        condition: '`metadata` が `{name: title, description: meta.summary}`、`update` の `set: {name: A, tags: [x]}`・`unset: [description]`・`text_edits: [{field: name, old: a, new: b}]`'
        mock: なし
        expected: '`set` が `{title: A, tags: [x]}`、`unset` が `[meta.summary]`、`text_edits[0].field` が `title`。元の操作は変わらない'
        exception: '-'
      - name: test_to_columns_when_data
        case: 正常
        summary: create の data を列へ入れる
        condition: '同じ `metadata` で `create` の `data: {name: A, description: d, tags: [x]}`'
        mock: なし
        expected: '`data` が `{title: A, meta: {summary: d}, tags: [x]}`'
        exception: '-'
      - name: test_to_columns_when_column_name
        case: 正常
        summary: 列名をそのまま渡す
        condition: '同じ `metadata` で `set: {title: A}`、もう 1 つは `metadata` が空の行で `set: {name: A}`'
        mock: なし
        expected: どちらも `set` が渡したまま
        exception: '-'
      - name: test_to_columns_when_both
        case: 異常
        summary: 共通のキーと列名を両方渡す
        condition: '同じ `metadata` で `index=2`、`set: {name: a, title: b}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `operations[2].set.name`、`rule` に `title`'
        exception: 共通のキーとその列名を同じ操作に両方渡した
  - name: expand_array_keys
    title: オブジェクトの配列への書き戻し
    kind: 関数
    container: project_index/features/write/apply.py
    usecase: 書き込み
    role: 変換
    summary: '`metadata` の列名が `[]`・`[{キー}]` を含む共通のキーへの操作を、オブジェクトの配列の列の置き換えにした操作を返す'
    scope: public
    thread_safe: true
    args:
      - name: operation
        title: 操作
        type: Operation
        required: true
        passing: positional
        description: 書き戻す操作
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: '`create` は `kind` の行、`update`・`replace` は文書の種類の行'
      - name: current
        title: 今の内容
        type: Mapping[str, Any] | None
        required: true
        passing: positional
        description: '`update` は文書の今の内容。`create`・`replace` は `None`'
      - name: index
        title: 操作の添字
        type: int
        required: true
        passing: keyword
        description: 違反の `path` に付ける `operations` の位置
    returns:
      type: Operation
      description: 書き戻した新しい操作（`operation` は書き換えない）
    process: |-
      1. `table.metadata` のうち、列名が `**.` で始まる共通のキー（どの深さの列もまとめるキー。例 `related: **.refs[]`）を集める。`data`・`set`・`add_to`・`remove_from` のキー、`unset` の要素、`text_edits[].field` のうち、項目のパスの先頭のキーが集めたキーのものを、`path` が `operations[{index}].{項目}.{キー}`（`unset` は `operations[{index}].unset`、`text_edits` は `operations[{index}].text_edits[{n}].field`）、`rule` が `{共通のキー} は文書の中の複数の列（{列名}）をまとめたキーで、書き込めません`、`fix` が列名の項目のパス（`refs`・`functions[0].refs` など）で指定することの違反にし、違反があれば操作を当てずに `InvalidArgumentError` で送る
      2. `table.metadata` のうち、列名が `**.` で始まらず `{配列}[].{項目}`（全ての要素のキー。例 `tags: tags[].name`）か `{配列}[{真偽値のキー}].{項目}`（選んだ要素のキー。例 `main_tags: tags[main].name`）の共通のキーを集める。無ければ `operation` をそのまま返す
      3. `text_edits[].field` が集めたキーを指す場合、`path` が `operations[{index}].text_edits[{n}].field`、`rule` が `{共通のキー} は文字列の項目ではありません` の違反にする
      4. `data`・`set`・`add_to`・`remove_from` の集めたキーの値が、要素が全て文字列のリストでない場合（オブジェクトの配列・文字列 1 つなど）、`path` が `operations[{index}].{項目}.{共通のキー}`、`rule` が `{共通のキー} は名前（文字列）の配列で指定します` の違反にする
      5. 3・4 の違反があれば、操作を当てずに `InvalidArgumentError` で送る
      6. 配列ごとに、元の配列を複製する。`update` は `current` の値、`create`・`replace` は `data` の列名の値（無ければ空の配列）
      7. 全ての要素のキーへの操作を当てる
         - `set` は渡した名前の並びで配列を作り直す。元からあった名前の要素は `main` を含む他のキーを保ち、無い名前は `{項目: 名前}` の要素にする
         - `remove_from` は項目が渡した名前の要素を削除する
         - `add_to` は配列に無い名前を `{項目: 名前}` の要素で末尾に追加する（`remove_from` の後に当てる）
         - `unset` は配列の列を削除する
         - `create`・`replace` の `data` の値は `set` と同じに当てる
      8. 選んだ要素のキーへの操作を当てる
         - `set` は渡した名前の要素の真偽値のキーを `true` にし、他の要素の真偽値のキーを削除する
         - `remove_from` は渡した名前の要素の真偽値のキーを削除する（無い名前は飛ばす）
         - `add_to` は渡した名前の要素の真偽値のキーを `true` にする（`remove_from` の後に当てる）
         - `unset` は全ての要素の真偽値のキーを削除する
         - `set`・`add_to`・`data` に配列に無い名前がある場合、`path` が `operations[{index}].{項目}.{共通のキー}`、`rule` が `{名前} は {全ての要素のキー} にありません` の違反にする
      9. 8 の違反があれば `InvalidArgumentError` で送る
      10. 集めたキーを各項目から除き、配列の列名へ作り直した配列を書く操作（`update` は `set`、`create`・`replace` は `data`。`unset` で列を削除したときは `unset`）にして返す
    exceptions:
      - name: InvalidArgumentError
        condition: 列名が `**.` で始まる共通のキーへの操作を渡した、集めたキーに名前（文字列）の配列でない値を渡した、選んだ要素のキーに配列に無い名前を渡した、または `text_edits` で指した
        message: '`引数が正しくありません: {違反の数} 件`'
    unit_tests:
      - name: test_expand_array_keys
        case: 正常
        summary: 全ての要素のキーの追加・削除・置き換え
        condition: '`metadata` が `{tags: tags[].name, main_tags: tags[main].name}`、今の内容が `{tags: [{name: a, main: true}, {name: b}]}`。`add_to: {tags: [c]}`・`remove_from: {tags: [b]}`・`set: {tags: [a, c, d]}` を別々に当てる'
        mock: なし
        expected: '`set.tags` がそれぞれ `[{name: a, main: true}, {name: b}, {name: c}]`・`[{name: a, main: true}]`・`[{name: a, main: true}, {name: c}, {name: d}]`'
        exception: '-'
      - name: test_expand_array_keys_when_main
        case: 正常
        summary: 選んだ要素のキーの操作
        condition: '同じ `metadata`、今の内容が `{tags: [{name: a, main: true}, {name: c}, {name: d}]}`。`set: {main_tags: [c]}`・`add_to: {main_tags: [d]}`・`remove_from: {main_tags: [a]}`・`unset: [main_tags]` を別々に当てる'
        mock: なし
        expected: '`set.tags` の `main` が、`c` だけ・`a` と `d`・無し・無しになる'
        exception: '-'
      - name: test_expand_array_keys_when_create
        case: 正常
        summary: create の data
        condition: '同じ `metadata` で `create` の `data: {name: r2, tags: [a, b], main_tags: [b]}`'
        mock: なし
        expected: '`data` が `{name: r2, tags: [{name: a}, {name: b, main: true}]}` で `main_tags` を持たない'
        exception: '-'
      - name: test_expand_array_keys_when_unknown_name
        case: 異常
        summary: 配列に無い名前
        condition: '同じ `metadata` と今の内容で `index=1`、`set: {main_tags: [z]}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `operations[1].set.main_tags`、`rule` に `z`'
        exception: 集めたキーに名前（文字列）の配列でない値を渡した、選んだ要素のキーに配列に無い名前を渡した、または `text_edits` で指した
      - name: test_expand_array_keys_when_plain
        case: 正常
        summary: '[] を使わない行'
        condition: '`metadata` が `{name: title}` で `set: {tags: [x]}`'
        mock: なし
        expected: 渡した操作のまま
        exception: '-'
      - name: test_expand_array_keys_when_objects
        case: 異常
        summary: 要素が文字列でない配列
        condition: '同じ `metadata` と今の内容で `index=2`。`create` の `data: {name: r2, tags: [{name: a, main: true}]}`・`add_to: {tags: [{name: c}]}`・`remove_from: {main_tags: [{name: a}]}` を別々に当てる'
        mock: なし
        expected: どれも `InvalidArgumentError` で、違反の `path` が `operations[2].data.tags`・`operations[2].add_to.tags`・`operations[2].remove_from.main_tags`、`rule` に `名前（文字列）の配列`。`TypeError` にならない
        exception: 集めたキーに名前（文字列）の配列でない値を渡した、選んだ要素のキーに配列に無い名前を渡した、または `text_edits` で指した
      - name: test_expand_array_keys_when_string
        case: 異常
        summary: 配列でなく文字列 1 つ
        condition: '同じ `metadata` と今の内容で `index=0`。`set: {tags: a}`・`set: {main_tags: a}` を別々に当てる'
        mock: なし
        expected: 'どちらも `InvalidArgumentError` で、違反の `path` が `operations[0].set.tags`・`operations[0].set.main_tags`。`a` の 1 文字のタグを書かない'
        exception: 集めたキーに名前（文字列）の配列でない値を渡した、選んだ要素のキーに配列に無い名前を渡した、または `text_edits` で指した
      - name: test_expand_array_keys_when_any_depth
        case: 異常
        summary: どの深さの列もまとめるキーへの操作
        condition: '`metadata` が `{related: "**.refs[]"}` で `index=0`。`set: {related: []}`・`unset: [related]`・`create` の `data: {related: []}`・`text_edits: [{field: related, old: a, new: b}]` を別々に当てる'
        mock: なし
        expected: '`InvalidArgumentError` で、違反の `path` が `operations[0].set.related`・`operations[0].unset`・`operations[0].data.related`・`operations[0].text_edits[0].field`、`rule` に `**.refs[]`'
        exception: 列名が `**.` で始まる共通のキーへの操作を渡した、集めたキーに名前（文字列）の配列でない値を渡した、選んだ要素のキーに配列に無い名前を渡した、または `text_edits` で指した
      - name: test_expand_array_keys_when_any_depth_column_name
        case: 正常
        summary: どの深さの列もまとめるキーの列名をそのまま渡す
        condition: '`metadata` が `{related: "**.refs[]"}` で `set: {refs: []}`'
        mock: なし
        expected: 渡した操作のまま
        exception: '-'
      - name: test_expand_array_keys_when_remove_then_add
        case: 正常
        summary: 同じ名前を remove_from と add_to に渡す
        condition: '`{tags: [{name: a, main: true}, {name: b}]}` に `remove_from: {tags: [b], main_tags: [a]}` と `add_to: {tags: [b], main_tags: [a]}`'
        mock: なし
        expected: '`tags` が `[{name: a, main: true}, {name: b}]`（削除してから追加し、`b` も `a` の `main` も残る）'
        exception: '-'
  - name: apply_body
    title: 本文の適用
    kind: 関数
    container: project_index/features/write/apply.py
    usecase: 書き込み
    role: 変換
    summary: 操作の `@body` を本文に当てて、新しい本文を返す
    scope: public
    thread_safe: true
    args:
      - name: current_body
        title: 今の本文
        type: str | None
        required: true
        passing: positional
        description: '`update`・`replace` は今の文書の本文。`create` は `None`'
      - name: operation
        title: 操作
        type: Operation
        required: true
        passing: positional
        description: 当てる操作
      - name: index
        title: 操作の添字
        type: int
        required: true
        passing: keyword
        description: 違反の `path` に付ける `operations` の位置
    returns:
      type: str | None
      description: 新しい本文。本文を変えない操作は `None`
    process: |-
      1. `create`・`replace` の `data`、`update` の `set` の `@body` が文字列でなければ、`path` が `operations[{index}].data.@body`（`update` は `set.@body`）の違反で `InvalidArgumentError` を送る
      2. `create`・`replace` は `data` の `@body`（無ければ `None`）を返す
      3. `update` は、`set` に `@body` があればその値、無ければ `current_body` を本文にし、`field` が `@body` の `text_edits` を順に当てる。一致の判定と違反は、項目の操作の適用の `text_edits` と同じ（`path` は `operations[{index}].text_edits[{n}].old`）
      4. `update` で `set` の `@body` も `@body` の `text_edits` も無ければ `None` を返す
      5. 違反があれば `InvalidArgumentError` で送る
    exceptions:
      - name: InvalidArgumentError
        condition: '`@body` が文字列でないか、`replace_all` が `False` の `@body` の `text_edits` の `old` が 1 か所に一致しない'
        message: '`引数が正しくありません: {違反の数} 件`'
    unit_tests:
      - name: test_apply_body
        case: 正常
        summary: create・set・text_edits の本文
        condition: '`create` の `data.@body` が `本文`、`update` の `set: {@body: x}`、`current_body` が `a\nb` で `text_edits: [{field: @body, old: b, new: c}]`、`set: {name: y}` だけの `update`'
        mock: なし
        expected: '`本文`・`x`・`a\nc`・`None`'
      - name: test_apply_body_when_text_edit_ambiguous
        case: 異常
        summary: 本文の old が 2 か所に一致する
        condition: '`current_body` が `a a`、`index=1` で `text_edits: [{field: @body, old: a, new: b}]`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `operations[1].text_edits[0].old`'
        exception: '`replace_all` が `False` の `@body` の `text_edits` の `old` が 1 か所に一致しない'
      - name: test_apply_body_when_not_string
        case: 異常
        summary: 文字列でない @body
        condition: '`index=0` で、`update` の `set: {@body: null}` と `create` の `data: {id: n2, path: n2.md, @body: 123}`'
        mock: なし
        expected: どちらも `InvalidArgumentError` で、違反の `path` が `operations[0].set.@body`・`operations[0].data.@body`
        exception: '`@body` が文字列でない'
visibility: internal
