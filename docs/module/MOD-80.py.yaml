id: MOD-80
title: 索引のサーバー / 書き込み / apply.py
lead: 項目の操作の適用と、共通のキーの列名への読み替えを受け持ち、書き込みの apply.py を修正するときに参照する。
tags:
  - name: topic:文書
    main: true
  - name: action:書き込み
  - name: action:検証
  - name: tool:ruamel.yaml
test_files:
  - tests/unit/project_index/features/write/test_apply.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の書き込み ..> オブジェクトの配列への書き戻し
        文書の書き込み ..> 列名への読み替え
        文書の書き込み ..> 操作を当てる
        文書の削除 ..> 操作を当てる : related を外す
        class 文書の書き込み {
          <<function>>
        }
        class 文書の削除 {
          <<function>>
        }
        class オブジェクトの配列への書き戻し {
          <<function>>
        }
        class 列名への読み替え {
          <<function>>
        }
