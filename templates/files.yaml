# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v9.2.0/schemas/knowledge-files.schema.yaml
files:
- path: files.schema.yaml
  name: 配信元に配置する管理用の YAML のスキーマの雛形
  description: setup が配信元へコピーする管理用の YAML のスキーマを受け持ち、管理用の YAML の行のキーを追加・修正するときに参照する。
  tags:
  - topic:スキーマ
  - topic:テンプレート
  - topic:セットアップ
  related:
  - to: SC-5
    type: see_also
- path: project-index.yaml
  name: 配信元の設定の雛形
  description: setup が新しい配信元に作る `project-index.yaml` の既定の行（管理用の YAML の行とプロンプトの行）を受け持ち、配信元の設定の既定値を修正するときに参照する。
  tags:
  - topic:テンプレート
  - topic:設定
  - topic:セットアップ
  related:
  - to: SC-5
    type: see_also
- path: settings.yaml
  name: 端末の設定の雛形
  description: global-setup が作る端末の設定の既定の内容を受け持ち、端末の設定の既定値と記載例を修正するときに参照する。
  tags:
  - topic:テンプレート
  - topic:端末の設定
  - topic:セットアップ
  related:
  - to: SC-2
    type: see_also
- path: feedback/project-index.yaml
  name: 会話の指摘の置き場所の配信元の設定の雛形
  description: feedback が指摘の置き場所に作る `project-index.yaml` の文書の行（ファイルと用語）を受け持ち、指摘の置き場所の配信元の設定を修正するときに参照する。
  tags:
  - topic:テンプレート
  - topic:設定
  - topic:用語
  related:
  - to: SC-13
    type: see_also
- path: feedback/terms.schema.yaml
  name: 会話の指摘の用語のスキーマの雛形
  description: feedback が指摘の置き場所へコピーする用語の YAML のスキーマを受け持ち、登録する用語のキーを追加・修正するときに参照する。
  tags:
  - topic:テンプレート
  - topic:スキーマ
  - topic:用語
  related:
  - to: SC-13
    type: see_also
- path: feedback/terms.yaml
  name: 会話の指摘の用語の YAML の雛形
  description: feedback が alias-inject の入った端末で指摘の置き場所に作る空の用語の YAML を受け持ち、用語の YAML の初期の内容を修正するときに参照する。
  tags:
  - topic:テンプレート
  - topic:用語
  - tool:alias-inject
  related:
  - to: SC-13
    type: see_also
- path: feedback/rules.yaml
  name: 会話の指摘のルールの索引の雛形
  description: feedback が rule-inject の入った端末で指摘の置き場所に作る空の rule-inject の索引を受け持ち、索引の初期の内容を修正するときに参照する。
  tags:
  - topic:テンプレート
  - topic:ルール
  - tool:rule-inject
  related:
  - to: SC-13
    type: see_also
checkpoint:
  commit: b993fd808f7e5508c0f2e02101c1f615d2b4674b
  reviewed: []
