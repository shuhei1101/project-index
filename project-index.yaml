# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v0.0.0/schemas/dev-docs.schema.json
version: "3"
name: project-index
default_ref: develop
worktrees:
  - ./.claude/worktrees/*
description: 文書とソースコードの索引・検索・書き込みを提供するサービスの設計書・公開ドキュメント
github:
  repository: shuhei1101/project-index
documents:
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/config.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: api
    title: 外部API
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/external-api.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: dev_command
    title: 開発コマンド
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/dev-command.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema: schemas/index.schema.yaml
    metadata:
      description: summary
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: src
    title: 索引のサーバーのコード
    paths: [src/files.yaml]
    exclude: ["*.schema.yaml", aliases.source.yaml, steps.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: plugin
    title: プラグインのフックのコード
    paths: [plugins/project-index/files.yaml]
    exclude: ["*.json", "*.md"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
