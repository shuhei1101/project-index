# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/project-index/v0.2.0/schemas/project-index.schema.json
version: "3"
name: project-index
default_ref: develop
worktrees:
  - ./.claude/worktrees/*
description: 文書とソースコードの索引・検索・書き込みを提供するサービスの設計書・公開ドキュメント
github:
  repository: shuhei1101/project-index
documents:
  - id: architecture
    title: アーキテクチャ図
    alias_type: doc
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/architecture.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: nonfunctional
    title: 非機能要件
    alias_type: doc
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/nonfunctional.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: scenario
    title: シナリオ
    alias_type: doc
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/scenario.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: interface
    title: インターフェース定義
    alias_type: doc
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/interface.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: module
    title: モジュール構成
    alias_type: doc
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/module.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: config
    title: 設定
    alias_type: doc
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/config.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: api
    title: 外部API
    alias_type: doc
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/external_api.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: library
    title: 外部ライブラリ
    alias_type: doc
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/library.schema.yaml
