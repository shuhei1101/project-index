            - page: interface/IF-32
            - page: interface/IF-33
            - page: interface/IF-34
        - group: インターフェース定義 / CLI
          items:
            - page: interface/IF-15
            - page: interface/IF-16
            - page: interface/IF-17
            - page: interface/IF-18
            - page: interface/IF-106-1
            - page: interface/IF-106-2
            - page: interface/IF-106-3
        - group: インターフェース定義 / フック
