    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: test_procedure
    title: テスト実行方法
    alias_type: doc
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/test_procedure.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: dev_command
    title: 開発コマンド
    alias_type: doc
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/dev_command.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: layout
    title: フォルダ構成
    alias_type: doc
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: glossary
    title: 用語集
    paths: ["docs/glossary/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/glossary.schema.yaml
      ref: design-schemas/v9.2.0
    records: terms
    alias_type: term
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema:
      source: knowledge
      path: schemas/design/index.schema.yaml
      ref: design-schemas/v9.2.0
    metadata:
      description: summary
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: src
    title: 索引のサーバーのコード
    paths: [src/files.yaml]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: plugin
    title: プラグイン
    paths: [plugins/project-index/files.yaml]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: docs_folder
    title: 文書のフォルダの目次と画面の設定
    paths:
      - docs/_theme/files.yml
      - docs/architecture/files.yml
      - docs/config/files.yml
      - docs/dev-command/files.yml
      - docs/external-api/files.yml
      - docs/glossary/files.yml
      - docs/interface/files.yml
      - docs/layout/files.yml
      - docs/library/files.yml
      - docs/module/files.yml
      - docs/nonfunctional/files.yml
      - docs/scenario/files.yml
      - docs/test-procedure/files.yml
    exclude: ["*.yaml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: repo
    title: スキーマ・雛形・型・CI・マーケットプレイス
    paths:
      - .claude-plugin/files.yaml
      - .github/files.yaml
      - schemas/files.yaml
      - templates/files.yaml
      - typings/files.yaml
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: root
    title: リポジトリの直下と docs/ の直下のファイル
    paths: [files.yaml]
    exclude: ["docs/pr/**"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: prompts
    title: プロンプト
    paths: [content/prompts/**/*.yaml]
    schema: schemas/prompt.schema.yaml
    converter: prompt-doc
    metadata:
      name: name
      description: description
      tags: tags
converters:
  - id: prompt-doc
    run: [project-index, prompt-doc]
nav:
  tabs:
    - title: はじめに
      items:
        - group: コアコンセプト
          items:
            - page: files_guide/docs/guide/コアコンセプト-配信元と権限.md
            - page: files_guide/docs/guide/コアコンセプト-文書のメタデータ.md
            - page: files_guide/docs/guide/コアコンセプト-プラグイン.md
        - group: リリース
          items:
            - page: files_guide/docs/guide/変更履歴.md
    - title: 使い方
      items:
        - group: 導入と更新
          items:
            - page: files_guide/docs/guide/project-indexを入れる.md
            - page: files_guide/docs/guide/配信元を配信する.md
            - page: files_guide/docs/guide/配信元を登録する.md
            - page: files_guide/docs/guide/メタデータを付ける基準.md
            - page: files_guide/docs/guide/project-indexを更新する.md
        - group: 判定
          items:
            - page: files_guide/docs/guide/新しく作るか修正するかの判定.md
            - page: files_guide/docs/guide/documentsの行の判定.md
