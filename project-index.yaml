            - page: interface/IF-12
            - page: interface/IF-13
            - page: interface/IF-14
        - group: インターフェース定義 / 読み取り API
          items:
            - page: interface/IF-22
            - page: interface/IF-23
            - page: interface/IF-24
            - page: interface/IF-25
            - page: interface/IF-26
            - page: interface/IF-27
            - page: interface/IF-28
            - page: interface/IF-29
        - group: インターフェース定義 / 端末の設定の API
