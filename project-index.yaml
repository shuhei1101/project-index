            - page: scenario/SC-1
            - page: scenario/SC-2
            - page: scenario/SC-4
            - page: scenario/SC-5
            - page: scenario/SC-6
            - page: scenario/SC-7
            - page: scenario/SC-8
            - page: scenario/SC-9
            - page: scenario/SC-10
            - page: scenario/SC-12
            - page: scenario/SC-11
            - page: scenario/SC-3
