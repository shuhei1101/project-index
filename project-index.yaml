# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v0.0.0/schemas/dev-docs.schema.json
version: "3"
name: project-index
default_ref: develop
worktrees:
  - ./.claude/worktrees/*
description: 文書とソースコードの索引・検索・書き込みを提供するサービスの設計書・公開ドキュメント
github:
  repository: shuhei1101/project-index
documents:
  - id: architecture
    title: アーキテクチャ図
    alias_type: doc
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: nonfunctional
    title: 非機能要件
    alias_type: doc
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: scenario
    title: シナリオ
    alias_type: doc
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: interface
    title: インターフェース定義
    alias_type: doc
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: module
    title: モジュール構成
    alias_type: doc
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: config
    title: 設定
    alias_type: doc
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/config.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: api
    title: 外部API
    alias_type: doc
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/external-api.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: library
    title: 外部ライブラリ
    alias_type: doc
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: test_procedure
    title: テスト実行方法
    alias_type: doc
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: dev_command
    title: 開発コマンド
    alias_type: doc
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/dev-command.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: layout
    title: フォルダ構成
    alias_type: doc
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: glossary
    title: 用語集
    paths: ["docs/glossary/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/glossary.schema.yaml
    records: terms
    alias_type: term
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema: schemas/index.schema.yaml
    metadata:
      description: summary
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: src
    title: 索引のサーバーのコード
    paths: [src/files.yaml]
    exclude: ["*.schema.yaml", aliases.source.yaml, steps.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: plugin
    title: プラグインのフックのコード
    paths: [plugins/project-index/files.yaml]
    exclude: ["*.json", "*.md"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
nav:
  tabs:
    - title: はじめに
      items:
        - auto:
            document: files_guide
            filter: {field: category, op: eq, values: [はじめに]}
    - title: 使い方
      items:
        - auto:
            document: files_guide
            filter: {field: category, op: eq, values: [使い方]}
    - title: 設計書
      items:
        - group: 全体
          items:
            - page: architecture
            - page: nonfunctional
            - page: layout
            - page: config
        - group: シナリオ
          items:
            - auto: {document: scenario}
        - group: インターフェース定義
          items:
            - auto: {document: interface}
        - group: モジュール構成
          items:
            - auto: {document: module}
        - group: 外部ライブラリ
          items:
            - auto: {document: library}
        - group: 開発
          items:
            - page: test_procedure
            - page: dev_command
    - title: コード
      items:
        - group: 索引のサーバー
          items:
            - auto: {document: src, group_by: tags}
        - group: プラグイン
          items:
            - auto: {document: plugin}
        - group: テスト
          items:
            - auto: {document: tests, group_by: tags}
    - title: リファレンス
      items:
        - auto:
            document: files_guide
            filter:
              and:
                - {field: category, op: eq, values: [リファレンス]}
                - not: {field: name, op: eq, values: [用語集]}
    - title: 用語集
      items:
        - page: files_guide/docs/guide/用語集.md
        - auto: {document: glossary}
