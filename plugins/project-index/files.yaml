files:
- path: hooks/pre_tool_use.py
  name: PreToolUse のフック
  description: PreToolUse のフックを受け持ち、ツール実行前のフックの pre_tool_use.py を修正するときに参照する。
  tags:
  - topic:ツール実行前のフック
  related:
  - to: MOD-4
    type: implements
- path: hooks/session_start.py
  name: SessionStart のフック
  description: SessionStart のフックを受け持ち、セッション開始のフックの session_start.py を修正するときに参照する。
  tags:
  - topic:セッション開始のフック
  related:
  - to: MOD-5
    type: implements
- path: .claude-plugin/plugin.json
  name: プラグインの定義
  description: プラグイン project-index の名前と説明を受け持ち、Claude Code に表示するプラグインの情報を修正するときに参照する。
  tags:
  - topic:プラグイン
  - tool:claude-code
  related:
  - to: MOD-2
    type: see_also
- path: .mcp.json
  name: プラグインが配る MCP の接続先
  description: 文書の MCP と管理の MCP の接続先の URL を受け持ち、待ち受けのポートや接続先を修正するときに参照する。
  tags:
  - topic:プラグイン
  - tool:mcp
  related:
  - to: CFG-1
    type: see_also
  - to: MOD-2
    type: see_also
- path: hooks/hooks.json
  name: プラグインのフックの登録
  description: SessionStart と PreToolUse のフックの登録を受け持ち、フックを呼ぶ出来事や対象のツールを修正するときに参照する。
  tags:
  - topic:フック
  - topic:プラグイン
  - tool:claude-code
  related:
  - to: IF-19
    type: see_also
  - to: IF-20
    type: see_also
- path: skills/global-setup/SKILL.md
  name: 端末に project-index を用意するスキル
  description: 端末ごとに 1 回、クローン・依存・端末の設定・Claude Code の env・起動を用意する手順を受け持ち、導入と更新の手順を修正するときに参照する。
  tags:
  - topic:セットアップ
  - topic:端末の設定
  - tool:claude-code
  related:
  - to: SC-2
    type: see_also
- path: skills/setup/SKILL.md
  name: フォルダを配信元として登録するスキル
  description: 配信元の登録の手順のページを文書の MCP で取得して進める入口を受け持ち、スキルの取得の引数と取得できないときの案内を修正するときに参照する。
  tags:
  - topic:セットアップ
  - topic:配信元
  - topic:メタデータ
  related:
  - to: SC-5
    type: see_also
