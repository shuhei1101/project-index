title: 開発コマンド
lead: project-index の開発で使用するコマンドの、分類ごとの前提・順序・コマンド・確認の記録。
categories:
  - name: 環境構築（クローン直後）
    commands: |-
      1. `.python-version` の Python と、`uv.lock` どおりの開発の依存を入れる

      ```bash
      uv sync --frozen
      ```
    verification:
      state: 済
      date: '2026-11-06'
      detail: 作業 PR の worktree で実行し、依存が入って `uv run project-index --version` が `project-index 0.0.0` を出すことを確認した
  - name: 取り込み後の追従（pull 後）
    commands: |-
      1. 取り込んだ `pyproject.toml`・`uv.lock` に手元の依存を合わせる

      ```bash
      uv sync
      ```
    verification:
      state: 済
      date: '2026-11-06'
      detail: 作業 PR の worktree で実行し、依存が lock どおりであることを確認した
  - name: 依存の追加・更新・削除
    commands: |-
      1. 実行時の依存を追加する（開発の依存は `--dev` を付ける）

      ```bash
      uv add {パッケージ}
      ```

      2. 依存を削除する

      ```bash
      uv remove {パッケージ}
      ```
    effects: '`pyproject.toml` と `uv.lock` を書き換える'
    verification:
      state: 未確認
      detail: 依存を書き換えるため、追加する依存が決まる shuhei1101/dev-docs#114 まで実行していない
  - name: 起動・停止
    commands: 未確定
  - name: テスト
    refs:
      - TP-1#
  - name: 静的検査
    refs:
      - TP-1#layers[lint]
  - name: ビルド・生成
    commands: 未確定
  - name: 取り込み前の検査
    refs:
      - TP-1#layers[単体テスト（バック）]
      - TP-1#layers[lint]
  - name: 管理作業
    commands: 未確定
id: CMD-1
prerequisites:
  - Python 3.14 と uv
